<title>Ciclo Concursos</title>

<style>
:root{
  --ground:#f2f4f3; --paper:#fff; --raso:#e9edec; --linha:#dde4e2; --linha2:#c6d1ce;
  --ink:#141a19; --ink2:#5d6968; --ink3:#8d9997;
  --tom:#0e5b55; --tom-raso:#dcebe8; --tom-forte:#0a4440;
  --bom:#1b6b3e; --bom-raso:#dbece2;
  --meio:#8d5410; --meio-raso:#f6e8d5;
  --ruim:#9c2a21; --ruim-raso:#f7e0de;
  --tit:"Archivo","Segoe UI",system-ui,sans-serif;
  --txt:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0f1413; --paper:#171d1c; --raso:#1d2423; --linha:#28302f; --linha2:#39433f;
    --ink:#e7eceb; --ink2:#97a4a2; --ink3:#6d7978;
    --tom:#5fbcaf; --tom-raso:#12302d; --tom-forte:#8ed6cb;
    --bom:#6dc793; --bom-raso:#12291d;
    --meio:#d8a45e; --meio-raso:#2c2212;
    --ruim:#e8867c; --ruim-raso:#2e1a18;
  }
}
:root[data-theme="dark"]{
  --ground:#0f1413; --paper:#171d1c; --raso:#1d2423; --linha:#28302f; --linha2:#39433f;
  --ink:#e7eceb; --ink2:#97a4a2; --ink3:#6d7978;
  --tom:#5fbcaf; --tom-raso:#12302d; --tom-forte:#8ed6cb;
  --bom:#6dc793; --bom-raso:#12291d;
  --meio:#d8a45e; --meio-raso:#2c2212;
  --ruim:#e8867c; --ruim-raso:#2e1a18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.55 var(--txt);-webkit-font-smoothing:antialiased}
h1,h2,h3,.tit,th,nav button,.n{font-family:var(--tit)}
.n,td.n,th.n,.tabular{font-variant-numeric:tabular-nums}
a{color:var(--tom)}

/* ---------- barra ---------- */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--linha)}
.barra{max-width:760px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:26px}
.marca{font-family:var(--tit);font-weight:700;font-size:15px;letter-spacing:-.1px;
  display:flex;align-items:center;gap:7px;padding:13px 0;white-space:nowrap;flex:0 0 auto}
.marca i{width:8px;height:8px;border-radius:50%;background:var(--tom);flex:0 0 auto}
nav{display:flex;gap:22px;margin-left:auto}
nav button{background:none;border:0;padding:14px 0 12px;font:600 14px var(--tit);
  color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.1px}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--tom);border-bottom-color:var(--tom)}
:focus-visible{outline:2px solid var(--tom);outline-offset:2px;border-radius:3px}

main{max-width:760px;margin:0 auto;padding:26px 20px 90px}
section[hidden]{display:none}

/* ---------- ritmo tipográfico ---------- */
.chapeu{font:600 11.5px var(--tit);text-transform:uppercase;letter-spacing:.9px;
  color:var(--ink3);margin:0 0 10px}
h2{font-size:21px;margin:0 0 4px;letter-spacing:-.3px;text-wrap:balance}
.legenda{color:var(--ink2);font-size:13.5px;margin:0 0 20px;max-width:60ch}
.secao{margin-bottom:34px}
.secao:last-child{margin-bottom:0}

/* ---------- a tarefa: a única coisa que é um cartão ---------- */
.foco{background:var(--paper);border:1px solid var(--linha);border-top:3px solid var(--tom);
  border-radius:3px;padding:20px 22px}
.foco.exerc{border-top-color:var(--meio)}
.foco-onde{font-size:13.5px;color:var(--ink2);margin-bottom:3px}
.foco-onde b{color:var(--ink);font-weight:600}
.foco-o-que{font:700 27px/1.15 var(--tit);letter-spacing:-.7px;margin:0 0 3px;
  font-variant-numeric:tabular-nums}
.foco-quanto{font-size:13.5px;color:var(--ink2);margin:0 0 18px}
.foco-quanto a{margin-left:10px}
.campos{border-top:1px solid var(--linha);padding-top:16px;display:flex;flex-direction:column;gap:13px}
.par{display:flex;gap:14px;flex-wrap:wrap}
.par>*{flex:1 1 150px;min-width:0}
.par>.curto{flex:0 0 96px}

/* ---------- formulário ---------- */
label,.rot{display:block;font:600 12.5px var(--txt);color:var(--ink2);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--linha2);border-radius:3px;
  background:var(--paper);color:var(--ink);font:15px var(--txt)}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:62px;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink3)}

button.b{background:var(--tom);color:#fff;border:0;border-radius:3px;padding:11px 20px;
  font:600 15px var(--tit);cursor:pointer;letter-spacing:.2px}
button.b:hover{filter:brightness(1.12)}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.b.fraco{background:none;color:var(--ink2);border:1px solid var(--linha2)}
button.b.fraco:hover{background:var(--raso);color:var(--ink);filter:none}
button.b.mini{padding:6px 11px;font-size:13px}
.acoes{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.nota{color:var(--ink2);font-size:13px;margin:0}

/* ---------- listas na página, sem moldura ---------- */
.lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha)}
.lista li{display:flex;gap:12px;align-items:baseline;padding:11px 2px;
  border-bottom:1px solid var(--linha);font-size:14.5px}
.lista .pos{color:var(--ink3);font-size:12.5px;min-width:16px;font-variant-numeric:tabular-nums}
.lista .quem{font-weight:600}
.lista .onde{color:var(--ink2);font-size:13.5px}
.lista .oque{margin-left:auto;color:var(--ink2);font-size:13.5px;text-align:right}

/* ---------- resumo do dia: uma linha, não quatro caixas ---------- */
.hoje-linha{display:flex;gap:20px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--linha);
  color:var(--ink2);font-size:13.5px}
.hoje-linha b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- três números do progresso ---------- */
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px;
  padding-bottom:26px;border-bottom:1px solid var(--linha);margin-bottom:26px}
.numero .valor{font:700 28px/1.1 var(--tit);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.numero .valor.bom{color:var(--bom)} .numero .valor.ruim{color:var(--ruim)}
.numero .rotulo{font:600 12.5px var(--txt);color:var(--ink2);margin-top:3px}
.numero .detalhe{font-size:12.5px;color:var(--ink3);margin-top:1px}

/* ---------- etiquetas de estado ---------- */
.eti{display:inline-block;padding:2px 8px;border-radius:3px;white-space:nowrap;
  font:600 11.5px var(--tit);letter-spacing:.3px;background:var(--raso);color:var(--ink2)}
.eti.bom{background:var(--bom-raso);color:var(--bom)}
.eti.meio{background:var(--meio-raso);color:var(--meio)}
.eti.ruim{background:var(--ruim-raso);color:var(--ruim)}
.eti.tom{background:var(--tom-raso);color:var(--tom-forte)}

/* ---------- blocos que abrem ---------- */
details.dobra{border-bottom:1px solid var(--linha)}
details.dobra>summary{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;

details.dobra>summary::-webkit-details-marker{display:none}
details.dobra>summary::before{content:"";width:0;height:0;flex:0 0 auto;

  transition:transform .12s}
details.dobra[open]>summary::before{transform:rotate(90deg)}
details.dobra>summary:hover{background:var(--raso)}
details.dobra .titulo{font-weight:600}
details.dobra .direita{margin-left:auto;color:var(--ink2);font-size:13px;
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.corpo{padding:4px 2px 18px 17px}

.materia-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:22px 0 6px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.materia-cab .nome{font:700 17px var(--tit);letter-spacing:-.2px}
.materia-cab .meta{margin-left:auto;font-size:13px;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
th{font:600 11.5px var(--tit);text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
   white-space:nowrap}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
.rolar{overflow-x:auto}

.faixa{border-left:3px solid var(--meio);background:var(--meio-raso);color:var(--meio);
  padding:12px 15px;font-size:14px;margin-bottom:22px;border-radius:0 3px 3px 0}
.faixa b{font-family:var(--tit)}
.faixa .lista{border-top:1px solid rgba(0,0,0,.08);margin-top:9px}
.faixa .lista li{border-bottom-color:rgba(0,0,0,.08);color:var(--ink)}
details.faixa>summary{cursor:pointer;list-style:none}
details.faixa>summary::-webkit-details-marker{display:none}
details.faixa>summary::after{content:" ▸"} details.faixa[open]>summary::after{content:" ▾"}

.nada{color:var(--ink2);font-size:14px;padding:26px 0;text-align:center}
.erro-linha{display:flex;gap:9px;margin-bottom:9px;align-items:center}
.erro-linha input{flex:1 1 150px} .erro-linha select{flex:0 0 165px}

#recado{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);
  color:var(--ground);padding:11px 19px;border-radius:3px;font-size:14px;z-index:60;
  box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}

@media (max-width:620px){
  .barra{padding:0 14px;gap:14px}
  .marca{padding:11px 0;font-size:13px}
  nav{gap:15px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:11px 0 9px;font-size:13.5px}
  main{padding:20px 16px 80px}
  .foco{padding:17px}
  .foco-o-que{font-size:23px}
  .lista li{flex-wrap:wrap;gap:3px 10px}
  .lista .oque{margin-left:0;width:100%;text-align:left;font-size:13px}
  .numeros{gap:18px}
  .par>.curto{flex:1 1 92px}
  .erro-linha{flex-wrap:wrap} .erro-linha input{flex:1 1 100%} .erro-linha select{flex:1 1 130px}
  details.dobra>summary{flex-wrap:wrap}
  details.dobra .direita{margin-left:0;width:100%;justify-content:flex-start;padding-left:15px}
  .corpo{padding-left:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<header>
  <div class="barra">
    <div class="marca"><i></i> Ciclo Concursos</div>
    <nav id="menu">
      <button data-aba="estudar" aria-current="true">Estudar</button>

<script>
"use strict";

/* =======================================================================
   MOTOR DO CICLO
   O plano é determinístico: dado o cadastro e os ajustes, sabemos qual é a
   próxima tarefa. O banco guarda só o que já foi CONCLUÍDO; o pendente é
   recalculado a cada tela.
   ===================================================================== */

const PADRAO = {
  paginas_min_dia: 10, paginas_max_dia: 20, fator_revisao: 2,
  questoes_por_bateria: 10, questoes_fixacao: 5, exercicios_fixacao: 1,
  meta_acerto: 80, minimo_questoes_avaliacao: 10, max_rodadas_reforco: 3,
  tamanho_bloco_alvo: 4, intervalos_revisao_espacada: "7,30,90",
};

function dividirPaginas(total, minDia, maxDia){
  total = Math.max(0, Math.floor(total));
  if (!total) return [];
  maxDia = Math.max(1, Math.floor(maxDia));
  minDia = Math.max(1, Math.min(Math.floor(minDia), maxDia));
  let dias = Math.max(1, Math.ceil(total / maxDia));
  while (dias > 1 && total / dias < minDia) dias--;
  const base = Math.floor(total / dias), resto = total % dias;
  const fatias = [];
  let pagina = 1;
  for (let i = 0; i < dias; i++){
    const tamanho = base + (i < resto ? 1 : 0);
    fatias.push([pagina, pagina + tamanho - 1]);
    pagina += tamanho;
  }
  return fatias;
}

function dividirPorFase(total, cfg, fase){
  let minimo = cfg.paginas_min_dia, maximo = cfg.paginas_max_dia;
  if (fase !== "leitura"){
    const f = Number(cfg.fator_revisao) || 1;
    minimo = Math.max(1, Math.round(minimo * f));
    maximo = Math.max(minimo, Math.round(maximo * f));
  }
  return dividirPaginas(total, minimo, maximo);
}

function montarBlocos(numeros, qtdBlocos, alvo){
  const n = numeros.length;
  if (!n) return [];
  let k;
  if (qtdBlocos) k = Math.max(1, Math.min(qtdBlocos, n));
  else {
    k = Math.max(1, Math.floor(n / Math.max(1, alvo) + 0.5));
    while (k > 1 && n / k < 3) k--;
    while (n / k > 5) k++;
  }
  const base = Math.floor(n / k), resto = n % k, blocos = [];
  let i = 0;
  for (let j = 0; j < k; j++){
    const tamanho = base + (j < resto ? 1 : 0);
    blocos.push(numeros.slice(i, i + tamanho));
    i += tamanho;
  }
  return blocos.filter((b) => b.length);
}

/** O sarrafo vale por matéria quando ela define o seu; senão, o geral. */
function sarrafoDa(materia, cfg){
  const proprio = materia && materia.meta;
  return proprio ? Number(proprio) : Number(cfg.meta_acerto);
}

function aproveitamento(baterias, momento, rodada){
  let q = 0, a = 0;
  for (const b of baterias){
    if (momento && b.momento !== momento) continue;
    if (rodada != null && b.rodada !== rodada) continue;
    q += b.questoes; a += b.acertos;
  }
  return [q, a];
}

const percentual = (q, a) => (q ? Math.round(1000 * a / q) / 10 : null);

/** Rodada mais recente em que a aula foi medida por exercícios que valem. */
function ultimaAvaliacao(aula){
  const rodadas = aula.baterias.filter((b) => b.momento === "revisao" || b.momento === "reforco")
                              .map((b) => b.rodada);
  if (!rodadas.length) return null;
  const rodada = Math.max(...rodadas);
  return [rodada, rodada <= 1 ? "revisao" : "reforco"];
}

/** A aula passou na ÚLTIMA vez em que foi medida? Quem já passou continua
    passada — só volta ao reforço quem ficou abaixo na própria última medição. */
function aulaConsolidada(aula, cfg, materia){
  const ultima = ultimaAvaliacao(aula);
  if (!ultima) return [false, null];
  const [rodada, momento] = ultima;
  const [q, a] = aproveitamento(aula.baterias, momento, rodada);
  const pct = percentual(q, a);
  if (q < Number(cfg.minimo_questoes_avaliacao)) return [false, pct];
  return [pct >= sarrafoDa(materia, cfg), pct];
}

const ROTULO_FASE = { leitura: "Leitura", revisao: "Revisão", reforco: "Reforço" };
const ROTULO_MOMENTO = {
  fixacao: "Exercícios de fixação", revisao: "Exercícios da revisão", reforco: "Exercícios de reforço",
};

function tarefasDaMateria(materia, aulas, cfg, limite){
  // Aula sem total de páginas ainda não está pronta para ser estudada: fica de
  // fora do plano em vez de entrar como se já tivesse sido lida.
  aulas = aulas.filter((a) => a.total_paginas > 0);
  if (!aulas.length) return [];
  const porNumero = new Map(aulas.map((a) => [a.numero, a]));
  const blocos = montarBlocos(aulas.map((a) => a.numero), materia.qtd_blocos, Number(cfg.tamanho_bloco_alvo));
  const usaFixacao = Number(cfg.exercicios_fixacao) === 1;
  const qFix = Number(cfg.questoes_fixacao), qBat = Number(cfg.questoes_por_bateria);
  const maxRodadas = Number(cfg.max_rodadas_reforco);
  const pendentes = [];

  const comum = (aula, bloco) => ({
    materia_id: materia.id, materia: materia.nome, aula_id: aula.id,
    aula_numero: aula.numero, aula_titulo: aula.titulo || "", bloco,
    link_pdf: aula.link_pdf || "", link_exercicios: aula.link_exercicios || "",
    observacao: aula.observacao || "",
  });

  function sessoesPendentes(aula, bloco, fase, rodada){
    const fatias = dividirPorFase(aula.total_paginas, cfg, fase);
    if (!fatias.length) return false;
    let faltou = false;
    fatias.forEach(([inicio, fim], i) => {
      const indice = i + 1;
      if (aula.concluidas.has(fase + "|" + rodada + "|" + indice)) return;
      faltou = true;
      if (pendentes.length < limite){
        pendentes.push(Object.assign(comum(aula, bloco), {
          tipo: "sessao", fase, rodada, indice, pag_inicio: inicio, pag_fim: fim,
          paginas: fim - inicio + 1, parte: indice + "/" + fatias.length,
          rotulo: ROTULO_FASE[fase] + " — páginas " + inicio + " a " + fim,
        }));
      }
    });
    return faltou;
  }

  function bateria(aula, bloco, momento, rodada, questoes){
    pendentes.push(Object.assign(comum(aula, bloco), {
      tipo: "bateria", momento, rodada, questoes,
      rotulo: ROTULO_MOMENTO[momento] + " — " + questoes + " questões",
    }));
  }

  for (let b = 0; b < blocos.length; b++){
    const numeroBloco = b + 1;
    const aulasBloco = blocos[b].map((n) => porNumero.get(n));

    // fase 1 — leitura do bloco inteiro, aula a aula
    let blocoLido = true;
    for (const aula of aulasBloco){
      if (sessoesPendentes(aula, numeroBloco, "leitura", 1)) blocoLido = false;
      else if (usaFixacao && !aproveitamento(aula.baterias, "fixacao")[0]){
        blocoLido = false;
        if (pendentes.length < limite) bateria(aula, numeroBloco, "fixacao", 1, qFix);
      }
    }
    if (!blocoLido){ if (pendentes.length >= limite) return pendentes; continue; }

    // fase 2 — volta à primeira aula do bloco: revisão + exercícios
    let blocoRevisado = true;
    for (const aula of aulasBloco){
      if (sessoesPendentes(aula, numeroBloco, "revisao", 1)) blocoRevisado = false;
      else if (!aproveitamento(aula.baterias, "revisao", 1)[0]){
        blocoRevisado = false;
        if (pendentes.length < limite) bateria(aula, numeroBloco, "revisao", 1, qBat);
      }
    }
    if (!blocoRevisado){ if (pendentes.length >= limite) return pendentes; continue; }

    // fase 3 — reforço individual: cada aula fraca tem a sua própria contagem
    let blocoFechado = true;
    for (const aula of aulasBloco){
      if (aulaConsolidada(aula, cfg, materia)[0]) continue;
      const anterior = ultimaAvaliacao(aula);
      const rodada = (anterior ? anterior[0] : 1) + 1;
      if (rodada > maxRodadas + 1) continue;   // esgotou: segue sinalizada
      if (sessoesPendentes(aula, numeroBloco, "reforco", rodada)) blocoFechado = false;
      else if (!aproveitamento(aula.baterias, "reforco", rodada)[0]){
        blocoFechado = false;
        if (pendentes.length < limite) bateria(aula, numeroBloco, "reforco", rodada, qBat);
      }
    }
    if (!blocoFechado){ if (pendentes.length >= limite) return pendentes; continue; }
    if (pendentes.length >= limite) return pendentes;
  }
  return pendentes;
}

/** Rodízio ponderado suave: a matéria servida devolve o total de pesos, o que
    espalha as importantes sem nunca repetir duas seguidas. */
function montarFila(estado, limite){
  const cfg = estado.cfg;
  const pendentes = [];
  for (const m of estado.materias){
    if (!m.ativa) continue;
    const aulas = estado.aulasPorMateria.get(m.id) || [];
    const tarefas = tarefasDaMateria(m, aulas, cfg, limite);
    if (tarefas.length) pendentes.push({ materia: m, tarefas, credito: 0 });
  }
  const fila = [];
  while (pendentes.length && fila.length < limite){
    const total = pendentes.reduce((s, p) => s + Math.max(1, p.materia.peso), 0);
    for (const p of pendentes) p.credito += Math.max(1, p.materia.peso);
    let escolhido = pendentes[0];
    for (const p of pendentes){
      if (p.credito > escolhido.credito ||
         (p.credito === escolhido.credito && p.materia.ordem < escolhido.materia.ordem)) escolhido = p;
    }
    escolhido.credito -= total;
    fila.push(escolhido.tarefas.shift());
    if (!escolhido.tarefas.length) pendentes.splice(pendentes.indexOf(escolhido), 1);
  }
  return fila;
}
</script>

<script>
"use strict";

/* =======================================================================
   DADOS — banco do artefato (o mesmo progresso no notebook e no celular)

   Uma ficha por aula, com o progresso dentro dela: as sessões concluídas em
   `feitas` e as baterias de exercícios em `baterias`. Concluir uma sessão é
   uma escrita só, e a carga inteira cabe em poucas centenas de documentos.
   ===================================================================== */

let BD = null, BAIXAR = null;
const estado = { cfg: Object.assign({}, PADRAO), materias: [], aulas: [], aulasPorMateria: new Map(),
                 erros: [], revisoes: [], aba: "estudar" };

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const hoje = () => new Date().toISOString().slice(0, 10);
const agora = () => new Date().toISOString().slice(0, 19);
const dataBr = (iso) => iso ? iso.slice(0,10).split("-").reverse().join("/") : "—";
const pct = (v) => (v == null ? "—" : v + "%");

let tempoAviso;
function avisar(texto){
  let caixa = document.getElementById("aviso-flutuante");
  if (!caixa){ caixa = document.createElement("div"); caixa.id = "aviso-flutuante"; document.body.appendChild(caixa); }
  caixa.textContent = texto;
  clearTimeout(tempoAviso);
  tempoAviso = setTimeout(() => caixa.remove(), 3200);
}

async function lerColecao(nome){
  const snap = await BD.collection(nome).limit(1000).get();
  return snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
}

async function carregar(){
  const [cfgDoc, materias, aulas, erros, revisoes] = await Promise.all([
    BD.doc("config/geral").get(),
    lerColecao("materias"), lerColecao("aulas"), lerColecao("erros"), lerColecao("revisoes"),
  ]);
  estado.cfg = Object.assign({}, PADRAO, cfgDoc.exists ? cfgDoc.data() : {});
  estado.materias = materias.sort((a, b) => (a.ordem - b.ordem) || a.nome.localeCompare(b.nome));
  estado.erros = erros;
  estado.revisoes = revisoes;
  estado.aulas = aulas.map((a) => {
    const feitas = a.feitas || {};
    return Object.assign({}, a, {
      numero: Number(a.numero), total_paginas: Number(a.total_paginas) || 0,
      feitas, baterias: a.baterias || [], concluidas: new Set(Object.keys(feitas)),
    });
  });
  estado.aulasPorMateria = new Map();
  for (const m of estado.materias){
    estado.aulasPorMateria.set(m.id,
      estado.aulas.filter((a) => a.materia_id === m.id).sort((x, y) => x.numero - y.numero));
  }
}

const aulaPorId = (id) => estado.aulas.find((a) => a.id === id);

/* ---------- panorama: matéria → blocos → aulas ---------- */

function situacaoDaAula(aula, materia, cfg){
  const leitura = dividirPorFase(aula.total_paginas, cfg, "leitura");
  const revisao = dividirPorFase(aula.total_paginas, cfg, "revisao");
  let feitasL = 0, feitasR = 0;
  for (const chave of aula.concluidas){
    if (chave.startsWith("leitura|")) feitasL++;
    else if (chave.startsWith("revisao|")) feitasR++;
  }
  const ultima = ultimaAvaliacao(aula);
  const [rodada, momento] = ultima || [1, "revisao"];
  const [q, a] = aproveitamento(aula.baterias, momento, rodada);
  const [qT, aT] = aproveitamento(aula.baterias);
  const [consolidada, pctRodada] = aulaConsolidada(aula, cfg, materia);
  let situacao;
  if (!aula.total_paginas) situacao = "sem_paginas";
  else if (consolidada) situacao = "consolidada";
  else if (!feitasL) situacao = "nao_iniciada";
  else if (feitasL < leitura.length) situacao = "lendo";
  else if (feitasR < revisao.length) situacao = "aguardando_revisao";
  else if (!q) situacao = "aguardando_exercicios";
  else situacao = "abaixo";
  return { id: aula.id, numero: aula.numero, titulo: aula.titulo || "",
    total_paginas: aula.total_paginas, link_pdf: aula.link_pdf || "",
    link_exercicios: aula.link_exercicios || "", observacao: aula.observacao || "",
    sessoes_leitura: leitura.length, feitas_leitura: feitasL,
    sessoes_revisao: revisao.length, feitas_revisao: feitasR,
    paginas_por_dia: leitura.length ? leitura[0][1] - leitura[0][0] + 1 : 0,
    rodada, questoes_rodada: q, acertos_rodada: a, percentual_rodada: pctRodada,
    questoes: qT, acertos: aT, percentual: percentual(qT, aT), consolidada, situacao };
}

function panorama(){
  const cfg = estado.cfg;
  return estado.materias.map((m) => {
    const todas = estado.aulasPorMateria.get(m.id) || [];
    const aulas = todas.filter((a) => a.total_paginas > 0);
    const semPaginas = todas.filter((a) => !(a.total_paginas > 0));
    const porNumero = new Map(aulas.map((a) => [a.numero, a]));
    const grupos = montarBlocos(aulas.map((a) => a.numero), m.qtd_blocos, Number(cfg.tamanho_bloco_alvo));
    const sarrafo = sarrafoDa(m, cfg);
    const blocos = grupos.map((numeros, i) => {
      const itens = numeros.map((n) => situacaoDaAula(porNumero.get(n), m, cfg));
      const qA = itens.reduce((s, x) => s + x.questoes_rodada, 0);
      const aA = itens.reduce((s, x) => s + x.acertos_rodada, 0);
      const q = itens.reduce((s, x) => s + x.questoes, 0);
      const a = itens.reduce((s, x) => s + x.acertos, 0);
      const atual = percentual(qA, aA);
      return { numero: i + 1, aulas: itens, questoes: qA, questoes_total: q, acertos_total: a,
        percentual: atual, percentual_acumulado: percentual(q, a),
        consolidado: itens.length > 0 && itens.every((x) => x.consolidada),
        abaixo: atual != null && atual < sarrafo,
        emCurso: itens.some((x) => x.situacao === "lendo" || x.situacao === "aguardando_revisao"
                                || x.situacao === "aguardando_exercicios" || x.situacao === "abaixo") };
    });
    const q = blocos.reduce((s, b) => s + b.questoes_total, 0);
    const a = blocos.reduce((s, b) => s + b.acertos_total, 0);
    return Object.assign({}, m, { blocos, sarrafo, total_aulas: todas.length,
      aulas_no_ciclo: aulas.length,
      sem_paginas: semPaginas.map((a) => situacaoDaAula(a, m, cfg)),
      total_paginas: aulas.reduce((s, x) => s + x.total_paginas, 0),
      questoes: q, acertos: a, percentual: percentual(q, a) });
  });
}

/** Ritmo real das últimas 4 semanas, projetado sobre o que falta. */
function projecao(){
  const corte = new Date(Date.now() - 28 * 864e5).toISOString().slice(0, 10);
  const dias = new Set();
  let feitas = 0;
  for (const a of estado.aulas){
    for (const chave of Object.keys(a.feitas)){
      const dia = String(a.feitas[chave].em || "").slice(0, 10);
      if (dia >= corte){ dias.add(dia); feitas++; }
    }
  }
  const ritmo = dias.size ? feitas / dias.size : null;
  let pendentes = 0;
  for (const m of estado.materias){
    if (!m.ativa) continue;
    pendentes += tarefasDaMateria(m, estado.aulasPorMateria.get(m.id) || [], estado.cfg, 9999).length;
  }
  const restam = ritmo ? Math.ceil(pendentes / ritmo) : null;
  return { pendentes, ritmo: ritmo ? Math.round(ritmo * 10) / 10 : null, dias: restam,
    termino: restam ? new Date(Date.now() + restam * 864e5).toISOString().slice(0, 10) : null };
}

function contagemDeHoje(){
  const h = hoje();
  let sessoes = 0, questoes = 0, acertos = 0;
  for (const a of estado.aulas){
    for (const chave of Object.keys(a.feitas)){
      if (String(a.feitas[chave].em || "").slice(0, 10) === h) sessoes++;
    }
    for (const b of a.baterias){
      if (String(b.data || "").slice(0, 10) === h){ questoes += b.questoes; acertos += b.acertos; }
    }
  }
  return { sessoes, questoes, acertos };
}

function revisoesVencidas(){
  const h = hoje();
  return estado.revisoes.filter((r) => !r.concluida_em && r.prevista_para <= h)
    .sort((a, b) => a.prevista_para.localeCompare(b.prevista_para));
}
</script>

<script>
"use strict";

/* =======================================================================
   TELAS — três lugares, não seis.

   Estudar  o que fazer agora, e só isso
   Progresso  como o método está indo: matéria → bloco → aula, num lugar só
   Ajustes  o que você configura uma vez e raramente mexe
   ===================================================================== */

const NOME_SIT = { nao_iniciada:"não iniciada", lendo:"em leitura",
  aguardando_revisao:"aguardando revisão", aguardando_exercicios:"aguardando exercícios",
  abaixo:"abaixo do sarrafo", consolidada:"consolidada", sem_paginas:"sem páginas" };
const ETI_SIT = { consolidada:"bom", abaixo:"ruim", lendo:"tom",
  aguardando_revisao:"meio", aguardando_exercicios:"meio" };
const MOTIVOS = { nao_sabia:"Não sabia o conteúdo", desatencao:"Desatenção",
  interpretacao:"Interpretação do enunciado", pegadinha:"Pegadinha da banca",
  decoreba:"Faltou decorar (lei seca)" };
const ROT_FASE = { leitura:"Leitura", revisao:"Revisão", reforco:"Reforço" };
const plural = (n, um, muitos) => n + " " + (n === 1 ? um : muitos);

function desenhar(){
  const aba = estado.aba;
  document.querySelectorAll("#menu button").forEach((b) =>
    b.setAttribute("aria-current", String(b.dataset.aba === aba)));
  document.querySelectorAll("main section").forEach((s) => { s.hidden = s.id !== "aba-" + aba; });
  ({ estudar: telaEstudar, progresso: telaProgresso, ajustes: telaAjustes }[aba])();
}

/* ================================================================ ESTUDAR */

function telaEstudar(){
  const alvo = document.getElementById("painel-estudar");
  if (!estado.materias.length){ alvo.innerHTML = telaPrimeiroUso(); return; }

  const fila = montarFila(estado, 9);
  const tarefa = fila[0];
  const dia = contagemDeHoje();
  const vencidas = revisoesVencidas();

  alvo.innerHTML = `
    ${vencidas.length ? faixaRevisoes(vencidas) : ""}
    <div class="secao">
      <p class="chapeu">Agora</p>
      ${tarefa ? (tarefa.tipo === "sessao" ? cartaoLeitura(tarefa) : cartaoExercicios(tarefa))
        : `<div class="foco"><div class="nada">Tudo em dia — nenhuma tarefa pendente no ciclo.</div></div>`}
    </div>
    ${fila.length > 1 ? `<div class="secao">
      <p class="chapeu">Depois disso</p>
      <ul class="lista">${fila.slice(1).map((t, i) => `
        <li><span class="pos">${i + 2}</span>
          <span class="quem">${esc(t.materia)}</span>
          <span class="onde">Aula ${t.aula_numero}</span>
          <span class="oque">${esc(t.rotulo)}</span></li>`).join("")}</ul>
    </div>` : ""}
    <div class="hoje-linha">
      <span>Hoje: <b>${dia.sessoes}</b> ${dia.sessoes === 1 ? "sessão" : "sessões"}</span>
      <span><b>${dia.questoes}</b> ${dia.questoes === 1 ? "questão" : "questões"}${
        dia.questoes ? " · <b>" + pct(percentual(dia.questoes, dia.acertos)) + "</b> de acerto" : ""}</span>
    </div>
    ${avisoSemPaginas()}`;
  if (tarefa && tarefa.tipo === "bateria") adicionarLinhaErro();
}

function telaPrimeiroUso(){
  return `<div class="secao">
    <h2>Vamos montar o seu ciclo</h2>
    <p class="legenda">O sistema precisa saber quais matérias você estuda, quantas aulas cada uma
      tem e quantas páginas tem o PDF de cada aula. Com isso ele monta a fila sozinho, todo dia.</p>
    <div class="acoes">
      <button class="b" id="btn-semear">Usar as matérias da minha planilha</button>
      <button class="b fraco" data-ir="ajustes">Cadastrar do zero</button>
    </div>
    <p class="nota" style="margin-top:14px">A primeira opção traz as 11 matérias do concurso do INSS
      com as aulas e as páginas que você já tinha anotado. Dá para editar tudo depois.</p>
  </div>`;
}

function faixaRevisoes(vencidas){
  return `<details class="faixa" open>
    <summary><b>${vencidas.length} ${vencidas.length === 1 ? "revisão espaçada venceu" :
      "revisões espaçadas venceram"}</b> — faça antes da fila</summary>
    <ul class="lista">${vencidas.slice(0, 6).map((r) => `
      <li><span class="eti meio">${r.intervalo_dias} dias</span>
        <span class="quem">${esc(r.materia)}</span>
        <span class="onde">Aula ${r.aula_numero}</span>
        <span class="oque">
          <button class="b fraco mini" data-rev-feita="${esc(r.id)}">Feita</button>
          <button class="b fraco mini" data-rev-adiar="${esc(r.id)}">Adiar</button></span></li>`).join("")}
    </ul></details>`;
}

/** Aula sem total de páginas não entra no rodízio — diga isso sem ocupar a tela. */
function avisoSemPaginas(){
  const faltando = panorama().filter((m) => m.sem_paginas.length);
  if (!faltando.length) return "";
  const total = faltando.reduce((s, m) => s + m.sem_paginas.length, 0);
  return `<details class="faixa" style="margin:22px 0 0">
    <summary><b>${total} ${total === 1 ? "aula está" : "aulas estão"} fora do ciclo</b>
      — falta o total de páginas</summary>
    <p style="margin:9px 0 0">${faltando.map((m) =>
      esc(m.nome) + " (" + m.sem_paginas.length + ")").join(" · ")}</p>
    <p style="margin:7px 0 0">Preencha em Ajustes → Matérias conforme for baixando os PDFs.</p>
  </details>`;
}

function onde(t){
  return `<p class="foco-onde"><b>${esc(t.materia)}</b> · Aula ${t.aula_numero}${
    t.aula_titulo ? " — " + esc(t.aula_titulo) : ""} · Bloco ${t.bloco}</p>`;
}

function cartaoLeitura(t){
  return `<div class="foco">
    ${onde(t)}
    <p class="foco-o-que">${ROT_FASE[t.fase]}: páginas ${t.pag_inicio} a ${t.pag_fim}</p>
    <p class="foco-quanto">${t.paginas} páginas · parte ${t.parte}
      ${t.link_pdf ? `<a href="${esc(t.link_pdf)}" target="_blank" rel="noopener">abrir o PDF</a>` : ""}</p>
    <div class="campos">
      <div class="par">
        <div class="curto"><label for="ses-min">Minutos</label>
          <input id="ses-min" type="number" min="0" inputmode="numeric" placeholder="0"></div>
        <div><label for="ses-obs">Onde parei</label>
          <input id="ses-obs" value="${esc(t.observacao)}" placeholder="ex.: item 3.2, pág. 27"></div>
      </div>
      <div><label for="ses-pontos">Pontos-chave, de memória</label>
        <textarea id="ses-pontos" placeholder="Sem olhar o PDF: 2 ou 3 ideias centrais desta leitura."></textarea></div>
      <div class="acoes">
        <button class="b" id="btn-concluir">Concluir sessão</button>
        <p class="nota">Depois disso o rodízio passa para a próxima matéria.</p>
      </div>
    </div></div>`;
}

function cartaoExercicios(t){
  const m = estado.materias.find((x) => x.id === t.materia_id);
  const sarrafo = sarrafoDa(m, estado.cfg);
  return `<div class="foco exerc">
    ${onde(t)}
    <p class="foco-o-que">Exercícios: ${t.questoes} questões</p>
    <p class="foco-quanto">${t.momento === "fixacao"
      ? "Fixação — este resultado não conta para o sarrafo"
      : "Vale o sarrafo de " + sarrafo + "% desta matéria"}
      ${t.link_exercicios ? `<a href="${esc(t.link_exercicios)}" target="_blank" rel="noopener">abrir as questões</a>` : ""}</p>
    <div class="campos">
      <div class="par">
        <div class="curto"><label for="bat-q">Questões</label>
          <input id="bat-q" type="number" min="1" inputmode="numeric" value="${t.questoes}"></div>
        <div class="curto"><label for="bat-a">Acertos</label>
          <input id="bat-a" type="number" min="0" inputmode="numeric"></div>
        <div class="curto"><label for="bat-min">Minutos</label>
          <input id="bat-min" type="number" min="0" inputmode="numeric" placeholder="0"></div>
        <div><label for="bat-obs">Observação</label>
          <input id="bat-obs" placeholder="banca, caderno usado..."></div>
      </div>
      <div>
        <span class="rot">O assunto de cada questão que você errou</span>
        <div id="lista-erros"></div>
        <button class="b fraco mini" id="btn-mais-erro">Adicionar outro erro</button>
      </div>
      <div class="acoes"><button class="b" id="btn-registrar">Registrar resultado</button></div>
    </div></div>`;
}

function adicionarLinhaErro(){
  const lista = document.getElementById("lista-erros");
  if (!lista) return;
  const linha = document.createElement("div");
  linha.className = "erro-linha";
  linha.innerHTML = `<input placeholder="assunto da questão errada" data-campo="assunto" aria-label="Assunto do erro">
    <select data-campo="motivo" aria-label="Motivo do erro">${Object.entries(MOTIVOS)
      .map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join("")}</select>
    <button class="b fraco mini" data-tirar-erro="1" aria-label="Remover este erro">Tirar</button>`;
  lista.appendChild(linha);
}
</script>

<script>
"use strict";

/* =============================================================== PROGRESSO */

function telaProgresso(){
  const dados = panorama();
  const p = projecao();
  const cfg = estado.cfg;
  const q = dados.reduce((s, m) => s + m.questoes, 0);
  const a = dados.reduce((s, m) => s + m.acertos, 0);
  const geral = percentual(q, a);
  const sarrafoGeral = Number(cfg.meta_acerto);
  const fracos = [];
  dados.forEach((m) => m.blocos.forEach((b) => {
    if (b.abaixo) fracos.push(m.nome + ", bloco " + b.numero);
  }));

  document.getElementById("painel-progresso").innerHTML = `
    <div class="numeros">
      <div class="numero">
        <div class="valor">${p.ritmo != null ? p.ritmo : "—"}</div>
        <div class="rotulo">Sessões por dia</div>
        <div class="detalhe">seu ritmo nas últimas 4 semanas</div></div>
      <div class="numero">
        <div class="valor ${geral == null ? "" : geral >= sarrafoGeral ? "bom" : "ruim"}">${pct(geral)}</div>
        <div class="rotulo">Aproveitamento geral</div>
        <div class="detalhe">${q ? a + " de " + q + " questões · sarrafo " + sarrafoGeral + "%"
          : "nenhuma questão ainda"}</div></div>
      <div class="numero">
        <div class="valor" style="font-size:22px">${p.termino ? dataBr(p.termino) : "—"}</div>
        <div class="rotulo">Término previsto</div>
        <div class="detalhe">${p.pendentes} tarefas restantes</div></div>
    </div>
    ${fracos.length ? `<div class="faixa"><b>Abaixo do sarrafo:</b> ${esc(fracos.join(" · "))}.
      Estes blocos voltam para reforço quando o ciclo passar por eles.</div>` : ""}
    <div class="secao">
      ${dados.map(blocoDaMateria).join("") ||
        `<div class="nada">Nenhuma matéria cadastrada. Comece em Ajustes.</div>`}
    </div>
    ${secaoErros()}`;
}

function blocoDaMateria(m){
  return `<div class="materia-cab">
      <span class="nome">${esc(m.nome)}</span>
      ${m.ativa ? "" : `<span class="eti meio">pausada</span>`}
      <span class="eti ${m.percentual == null ? "" : m.percentual >= m.sarrafo ? "bom" : "ruim"}">${pct(m.percentual)}</span>
      <span class="meta">peso ${m.peso} · sarrafo ${m.sarrafo}% · ${m.aulas_no_ciclo} de ${m.total_aulas} aulas no ciclo</span>
    </div>
    ${m.blocos.map((b) => `
      <details class="dobra">
        <summary>
          <span class="titulo">Bloco ${b.numero}</span>
          <span class="onde" style="color:var(--ink2);font-size:13px">${plural(b.aulas.length, "aula", "aulas")}</span>
          <span class="direita">
            ${b.consolidado ? `<span class="eti bom">consolidado</span>`
              : b.abaixo ? `<span class="eti ruim">abaixo do sarrafo</span>`
              : b.emCurso ? `<span class="eti tom">em andamento</span>`
              : `<span class="eti">não começou</span>`}
            <span class="tabular">${b.percentual != null
              ? pct(b.percentual) + " · " + b.questoes_total + " questões" : "sem exercícios"}</span>
          </span>
        </summary>
        <div class="corpo"><div class="rolar"><table>
          <thead><tr><th>Aula</th><th>Situação</th><th class="n">Leitura</th><th class="n">Revisão</th>
            <th class="n">Rodada</th><th class="n">Última</th><th class="n">Acumulado</th></tr></thead>
          <tbody>${b.aulas.map((a) => `<tr>
            <td style="white-space:nowrap">Aula ${a.numero} ${esc(a.titulo)}</td>
            <td><span class="eti ${ETI_SIT[a.situacao] || ""}">${esc(NOME_SIT[a.situacao])}</span></td>
            <td class="n">${a.feitas_leitura}/${a.sessoes_leitura}</td>
            <td class="n">${a.feitas_revisao}/${a.sessoes_revisao}</td>
            <td class="n">${a.rodada}</td>
            <td class="n"><b>${pct(a.percentual_rodada)}</b></td>
            <td class="n">${a.questoes ? pct(a.percentual) + " em " + a.questoes : "—"}</td>
          </tr>`).join("")}</tbody></table></div></div>
      </details>`).join("") || `<div class="nada">Nenhuma aula com total de páginas preenchido.</div>`}
    ${m.sem_paginas.length ? `<p class="nota" style="padding:9px 2px">
      ${plural(m.sem_paginas.length, "aula fora do ciclo", "aulas fora do ciclo")} — falta o total
      de páginas, que você preenche em Ajustes.</p>` : ""}`;
}

function secaoErros(){
  const itens = estado.erros.slice().sort((x, y) =>
    (x.resolvido - y.resolvido) || String(y.data || "").localeCompare(String(x.data || "")));
  const resumo = new Map();
  for (const e of itens){
    const chave = e.materia + "||" + String(e.assunto).toLowerCase();
    if (!resumo.has(chave)) resumo.set(chave, { materia: e.materia, assunto: e.assunto, vezes: 0, abertos: 0 });
    const r = resumo.get(chave);
    r.vezes++; if (!e.resolvido) r.abertos++;
  }
  const ranking = [...resumo.values()].sort((x, y) => y.vezes - x.vezes);
  if (!ranking.length) return `<div class="secao">
    <p class="chapeu">Caderno de erros</p>
    <p class="nota">Vazio por enquanto. Ele se enche sozinho conforme você anota o assunto das
      questões erradas ao registrar uma bateria — e vira o material da véspera.</p></div>`;
  return `<div class="secao">
    <p class="chapeu">Caderno de erros</p>
    <ul class="lista">${ranking.slice(0, 12).map((r, i) => `
      <li><span class="pos">${i + 1}</span><span class="quem">${esc(r.assunto)}</span>
        <span class="onde">${esc(r.materia)}</span>
        <span class="oque">${r.vezes}× · ${r.abertos} em aberto</span></li>`).join("")}</ul>
    <details class="dobra" style="border-top:0"><summary><span class="titulo">Ver todos os
      ${itens.length} erros</span></summary>
      <div class="corpo"><div class="rolar"><table>
        <thead><tr><th>Data</th><th>Matéria</th><th class="n">Aula</th><th>Assunto</th>
          <th>Motivo</th><th></th></tr></thead>
        <tbody>${itens.map((e) => `<tr${e.resolvido ? ` style="opacity:.45"` : ""}>
          <td style="white-space:nowrap">${dataBr(e.data)}</td><td>${esc(e.materia)}</td>
          <td class="n">${e.aula_numero}</td><td>${esc(e.assunto)}</td>
          <td>${esc(MOTIVOS[e.motivo] || e.motivo)}</td>
          <td class="n"><button class="b fraco mini" data-erro="${esc(e.id)}">${
            e.resolvido ? "reabrir" : "resolvido"}</button></td></tr>`).join("")}
        </tbody></table></div></div></details>
  </div>`;
}

<script>
"use strict";

/* =======================================================================
   AÇÕES
   ===================================================================== */

function campos(elemento){
  const d = {};
  elemento.querySelectorAll("[data-campo]").forEach((c) => { d[c.dataset.campo] = c.value; });
  return d;
}

async function recarregar(){ await carregar(); desenhar(); }

async function concluirSessao(t){
  const aula = aulaPorId(t.aula_id);
  if (!aula) return;
  const feitas = Object.assign({}, aula.feitas);
  feitas[t.fase + "|" + t.rodada + "|" + t.indice] = {
    em: agora(), minutos: Number(document.getElementById("ses-min").value) || 0,
    pontos: document.getElementById("ses-pontos").value.trim().slice(0, 2000),
    pag_inicio: t.pag_inicio, pag_fim: t.pag_fim };
  await BD.doc("aulas/" + aula.id).update({
    feitas, observacao: document.getElementById("ses-obs").value.trim().slice(0, 300) });
  avisar("Sessão concluída. Próxima matéria do rodízio.");
  await recarregar();
}

async function registrarBateria(t){
  const questoes = Number(document.getElementById("bat-q").value);
  const bruto = document.getElementById("bat-a").value;
  if (bruto === ""){ avisar("Informe quantas questões você acertou."); return; }
  const acertos = Number(bruto);
  if (!(questoes > 0)){ avisar("O número de questões precisa ser maior que zero."); return; }
  if (acertos < 0 || acertos > questoes){ avisar("Os acertos não podem passar do total de questões."); return; }

  const aula = aulaPorId(t.aula_id);
  const materia = estado.materias.find((m) => m.id === t.materia_id);
  const registro = { momento: t.momento, rodada: t.rodada, questoes, acertos,
    minutos: Number(document.getElementById("bat-min").value) || 0, data: agora(),
    observacao: document.getElementById("bat-obs").value.trim().slice(0, 300) };
  const baterias = aula.baterias.concat([registro]);
  await BD.doc("aulas/" + aula.id).update({ baterias });

  const erros = [...document.querySelectorAll("#lista-erros .erro-linha")].map((l) => ({
    assunto: l.querySelector('[data-campo="assunto"]').value.trim().slice(0, 160),
    motivo: l.querySelector('[data-campo="motivo"]').value,
  })).filter((e) => e.assunto);
  for (const e of erros){
    await BD.collection("erros").add({ assunto: e.assunto, motivo: e.motivo,
      materia: materia.nome, aula_numero: aula.numero, data: agora(), resolvido: 0 });
  }
  if (aulaConsolidada(Object.assign({}, aula, { baterias }), estado.cfg, materia)[0]){
    await agendarRevisoes(aula, materia);
  }
  avisar(erros.length ? "Resultado e erros registrados." : "Resultado registrado.");
  await recarregar();
}

async function agendarRevisoes(aula, materia){
  const dias = String(estado.cfg.intervalos_revisao_espacada).split(",")
    .map((x) => parseInt(x, 10)).filter((x) => x > 0);
  for (const d of dias){
    const id = aula.id + "-" + d;
    if (estado.revisoes.some((r) => r.id === id)) continue;
    await BD.doc("revisoes/" + id).set({ aula_id: aula.id, materia: materia.nome,
      aula_numero: aula.numero, intervalo_dias: d,
      prevista_para: new Date(Date.now() + d * 864e5).toISOString().slice(0, 10),
      concluida_em: "" });
  }
}

async function criarAulas(materiaId, quantidade, inicio, paginas){
  const lote = [];
  for (let i = 0; i < quantidade; i++){
    lote.push({ materia_id: materiaId, numero: inicio + i, titulo: "",
      total_paginas: (paginas && paginas[inicio + i]) || 0,
      link_pdf: "", link_exercicios: "", observacao: "", feitas: {}, baterias: [] });
  }
  for (let i = 0; i < lote.length; i += 10){
    await Promise.all(lote.slice(i, i + 10).map((a) => BD.collection("aulas").add(a)));
  }
}

const SEMENTE = [
  { nome: "Direito Eleitoral", peso: 3, aulas: 18,
    paginas: { 0:59, 1:27, 2:76, 3:61, 4:72, 5:92, 6:122, 7:131, 8:85, 9:102 } },
  { nome: "Língua Portuguesa", peso: 2, aulas: 11, paginas: { 0:74 } },
  { nome: "Direito Administrativo", peso: 2, aulas: 16, paginas: { 0:76, 1:73, 4:80 } },
  { nome: "Informática", peso: 2, aulas: 17, paginas: { 0:89 } },
  { nome: "Noções de Administração Pública", peso: 2, aulas: 22, paginas: { 0:42 } },
  { nome: "Direito Constitucional", peso: 1, aulas: 11, paginas: { 0:40 } },
  { nome: "Direito Civil", peso: 1, aulas: 11, paginas: { 0:64 } },
  { nome: "Direito Penal", peso: 1, aulas: 12, paginas: { 0:45, 1:79, 6:119 } },
  { nome: "Direito Processual Civil", peso: 1, aulas: 10, paginas: {} },
  { nome: "Direito Processual Penal", peso: 1, aulas: 13, paginas: {} },
  { nome: "Normas Aplicáveis aos Servidores", peso: 1, aulas: 5, paginas: { 0:168 } },
];

async function semear(botao){
  botao.disabled = true;
  try {
    for (let i = 0; i < SEMENTE.length; i++){
      const s = SEMENTE[i];
      botao.textContent = "Criando " + s.nome + " (" + (i + 1) + " de " + SEMENTE.length + ")...";
      const ref = await BD.collection("materias").add({ nome: s.nome, peso: s.peso, ordem: i + 1,
        ativa: 1, qtd_blocos: 0, meta: 0 });
      await criarAulas(ref.id, s.aulas, 0, s.paginas);
    }
    avisar("Matérias carregadas. Agora preencha o total de páginas das aulas que faltam.");
    await recarregar();
  } catch (erro){
    botao.disabled = false;
    botao.textContent = "Usar as matérias da minha planilha";
    avisar("Não deu para criar tudo: " + (erro && erro.message ? erro.message : erro));
  }
}

async function baixarCopia(){
  if (!BAIXAR){ avisar("Este navegador não permite baixar arquivos desta página."); return; }
  const copia = { gerado_em: agora(), config: estado.cfg, materias: estado.materias,
    aulas: estado.aulas.map((a) => { const c = Object.assign({}, a); delete c.concluidas; return c; }),
    erros: estado.erros, revisoes: estado.revisoes };
  await BAIXAR.save({ filename: "ciclo-concursos-" + hoje() + ".json",
                      data: JSON.stringify(copia, null, 2) });
}

async function aoClicar(evento){
  const alvo = evento.target.closest("button");
  if (!alvo || !BD) return;
  const d = alvo.dataset;
  const atual = () => montarFila(estado, 1)[0];
  try {
    if (d.aba){ estado.aba = d.aba; desenhar(); return; }
    if (d.ir){ estado.aba = d.ir; desenhar(); return; }
    if (alvo.id === "btn-semear") return await semear(alvo);
    if (alvo.id === "btn-concluir") return await concluirSessao(atual());
    if (alvo.id === "btn-registrar") return await registrarBateria(atual());
    if (alvo.id === "btn-mais-erro") return adicionarLinhaErro();
    if (d.tirarErro) return alvo.closest(".erro-linha").remove();

    if (d.revFeita){
      await BD.doc("revisoes/" + d.revFeita).update({ concluida_em: hoje() });
      avisar("Revisão marcada como feita.");
      return await recarregar();
    }
    if (d.revAdiar){
      await BD.doc("revisoes/" + d.revAdiar)
        .update({ prevista_para: new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10) });
      avisar("Adiada em dois dias.");
      return await recarregar();
    }
    if (alvo.id === "btn-nova-materia"){
      const nome = document.getElementById("nm-nome").value.trim();
      if (!nome){ avisar("Dê um nome à matéria."); return; }
      const ref = await BD.collection("materias").add({ nome,
        peso: Number(document.getElementById("nm-peso").value) || 1,
        meta: Number(document.getElementById("nm-sarrafo").value) || 0,
        ordem: estado.materias.length + 1, ativa: 1, qtd_blocos: 0 });
      const quantas = Number(document.getElementById("nm-aulas").value) || 0;
      if (quantas) await criarAulas(ref.id, quantas, 0, null);
      avisar("Matéria criada.");
      return await recarregar();
    }
    if (d.salvarMateria){
      const v = campos(alvo.closest("[data-materia]"));
      await BD.doc("materias/" + d.salvarMateria).update({
        nome: v.nome.trim(), peso: Number(v.peso) || 1, ordem: Number(v.ordem) || 0,
        qtd_blocos: Number(v.qtd_blocos) || 0, meta: Number(v.meta) || 0,
        ativa: v.ativa === "1" ? 1 : 0 });
      avisar("Matéria salva.");
      return await recarregar();
    }
    if (d.excluirMateria){
      const m = estado.materias.find((x) => x.id === d.excluirMateria);
      if (!confirm("Excluir " + m.nome + " e todo o histórico dela?")) return;
      const aulas = estado.aulasPorMateria.get(m.id) || [];
      for (let i = 0; i < aulas.length; i += 10){
        await Promise.all(aulas.slice(i, i + 10).map((a) => BD.doc("aulas/" + a.id).delete()));
      }
      await BD.doc("materias/" + m.id).delete();
      avisar("Matéria excluída.");
      return await recarregar();
    }
    if (d.salvarAula){
      const v = campos(alvo.closest("[data-aula]"));
      await BD.doc("aulas/" + d.salvarAula).update({
        numero: Number(v.numero) || 0, titulo: v.titulo.trim(),
        total_paginas: Math.max(0, Number(v.total_paginas) || 0),
        link_pdf: v.link_pdf.trim(), link_exercicios: v.link_exercicios.trim() });
      avisar("Aula salva.");
      return await recarregar();
    }
    if (d.lote){
      const v = campos(alvo.closest("[data-materia]"));
      alvo.disabled = true;
      await criarAulas(d.lote, Number(v.lote_qtd) || 1, Number(v.lote_inicio) || 0, null);
      avisar("Aulas criadas. Agora preencha o total de páginas.");
      return await recarregar();
    }
    if (d.erro){
      const e = estado.erros.find((x) => x.id === d.erro);
      await BD.doc("erros/" + d.erro).update({ resolvido: e.resolvido ? 0 : 1 });
      return await recarregar();
    }
    if (d.sarrafo){ document.getElementById("campo-sarrafo").value = d.sarrafo; return; }
    if (alvo.id === "btn-salvar-cfg" || alvo.id === "btn-salvar-sarrafo"){
      const novo = {};
      document.querySelectorAll("[data-cfg]").forEach((c) => {
        novo[c.dataset.cfg] = c.type === "number" ? Number(c.value) : c.value.trim();
      });
      if (!(novo.meta_acerto > 0 && novo.meta_acerto <= 100)){
        avisar("O sarrafo precisa ficar entre 1% e 100%."); return;
      }
      if (novo.paginas_min_dia > novo.paginas_max_dia){
        avisar("O mínimo de páginas não pode ser maior que o máximo."); return;
      }
      await BD.doc("config/geral").set(Object.assign({}, estado.cfg, novo));
      avisar("Ajustes salvos.");
      return await recarregar();
    }
    if (alvo.id === "btn-backup") return await baixarCopia();
  } catch (erro){
    console.error(erro);
    avisar("Não deu certo: " + (erro && erro.message ? erro.message : "tente de novo"));
  }
}

/* ---------------------------------------------------------------------
   Duas casas, um arquivo só.

   Aberto pelo endereço do Claude, os dados ficam no servidor e acompanham
   você entre o notebook e o celular. Salvo no computador e aberto com dois
   cliques, o mesmo arquivo guarda tudo no próprio navegador — sem instalar
   nada, sem internet. A interface não sabe a diferença: os dois lados falam
   a mesma linguagem de documentos.
   ------------------------------------------------------------------- */

const NA_NUVEM = typeof window.claude === "object" && window.claude
                 && typeof window.claude.use === "function";

function bancoDoNavegador(){
  const CHAVE = "cicloConcursos.v1";
  let loja;
  try { loja = JSON.parse(localStorage.getItem(CHAVE)) || null; } catch (e){ loja = null; }
  if (!loja || typeof loja !== "object") loja = { docs: {}, seq: 0 };

  function salvar(){
    try {
      localStorage.setItem(CHAVE, JSON.stringify(loja));
    } catch (e){
      avisar("Não consegui salvar: o navegador está sem espaço. Baixe uma cópia em Ajustes.");
      throw e;
    }
  }
  const clonar = (d) => JSON.parse(JSON.stringify(d));
  const novoId = () => { loja.seq = (loja.seq || 0) + 1; return "d" + loja.seq.toString(36); };
  const snap = (c) => ({ id: c.split("/").pop(), exists: Object.hasOwn(loja.docs, c),
                         data: () => clonar(loja.docs[c] || {}) });
  const docRef = (c) => ({
    get: async () => snap(c),
    set: async (d) => { loja.docs[c] = clonar(d); salvar(); },
    update: async (d) => { loja.docs[c] = Object.assign({}, loja.docs[c] || {}, clonar(d)); salvar(); },
    delete: async () => { delete loja.docs[c]; salvar(); },
  });
  const colRef = (col) => {
    const profundidade = col.split("/").length + 1;
    const q = {
      limit: () => q, where: () => q, orderBy: () => q,
      get: async () => ({ docs: Object.keys(loja.docs)
        .filter((k) => k.startsWith(col + "/") && k.split("/").length === profundidade)
        .map(snap) }),
      doc: (id) => docRef(col + "/" + (id || novoId())),
      add: async (d) => { const id = novoId(); await docRef(col + "/" + id).set(d); return { id }; },
    };
    return q;
  };
  return { doc: docRef, collection: colRef, apagarTudo: () => { loja = { docs: {}, seq: 0 }; salvar(); } };
}

function baixarPeloNavegador(){
  return { save: async ({ filename, data }) => {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }};
}

/** Restaura uma cópia baixada antes. Substitui tudo o que existe hoje. */
async function restaurarCopia(texto){
  const copia = JSON.parse(texto);
  if (!copia || !Array.isArray(copia.materias)) throw new Error("Este arquivo não é uma cópia do Ciclo Concursos");
  for (const nome of ["materias", "aulas", "erros", "revisoes"]){
    const atuais = await BD.collection(nome).limit(1000).get();
    for (const d of atuais.docs) await BD.collection(nome).doc(d.id).delete();
  }
  if (copia.config) await BD.doc("config/geral").set(copia.config);
  for (const nome of ["materias", "aulas", "erros", "revisoes"]){
    for (const item of copia[nome] || []){
      const corpo = Object.assign({}, item);
      delete corpo.id; delete corpo.concluidas;
      await BD.collection(nome).doc(item.id).set(corpo);
    }
  }
}





function semBanco(){
  document.getElementById("painel-estudar").innerHTML = `<div class="secao">
    <h2>Não consegui abrir os seus dados</h2>
    <p class="legenda">Esta página guarda o seu progresso na sua conta. Recarregue; se continuar
      assim, abra o endereço de novo a partir do link original.</p></div>`;
}

document.addEventListener("click", aoClicar);
document.getElementById("menu").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-aba]");
  if (b){ estado.aba = b.dataset.aba; desenhar(); }
});
document.addEventListener("change", async (evento) => {
  if (evento.target.id !== "arquivo-copia") return;
  const arquivo = evento.target.files[0];
  if (!arquivo) return;
  if (!confirm("Restaurar a cópia apaga o que está aqui agora. Continuar?")) return;
  try {
    await restaurarCopia(await arquivo.text());
    avisar("Cópia restaurada.");
    await recarregar();
  } catch (erro){
    avisar(erro.message || "Não consegui ler o arquivo.");
  }
});

document.getElementById("painel-estudar").innerHTML =
  `<div class="nada">Carregando o seu ciclo...</div>`;

(async () => {
  if (NA_NUVEM){
    BD = await claude.use("db");
    if (!BD){ semBanco(); return; }
    try { BAIXAR = await claude.use("downloads"); } catch (e){ BAIXAR = null; }
  } else {
    BD = bancoDoNavegador();
    BAIXAR = baixarPeloNavegador();
  }
  try {
    await carregar();
    desenhar();
  } catch (erro){
    console.error(erro);
    document.getElementById("painel-estudar").innerHTML =
      `<div class="nada">Falha ao carregar: ${esc(erro && erro.message)}. Recarregue a página.</div>`;
  }
})();
