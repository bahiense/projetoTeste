            'Depois de conferir, repita a frase em voz alta na versão “como soa”: só se ouve o que a boca já produziu.</p>' +
            '</div>';
    }

    function pintaItem() {
        var item = bloco.itens[i];
        var area = ui.$('dt-area');
        if (!area) return;
        respondido = false;
        area.innerHTML =
            '<div class="dt-topo"><span>Frase ' + (i + 1) + ' de ' + bloco.itens.length + '</span>' +
            '<span class="dt-placar">' + acertos.length + ' respondidas · média ' + mediaAtual() + '%</span></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dt-ouvir">🔊 Ouvir</button>' +
            '<button class="btn" id="dt-lento">🐢 Bem devagar</button>' +
            '</div>' +
            '<textarea class="entrada entrada--grande" id="dt-txt" rows="3" placeholder="write exactly what you hear"></textarea>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dt-conferir">Conferir</button>' +
            '<button class="btn" id="dt-pular">Pular →</button>' +
            '</div>' +
            '<div id="dt-res"></div>';

        ui.$('dt-ouvir').addEventListener('click', function () { F.voz.falar(item.en, { rate: vel }); });
        ui.$('dt-lento').addEventListener('click', function () { F.voz.falar(item.en, { rate: 0.6 }); });
        ui.$('dt-conferir').addEventListener('click', conferir);
        ui.$('dt-pular').addEventListener('click', proximo);
        ui.$('dt-txt').addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) conferir();
        });
        ui.$('dt-txt').focus();
        F.voz.falar(item.en, { rate: vel });
    }

    function mediaAtual() {
        if (!acertos.length) return 0;
        return Math.round(acertos.reduce(function (a, b) { return a + b; }, 0) / acertos.length);
    }

    function conferir() {
        if (!ui.$('dt-res')) return;
        if (respondido) { proximo(); return; }
        var item = bloco.itens[i];
        var meu = ui.$('dt-txt').value;
        var r = F.texto.pontuar(item.en, meu);
        respondido = true;
        acertos.push(r.pct);
        F.store.registrar('ditado', r.pct);
        F.store.concluirBloco('escuta');

        ui.$('dt-res').innerHTML =
            '<div class="res-topo">' + ui.anel(r.pct) +
            '<div class="res-txt"><b>' + esc(ui.veredito(r.pct)) + '</b>' +
            '<small>O texto era: “' + esc(item.en) + '”</small></div></div>' +
            ui.diff(r) + ui.legendaDiff() +
            '<div class="soa-caixa"><b>Como isso realmente soa:</b> <i>' + esc(item.soa) + '</i> ' +
            ui.botaoOuvir(item.en, 'ouvir de novo') + '</div>' +
            (item.nota ? '<p class="nota-explica">' + esc(item.nota) + '</p>' : '') +
            '<p class="legenda">Agora fale a versão “como soa” três vezes em voz alta, rápido.</p>';

        ui.$('dt-conferir').textContent = 'Próxima →';
    }

    function proximo() {
        if (!ui.$('dt-area')) return;
        if (i + 1 >= bloco.itens.length) {
            var m = mediaAtual();
            ui.$('dt-area').innerHTML = '<div class="teste-fim">' + ui.anel(m, 'de escuta') +
                '<p>' + esc(m >= 90 ? 'Seu ouvido está pegando a fala colada. Suba de nível.'
                    : m >= 70 ? 'Bom. Repita este bloco amanhã e ele vira 90.'
                        : 'Ainda escapa muita coisa. Faça este mesmo bloco por três dias seguidos antes de trocar.') + '</p>' +
                '<div class="linha-botoes">' +
                '<button class="btn btn--forte" id="dt-refazer">Refazer este bloco</button>' +
                '<a class="btn" href="#/exercicios">Outro exercício</a></div></div>';
            ui.$('dt-refazer').addEventListener('click', function () { i = 0; acertos = []; pintaItem(); });
            return;
        }
        i++;
        pintaItem();
    }

    function montar() { pintaItem(); }

    return { render: render, montar: montar };
})();

    <script>
/* =========================================================
   TELA BLOCOS — memorização proposital com repetição espaçada.

   Regra: aparece o português, você PRODUZ o inglês em voz alta
   antes de revelar. Reconhecer não é saber.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.chunks = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;
    var fila = [], pos = 0, revelado = false, modo = 'treino', filtro = '';

    function render(args) {
        filtro = args[0] || '';
        var conjunto = F.curso.chunksDaSemana();
        var base = filtro ? F.data.chunks.filter(function (c) { return c.f === filtro; }) : conjunto.todos;
        var r = F.srs.resumo(base);
        fila = F.srs.fila(base, 20);
        pos = 0; revelado = false;

        var funcoes = ['<a class="pilula' + (filtro ? '' : ' is-on') + '" href="#/chunks">Da semana</a>'].concat(
            F.data.funcoes.map(function (f) {
                return '<a class="pilula' + (filtro === f.id ? ' is-on' : '') + '" href="#/chunks/' + f.id + '">' + esc(f.nome) + '</a>';
            })).join('');

        var fn = filtro ? F.curso.funcao(filtro) : null;

        return ui.cabecalho('Blocos de fala', 'O nativo não monta a frase: ele puxa o bloco pronto.') +
            '<div class="pilulas">' + funcoes + '</div>' +
            (fn ? '<p class="sub sub--solta">' + esc(fn.desc) + '</p>' : '') +

            '<div class="cartao">' +
            '<div class="srs-resumo">' +
            '<div><b>' + r.revisar + '</b><small>para revisar</small></div>' +
            '<div><b>' + r.novos + '</b><small>novos</small></div>' +
            '<div><b>' + r.aprendidos + '</b><small>na memória longa</small></div>' +
            '<div><b>' + r.total + '</b><small>no conjunto</small></div>' +
            '</div>' +
            '<div class="segmentado" id="ch-modo">' +
            '<button data-m="treino" class="is-on">Treinar</button>' +
            '<button data-m="lista">Ver a lista</button>' +
            '</div>' +
            '<div id="ch-area"></div>' +
            '</div>';
    }

    function pintar() {
        var area = ui.$('ch-area');
        if (!area) return;
        if (modo === 'lista') return pintarLista(area);
        if (!fila.length) {
            area.innerHTML = '<p class="vazio">Nada para revisar agora neste conjunto. ' +
                'Volte amanhã ou escolha outra função acima.</p>';
            return;
        }
        if (pos >= fila.length) {
            area.innerHTML = '<div class="teste-fim"><p class="feito-tudo">Rodada concluída: ' + fila.length + ' blocos.</p>' +
                '<p class="sub">Os que você errou voltam amanhã. Os fáceis somem por semanas.</p>' +
                '<button class="btn btn--forte" id="ch-mais">Mais uma rodada</button></div>';
            ui.$('ch-mais').addEventListener('click', function () { F.app.desenhar(); });
            F.store.concluirBloco('chunks');
            return;
        }

        var c = fila[pos];
        var cart = F.srs.cartao(c.id);
        revelado = false;

        area.innerHTML =
            '<div class="carta">' +
            '<div class="carta-topo">' + (pos + 1) + ' de ' + fila.length +
            ' · <span class="tag">' + esc((F.curso.funcao(c.f) || {}).nome || c.f) + '</span>' +
            (cart.rep ? ' · visto ' + (cart.acertos + cart.erros) + '×' : ' · novo') + '</div>' +
            '<p class="carta-pt">' + esc(c.pt) + '</p>' +
            '<p class="carta-instrucao">Diga em inglês, em voz alta, antes de revelar.</p>' +
            '<div id="ch-frente"><button class="btn btn--forte btn--grande" id="ch-revelar">Revelar</button></div>' +
            '</div>';

        ui.$('ch-revelar').addEventListener('click', revelar);
    }

    function revelar() {
        var c = fila[pos];
        revelado = true;
        var el = ui.$('ch-frente');
        if (!el) return;
        el.innerHTML =
            '<p class="carta-en">' + esc(c.en) + '</p>' +
            (c.nota ? '<p class="carta-nota">' + esc(c.nota) + '</p>' : '') +
            '<div class="linha-botoes">' +
            ui.botaoOuvir(c.en, 'Ouvir') +
            '<button class="btn btn--som" data-falar="' + esc(c.en) + '" data-rate="0.65">🐢 Devagar</button>' +
            '<button class="btn" id="ch-marcar">☆ Marcar</button>' +
            '</div>' +
            F.pratica.caixa('ch-pratica', 'Repetir em voz alta') +
            '<p class="carta-pergunta">Você produziu isso sozinho, antes de revelar?</p>' +
            '<div class="notas">' +
            '<button class="btn btn--nota bad" data-nota="0">Não saiu<small>volta amanhã</small></button>' +
            '<button class="btn btn--nota mid" data-nota="1">Com esforço<small>volta em breve</small></button>' +
            '<button class="btn btn--nota good" data-nota="2">Saiu na hora<small>some por semanas</small></button>' +
            '</div>';

        F.voz.falar(c.en);
        F.pratica.ligar('ch-pratica', { alvo: c.en, serie: 'pronuncia' });

        ui.$('ch-marcar').addEventListener('click', function () {
            var m = F.store.get().marcados;
            var k = m.indexOf(c.id);
            if (k >= 0) { m.splice(k, 1); ui.toast('Desmarcado.'); }
            else { m.push(c.id); ui.toast('Marcado para revisar sempre.'); }
            F.store.salvar();
        });

        ui.qq('#ch-area [data-nota]').forEach(function (b) {
            b.addEventListener('click', function () {
                F.srs.responder(c.id, parseInt(b.getAttribute('data-nota'), 10));
                pos++;
                pintar();
            });
        });
    }

    function pintarLista(area) {
        var conjunto = filtro ? F.data.chunks.filter(function (c) { return c.f === filtro; }) : F.curso.chunksDaSemana().todos;
        var porFuncao = {};
        conjunto.forEach(function (c) { (porFuncao[c.f] = porFuncao[c.f] || []).push(c); });

        area.innerHTML = Object.keys(porFuncao).map(function (f) {
            var fn = F.curso.funcao(f) || { nome: f, desc: '' };
            return '<section class="grupo">' +
                '<h4>' + esc(fn.nome) + '</h4><p class="sub">' + esc(fn.desc) + '</p>' +
                '<ul class="lista-chunks">' + porFuncao[f].map(function (c) {
                    var cart = F.srs.cartao(c.id);
                    return '<li>' +
                        '<button class="chunk-som" data-falar="' + esc(c.en) + '">🔊</button>' +
                        '<span><b>' + esc(c.en) + '</b><small>' + esc(c.pt) + '</small>' +
                        (c.nota ? '<em>' + esc(c.nota) + '</em>' : '') + '</span>' +
                        '<i class="selo n' + c.n + '">' + (cart.int >= 21 ? '✓' : c.n) + '</i>' +
                        '</li>';
                }).join('') + '</ul></section>';
        }).join('');
    }

    function montar() {
        ui.qq('#ch-modo button').forEach(function (b) {
            b.addEventListener('click', function () {
                modo = b.getAttribute('data-m');
                ui.qq('#ch-modo button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
                pintar();
            });
        });
        pintar();
    }

    return { render: render, montar: montar };
})();

    <script>
/* =========================================================
   TELA DRILLS — estímulo, relógio, resposta.

   Não é para acertar pensando: é para acertar sem pensar.
   Enquanto a estrutura exigir raciocínio, ela não existe na
   sua fala espontânea.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.drills = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;
    var drill = null, ordem = [], pos = 0, notas = [], tempo = 5, timer = null, rodando = false;

    function render(args) {
        var id = args[0] || F.curso.semanaAtual().drill;
        drill = F.curso.drill(id) || F.data.drills[0];
        ordem = ui.embaralhar(drill.itens);
        pos = 0; notas = [];

        var pills = F.data.drills.map(function (d) {
            return '<a class="pilula' + (d.id === drill.id ? ' is-on' : '') + '" href="#/drills/' + d.id + '">' + esc(d.nome) + '</a>';
        }).join('');

        return ui.cabecalho('Drills de automatização', 'Estímulo, poucos segundos, resposta em voz alta.') +
            '<div class="pilulas">' + pills + '</div>' +
            '<div class="cartao">' +
            '<h3>' + esc(drill.nome) + '</h3>' +
            '<p class="porque">' + esc(drill.foco) + '</p>' +
            '<p class="sub"><b>Como fazer:</b> ' + esc(drill.instrucao) + '</p>' +
            '<p class="modelo">Modelo: <i>' + esc(drill.modelo) + '</i></p>' +
            '<label class="campo campo--slider"><span>Tempo para responder: <b id="dr-tv">' + tempo + 's</b></span>' +
            '<input type="range" id="dr-tempo" min="2" max="10" step="1" value="' + tempo + '"></label>' +
            '<div id="dr-area"></div>' +
            '</div>';
    }

    function pintar() {
        var area = ui.$('dr-area');
        if (!area) return;
        if (pos >= ordem.length) return fim(area);

        var it = ordem[pos];
        area.innerHTML =
            '<div class="dr-topo"><span>' + (pos + 1) + ' de ' + ordem.length + '</span>' +
            '<span class="dt-placar">acertos: ' + notas.filter(Boolean).length + '</span></div>' +
            '<div class="dr-estimulo" id="dr-est">' + esc(it[0]) + '</div>' +
            '<div class="dr-relogio"><i id="dr-barra"></i></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dr-ir">▶ Ouvir e responder</button>' +
            '<button class="btn" id="dr-ver">Ver a resposta</button>' +
            '</div>' +
            '<div id="dr-res"></div>';

        ui.$('dr-ir').addEventListener('click', rodar);
        ui.$('dr-ver').addEventListener('click', function () { revelar(null); });
    }

    function rodar() {
        if (rodando) return;
        rodando = true;
        var it = ordem[pos];
        var barra = ui.$('dr-barra');
        ui.$('dr-res').innerHTML = '';

        F.voz.falar(it[0], { rate: 0.95 }).then(function () {
            if (!document.body.contains(barra)) return;
            barra.style.transition = 'none';
            barra.style.width = '100%';
            setTimeout(function () {
                barra.style.transition = 'width ' + tempo + 's linear';
                barra.style.width = '0%';
            }, 20);

            if (F.voz.temEscuta()) {
                F.voz.ouvir({ limite: tempo * 1000 }).then(function (r) {
                    revelar(r.vazio ? '' : r.texto);
                }).catch(function () { revelar(null); });
            } else {
                timer = setTimeout(function () { revelar(null); }, tempo * 1000);
            }
        });
    }

    function revelar(ouvido) {
        rodando = false;
        clearTimeout(timer);
        F.voz.pararEscuta();
        var caixa = ui.$('dr-res');
        if (!caixa) return;
        var it = ordem[pos];
        var certa = it[1];
        var html = '<div class="dr-resposta"><b>Resposta:</b> ' + esc(certa) + ' ' +
            ui.botaoOuvir(certa, 'ouvir') + '</div>';

        if (ouvido !== null && ouvido !== undefined) {
            var r = F.texto.pontuar(certa, ouvido);
            notas.push(r.pct >= 70);
            F.store.registrar('drill', r.pct);
            html += '<div class="res-topo">' + ui.anel(r.pct) +
                '<div class="res-txt"><b>' + esc(r.pct >= 70 ? 'Saiu.' : 'Ainda não saiu automático.') + '</b>' +
                '<small>Ouvi: “' + esc(ouvido || '(nada)') + '”</small></div></div>' + ui.diff(r);
        } else {
            html += '<p class="carta-pergunta">Você respondeu antes de ouvir?</p>' +
                '<div class="notas">' +
                '<button class="btn btn--nota bad" data-ok="0">Não</button>' +
                '<button class="btn btn--nota good" data-ok="1">Sim, na hora</button></div>';
        }
        html += '<button class="btn btn--forte" id="dr-prox">Próximo →</button>';
        caixa.innerHTML = html;

        F.voz.falar(certa, { rate: 0.95 });

        ui.qq('#dr-res [data-ok]').forEach(function (b) {
            b.addEventListener('click', function () {
                var ok = b.getAttribute('data-ok') === '1';
                notas.push(ok);
                F.store.registrar('drill', ok ? 100 : 0);
                pos++; pintar();
            });
        });
        ui.$('dr-prox').addEventListener('click', function () { pos++; pintar(); });
    }

    function fim(area) {
        if (!area) return;
        var pct = notas.length ? Math.round((notas.filter(Boolean).length / notas.length) * 100) : 0;
        F.store.concluirBloco('drill');
        area.innerHTML = '<div class="teste-fim">' + ui.anel(pct, 'automático') +
            '<p>' + esc(pct >= 90 ? 'Automatizado. Pode trocar de drill.'
                : pct >= 60 ? 'Está virando reflexo. Mais duas rodadas hoje e amanhã.'
                    : 'Ainda está sendo raciocinado. Diminua o tempo de resposta só quando acertar 8 de 10.') + '</p>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dr-de-novo">Rodar de novo, embaralhado</button>' +
            '<a class="btn" href="#/exercicios">Outro exercício</a></div></div>';
        ui.$('dr-de-novo').addEventListener('click', function () {
            ordem = ui.embaralhar(drill.itens); pos = 0; notas = []; pintar();
        });
    }

    function montar() {
        ui.$('dr-tempo').addEventListener('input', function () {
            tempo = parseInt(this.value, 10);
            ui.$('dr-tv').textContent = tempo + 's';
        });
        pintar();
    }

    function desmontar() { clearTimeout(timer); rodando = false; }

    return { render: render, montar: montar, desmontar: desmontar };
})();

</script>

        });

        ui.$('cv-prox').addEventListener('click', function () { turno++; pintar(); });

        /* A caixa de prática aqui compara com o modelo só para dar
           referência; o que vale mesmo é ter falado e usado os blocos. */
        F.pratica.ligar('cv-pratica', {
            alvo: function () { return dl.turnos[turno].modelo; },
            limite: 25000,
            aoResultado: function (pct, r) {
                var meu = r.hip.join(' ');
                minhas.push(meu);
                notas.push(pct);
                marcarObrigatorios(meu);
            }
        });
    }

    function marcarObrigatorios(texto) {
        var n = F.texto.normalizar(texto);
        dl.obrigatorios.forEach(function (o, i) {
            if (usados[i]) return;
            var alvo = F.texto.normalizar(o);
            // aceita a expressão inteira ou quase toda (o reconhecimento erra palavras pequenas)
            var partes = alvo.split(' ');
            var achou = n.indexOf(alvo) >= 0;
            if (!achou && partes.length > 2) {
                var presentes = partes.filter(function (p) { return n.indexOf(p) >= 0; }).length;
                achou = presentes / partes.length >= 0.8;
            }
            if (achou) {
                usados[i] = true;
                var chip = ui.q('#cv-chips [data-ob="' + i + '"]');
                if (chip) chip.classList.add('is-ok');
                ui.toast('Bloco usado: ' + o);
            }
        });
    }

    function fim(area) {
        if (!area) return;
        var usadosN = Object.keys(usados).length;
        var media = notas.length ? Math.round(notas.reduce(function (a, b) { return a + b; }, 0) / notas.length) : 0;
        var palavras = minhas.join(' ').split(/\s+/).filter(Boolean).length;
        F.store.registrar('fala', Math.min(100, media * 0.5 + (usadosN / dl.obrigatorios.length) * 50));
        F.store.concluirBloco('conversa');

        area.innerHTML = '<div class="teste-fim">' +
            '<h3>Cena encerrada</h3>' +
            '<div class="streak-linha">' +
            '<div class="streak-num">' + palavras + '<small>palavras suas</small></div>' +
            '<div class="streak-num">' + usadosN + '/' + dl.obrigatorios.length + '<small>blocos obrigatórios</small></div>' +
            '<div class="streak-num">' + media + '%<small>proximidade do modelo</small></div>' +
            '</div>' +
            '<p class="sub">Proximidade do modelo é referência, não nota: uma resposta diferente pode ser melhor. ' +
            'O que conta é ter falado sem travar e ter usado os blocos.</p>' +
            '<div class="cartao cartao--missao"><h3>Desafio</h3><p class="missao">' + esc(dl.desafio) + '</p></div>' +
            (minhas.length ? '<details class="transcricao"><summary>Ver o que você falou</summary><ul>' +
                minhas.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></details>' : '') +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="cv-refazer">Refazer a cena</button>' +
            '<a class="btn" href="#/arena">Ir para a arena</a>' +
            '</div></div>';

        ui.$('cv-refazer').addEventListener('click', function () {
            turno = 0; minhas = []; notas = []; usados = {};
            ui.qq('#cv-chips .chip').forEach(function (c) { c.classList.remove('is-ok'); });
            pintar();
        });
    }

    function montar() { pintar(); }

    return { render: render, montar: montar };
})();

</script>
    <script>
/* =========================================================
   TELA ARENA — falar sem parar, sob cronômetro.

   O exercício mais desconfortável do app e o que mais separa
   quem "sabe inglês" de quem fala inglês. A regra é uma só:
   a boca não pode parar até o relógio zerar.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.arena = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    var MODOS = [
        { id: 'monologo', nome: 'Monólogo', desc: 'Um tema sorteado. Falar sem parar até o tempo acabar.' },
        { id: 'entrevista', nome: 'Entrevista', desc: 'A pergunta que a banca faz. Resposta estruturada, sob relógio.' },
        { id: 'ensinar', nome: 'Ensinar', desc: 'O exercício central do método: você ensina algo em inglês.' },
        { id: 'debate', nome: 'Debate', desc: 'Você recebe um lado — inclusive um que você não defende.' },
        { id: 'narracao', nome: 'Narração', desc: 'Narrar o que está acontecendo, ao vivo, no presente.' }
    ];

    var modo = 'monologo', item = null, tempo = 60, rodando = false;
    var relogio = null, transcricao = '', escutaLoop = null, iniciou = 0;

    function render(args) {
        modo = args[0] || 'monologo';
        if (!F.data.prompts[modo]) modo = 'monologo';
        sortear();

        var pills = MODOS.map(function (m) {
            return '<a class="pilula' + (m.id === modo ? ' is-on' : '') + '" href="#/arena/' + m.id + '">' + esc(m.nome) + '</a>';
        }).join('');
        var md = MODOS.filter(function (m) { return m.id === modo; })[0];

        return ui.cabecalho('Arena', 'A boca não para até o relógio zerar. Errar é permitido; parar, não.') +
            '<div class="pilulas">' + pills + '</div>' +
            '<p class="sub sub--solta">' + esc(md.desc) + '</p>' +

            '<div class="cartao cartao--arena">' +
            '<div class="arena-prompt" id="ar-prompt"></div>' +
            '<div class="arena-relogio" id="ar-relogio">' + fmt(tempo) + '</div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte btn--grande" id="ar-ir">▶ Começar</button>' +
            '<button class="btn" id="ar-sortear">🎲 Outro tema</button>' +
            '<button class="btn btn--som" id="ar-ouvir">🔊 Ouvir o tema</button>' +
            '</div>' +
            '<div class="arena-vivo" id="ar-vivo"></div>' +
            '</div>' +

            '<div id="ar-res"></div>' +

            '<div class="cartao">' +
            '<h3>As três regras</h3>' +
            '<ul class="lista-check">' +
            '<li><b>Não pare.</b> Se travar numa palavra, descreva-a em inglês e siga.</li>' +
            '<li><b>Não traduza.</b> Nem uma palavra em português, nem para si mesmo.</li>' +
            '<li><b>Não se corrija.</b> Errou, segue. Correção é depois, ouvindo a gravação.</li>' +
            '</ul>' +
            '</div>';
    }

    function sortear() {
        var lista = F.data.prompts[modo];
        item = ui.sorteio(lista);
        tempo = item.t || (modo === 'debate' ? 90 : 90);
    }

    function pintarPrompt() {
        var el = ui.$('ar-prompt');
        if (!el) return;
        el.innerHTML = '<p class="arena-en">' + esc(item.p) + '</p>' +
            '<p class="arena-pt">' + esc(item.pt || '') + '</p>' +
            (item.dica ? '<p class="dica-turno">💡 ' + esc(item.dica) + '</p>' : '') +
            (modo === 'debate' ? '<p class="legenda">Defenda este lado por 90 segundos, concordando ou não.</p>' : '');
        ui.$('ar-relogio').textContent = fmt(tempo);
        ui.$('ar-ouvir').setAttribute('data-falar', item.p);
    }

    function fmt(s) {
        var m = Math.floor(s / 60), r = s % 60;
        return m + ':' + (r < 10 ? '0' : '') + r;
    }

    /* Reconhecimento longo: o Chrome encerra sozinho em pausas,
       então religamos até o tempo acabar. */
    function escutarAte(fimEm, aoTexto) {
        var vivo = true;
        function ciclo() {
            if (!vivo || Date.now() >= fimEm) return;
            F.voz.ouvir({
                continuo: true,
                limite: Math.max(1000, fimEm - Date.now()),
                onParcial: function (t) { aoTexto(t, false); }
            }).then(function (r) {
                if (r.texto) aoTexto(r.texto, true);
                if (vivo && Date.now() < fimEm - 500) setTimeout(ciclo, 120);
            }).catch(function () { vivo = false; });
        }
        ciclo();
        return { parar: function () { vivo = false; F.voz.pararEscuta(); } };
    }

    function comecar() {
        if (rodando) return parar();
        rodando = true;
        transcricao = '';
        iniciou = Date.now();
        ui.$('ar-ir').textContent = '⏹ Parar agora';
        ui.$('ar-res').innerHTML = '';
        ui.$('ar-vivo').innerHTML = '<p class="vivo-txt" id="ar-vivo-txt">…</p>';

        if (F.voz.temGravacao()) F.voz.comecarGravacao().catch(function () { });

        var fimEm = Date.now() + tempo * 1000;
        if (F.voz.temEscuta()) {
            escutaLoop = escutarAte(fimEm, function (t, final) {
                if (final) transcricao += ' ' + t;
                var el = ui.$('ar-vivo-txt');
                if (el) el.textContent = (transcricao + ' ' + (final ? '' : t)).trim().slice(-320);
            });
        } else {
            ui.$('ar-vivo').innerHTML = '<p class="sub">Sem reconhecimento de fala neste aparelho — ' +
                'fale assim mesmo, a gravação é o que importa.</p>';
        }

        relogio = ui.contagem(tempo, ui.$('ar-relogio'), parar);
    }

    function parar() {
        if (!rodando) return;
        rodando = false;
        var dur = relogio ? relogio.decorrido() : 0;
        if (relogio) relogio.parar();
        if (escutaLoop) escutaLoop.parar();
        var btIr = ui.$('ar-ir');
        if (btIr) btIr.textContent = '▶ Começar de novo';

        var audio = F.voz.gravando() ? F.voz.pararGravacao() : Promise.resolve(null);
        audio.then(function (url) { resultado(dur || tempo, url); });
    }

    function resultado(dur, url) {
        var caixa = ui.$('ar-res');
        if (!caixa) return;   // o aluno já saiu da arena
        var texto = transcricao.trim();
        var palavras = texto ? texto.split(/\s+/).filter(Boolean) : [];
        var wpm = dur > 0 ? Math.round((palavras.length / dur) * 60) : 0;
        var unicas = {};
        palavras.forEach(function (p) { unicas[F.texto.normalizar(p)] = 1; });
        var variedade = palavras.length ? Math.round((Object.keys(unicas).length / palavras.length) * 100) : 0;
        var chunksUsados = acharChunks(texto);
        var muletas = contarMuletas(texto);

        /* Nota da fala: volume, ritmo e riqueza. Nunca sobre "erro de gramática" —
           esse não é o objetivo deste exercício. */
        var nFluxo = Math.min(100, Math.round((wpm / 110) * 100));
        var nDuracao = Math.min(100, Math.round((dur / tempo) * 100));
        var nRiqueza = Math.min(100, variedade + chunksUsados.length * 4);
        var nota = Math.round(nFluxo * 0.4 + nDuracao * 0.35 + nRiqueza * 0.25);
        if (F.voz.temEscuta() && palavras.length) F.store.registrar('fala', nota);
        F.store.concluirBloco('fala');

        caixa.innerHTML = '<div class="cartao">' +
            '<h3>Como foi</h3>' +
            '<div class="streak-linha">' +
            '<div class="streak-num">' + dur + 's<small>falando</small></div>' +
            '<div class="streak-num">' + palavras.length + '<small>palavras</small></div>' +
            '<div class="streak-num">' + wpm + '<small>palavras/min</small></div>' +
            '<div class="streak-num">' + variedade + '%<small>variedade</small></div>' +
            '</div>' +
            (F.voz.temEscuta() && palavras.length ? '<div class="res-topo">' + ui.anel(nota, 'fala') +
                '<div class="res-txt"><b>' + esc(veredito(wpm, dur)) + '</b>' +
                '<small>Nativo em conversa relaxada fala entre 120 e 160 palavras por minuto.</small></div></div>' : '') +
            (chunksUsados.length ? '<p class="sub">Blocos do banco que você usou: ' +
                chunksUsados.map(function (c) { return '<span class="chip is-ok">' + esc(c) + '</span>'; }).join(' ') + '</p>'
                : '<p class="sub">Você não usou nenhum bloco do banco. Tente encaixar dois na próxima rodada — ' +
                'é assim que eles saem da lista e entram na sua fala.</p>') +
            (muletas.length ? '<p class="sub">Muletas detectadas: ' + muletas.map(function (m) {
                return '<span class="chip chip--alerta">' + esc(m.p) + ' ×' + m.n + '</span>';
            }).join(' ') + ' — troque por um chunk de ganhar tempo.</p>' : '') +
            (url ? '<div class="audio-linha"><b>Sua fala</b><audio controls src="' + url + '"></audio></div>' : '') +
            (texto ? '<details class="transcricao"><summary>Ver a transcrição</summary><p>' + esc(texto) + '</p></details>' : '') +
            '<p class="legenda">Ouça a gravação inteira. Anote no diário as três palavras que faltaram.</p>' +
            '<a class="btn" href="#/diario">Anotar no diário</a>' +
            '</div>';
    }

    function veredito(wpm, dur) {
        if (dur < tempo * 0.6) return 'Você parou antes do tempo. Da próxima, encha o silêncio com qualquer coisa — até "let me think" conta.';
        if (wpm < 70) return 'Muito devagar: ainda tem tradução no meio do caminho.';
        if (wpm < 110) return 'Ritmo de conversa cuidadosa. Já é comunicação real.';
        if (wpm <= 170) return 'Ritmo de nativo relaxado. É esse o alvo.';
        return 'Rápido demais para ser entendido com clareza — respire e marque as pausas.';
    }

    function acharChunks(texto) {
        var n = ' ' + F.texto.normalizar(texto) + ' ';
        var achados = [];
        F.data.chunks.forEach(function (c) {
            if (achados.length >= 8) return;
            var alvo = F.texto.normalizar(c.en.split('—')[0]);
            if (alvo.split(' ').length < 2) return;
            if (n.indexOf(' ' + alvo + ' ') >= 0) achados.push(c.en);
        });
        return achados;
    }

    function contarMuletas(texto) {
        var n = ' ' + F.texto.normalizar(texto) + ' ';
        var lista = ['like', 'you know', 'i mean', 'basically', 'actually', 'so', 'um', 'uh'];
        var out = [];
        lista.forEach(function (m) {
            var re = new RegExp(' ' + m + ' ', 'g');
            var c = (n.match(re) || []).length;
            if (c >= 4) out.push({ p: m, n: c });
        });
        return out;
    }

    function montar() {
        pintarPrompt();
        ui.$('ar-ir').addEventListener('click', comecar);
        ui.$('ar-sortear').addEventListener('click', function () {
            if (rodando) return;
            sortear(); pintarPrompt();
        });
    }

    function desmontar() {
        if (relogio) relogio.parar();
        if (escutaLoop) escutaLoop.parar();
        if (F.voz.gravando()) F.voz.pararGravacao();
        rodando = false;
    }

    return { render: render, montar: montar, desmontar: desmontar };
})();

</script>
    <script>
/* =========================================================
   TELA CORAGEM — exposição graduada contra a vergonha de falar.

   Vergonha não some por convencimento; some por exposição
   repetida e crescente. Um degrau de cada vez, duas vezes cada.

window.F = window.F || {};
F.telas = F.telas || {};

F.telas.coragem = (function () {

    function render() {

                '</section>';

        var pct = Math.round(((atual - 1) / F.data.escada.length) * 100);

        return ui.cabecalho('Escada da coragem',

            '<div class="cartao">' +
            '<div class="dia-topo">' +
            '<div><b>Degrau ' + atual + ' de 20</b><small>' + esc(F.curso.degrau(atual).titulo) + '</small></div>' +
            ui.anel(pct, 'da escada', 'neutro') +
            '</div>' +
            '<p class="sub">Cada degrau precisa ser cumprido <b>duas vezes</b> antes de destravar o próximo. ' +
            'Não vale "mais ou menos": ou você fez, ou não fez.</p>' +
            '</div>' +
            html;
    }

    function montar() {
        ui.qq('[data-fiz]').forEach(function (b) {
            b.addEventListener('click', function () {
                var n = parseInt(b.getAttribute('data-fiz'), 10);
                var e = F.store.get().escada;
                e.feitos[n] = (e.feitos[n] || 0) + 1;
                if (e.feitos[n] >= 2 && e.nivel === n && n < F.data.escada.length) {

                } else {
                    ui.toast('Registrado: ' + e.feitos[n] + '/2.');

                F.store.salvar();
                var d = F.curso.degrau(n);
                F.store.anotar({ tipo: 'coragem', texto: 'Degrau ' + n + ': ' + d.titulo, pergunta: d.debrief });
                F.app.desenhar();
            });
        });
    }

    return { render: render, montar: montar };
})();

    <script>
/* =========================================================
   TELA ERROS — as armadilhas do português dentro do inglês.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.erros = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    var TIPOS = {
        'falso-amigo': 'Falsos amigos',
        'literal': 'Tradução literal',
        'gramatica': 'Gramática sob pressão',
        'pragmatica': 'Soar rude sem querer'
    };

    var modo = 'quiz', tipo = '', ordem = [], pos = 0, acertos = 0;

    function render(args) {
        tipo = args[0] || '';
        preparar();
        var pills = ['<a class="pilula' + (tipo ? '' : ' is-on') + '" href="#/erros">Tudo</a>'].concat(
            Object.keys(TIPOS).map(function (t) {
                return '<a class="pilula' + (tipo === t ? ' is-on' : '') + '" href="#/erros/' + t + '">' + esc(TIPOS[t]) + '</a>';
            })).join('');

        return ui.cabecalho('Erros de brasileiro',
            'Não são erros bobos: é a estrutura do português vazando para dentro do inglês.') +
            '<div class="pilulas">' + pills + '</div>' +
            '<div class="cartao">' +
            '<div class="segmentado" id="er-modo">' +
            '<button data-m="quiz" class="is-on">Treinar</button>' +
            '<button data-m="lista">Ver a lista</button>' +
            '</div>' +
            '<div id="er-area"></div>' +
            '</div>';
    }

    function base() {
        return tipo ? F.data.erros.filter(function (e) { return e.tipo === tipo; }) : F.data.erros;
    }

    function preparar() {
        ordem = ui.embaralhar(base()).slice(0, 15);
        pos = 0; acertos = 0;
    }

    function pintar() {
        var area = ui.$('er-area');
        if (!area) return;
        if (modo === 'lista') return lista(area);
        if (pos >= ordem.length) {
            var pct = Math.round((acertos / ordem.length) * 100);
            area.innerHTML = '<div class="teste-fim">' + ui.anel(pct, 'de armadilhas') +
                '<p>' + esc(pct >= 90 ? 'Você já não cai nessas. Ótimo sinal.'
                    : pct >= 60 ? 'Bom, mas algumas ainda passam. Refaça amanhã.'
                        : 'Vale voltar na lista e ler as explicações antes de treinar de novo.') + '</p>' +
                '<button class="btn btn--forte" id="er-de-novo">Outra rodada</button></div>';
            ui.$('er-de-novo').addEventListener('click', function () { preparar(); pintar(); });
            return;
        }

        var e = ordem[pos];
        var esquerda = Math.random() < 0.5;
        var a = esquerda ? e.errado : e.certo;
        var b = esquerda ? e.certo : e.errado;
        var certoLado = esquerda ? 'b' : 'a';

        area.innerHTML =
            '<div class="dt-topo"><span>' + (pos + 1) + ' de ' + ordem.length + '</span>' +
            '<span class="dt-placar">acertos: ' + acertos + '</span></div>' +
            '<p class="sub">Qual das duas um nativo diria?</p>' +
            '<div class="op-duplo">' +
            '<button class="btn btn--op" data-l="a">' + esc(a) + '</button>' +
            '<button class="btn btn--op" data-l="b">' + esc(b) + '</button>' +
            '</div>' +
            '<div id="er-fb"></div>';

        ui.qq('#er-area [data-l]').forEach(function (bt) {
            bt.addEventListener('click', function () {
                var ok = bt.getAttribute('data-l') === certoLado;
                if (ok) acertos++;
                ui.$('er-fb').innerHTML =
                    '<div class="fb ' + (ok ? 'fb--ok' : 'fb--erro') + '">' + (ok ? '✓ Isso.' : '✕ Era a outra.') + '</div>' +

        if (n >= 50) return 'Intermediário alto: comunica bem o que planejou, trava no improviso.';
        if (n >= 30) return 'Começando o programa. O número sobe rápido nas primeiras semanas — não pare agora.';
        return 'Poucos dados ainda. Faça o ciclo completo por uma semana e volte aqui.';

    function mediaDe(arr) {
        if (!arr.length) return null;
        return Math.round(arr.reduce(function (a, b) { return a + b.p; }, 0) / arr.length);

    function grafico(h) {
        if (!h.length) return '<div class="grafico grafico--vazio">sem dados ainda</div>';

        var larg = 260, alt = 54;
        var passo = pontos.length > 1 ? larg / (pontos.length - 1) : larg;
        var d = pontos.map(function (p, i) {
            return (i ? 'L' : 'M') + (i * passo).toFixed(1) + ' ' + (alt - (p.p / 100) * alt).toFixed(1);
        }).join(' ');
        return '<svg class="grafico" viewBox="0 0 ' + larg + ' ' + alt + '" preserveAspectRatio="none">' +
            '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2" ' +
            'stroke-linejoin="round" stroke-linecap="round"/></svg>';
    }

    function barrasMinutos() {
        var s = F.store.get();
        var meta = s.config.metaDiaria || 45;
        var hoje = new Date();
        var barras = [];
        for (var i = 13; i >= 0; i--) {
            var d = new Date(hoje.getTime() - i * 86400000);
            var k = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
            var min = s.minutos[k] || 0;
            var h = Math.min(100, Math.round((min / meta) * 100));

                '<i style="height:' + Math.max(3, h) + '%"></i>' +
                '<small>' + ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][d.getDay()] + '</small></div>');
        }
        return '<div class="minutos-barras">' + barras.join('') + '</div>' +
            '<p class="legenda">Últimos 14 dias contra a meta de ' + meta + ' minutos.</p>';
    }

    function p2(n) { return n < 10 ? '0' + n : '' + n; }

    return { render: render };
})();

(function () {
    'use strict';

    var ui = F.ui, esc = F.ui.esc;
    var telaAtual = null;

    /* ---------------- navegação ---------------- */

    var ROTAS = [
        'inicio', 'hoje', 'exercicios', 'pronuncia', 'shadowing', 'escuta', 'chunks',
        'drills', 'conversa', 'arena', 'coragem', 'erros', 'plano', 'diario',
        'progresso', 'config', 'metodo'
    ];

    function rota() {
        var h = (location.hash || '').replace(/^#\/?/, '');
        var partes = h.split('/').filter(Boolean);
        var nome = partes[0] || (F.store.get().pacto ? 'hoje' : 'inicio');
        if (ROTAS.indexOf(nome) < 0) nome = 'hoje';
        return { nome: nome, args: partes.slice(1) };
    }

    function ir(hash) { location.hash = hash; }

    function desenhar() {
        var r = rota();

        if (!tela) { alvo.innerHTML = '<p class="vazio">Tela não encontrada.</p>'; return; }

        // deixa a tela anterior desligar timers e áudio
        if (telaAtual && telaAtual.desmontar) { try { telaAtual.desmontar(); } catch (e) { } }
        F.voz.pararFala();
        F.voz.pararEscuta();

        telaAtual = tela;
        alvo.innerHTML = tela.render(r.args) || '';
        alvo.scrollTop = 0;
        window.scrollTo(0, 0);
        if (tela.montar) tela.montar(r.args);
        pintarCabecalho();
        marcarNav(r.nome);

    function marcarNav(nome) {
        var mapa = { hoje: 'hoje', exercicios: 'exercicios', coragem: 'coragem', progresso: 'progresso' };

        ui.qq('.nav-item').forEach(function (b) {
            b.classList.toggle('is-on', b.getAttribute('data-nav') === grupo);
        });

    function pintarCabecalho() {
        var s = F.store.get();

        var pct = Math.min(100, Math.round((min / meta) * 100));
        ui.$('cab-streak').textContent = s.streak.atual;
        ui.$('cab-min').textContent = min + '/' + meta + ' min';

                '<ul class="lista-check">' +
                '<li><b>45 minutos por dia</b>, seis dias por semana. Trinta deles falando em voz alta.</li>' +
                '<li><b>Um alvo por semana</b>, por 48 semanas: um som, uma estrutura, uma função, uma missão real.</li>' +
                '<li><b>O app te ouve</b> e mostra, palavra por palavra, o que o ouvido de um nativo perderia.</li>' +
                '<li><b>Escada da coragem</b>: 20 degraus do espelho até ensinar uma aula inteira em inglês.</li>' +
                '</ul>' +
                '</div>' +

                '<div class="cartao cartao--pacto">' +
                '<h3>O pacto</h3>' +
                '<p>Na escola missionária existe uma regra chamada <b>SYL — Speak Your Language</b>. ' +
                'Durante o tempo combinado, não se fala a língua materna. Nem uma palavra. ' +
                'Não é rigor por rigor: é que a saída fácil do português é exatamente o que impede o cérebro ' +
                'de procurar o caminho em inglês.</p>' +
                '<label class="pacto-linha"><input type="checkbox" id="pc1"> Vou falar em voz alta todos os dias, mesmo sozinho, mesmo feio.</label>' +
                '<label class="pacto-linha"><input type="checkbox" id="pc2"> Quando faltar palavra, vou descrever em inglês em vez de trocar para o português.</label>' +
                '<label class="pacto-linha"><input type="checkbox" id="pc3"> Não vou pedir desculpa pelo meu inglês. Nunca.</label>' +
                '<label class="campo"><span>Seu nome</span><input type="text" id="nome" placeholder="como quer ser chamado" autocomplete="name"></label>' +
                '<button class="btn btn--grande" id="assinar" disabled>Assinar e começar a semana 1</button>' +
                '</div>' +

                '<p class="rodape-nota">Tudo fica salvo só no seu aparelho. Nenhum dado sai daqui.</p>' +
                '</div>';
        },
        montar: function () {
            var cxs = ['pc1', 'pc2', 'pc3'].map(ui.$);
            var bt = ui.$('assinar');
            function checa() {
                bt.disabled = !cxs.every(function (c) { return c.checked; });
            }
            cxs.forEach(function (c) { c.addEventListener('change', checa); });
            bt.addEventListener('click', function () {
                var s = F.store.get();
                s.pacto = true;
                s.nome = ui.$('nome').value.trim();
                s.criado = F.store.hoje();
                F.store.salvar();
                F.store.tocarStreak();
                ui.toast('Pacto assinado. Bem-vindo ao dia 1.');
                ir('#/hoje');
            });
        }
    };

    /* =========================================================
       TELA: configurações
       ========================================================= */
    F.telas.config = {
        render: function () {
            var c = F.store.get().config;
            var vozes = F.voz.listaVozes();
            var opts = ['<option value="">Escolher automaticamente</option>'].concat(vozes.map(function (v) {
                return '<option value="' + esc(v.name) + '"' + (c.voz === v.name ? ' selected' : '') + '>' +
                    esc(v.name) + ' — ' + esc(v.lang) + '</option>';
            })).join('');

            return ui.cabecalho('Ajustes', 'Voz, meta diária e seus dados.') +
                '<div class="cartao">' +
                '<label class="campo"><span>Sotaque de referência</span>' +
                '<select id="cfg-sotaque">' +
                ['en-US:Americano', 'en-GB:Britânico', 'en-AU:Australiano', 'en-IN:Indiano'].map(function (o) {
                    var p = o.split(':');
                    return '<option value="' + p[0] + '"' + (c.sotaque === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
                }).join('') +
                '</select></label>' +

                '<label class="campo"><span>Voz do aparelho ' +
                (vozes.length ? '(' + vozes.length + ' em inglês)' : '(nenhuma voz em inglês encontrada)') +
                '</span><select id="cfg-voz">' + opts + '</select></label>' +
                '<button class="btn btn--som" data-falar="This is how I sound. Repeat after me, and listen to the rhythm.">🔊 Testar a voz</button>' +

                '<label class="campo"><span>Velocidade da fala: <b id="cfg-rate-v">' + c.rate + '×</b></span>' +
                '<input type="range" id="cfg-rate" min="0.5" max="1.3" step="0.05" value="' + c.rate + '"></label>' +

                '<label class="campo"><span>Meta diária: <b id="cfg-meta-v">' + c.metaDiaria + ' min</b></span>' +
                '<input type="range" id="cfg-meta" min="15" max="120" step="5" value="' + c.metaDiaria + '"></label>' +

                '<label class="campo campo--linha"><input type="checkbox" id="cfg-pt"' + (c.mostrarPt ? ' checked' : '') + '>' +
                '<span>Mostrar a tradução em português por padrão</span></label>' +
                '</div>' +

                '<div class="cartao">' +
                '<h3>Seus dados</h3>' +
                '<p class="sub">Tudo fica neste aparelho. Baixe uma cópia antes de trocar de celular ou limpar o navegador.</p>' +
                '<div class="linha-botoes">' +
                '<button class="btn" id="exportar">Baixar backup</button>' +
                '<button class="btn" id="importar">Restaurar backup</button>' +
                '<button class="btn btn--perigo" id="zerar">Apagar tudo</button>' +
                '</div>' +
                '<input type="file" id="arquivo" accept="application/json" hidden>' +
                '</div>' +

                '<div class="cartao">' +
                '<h3>Recursos do aparelho</h3>' +
                '<ul class="lista-status">' +
                linhaStatus('Falar (voz do sistema)', F.voz.temFala()) +
                linhaStatus('Ouvir você (reconhecimento de fala)', F.voz.temEscuta()) +
                linhaStatus('Gravar sua voz', F.voz.temGravacao()) +
                '</ul>' +
                (F.voz.temEscuta() ? '' : '<p class="sub">Sem reconhecimento de fala, todos os exercícios continuam ' +
                    'funcionando: no lugar de falar, você digita o que diria. O ideal é usar o Chrome.</p>') +
                '</div>';
        },
        montar: function () {
            var s = F.store.get();
            function liga(id, fn) { var e = ui.$(id); if (e) e.addEventListener('change', fn); }
            liga('cfg-sotaque', function () { s.config.sotaque = this.value; s.config.voz = ''; F.store.salvar(); desenhar(); });
            liga('cfg-voz', function () { s.config.voz = this.value; F.store.salvar(); });
            liga('cfg-pt', function () { s.config.mostrarPt = this.checked; F.store.salvar(); });

            var r = ui.$('cfg-rate');
            r.addEventListener('input', function () {
                s.config.rate = parseFloat(this.value);
                ui.$('cfg-rate-v').textContent = s.config.rate.toFixed(2) + '×';
                F.store.salvar();
            });
            var m = ui.$('cfg-meta');
            m.addEventListener('input', function () {
                s.config.metaDiaria = parseInt(this.value, 10);
                ui.$('cfg-meta-v').textContent = s.config.metaDiaria + ' min';
                F.store.salvar();
                pintarCabecalho();
            });

            ui.$('exportar').addEventListener('click', function () {
                var blob = new Blob([F.store.exportar()], { type: 'application/json' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'fluencia180-' + F.store.hoje() + '.json';
                document.body.appendChild(a); a.click(); a.remove();
                ui.toast('Backup baixado.');
            });
            ui.$('importar').addEventListener('click', function () { ui.$('arquivo').click(); });
            ui.$('arquivo').addEventListener('change', function () {
                var f = this.files[0];
                if (!f) return;
                var leitor = new FileReader();
                leitor.onload = function () {
                    try {
                        F.store.importar(leitor.result);
                        ui.toast('Backup restaurado.');
                        desenhar();
                    } catch (e) { ui.toast('Arquivo inválido.', 'erro'); }
                };
                leitor.readAsText(f);
            });
            ui.$('zerar').addEventListener('click', function () {
                if (!confirm('Apagar todo o seu progresso? Isso não tem volta.')) return;
                F.store.zerar();
                ir('#/inicio');
                desenhar();
            });
        }
    };

    function linhaStatus(nome, ok) {
        return '<li class="' + (ok ? 'ok' : 'nao') + '">' + (ok ? '✓' : '✕') + ' ' + esc(nome) + '</li>';
    }

    /* =========================================================
       TELA: o método (por que cada exercício existe)
       ========================================================= */
    F.telas.metodo = {
        render: function () {
            return ui.cabecalho('Por que este método funciona',
                'Escola missionária de idiomas: o que ela faz de diferente, e por que dá certo com brasileiro.') +
                '<div class="cartao texto-longo">' +
                '<h3>1. A língua se aprende usando, não estudando</h3>' +
                '<p>No treinamento missionário, o aluno recebe uma tarefa real — ensinar uma lição, visitar uma família — ' +
                'e a língua é o instrumento para cumprir a tarefa. Ninguém "estuda inglês": as pessoas resolvem coisas ' +
                'em inglês. É por isso que aqui todo exercício tem um objetivo comunicativo, e não uma lista de vocabulário.</p>' +

                '<h3>2. Bloco, não palavra</h3>' +
                '<p>Quem monta a frase peça por peça sempre vai falar devagar, por mais que saiba gramática. ' +
                'O falante fluente puxa blocos prontos da memória — <i>to be honest with you</i>, <i>that makes sense</i>, ' +
                '<i>I see where you are coming from</i>. São mais de seiscentos blocos aqui, por função, e a repetição ' +
                'espaçada garante que eles fiquem.</p>' +

                '<h3>3. Falar antes de estar pronto</h3>' +
                '<p>A regra SYL existe para tirar a saída fácil. Quem pode voltar ao português quando falta uma palavra ' +
                'nunca desenvolve a habilidade mais importante da fluência: <b>contornar</b> — explicar a palavra que ' +
                'você não sabe usando as que você sabe. Nativo faz isso o tempo todo.</p>' +

                '<h3>4. Repetição até virar reflexo</h3>' +
                '<p>Os drills de estímulo e resposta parecem antiquados, e são: vêm do método audiolingual, que a escola ' +
                'missionária nunca abandonou porque funciona para uma coisa específica — automatizar estrutura. ' +
                'Enquanto você precisar pensar para formar um present perfect, ele não existe na sua fala espontânea.</p>' +

                '<h3>5. Constância mata talento</h3>' +
                '<p>Quarenta e cinco minutos por dia durante seis meses são cento e trinta e cinco horas de prática ' +
                'concentrada. Três horas num sábado, uma vez por mês, não são nada. O app mede sua sequência de dias ' +
                'porque é a única métrica que prevê o resultado final.</p>' +

                '<h3>6. Erro corrigido na hora, sem drama</h3>' +
                '<p>O app te ouve, mostra o que saiu diferente e nomeia o erro típico de brasileiro por trás. ' +
                'Sem nota vermelha, sem humilhação, sem elogio falso: informação exata e a próxima tentativa.</p>' +

                '<h3>O que este método NÃO é</h3>' +
                '<p>Não é curso de gramática, não substitui conversar com gente de verdade e não faz milagre em quem ' +
                'não abre a boca. As missões semanais existem justamente para te empurrar para fora do app — ' +
                'é lá fora que a fluência acontece. Aqui é o treino.</p>' +
                '</div>';
        }
    };

    /* ---------------- boot ---------------- */

    F.app = { ir: ir, desenhar: desenhar, pintarCabecalho: pintarCabecalho };

    document.addEventListener('DOMContentLoaded', function () {
        if (!location.hash) location.hash = F.store.get().pacto ? '#/hoje' : '#/inicio';
        desenhar();
        if ('serviceWorker' in navigator) {
            location.protocol !== 'file:' && navigator.serviceWorker.register('sw.js').catch(function () { });
        }
    });
})();

</script>
</body>

</html>
