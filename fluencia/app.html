    /* O reconhecimento de fala do Android não devolve o microfone no instante
       em que é desligado: o serviço do sistema ainda segura a captura por um
       momento, e o getUserMedia falha com NotReadableError. Uma espera fixa
       resolve em alguns aparelhos e não em outros, então aqui se tenta de
       novo, dando mais tempo a cada rodada. */
    var ESPERAS = [120, 700, 1500];

    function comecarGravacao(tentativa) {
        if (!temGravacao()) return Promise.reject(new Error('sem-gravacao'));

        /* Dentro do app, quem grava é o Android. */
        var nativo = gravadorNativo();
        if (nativo) {
            F.diag.anotar('gravação: pedindo ao Android');
            return prepararMicrofone().then(function () {
                var r = nativo.comecar();
                F.diag.anotar('gravação: Android respondeu "' + r + '"');
                if (r === 'ok') return true;
                if (r === 'sem-permissao') throw new Error('permissao-negada');
                var e = new Error(String(r).replace(/^erro:/, '') || 'gravacao-falhou');
                e.name = 'NotReadableError';

            });
        }

        var n = tentativa || 0;

        return prepararMicrofone()
            .then(function () { return esperar(ESPERAS[n]); })
            .then(function () { return abrirCaptura(); })
            .catch(function (e) {
                F.diag.anotar('gravação: tentativa ' + (n + 1) + ' falhou (' + (e && e.name) + ')');
                var ocupado = e && (e.name === 'NotReadableError' || e.name === 'AbortError' ||
                    e.name === 'NotFoundError');
                if (ocupado && n < ESPERAS.length - 1) return comecarGravacao(n + 1);
                throw e;
            });
    }

    function abrirCaptura() {
        return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            ultimoStream = stream;
            pedacos = [];
            var tipos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', ''];
            var mime = '';

            }
            gravador = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
            gravador.ondataavailable = function (e) { if (e.data && e.data.size) pedacos.push(e.data); };

            return true;

    function pararGravacao() {
        var nativo = gravadorNativo();
        if (nativo) {
            return new Promise(function (resolve) {
                // o arquivo precisa fechar antes de a página tentar tocá-lo
                setTimeout(function () { resolve(nativo.parar() || null); }, 300);

                var blob = new Blob(pedacos, { type: gravador.mimeType || 'audio/webm' });

    /* Apaga o arquivo (no app) ou solta o blob (no navegador). Uma gravação

    function apagarGravacao(url) {

        var nativo = gravadorNativo();

    }

    function gravando() {
        var nativo = gravadorNativo();
        if (nativo) return nativo.gravando();
        return !!gravador && gravador.state === 'recording';
    }

    return {
        temFala: temFala,
        temEscuta: temEscuta,
        temGravacao: temGravacao,
        listaVozes: listaVozes,
        falar: falar,
        pararFala: pararFala,
        falarSequencia: falarSequencia,
        ouvir: ouvir,
        pararEscuta: pararEscuta,
        escutando: escutando,
        comecarGravacao: comecarGravacao,
        pararGravacao: pararGravacao,
        soltarStream: soltarStream,
        apagarGravacao: apagarGravacao,
        gravando: gravando
    };
})();

    <script>
/* =========================================================
   Peças de interface reaproveitadas por todas as telas.
   ========================================================= */
window.F = window.F || {};

F.ui = (function () {
    'use strict';

    function $(id) { return document.getElementById(id); }
    function q(sel, raiz) { return (raiz || document).querySelector(sel); }
    function qq(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    var toastTimer = null;
    function toast(msg, tipo) {
        var el = $('toast');
        if (!el) return;
        el.textContent = msg;
        el.className = 'toast is-on' + (tipo ? ' toast--' + tipo : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.className = 'toast'; }, 2600);
    }

    /* Anel de nota, 0 a 100. */
    /* cor: sem argumento, semáforo de desempenho; 'neutro' para barra de
       progresso, onde estar no começo não é um problema a sinalizar. */
    function anel(pct, rotulo, cor) {
        pct = Math.max(0, Math.min(100, Math.round(pct || 0)));
        if (cor === 'neutro') cor = 'var(--accent)';
        else if (!cor) cor = pct >= 85 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--bad)';
        return '<div class="anel" style="--pct:' + pct + ';--cor:' + cor + '">' +
            '<div class="anel-num">' + pct + '<small>%</small></div>' +
            (rotulo ? '<div class="anel-rot">' + esc(rotulo) + '</div>' : '') +
            '</div>';
    }

    function barra(pct, cor) {
        pct = Math.max(0, Math.min(100, Math.round(pct || 0)));
        return '<div class="barra"><i style="width:' + pct + '%' + (cor ? ';background:' + cor : '') + '"></i></div>';
    }

    /* Mostra o diff entre o esperado e o que foi ouvido. */
    function diff(resultado) {
        var out = resultado.ops.map(function (o) {
            if (o.op === 'ok') return '<span class="w w--ok">' + esc(o.ref) + '</span>';
            if (o.op === 'troca') return '<span class="w w--troca" title="ouvi: ' + esc(o.hip) + '">' + esc(o.ref) +
                '<em>' + esc(o.hip) + '</em></span>';
            if (o.op === 'faltou') return '<span class="w w--faltou">' + esc(o.ref) + '</span>';
            return '<span class="w w--sobrou">' + esc(o.hip) + '</span>';
        }).join(' ');
        return '<div class="diff">' + out + '</div>';
    }

    function legendaDiff() {
        return '<p class="legenda">' +
            '<span class="w w--ok">certo</span> ' +
            '<span class="w w--troca">saiu diferente</span> ' +
            '<span class="w w--faltou">não saiu</span> ' +
            '<span class="w w--sobrou">sobrou</span></p>';
    }

    function dicasDiagnostico(lista) {
        if (!lista || !lista.length) return '';
        return '<div class="diag">' + lista.map(function (d) {
            return '<div class="diag-item"><b>' + d.n + '×</b> ' + esc(d.dica) +
                ' <a href="#/pronuncia/' + d.id + '" class="link">treinar isso</a></div>';
        }).join('') + '</div>';
    }

    /* Cronômetro regressivo simples; devolve um objeto com parar(). */
    function contagem(segundos, elemento, aoFim) {
        var restante = segundos;
        function pinta() {
            var m = Math.floor(restante / 60), s = restante % 60;
            if (elemento) elemento.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }
        pinta();
        var t = setInterval(function () {
            restante--;
            pinta();
            if (restante <= 0) {
                clearInterval(t);
                if (aoFim) aoFim();
            }
        }, 1000);
        return {
            parar: function () { clearInterval(t); return segundos - restante; },
            decorrido: function () { return segundos - restante; }
        };
    }

    /* Cronômetro progressivo. */
    function relogio(elemento, aoTique) {
        var seg = 0;
        var t = setInterval(function () {
            seg++;
            if (elemento) {
                var m = Math.floor(seg / 60), s = seg % 60;
                elemento.textContent = m + ':' + (s < 10 ? '0' : '') + s;
            }
            if (aoTique) aoTique(seg);
        }, 1000);
        return { parar: function () { clearInterval(t); return seg; }, seg: function () { return seg; } };
    }

        var arr = a.slice();
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }

    }

    function sorteio(a) { return a[Math.floor(Math.random() * a.length)]; }

    function botaoOuvir(texto, rotulo, extra) {
        return '<button class="btn btn--som" data-falar="' + esc(texto) + '"' +
            (extra || '') + '>🔊 ' + esc(rotulo || 'Ouvir') + '</button>';
    }

    /* ---------------------------------------------------------
       Ajuda em pop-up.

       A explicação precisa existir — sem ela o aluno não sabe o
       que fazer —, mas não precisa estar na frente dele o tempo
       todo. Fica atrás de um botão, perto do exercício que ela
       explica, e some depois de lida.
       --------------------------------------------------------- */
    var ajudas = [];

    function limparAjudas() { ajudas = []; }

    function ajuda(titulo, conteudo, rotulo) {
        var i = ajudas.push({ titulo: titulo, corpo: conteudo }) - 1;
        return '<button class="btn-ajuda" data-ajuda="' + i + '" ' +
            'aria-label="' + esc('Como funciona: ' + titulo) + '">' +
            (rotulo ? esc(rotulo) : '?') + '</button>';
    }

    function abrirAjuda(i) {

    <script>
/* =========================================================
   LEMBRETE DE ESTUDO — o aviso antes da hora.

   Constância é o que decide o resultado em seis meses, e o que
   quebra a constância quase nunca é falta de vontade: é a hora
   passar sem ninguém avisar. O aviso vem alguns minutos ANTES
   do horário marcado, que é quando ainda dá para largar o que
   está fazendo — no minuto exato já é tarde.

   Quem avisa de verdade é o Android, pelo AlarmManager: o
   navegador só consegue avisar com a página aberta, e isso não
   serve para lembrar de nada.
   ========================================================= */
window.F = window.F || {};

F.lembrete = (function () {
    'use strict';

    var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
    var timerWeb = null;

    function cfg() { return F.store.get().config.lembrete; }

    function ponte() {
        return (window.__android && window.__android.lembretes) || null;
    }

    /* ---------------- próximo disparo ----------------

       O dia escolhido é o dia do ESTUDO, não o do aviso: quem marca
       segunda 00h05 com dez minutos de antecedência é avisado no
       domingo às 23h55, e não numa segunda que não existe. */
    function proximo(quando) {
        var c = cfg();
        if (!c.ligado || !c.dias.length) return null;
        var partes = String(c.hora || '19:00').split(':');
        var h = parseInt(partes[0], 10) || 0, m = parseInt(partes[1], 10) || 0;
        var agora = quando || new Date();

        for (var i = 0; i < 9; i++) {
            var estudo = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + i, h, m, 0, 0);
            if (c.dias.indexOf(estudo.getDay()) < 0) continue;
            var aviso = new Date(estudo.getTime() - (c.antes || 0) * 60000);
            if (aviso.getTime() > agora.getTime()) return { aviso: aviso, estudo: estudo };
        }
        return null;
    }

    function doisDigitos(n) { return (n < 10 ? '0' : '') + n; }

    function descrever() {
        var c = cfg();
        if (!c.ligado) return 'Desligado.';
        if (!c.dias.length) return 'Nenhum dia escolhido — marque pelo menos um.';
        var p = proximo();
        if (!p) return 'Sem próximo aviso.';
        var hoje = new Date();
        var dif = Math.floor((p.aviso - new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())) / 86400000);
        var quando = dif === 0 ? 'hoje' : dif === 1 ? 'amanhã' : DIAS[p.aviso.getDay()];
        return 'Próximo aviso ' + quando + ' às ' +
            doisDigitos(p.aviso.getHours()) + ':' + doisDigitos(p.aviso.getMinutes()) +
            (c.antes ? ' (estudo às ' + doisDigitos(p.estudo.getHours()) + ':' + doisDigitos(p.estudo.getMinutes()) + ')' : '');
    }

    /* ---------------- estado do aparelho ---------------- */

    /* Três coisas podem faltar, e cada uma tem conserto diferente:
       permissão de notificar, permissão de alarme exato, e o app
       nativo em si. Misturar as três num "não funcionou" deixa o
       aluno sem saber o que fazer. */
    function estado() {
        var p = ponte();
        if (!p) {
            var web = typeof Notification !== 'undefined';
            return {
                onde: 'navegador',
                pode: web && Notification.permission === 'granted',
                permissao: web ? Notification.permission : 'indisponivel',
                exato: true
            };
        }
        var bruto = {};
        try { bruto = JSON.parse(p.estado() || '{}'); } catch (e) { }
        return {
            onde: 'android',
            pode: !!bruto.permissao,
            permissao: bruto.permissao ? 'granted' : 'denied',
            exato: bruto.exato !== false,
            agendados: bruto.agendados || 0
        };
    }

    /* Pede a permissão e devolve o resultado por promessa, para a tela
       poder mostrar o que aconteceu sem ficar consultando. */
    function pedirPermissao() {
        var p = ponte();
        if (p) {
            return new Promise(function (resolve) {
                window.__pontePermissaoAviso = function (ok) {
                    window.__pontePermissaoAviso = null;
                    resolve(!!ok);
                };
                try { p.pedirPermissao(); } catch (e) { resolve(false); }
                /* Se o Android não responder (permissão já negada duas vezes,
                   por exemplo), não deixa a tela esperando para sempre. */
                setTimeout(function () {
                    if (window.__pontePermissaoAviso) {
                        window.__pontePermissaoAviso = null;
                        resolve(estado().pode);
                    }
                }, 20000);
            });
        }
        if (typeof Notification === 'undefined') return Promise.resolve(false);
        return Notification.requestPermission().then(function (r) { return r === 'granted'; });
    }

    function abrirAjustesDeAlarme() {
        var p = ponte();
        if (p && p.abrirAjustesExato) { try { p.abrirAjustesExato(); } catch (e) { } }
    }

    /* ---------------- aplicar ----------------

       Chamado sempre que a configuração muda. No Android entrega o
       plano inteiro para o lado nativo reagendar; no navegador arma
       um temporizador que só vale enquanto a página estiver aberta. */
    function aplicar() {
        var c = cfg();
        var p = ponte();
        if (p) {
            try {
                p.agendar(JSON.stringify({
                    ligado: !!c.ligado,
                    dias: c.dias || [],
                    hora: c.hora || '19:00',
                    antes: c.antes || 0
                }));
            } catch (e) { }
            return;
        }
        armarNoNavegador();
    }

    function armarNoNavegador() {
        clearTimeout(timerWeb);
        var c = cfg();
        if (!c.ligado || typeof Notification === 'undefined') return;
        if (Notification.permission !== 'granted') return;
        var p = proximo();
        if (!p) return;
        var espera = p.aviso - new Date();
        /* setTimeout com valor acima de ~24,8 dias estoura; e de qualquer
           forma a aba não fica aberta tanto tempo. */
        if (espera > 86400000) return;
        timerWeb = setTimeout(function () {
            try {
                new Notification('Fluência 180', {
                    body: texto(c.antes),
                    tag: 'fluencia-estudo'
                });
            } catch (e) { }
            armarNoNavegador();
        }, espera);
    }

    function texto(antes) {
        if (!antes) return 'Hora de estudar. Comece pelo bloco de hoje.';
        return 'Seu estudo começa em ' + antes + ' minuto' + (antes > 1 ? 's' : '') +
            '. Separe o fone e um lugar onde dê para falar alto.';
    }

    return {
        DIAS: DIAS,
        proximo: proximo,
        descrever: descrever,
        estado: estado,
        pedirPermissao: pedirPermissao,
        abrirAjustesDeAlarme: abrirAjustesDeAlarme,
        aplicar: aplicar
    };
})();

</script>

    <script>
/* =========================================================
   Prática falada — o pedaço reaproveitado por todas as telas.

   Fluxo: o app fala o modelo, você repete, o reconhecimento de
   voz transcreve, o texto é comparado com o alvo e o erro é
   diagnosticado. Sem reconhecimento de voz no aparelho, o
   mesmo exercício funciona por escrito.
   ========================================================= */
window.F = window.F || {};

F.pratica = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    /* Caixa de prática: botão de falar + área de resultado. */
    function caixa(id, rotulo) {
        return '<div class="pratica" id="' + id + '">' +
            '<button class="btn btn--falar" data-papel="falar">🎙️ ' + esc(rotulo || 'Sua vez — falar') + '</button>' +
            '<div class="pratica-status" data-papel="status"></div>' +
            '<div class="pratica-res" data-papel="res"></div>' +
            '</div>';
    }

    /* Liga a caixa. opcoes: { alvo: string|função, serie: 'pronuncia', aoResultado: fn(pct, res) } */
    function ligar(id, opcoes) {
        var raiz = ui.$(id);
        if (!raiz) return;
        var bt = raiz.querySelector('[data-papel="falar"]');
        var status = raiz.querySelector('[data-papel="status"]');
        var res = raiz.querySelector('[data-papel="res"]');
        var ocupado = false;

        function alvoAtual() {
            return typeof opcoes.alvo === 'function' ? opcoes.alvo() : opcoes.alvo;
        }

        function mostrar(texto) {
            if (!document.body.contains(res)) return;
            var alvo = alvoAtual();
            var r = F.texto.pontuar(alvo, texto);
            var diag = F.texto.diagnosticoDaFrase(r);
            /* Onde a fala é livre (role-play, explicar), comparar com um modelo
               único não diz se a frase está certa — diz só o quanto ela é
               parecida. A correção por regras entra aí, e é ela que responde
               a pergunta que o aluno realmente faz: "o que eu falei estava
               errado?". */
            res.innerHTML =
                '<div class="res-topo">' + ui.anel(r.pct, opcoes.livre ? 'proximidade' : '') +
                '<div class="res-txt"><b>' + esc(opcoes.livre ? 'Comparação com o modelo'
                    : opcoes.veredito ? opcoes.veredito(r.pct) : ui.veredito(r.pct)) + '</b>' +
                '<small>Ouvi: “' + esc(texto || '(nada)') + '”</small></div></div>' +
                (opcoes.livre ? '' : ui.diff(r) + ui.legendaDiff() + ui.dicasDiagnostico(diag)) +
                (opcoes.corrigir ? F.correcao.html(texto, { checar: opcoes.checar || [] }) : '') +
                (opcoes.livre ? '<p class="legenda">A sua resposta não precisa ser igual à do modelo. ' +
                    'A proximidade é só referência de tamanho e registro.</p>' : '');
            if (opcoes.serie) F.store.registrar(opcoes.serie, r.pct);
            if (opcoes.aoResultado) opcoes.aoResultado(r.pct, r);
        }

        /* motivo: 'sem-suporte' quando o aparelho não tem reconhecimento, ou o
           nome do erro quando a tentativa falhou — dizer "não reconhece fala"
           para quem acabou de usar o reconhecimento é mentira, e manda o aluno
           procurar solução no lugar errado. */
        function porEscrito(motivo) {
            var aviso;
            if (!motivo || motivo === 'sem-suporte') {
                aviso = 'Este aparelho não reconhece fala (no computador, use o Chrome). ' +
                    'Fale em voz alta assim mesmo e digite o que você disse:';
            } else {
                var causas = {
                    'sem-internet': 'Sem internet. O reconhecimento de fala do Android é feito na rede — ' +
                        'sem conexão, ele não funciona (o resto do app funciona offline).',
                    'microfone-ocupado': 'O microfone está ocupado por outro app — chamada, assistente de ' +
                        'voz ou gravador.',
                    'reconhecimento-ocupado': 'O reconhecimento ainda estava terminando a escuta anterior.',
                    'reconhecimento-instavel': 'O serviço de reconhecimento do aparelho recusou o pedido. ' +
                        'O app já tentou de novo sozinho.',
                    'servidor-de-fala': 'O servidor de reconhecimento do Google não respondeu.',
                    'limite-do-google': 'O Google limitou os pedidos de reconhecimento por agora.',
                    'idioma-nao-instalado': 'O pacote de voz em inglês não está instalado. Ajustes do ' +
                        'aparelho → Google → Voz → Reconhecimento de fala offline → baixar inglês.',
                    'no-speech': 'Não chegou nenhuma voz. Fale mais perto e mais alto do que parece preciso.'
                };
                aviso = 'A escuta falhou agora. ' + (causas[motivo] || 'Motivo relatado: ' + motivo + '.') +
                    ' Toque no botão para tentar de novo, ou fale e digite o que você disse:';
            }
            res.innerHTML = '<div class="fallback">' +
                '<p class="sub">' + esc(aviso) + '</p>' +
                '<textarea class="entrada" rows="2" placeholder="write what you just said out loud"></textarea>' +
                '<button class="btn" data-papel="conferir">Conferir</button></div>';
            var ta = res.querySelector('textarea');

            res.querySelector('[data-papel="conferir"]').addEventListener('click', function () {
                mostrar(ta.value);
            });
        }

        bt.addEventListener('click', function () {
            if (ocupado) { F.voz.pararEscuta(); return; }
            if (!F.voz.temEscuta()) { porEscrito('sem-suporte'); return; }

            ocupado = true;
            bt.classList.add('is-ouvindo');
            bt.textContent = '⏹ Parar';
            status.textContent = 'Ouvindo… fale a frase inteira.';

            F.voz.ouvir({
                limite: opcoes.limite || 15000,

            }).then(function (r) {

                if (!document.body.contains(raiz)) return;

                if (r.vazio) {
                    res.innerHTML = '<p class="sub">Não ouvi nada. Fale mais perto do microfone — ' +
                        'e mais alto do que parece necessário.</p>';
                    return;

                mostrar(r.texto);
            }).catch(function (e) {
                ocupado = false;
                if (!document.body.contains(raiz)) return;
                bt.classList.remove('is-ouvindo');
                bt.textContent = '🎙️ Sua vez — falar';
                status.textContent = '';
                if (String(e.message) === 'not-allowed') {
                    res.innerHTML = '<p class="sub">O microfone está bloqueado para o app. Abra os ajustes ' +

    /* Gravador para se ouvir: grava, toca, guarda a anterior para comparação

    function gravador(id) {

    /* A segunda linha é sempre a anterior; a distância no tempo é o que dá

    function rotuloAntes(g) {
        var q = quando(g);
        return q === 'hoje' ? 'Antes' : 'Antes · ' + q;
    }

    /* "hoje", "ontem", "há 12 dias" — é a distância que dá sentido à comparação. */
    function quando(g) {
        if (!g.data) return '';
        var dias = F.store.diasEntre(g.data, F.store.hoje());
        if (dias <= 0) return 'hoje';
        if (dias === 1) return 'ontem';
        if (dias < 30) return 'há ' + dias + ' dias';
        return g.data;

                    '<button class="btn btn--apagar" data-apagar="' + esc(g.url) + '" ' +
                    'title="apagar esta gravação" aria-label="apagar esta gravação">✕</button>' +
                    '</div>';
            }).join('') +
                (lista.length > 1
                    ? '<p class="legenda">Ouça as duas. A diferença entre elas é o seu progresso — ' +

                    : '<p class="legenda">Guardada. Grave de novo daqui a duas semanas e compare — ' +

                F.voz.pararGravacao().then(function (url) {
                    if (!document.body.contains(raiz)) return;
                    bt.textContent = '⏺ Gravar de novo';
                    bt.classList.remove('is-rec');
                    if (!url) {
                        saida.innerHTML = '<p class="sub">A gravação saiu vazia — fale mais perto do ' +
                            'microfone e por pelo menos dois segundos.</p>';
                        return;
                    }
                    var saíram = F.store.guardarGravacao({ url: url, chave: chave });
                    saíram.forEach(function (v) { F.voz.apagarGravacao(v.url); });
                    pintar();
                });
            } else {
                F.voz.comecarGravacao().then(function () {
                    bt.textContent = '⏹ Parar gravação';
                    bt.classList.add('is-rec');
                }).catch(function (e) {
                    saida.innerHTML = '<p class="sub">' + esc(explicarMicrofone(e)) + '</p>';
                    F.ui.toast('Não consegui acessar o microfone.', 'erro');
                });
            }
        });
    }

    /* Cada motivo tem uma saída diferente, e um aviso genérico deixa o aluno
       sem ação. O nome técnico vai junto: é o que permite corrigir o app
       quando alguém relata a falha. */
    function explicarMicrofone(e) {
        /* Erros do navegador se identificam pelo .name (NotAllowedError); os
           nossos, pela mensagem. Olhar só um dos dois faz o aviso dizer
           "Error", que não ajuda ninguém. */
        var nome = (e && e.name) || '';
        var msg = (e && e.message) || '';
        nome = (nome && nome !== 'Error') ? nome : (msg || 'desconhecido');
        if (nome === 'permissao-negada' || nome === 'NotAllowedError' || nome === 'SecurityError') {
            return 'O microfone está bloqueado para o app. Abra os ajustes do aparelho → Aplicativos → ' +
                'Fluência 180 → Permissões → Microfone → Permitir, e tente de novo. (' + nome + ')';
        }
        if (nome === 'NotReadableError' || nome === 'AbortError') {
            // no app é o Android que grava, e não há as três tentativas do navegador
            var noApp = !!(window.__android && window.__android.gravador);
            return 'O microfone está ocupado' +
                (noApp ? '' : ' — o app tentou três vezes, esperando até um segundo e meio entre elas') +
                '. Quem costuma segurar é uma chamada em andamento, um assistente de voz ' +
                '(Bixby, Google, Alexa) ou um gravador aberto. Feche e toque em gravar de novo; ' +
                'se insistir, veja o Diagnóstico em Ajustes. (' + nome + ')';
        }
        if (nome === 'NotFoundError') {
            return 'Este aparelho não apresentou nenhum microfone ao navegador. (' + nome + ')';
        }
        if (nome === 'permissao-sem-resposta') {
            return 'O pedido de permissão ficou sem resposta. Toque em gravar de novo e responda ao aviso do Android.';
        }
        if (nome === 'sem-gravacao') {
            return 'Este navegador não grava áudio. No computador, use o Chrome; no celular, o app instalado pelo APK.';
        }
        return 'Não consegui abrir o microfone. Motivo relatado pelo sistema: ' + nome + '.';
    }

    return { caixa: caixa, ligar: ligar, gravador: gravador, ligarGravador: ligarGravador, explicarMicrofone: explicarMicrofone };
})();

</script>

        var h = new Date().getHours();
        var p = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
        return nome ? p + ', ' + nome + '.' : p + '.';
    }

    /* Últimos 35 dias, estilo grade de contribuições. */
    function calendario() {
        var s = F.store.get();
        var hoje = new Date();
        var celulas = [];
        for (var i = 34; i >= 0; i--) {
            var d = new Date(hoje.getTime() - i * 86400000);
            var chave = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
            var min = s.minutos[chave] || 0;
            var n = min === 0 ? 0 : min < 15 ? 1 : min < 30 ? 2 : min < 45 ? 3 : 4;
            celulas.push('<i class="cal-n' + n + '" title="' + chave + ': ' + min + ' min"></i>');
        }
        return '<div class="calendario">' + celulas.join('') + '</div>' +
            '<p class="legenda">Últimos 35 dias. Quanto mais escuro, mais tempo de boca aberta.</p>';
    }

    function p2(n) { return n < 10 ? '0' + n : '' + n; }

    function montar() {
        var b = ui.$('proxima-semana');
        if (!b) return;
        b.addEventListener('click', function () {
            var s = F.store.get();
            if (s.semana >= F.data.curriculo.length) {
                ui.toast('Você chegou ao fim do programa. Recomece o ciclo num nível mais alto.');
                return;
            }
            if (!confirm('Fechar a semana ' + s.semana + ' e abrir a ' + (s.semana + 1) + '?\n\n' +
                'Só avance se a missão da semana foi cumprida de verdade.')) return;
            F.curso.avancarSemana();
            ui.toast('Semana ' + F.store.get().semana + ' liberada.');
            F.app.desenhar();
        });
    }

    return { render: render, montar: montar };
})();

F.telas = F.telas || {};

        return ui.cabecalho('Pronúncia') +

            '</div>' +
            '<div class="pares">' + pares + '</div>' +
            '<div class="linha-botoes">' +
            '<button class="btn" id="bt-teste">Teste de ouvido (10 rodadas)</button>' +
            '<button class="btn" id="bt-tudo">Ouvir todos, devagar</button>' +
            '</div>' +
            '<div id="teste-area"></div>' +
            '</div>' +

            '<div class="cartao">' +
            '<div class="cartao-titulo"><h3>Sua vez</h3>' +
            '<span class="sub">frase <b id="fr-num">1</b> de ' + som.frases.length + '</span>' +
            ui.ajuda('Sua vez', '<p>Ouça o modelo, repita <b>em voz alta</b> e o app mostra o que ele ' +
                'entendeu da sua fala, palavra por palavra.</p><p>A contagem de sílabas é o alerta contra ' +

            '<div class="linha-botoes">' +
            ui.botaoOuvir(frasePartida(som.frases[0]).real, 'Ouvir', ' id="bt-ouvir"') +
            '<button class="btn" id="bt-lento" data-falar="' + esc(frasePartida(som.frases[0]).real) + '" data-rate="0.6">🐢 Devagar</button>' +
            '<button class="btn" id="bt-prox">Próxima frase →</button>' +
            '</div>' +
            F.pratica.caixa('pr-pratica') +
            '</div>' +

            '<div class="cartao">' +
            '<div class="cartao-titulo"><h3>Gravar e comparar</h3>' +
            ui.ajuda('Gravar e comparar', '<p>Grave a mesma frase hoje e daqui a duas semanas. É o ' +
                'exercício mais desconfortável e o mais convincente: a diferença entre as duas gravações ' +
                'é a única prova de progresso que não mente.</p><p>O app guarda a anterior de cada som, ' +
                'com a data. O ✕ apaga uma gravação — a antiga pergunta antes, porque não dá para refazer.</p>') +
            '</div>' +
            F.pratica.gravador('pr-grav') +
            '</div>';
    }

    /* Um lado do par mínimo. O lado que representa o ERRO não ganha áudio:
       é grafia para o olho brasileiro, e a voz inglesa lendo "es-tó-pi" não
       produz nem o erro nem o acerto. Fica como texto, para comparação. */
    function lado(texto, ipa) {
        var falavel = F.texto.paraFalar(texto);
        if (F.texto.ehGrafiaDeErro(texto, ipa) || !falavel) {
            return '<span class="par-lado par-lado--erro"><b>' + esc(texto) + '</b>' +
                '<small>' + esc(ipa) + '</small></span>';
        }
        return '<button class="par-lado" data-falar="' + esc(falavel) + '">' +
            '<b>' + esc(texto) + '</b><small>' + esc(ipa) + '</small></button>';
    }

    /* A frase pode vir com a versão "como soa" depois da seta. As duas
       aparecem; só a primeira é falada e contada. */
    function frasePartida(t) {
        var partes = String(t).split('→');
        return { real: partes[0].trim(), soa: (partes[1] || '').trim() };
    }

    function blocoFrase(t) {
        var f = frasePartida(t);
        return '<p class="frase-alvo" id="fr-txt">' + esc(f.real) + '</p>' +
            (f.soa ? '<p class="soa-caixa"><b>Como isso soa:</b> <i>' + esc(f.soa) + '</i></p>' : '') +
            '<p class="legenda" id="fr-silabas">Sílabas esperadas: <b>' + F.texto.silabas(f.real) +
            '</b> — se você falou mais, colou vogal onde não tem.</p>';
    }

    function montar() {
        F.pratica.ligar('pr-pratica', {
            alvo: function () { return frasePartida(som.frases[frase]).real; },
            serie: 'pronuncia',
            aoResultado: function () { F.store.concluirBloco('aquecimento'); }
        });
        F.pratica.ligarGravador('pr-grav', { chave: 'pronuncia:' + som.id });

        ui.$('bt-prox').addEventListener('click', function () {
            frase = (frase + 1) % som.frases.length;
            var t = som.frases[frase];
            var real = frasePartida(t).real;
            ui.$('fr-bloco').innerHTML = blocoFrase(t);
            ui.$('fr-num').textContent = frase + 1;
            ui.$('bt-ouvir').setAttribute('data-falar', real);
            ui.$('bt-lento').setAttribute('data-falar', real);
            ui.q('#pr-pratica [data-papel="res"]').innerHTML = '';
            F.voz.falar(real);
        });

        ui.$('bt-tudo').addEventListener('click', function () {
            var seq = [];
            som.pares.forEach(function (p) {
                if (!F.texto.ehGrafiaDeErro(p.a, p.ipaA)) seq.push(F.texto.paraFalar(p.a));
                if (!F.texto.ehGrafiaDeErro(p.b, p.ipaB)) seq.push(F.texto.paraFalar(p.b));
            });
            F.voz.falarSequencia(seq.filter(Boolean), { rate: 0.7, pausa: 500 });

    /* Teste de percepção: o app fala um dos dois, você diz qual foi. */
    function iniciarTeste() {
        var area = ui.$('teste-area');

        proximaRodada(area);

    function proximaRodada(area) {
        // o teste roda com setTimeout: se o aluno saiu da tela, não há onde escrever
        if (!area || !document.body.contains(area)) return;
        if (teste.rodada >= teste.total) {
            var pct = Math.round((teste.acertos / teste.total) * 100);
            F.store.registrar('pronuncia', pct, 'ouvido');
            area.innerHTML = '<div class="teste-fim">' + ui.anel(pct, 'de ouvido') +
                '<p>' + esc(pct >= 90 ? 'Seu ouvido separa os dois sons. Agora é só a boca acompanhar.'
                    : pct >= 70 ? 'Quase lá. Repita o teste hoje e amanhã: percepção melhora rápido.'
                        : 'Seu ouvido ainda funde os dois sons — e boca não produz o que ouvido não separa. Escute os pares 5 minutos por dia.') + '</p>' +
                '<button class="btn" id="bt-teste2">Repetir teste</button></div>';
            ui.$('bt-teste2').addEventListener('click', iniciarTeste);

        }

        var faláveis = som.pares.filter(function (p) {
            return !F.texto.ehGrafiaDeErro(p.a, p.ipaA) && !F.texto.ehGrafiaDeErro(p.b, p.ipaB) &&
                F.texto.paraFalar(p.a) && F.texto.paraFalar(p.b);
        });
        if (!faláveis.length) {
            area.innerHTML = '<p class="sub">Este som não tem pares que o aparelho consiga falar ' +
                'dos dois lados — o contraste aqui é com a grafia do erro, para ler e comparar. ' +
                'Use os pares acima e a sua própria voz.</p>';
            return;
        }
        var par = ui.sorteio(faláveis);
        var ladoA = Math.random() < 0.5;
        teste.atual = { par: par, correto: ladoA ? 'a' : 'b' };
        var palavra = ladoA ? par.a : par.b;

   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.shadowing = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;
    var passagem = null, linha = 0, modo = 'en', vel = 1, tocando = null, loop = null;

    function render(args) {

            '<p><b>Os quatro modos:</b> Texto é o que está escrito; Ritmo marca em maiúscula as sílabas ' +

            'Português serve só para conferir o sentido, nunca para traduzir na hora.</p>' +

            '<div class="sh-controles">' +
            '<div class="segmentado" id="sh-modo">' +
            ['en:Texto', 'forte:Ritmo', 'soa:Como soa', 'pt:Português'].map(function (o) {
                var p = o.split(':');
                return '<button data-modo="' + p[0] + '"' + (p[0] === 'en' ? ' class="is-on"' : '') + '>' + p[1] + '</button>';
            }).join('') + '</div>' +
            '<label class="campo campo--slider"><span>Velocidade <b id="sh-vel">' + vel.toFixed(2) + '×</b></span>' +
            '<input type="range" id="sh-rate" min="0.5" max="1.2" step="0.05" value="' + vel + '"></label>' +
            '</div>' +

            '<ol class="linhas" id="sh-linhas">' +
            passagem.linhas.map(function (l, i) {
                return '<li class="linha' + (i === 0 ? ' is-on' : '') + '" data-i="' + i + '">' +
                    '<span class="linha-txt">' + textoLinha(l, 'en') + '</span>' +
                    (l.nota ? '<span class="linha-nota">' + esc(l.nota) + '</span>' : '') +
                    '</li>';
            }).join('') +
            '</ol>' +

            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="sh-tocar">▶ Tocar tudo</button>' +
            '<button class="btn" id="sh-linha">🔁 Repetir esta linha 3×</button>' +
            '<button class="btn" id="sh-prox">Próxima linha →</button>' +
            '</div>' +
            '</div>' +

            '<div class="cartao">' +
            '<div class="cartao-titulo"><h3>Sua vez, linha por linha</h3>' +
            ui.ajuda('Sua vez', '<p>Ouça a linha, fale por cima e o app mostra o que um ouvido de fora ' +

            '<p class="frase-alvo" id="sh-alvo">' + esc(passagem.linhas[0].en) + '</p>' +

            '<div class="cartao">' +
            '<div class="cartao-titulo"><h3>Gravar e comparar</h3>' +
            ui.ajuda('Gravar e comparar', '<p>Grave a passagem inteira. Repita na semana que vem, com a ' +
                'gravação antiga do lado — é a comparação que mostra o progresso.</p>') + '</div>' +

    function textoLinha(l, m) {
        if (m === 'forte') return marcarFortes(l.forte || l.en);
        if (m === 'soa') return '<i class="soa">' + esc(l.soa || l.en) + '</i>';
        if (m === 'pt') return '<i class="pt">' + esc(l.pt) + '</i>';
        return esc(l.en);
    }

    /* Deixa em destaque as sílabas escritas em maiúscula na versão "forte". */
    function marcarFortes(t) {
        return esc(t).replace(/([A-Z]{2,})/g, '<b>$1</b>');
    }

    function pintar() {
        ui.qq('#sh-linhas .linha').forEach(function (li, i) {
            li.classList.toggle('is-on', i === linha);
            li.querySelector('.linha-txt').innerHTML = textoLinha(passagem.linhas[i], modo);
        });
        var alvo = ui.$('sh-alvo');
        if (alvo) alvo.textContent = passagem.linhas[linha].en;
        var res = ui.q('#sh-pratica [data-papel="res"]');
        if (res) res.innerHTML = '';
    }

    function montar() {
        F.pratica.ligar('sh-pratica', {
            alvo: function () { return passagem.linhas[linha].en; },
            serie: 'pronuncia',
            aoResultado: function () { F.store.concluirBloco('shadowing'); }
        });
        F.pratica.ligarGravador('sh-grav', { chave: 'shadowing:' + passagem.id });

        ui.qq('#sh-modo button').forEach(function (b) {
            b.addEventListener('click', function () {
                modo = b.getAttribute('data-modo');
                ui.qq('#sh-modo button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
                pintar();
            });
        });

        ui.$('sh-rate').addEventListener('input', function () {
            vel = parseFloat(this.value);
            ui.$('sh-vel').textContent = vel.toFixed(2) + '×';
        });

        ui.qq('#sh-linhas .linha').forEach(function (li) {
            li.addEventListener('click', function () {
                linha = parseInt(li.getAttribute('data-i'), 10);
                pintar();
                F.voz.falar(passagem.linhas[linha].en, { rate: vel });
            });
        });

        ui.$('sh-tocar').addEventListener('click', function () {
            var bt = this;
            if (tocando) {
                tocando.cancelar();
                tocando = null;
                bt.textContent = '▶ Tocar tudo';
                return;
            }
            bt.textContent = '⏹ Parar';
            var frases = passagem.linhas.map(function (l) { return l.en; });
            tocando = F.voz.falarSequencia(frases, { rate: vel, pausa: 500 }, function (i) {
                linha = i; pintar();
            });
            tocando.then(function () {
                tocando = null;
                bt.textContent = '▶ Tocar tudo';
                F.store.concluirBloco('shadowing');
            });
        });

        ui.$('sh-linha').addEventListener('click', function () {
            if (loop) { loop.cancelar(); loop = null; this.textContent = '🔁 Repetir esta linha 3×'; return; }
            var t = passagem.linhas[linha].en;
            var bt = this;
            bt.textContent = '⏹ Parar repetição';
            loop = F.voz.falarSequencia([t, t, t], { rate: vel, pausa: 900 });
            loop.then(function () { loop = null; bt.textContent = '🔁 Repetir esta linha 3×'; });
        });

        ui.$('sh-prox').addEventListener('click', function () {
            linha = (linha + 1) % passagem.linhas.length;
            pintar();
            F.voz.falar(passagem.linhas[linha].en, { rate: vel });
        });
    }

    function desmontar() {
        if (tocando) { tocando.cancelar(); tocando = null; }
        if (loop) { loop.cancelar(); loop = null; }
    }

    return { render: render, montar: montar, desmontar: desmontar };
})();

</script>

        var pills = F.data.ditado.map(function (d) {
            return '<a class="pilula' + (d.id === bloco.id ? ' is-on' : '') + '" href="#/escuta/' + d.id + '">' +
                '<i class="nivel n' + d.nivel + '"></i>' + esc(d.titulo) + '</a>';

        var comoFazer = '<p>Escreva <b>exatamente</b> o que ouviu, nem uma palavra a mais.</p>' +
            '<p>Ouça no máximo três vezes antes de escrever. Se não pegou, escreva o que conseguiu — o ' +

            '<p>Depois de conferir, repita a frase em voz alta na versão <b>como soa</b>: só se ouve o ' +
            'que a boca já produziu.</p>' +
            '<p><b>Foco deste bloco:</b> ' + esc(bloco.foco) + '</p>';

        return ui.cabecalho('Laboratório de escuta') +
            '<div class="pilulas">' + pills + '</div>' +
            '<div class="cartao">' +
            '<div class="cartao-titulo"><h3>' + esc(bloco.titulo) + '</h3>' +
            ui.ajuda('Como fazer o ditado', comoFazer) + '</div>' +
            '<div id="dt-area"></div>' +
            '</div>';
    }

    function pintaItem() {
        var item = bloco.itens[i];
        var area = ui.$('dt-area');
        if (!area) return;
        respondido = false;
        area.innerHTML =
            '<div class="dt-topo"><span>Frase ' + (i + 1) + ' de ' + bloco.itens.length + '</span>' +
            '<span class="dt-placar">' + acertos.length + ' respondidas · média ' + mediaAtual() + '%</span></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dt-ouvir">🔊 Ouvir</button>' +
            '<button class="btn" id="dt-lento">🐢 Bem devagar</button>' +
            '</div>' +
            '<textarea class="entrada entrada--grande" id="dt-txt" rows="3" placeholder="write exactly what you hear"></textarea>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dt-conferir">Conferir</button>' +
            '<button class="btn" id="dt-pular">Pular →</button>' +
            '</div>' +

        ui.$('dt-ouvir').addEventListener('click', function () { F.voz.falar(item.en, { rate: vel }); });
        ui.$('dt-lento').addEventListener('click', function () { F.voz.falar(item.en, { rate: 0.6 }); });
        ui.$('dt-conferir').addEventListener('click', conferir);
        ui.$('dt-pular').addEventListener('click', proximo);
        ui.$('dt-txt').addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) conferir();

        ui.$('dt-txt').focus();

    function mediaAtual() {
        if (!acertos.length) return 0;
        return Math.round(acertos.reduce(function (a, b) { return a + b; }, 0) / acertos.length);

    function conferir() {
        if (!ui.$('dt-res')) return;
        if (respondido) { proximo(); return; }
        var item = bloco.itens[i];
        var meu = ui.$('dt-txt').value;
        var r = F.texto.pontuar(item.en, meu);

        F.store.concluirBloco('escuta');

        ui.$('dt-res').innerHTML =

            '<small>O texto era: “' + esc(item.en) + '”</small></div></div>' +
            ui.diff(r) + ui.legendaDiff() +
            '<div class="soa-caixa"><b>Como isso realmente soa:</b> <i>' + esc(item.soa) + '</i> ' +
            ui.botaoOuvir(item.en, 'ouvir de novo') + '</div>' +
            (item.nota ? '<p class="nota-explica">' + esc(item.nota) + '</p>' : '') +
            '<p class="legenda">Agora fale a versão “como soa” três vezes em voz alta, rápido.</p>';

        ui.$('dt-conferir').textContent = 'Próxima →';
    }

    function proximo() {
        if (!ui.$('dt-area')) return;
        if (i + 1 >= bloco.itens.length) {
            var m = mediaAtual();
            ui.$('dt-area').innerHTML = '<div class="teste-fim">' + ui.anel(m, 'de escuta') +
                '<p>' + esc(m >= 90 ? 'Seu ouvido está pegando a fala colada. Suba de nível.'
                    : m >= 70 ? 'Bom. Repita este bloco amanhã e ele vira 90.'
                        : 'Ainda escapa muita coisa. Faça este mesmo bloco por três dias seguidos antes de trocar.') + '</p>' +
                '<div class="linha-botoes">' +
                '<button class="btn btn--forte" id="dt-refazer">Refazer este bloco</button>' +
                '<a class="btn" href="#/exercicios">Outro exercício</a></div></div>';
            ui.$('dt-refazer').addEventListener('click', function () { i = 0; acertos = []; pintaItem(); });
            return;
        }
        i++;
        pintaItem();
    }

    function montar() { pintaItem(); }

    return { render: render, montar: montar };

/* =========================================================
   TELA BLOCOS — o bloco não se traduz, se encaixa.

   A versão anterior mostrava o português e pedia o inglês, que é

    /* buracos do cartão atual e o que já foi conquistado nele */
    var furos = [], formaOk = false, usoOk = false;

            })).join('');

        var comoFazer = '<p>O nativo não monta a frase peça por peça: ele puxa o bloco pronto. Enquanto ' +
            'você traduz, ele já está na terceira frase.</p>' +
            '<ol>' +

            '<div class="segmentado" id="ch-modo">' +

    function pintar() {

        var sorteados = ui.embaralhar(candidatos.slice()).slice(0, quantos);
        var html = partes.map(function (p, i) {
            if (sorteados.indexOf(i) < 0) return esc(p);
            return '<i class="furo">' + p.replace(/[A-Za-z']/g, '_') + '</i>';
        }).join('');
        return { html: html, quantos: quantos };
    }

    function revelar() {
        var c = fila[pos];
        var el = ui.$('ch-frente');
        if (!el) return;
        var ver = ui.$('ch-revelar');
        if (ver) ver.hidden = true;

        el.innerHTML =
            '<p class="carta-en">' + esc(c.en) + '</p>' +
            '<p class="carta-pt">' + esc(c.pt) + '</p>' +
            (c.nota ? '<p class="carta-nota">' + esc(c.nota) + '</p>' : '') +
            '<div class="linha-botoes">' +
            ui.botaoOuvir(c.en, 'Ouvir') +
            '<button class="btn btn--som" data-falar="' + esc(c.en) + '" data-rate="0.65">🐢 Devagar</button>' +
            '<button class="btn" id="ch-marcar">☆ Marcar</button>' +
            '</div>' +
            '<div class="ch-uso">' +
            '<b>Agora use num contexto seu</b>' +
            '<p class="sub">Invente uma frase sua que contenha este bloco. Não existe modelo: o app ' +
            'só confere se o bloco está lá dentro.</p>' +
            '<button class="btn btn--forte" id="ch-usar">🎙 Falar a minha frase</button>' +
            '<div id="ch-uso-res"></div>' +
            '</div>' +
            '<p class="carta-pergunta">O bloco veio à cabeça sozinho?</p>' +
            '<div class="notas">' +
            '<button class="btn btn--nota bad" data-nota="0">Não saiu<small>volta amanhã</small></button>' +
            '<button class="btn btn--nota mid" data-nota="1">Com esforço<small>volta em breve</small></button>' +
            '<button class="btn btn--nota good" data-nota="2">Saiu na hora<small>some por semanas</small></button>' +
            '</div>';

        F.voz.falar(c.en);

        ui.$('ch-marcar').addEventListener('click', function () {
            var m = F.store.get().marcados;
            var k = m.indexOf(c.id);
            if (k >= 0) { m.splice(k, 1); ui.toast('Desmarcado.'); }
            else { m.push(c.id); ui.toast('Marcado para revisar sempre.'); }
            F.store.salvar();
        });

        ui.$('ch-usar').addEventListener('click', function () { ouvirUso(c); });

        ui.qq('#ch-area [data-nota]').forEach(function (b) {
            b.addEventListener('click', function () {
                F.srs.responder(c.id, parseInt(b.getAttribute('data-nota'), 10));
                pos++;
                pintar();
            });
        });
    }

    /* O uso não é comparado com modelo nenhum: o único critério é o bloco
       ter aparecido inteiro dentro da frase que o aluno inventou. Medir
       proximidade aqui reprovaria justamente a frase original, que é o
       que o exercício quer. */
    function ouvirUso(c) {
        var bt = ui.$('ch-usar');
        var caixa = ui.$('ch-uso-res');
        if (!bt || !caixa) return;
        if (!F.voz.temEscuta()) {
            caixa.innerHTML = '<textarea class="entrada" id="ch-uso-txt" rows="2" ' +
                'placeholder="write your own sentence with the block"></textarea>' +
                '<button class="btn" id="ch-uso-conferir">Conferir</button>';
            ui.$('ch-uso-conferir').addEventListener('click', function () {
                julgarUso(c, ui.$('ch-uso-txt').value);
            });
            return;
        }
        bt.textContent = '● ouvindo…';
        bt.classList.add('is-gravando');
        F.voz.ouvir({ limite: 12000 }).then(function (r) {
            var b = ui.$('ch-usar');
            if (b) { b.textContent = '🎙 Falar de novo'; b.classList.remove('is-gravando'); }
            julgarUso(c, r.vazio ? '' : r.texto);
        }).catch(function () {
            var b = ui.$('ch-usar');
            if (b) { b.textContent = '🎙 Falar de novo'; b.classList.remove('is-gravando'); }
            if (ui.$('ch-uso-res')) ui.$('ch-uso-res').innerHTML = ui.aviso('A escuta falhou agora. Tente de novo.', 'atencao');
        });
    }

    function julgarUso(c, dito) {
        var caixa = ui.$('ch-uso-res');
        if (!caixa) return;
        if (!dito) {
            caixa.innerHTML = ui.aviso('Não ouvi nada. Fale mais perto do aparelho.', 'atencao');
            return;
        }
        var dentro = contem(dito, c.en);
        var extras = Math.max(0, F.texto.palavras(dito).length - F.texto.palavras(c.en).length);
        usoOk = dentro && extras >= 2;
        F.store.registrar('chunks', usoOk ? 100 : (dentro ? 60 : 20));

        caixa.innerHTML =
            '<div class="res-topo"><div class="res-txt"><b>' + esc(
                usoOk ? 'O bloco entrou numa frase sua. É esse o objetivo.'
                    : dentro ? 'O bloco está lá, mas quase nada em volta. Construa uma frase inteira.'
                        : 'O bloco não apareceu na frase. Ele precisa sair inteiro, do jeito que é.') +
            '</b><small>Ouvi: “' + esc(dito) + '”' +
            (dentro ? ' · ' + extras + ' palavras suas em volta' : '') + '</small></div></div>' +
            /* a correção só entra quando há erro clássico a nomear; sem isso
               ela vira um parágrafo de "não achei nada" em todo cartão */
            (F.correcao.analisar(dito).achados.length ? F.correcao.html(dito) : '');
    }

    /* Casa o bloco dentro da fala do aluno já normalizado: contração
       expandida, apóstrofo fora, pontuação fora. "I'd love to" e
       "I would love to" contam como o mesmo bloco. */
    function contem(dito, bloco) {
        var d = ' ' + F.texto.normalizar(dito) + ' ';
        var b = ' ' + F.texto.normalizar(bloco) + ' ';
        return d.indexOf(b) >= 0;
    }

    function pintarLista(area) {
        var conjunto = filtro ? F.data.chunks.filter(function (c) { return c.f === filtro; }) : F.curso.chunksDaSemana().todos;
        var porFuncao = {};
        conjunto.forEach(function (c) { (porFuncao[c.f] = porFuncao[c.f] || []).push(c); });

        area.innerHTML = Object.keys(porFuncao).map(function (f) {
            var fn = F.curso.funcao(f) || { nome: f, desc: '' };
            return '<section class="grupo">' +
                '<h4>' + esc(fn.nome) + '</h4><p class="sub">' + esc(fn.desc) + '</p>' +
                '<ul class="lista-chunks">' + porFuncao[f].map(function (c) {
                    var cart = F.srs.cartao(c.id);
                    return '<li>' +
                        '<button class="chunk-som" data-falar="' + esc(c.en) + '">🔊</button>' +
                        '<span><b>' + esc(c.en) + '</b><small>' + esc(c.pt) + '</small>' +
                        (c.nota ? '<em>' + esc(c.nota) + '</em>' : '') + '</span>' +
                        '<i class="selo n' + c.n + '">' + (cart.int >= 21 ? '✓' : c.n) + '</i>' +
                        '</li>';
                }).join('') + '</ul></section>';
        }).join('');
    }

    function montar() {
        ui.qq('#ch-modo button').forEach(function (b) {
            b.addEventListener('click', function () {
                modo = b.getAttribute('data-m');
                ui.qq('#ch-modo button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
                pintar();
            });
        });
        pintar();
    }

    return { render: render, montar: montar };
})();

</script>
    <script>
/* =========================================================
   TELA DRILLS — estímulo, relógio, resposta.

   Não é para acertar pensando: é para acertar sem pensar.
   Enquanto a estrutura exigir raciocínio, ela não existe na
   sua fala espontânea.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.drills = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;
    /* Quantas respostas fecham o bloco de drill do dia. Conta o trabalho
       feito, não a chegada à última tela: pode ser em drills diferentes e
       em várias sessões — sair da tela não apaga nada. */
    var META_DIA = 8;
    var drill = null, ordem = [], pos = 0, notas = [], tempo = 5, timer = null, rodando = false;
    /* marca se a tentativa atual já lançou nota — repetir o item tem de
       desfazer essa nota, senão o mesmo estímulo conta duas vezes. */
    var notaLancada = false;

    function render(args) {
        var id = args[0] || F.curso.semanaAtual().drill;
        drill = F.curso.drill(id) || F.data.drills[0];
        ordem = ui.embaralhar(drill.itens);
        pos = 0; notas = [];

        var pills = F.data.drills.map(function (d) {
            return '<a class="pilula' + (d.id === drill.id ? ' is-on' : '') + '" href="#/drills/' + d.id + '">' + esc(d.nome) + '</a>';
        }).join('');

        var comoFazer = '<ol>' +
            '<li>Toque em <b>Ouvir e responder</b>: o app fala o estímulo.</li>' +
            '<li>Responda <b>em voz alta</b> antes de o tempo acabar. Não escreva, não pense demais.</li>' +
            '<li>Só então o app mostra a resposta e o que ele ouviu de você.</li>' +
            '</ol>' +
            '<p><b>Este drill:</b> ' + esc(drill.foco) + '</p>' +
            '<p><b>Como fazer:</b> ' + esc(drill.instrucao) + '</p>' +
            '<p><b>' + (drill.aberto ? 'Exemplo' : 'Modelo') + ':</b> <i>' + esc(drill.modelo) + '</i></p>' +
            (drill.aberto
                ? '<p class="destaque"><b>Resposta livre.</b> Várias respostas servem — o app não compara ' +
                'palavra por palavra. O que conta é responder rápido, sem travar. A resposta mostrada ' +
                'depois é <i>uma</i> possibilidade, para comparar ideias, não para copiar.</p>'
                : '<p class="destaque"><b>Resposta única.</b> Este drill treina uma estrutura: existe uma ' +
                'forma certa, e o objetivo é que ela saia sem você pensar.</p>') +
            '<p>O tempo de resposta começa em 5 segundos. Diminua só quando estiver acertando quase tudo.</p>';

        return ui.cabecalho('Drills') +
            '<div class="pilulas">' + pills + '</div>' +
            '<div class="cartao">' +
            '<div class="cartao-titulo">' +
            '<h3>' + esc(drill.nome) + '</h3>' +
            '<span class="etiqueta">' + (drill.aberto ? 'resposta livre' : 'resposta única') + '</span>' +
            ui.ajuda('Como funciona este drill', comoFazer) +
            '</div>' +
            '<label class="campo campo--slider"><span>Tempo para responder: <b id="dr-tv">' + tempo + 's</b></span>' +
            '<input type="range" id="dr-tempo" min="2" max="10" step="1" value="' + tempo + '"></label>' +
            '<div id="dr-area"></div>' +
            '</div>';
    }

    /* Os drills de estrutura têm par simples; os de resposta livre trazem
       ainda uma segunda forma de dizer e a tradução das duas — é o que
       permite ao aluno entender a resposta em vez de só copiá-la. */
    function comoObjeto(it) {
        return {
            estimulo: it[0], resposta: it[1],
            alternativa: it[2] || '', pt: it[3] || '', ptAlt: it[4] || ''
        };
    }

    function pintar() {
        var area = ui.$('dr-area');
        if (!area) return;
        if (pos >= ordem.length) return fim(area);

        notaLancada = false;
        var it = comoObjeto(ordem[pos]);
        area.innerHTML =
            '<div class="dr-topo"><span>' + (pos + 1) + ' de ' + ordem.length + '</span>' +
            '<span class="dt-placar">acertos: ' + notas.filter(Boolean).length + '</span></div>' +
            barraDoBloco() +
            '<div class="dr-estimulo" id="dr-est">' + esc(it.estimulo) + '</div>' +
            '<div class="dr-relogio"><i id="dr-barra"></i></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dr-ir">▶ Ouvir e responder</button>' +
            '<button class="btn" id="dr-ver">' + (drill.aberto ? 'Ver uma resposta' : 'Ver a resposta') + '</button>' +
            '</div>' +
            '<div id="dr-res"></div>';

        ui.$('dr-ir').addEventListener('click', rodar);
        ui.$('dr-ver').addEventListener('click', function () { revelar(null); });
    }

    /* O aluno precisa ver o que falta para o bloco fechar — antes disto
       ele respondia por um tempão sem saber que o ✓ do dia dependia de
       terminar a rodada inteira sem sair da tela. */
    function barraDoBloco() {
        var n = F.store.feitosHoje('drill');
        if (F.store.blocoFeito('drill')) {
            return '<p class="bloco-progresso is-ok">✓ Bloco de drill do dia concluído — ' +
                n + ' respostas. O que vier agora é treino extra.</p>';
        }
        return '<p class="bloco-progresso">Bloco do dia: <b>' + n + ' de ' + META_DIA +
            '</b> respostas' + (n ? '' : ' — vale qualquer drill, em qualquer ordem') + '.</p>';
    }

    /* Marca o bloco assim que o trabalho do dia chega na meta, e não só no
       fim da rodada: trocar de drill ou fechar o app não perde o progresso. */
    function contarParaOBloco() {
        if (F.store.blocoFeito('drill')) return;
        if (F.store.feitosHoje('drill') < META_DIA) return;
        F.store.concluirBloco('drill');
        ui.toast('Bloco de drill do dia concluído ✓');
    }

    function rodar() {
        if (rodando) return;
        rodando = true;
        var it = comoObjeto(ordem[pos]);
        var barra = ui.$('dr-barra');
        ui.$('dr-res').innerHTML = '';

        F.voz.falar(it.estimulo, { rate: 0.95 }).then(function () {
            if (!document.body.contains(barra)) return;
            barra.style.transition = 'none';
            barra.style.width = '100%';
            setTimeout(function () {
                barra.style.transition = 'width ' + tempo + 's linear';
                barra.style.width = '0%';
            }, 20);

            if (F.voz.temEscuta()) {
                F.voz.ouvir({ limite: tempo * 1000 }).then(function (r) {
                    revelar(r.vazio ? '' : r.texto);
                }).catch(function () { revelar(null); });
            } else {
                timer = setTimeout(function () { revelar(null); }, tempo * 1000);
            }
        });
    }

    function revelar(ouvido) {
        rodando = false;
        clearTimeout(timer);
        F.voz.pararEscuta();
        var caixa = ui.$('dr-res');
        if (!caixa) return;
        var it = comoObjeto(ordem[pos]);
        var certa = it.resposta;
        var html = drill.aberto ? possibilidades(it)
            : '<div class="dr-resposta"><b>Resposta:</b> ' + esc(certa) + ' ' +
            ui.botaoOuvir(certa, 'ouvir') + '</div>' +
            (it.pt ? '<p class="corr-traducao">' + esc(it.pt) + '</p>' : '');

        if (ouvido !== null && ouvido !== undefined) {
            if (drill.aberto) {
                /* Resposta livre: comparar com um modelo único reprovaria uma
                   resposta boa só por ser diferente — que é exatamente o que
                   este exercício quer que o aluno produza. O que se mede aqui
                   é ter respondido, e rápido. */
                var palavras = F.texto.palavras(ouvido || '');
                var respondeu = palavras.length >= 3;
                notas.push(respondeu); notaLancada = true;
                F.store.registrar('drill', respondeu ? 100 : (palavras.length ? 50 : 0));
                contarParaOBloco();
                html = '<div class="res-topo"><div class="res-txt"><b>' +
                    esc(respondeu ? 'Respondeu — é isso que o exercício mede.'
                        : palavras.length ? 'Saiu curto demais. Uma frase inteira, mesmo torta.'
                            : 'Não saiu nada. Da próxima, fale qualquer coisa antes do tempo acabar.') +
                    '</b></div></div>' +
                    F.correcao.html(ouvido, { checar: drill.checar || [] }) +
                    possibilidades(it);
            } else {
                var r = F.texto.pontuar(certa, ouvido);
                notas.push(r.pct >= 70); notaLancada = true;
                F.store.registrar('drill', r.pct);
                contarParaOBloco();
                html += '<div class="res-topo">' + ui.anel(r.pct) +
                    '<div class="res-txt"><b>' + esc(r.pct >= 70 ? 'Saiu.' : 'Ainda não saiu automático.') + '</b>' +
                    '<small>Ouvi: “' + esc(ouvido || '(nada)') + '”</small></div></div>' + ui.diff(r) +
                    (it.pt ? '<p class="corr-traducao">' + esc(it.pt) + '</p>' : '') +
                    // aqui a nota já mostra o desvio; a correção só entra se
                    // houver um erro clássico de brasileiro para nomear
                    (F.correcao.analisar(ouvido).achados.length ? F.correcao.html(ouvido) : '');
            }
        } else {
            html += '<p class="carta-pergunta">Você respondeu antes de ouvir?</p>' +
                '<div class="notas">' +
                '<button class="btn btn--nota bad" data-ok="0">Não</button>' +
                '<button class="btn btn--nota good" data-ok="1">Sim, na hora</button></div>';
        }
        html += '<div class="linha-botoes">' +
            '<button class="btn" id="dr-rep">↻ Repetir este</button>' +
            '<button class="btn btn--forte" id="dr-prox">Próximo →</button></div>';
        caixa.innerHTML = html;

        F.voz.falar(certa, { rate: 0.95 });

        ui.qq('#dr-res [data-ok]').forEach(function (b) {
            b.addEventListener('click', function () {
                var ok = b.getAttribute('data-ok') === '1';
                notas.push(ok);
                F.store.registrar('drill', ok ? 100 : 0);
                contarParaOBloco();
                pos++; pintar();
            });
        });
        ui.$('dr-rep').addEventListener('click', repetir);
        ui.$('dr-prox').addEventListener('click', function () { pos++; pintar(); });
    }

    /* Repetir não avança e não deixa rastro: a nota da tentativa anterior
       sai da conta, para o mesmo estímulo não pesar duas vezes no placar. */
    function repetir() {
        F.voz.pararFala();
        F.voz.pararEscuta();
        clearTimeout(timer);
        rodando = false;
        if (notaLancada) { notas.pop(); notaLancada = false; }
        pintar();
    }

    /* Duas formas de dizer a mesma coisa, cada uma com a tradução. Uma
       resposta só ensina a copiar; duas ensinam que existe escolha. */
    function possibilidades(it) {
        var bloco = '<div class="possiveis">' +
            '<div class="possivel"><b>Uma resposta possível</b>' +
            '<p class="possivel-en">' + esc(it.resposta) + ' ' + ui.botaoOuvir(it.resposta, 'ouvir') + '</p>' +
            (it.pt ? '<p class="possivel-pt">' + esc(it.pt) + '</p>' : '') +
            '</div>';

        if (it.alternativa) {
            bloco += '<div class="possivel"><b>Outra forma de dizer</b>' +
                '<p class="possivel-en">' + esc(it.alternativa) + ' ' + ui.botaoOuvir(it.alternativa, 'ouvir') + '</p>' +
                (it.ptAlt ? '<p class="possivel-pt">' + esc(it.ptAlt) + '</p>' : '') +
                '</div>';
        }

        return bloco + '<p class="legenda">A sua não precisa ser igual a nenhuma das duas. ' +
            'Compare a ideia, o tamanho e o registro.</p></div>';
    }

    function fim(area) {
        if (!area) return;
        var pct = notas.length ? Math.round((notas.filter(Boolean).length / notas.length) * 100) : 0;
        F.store.concluirBloco('drill');
        area.innerHTML = '<div class="teste-fim">' + ui.anel(pct, drill.aberto ? 'sem travar' : 'automático') +
            '<p>' + esc(drill.aberto
                ? (pct >= 90 ? 'Você respondeu a quase tudo no tempo. É esse o objetivo.'
                    : pct >= 60 ? 'Bom. As que ficaram para trás são as que você ainda traduz antes de falar.'
                        : 'Muitas ficaram no silêncio. Aumente o tempo de resposta e vá diminuindo aos poucos.')
                : (pct >= 90 ? 'Automatizado. Pode trocar de drill.'
                    : pct >= 60 ? 'Está virando reflexo. Mais duas rodadas hoje e amanhã.'
                        : 'Ainda está sendo raciocinado. Diminua o tempo de resposta só quando acertar 8 de 10.')) + '</p>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="dr-de-novo">Rodar de novo, embaralhado</button>' +
            '<a class="btn" href="#/exercicios">Outro exercício</a></div></div>';
        ui.$('dr-de-novo').addEventListener('click', function () {
            ordem = ui.embaralhar(drill.itens); pos = 0; notas = []; pintar();
        });
    }

    function montar() {
        ui.$('dr-tempo').addEventListener('input', function () {
            tempo = parseInt(this.value, 10);
            ui.$('dr-tv').textContent = tempo + 's';
        });
        pintar();
    }

    function desmontar() { clearTimeout(timer); rodando = false; }

    return { render: render, montar: montar, desmontar: desmontar };
})();
