<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <meta name="description"
        content="Treino diário de inglês falado para brasileiros: pronúncia, shadowing, escuta, conversa e correção. Seis meses do intermediário ao quase nativo.">
    <title>Fluência 180 — inglês falado para brasileiros</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
/* =========================================================
   Fluência 180 — estilo.
   Escuro por padrão: o app é usado cedo, tarde e no ônibus.
   ========================================================= */

:root {
    --bg: #0b0d12;
    --bg-soft: #141824;
    --bg-soft2: #1b2130;
    --line: #242a3a;
    --fg: #eef1f7;
    --fg-dim: #97a0b6;
    --accent: #4f8cff;
    --accent-2: #ff8a3d;
    --ok: #35c46a;
    --warn: #f2b33c;
    --bad: #ff5a52;
    --radius: 14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
}

a { color: var(--accent); text-decoration: none; }
h2, h3, h4 { margin: 0 0 6px; letter-spacing: -0.3px; line-height: 1.25; }
p { margin: 0 0 10px; }

/* ============ cabeçalho ============ */

.cabecalho {
    position: sticky;
    top: 0;
    z-index: 30;
    padding: calc(10px + var(--safe-t)) 14px 0;
    background: rgba(11, 13, 18, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
}

.marca {
    color: var(--fg);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.4px;
}
.marca b { color: var(--accent-2); }

.cabecalho { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cab-info { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.cab-chip {
    font-size: 12px;
    color: var(--fg-dim);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
}
.cab-chip b { color: var(--accent-2); }
.cab-chip--sem { color: var(--fg); }

.cab-eng {
    font-size: 18px;
    color: var(--fg-dim);
    padding: 2px 6px;
}

.cab-progresso {
    flex: 0 0 100%;
    height: 3px;
    background: var(--bg-soft);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
}
.cab-progresso i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .4s ease;
}

/* ============ estrutura ============ */

.tela {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 14px calc(96px + var(--safe-b));
}

.tela-head { margin-bottom: 14px; }
.tela-head h2 { font-size: 24px; }
.tela-head p { color: var(--fg-dim); font-size: 14px; margin: 0; }
.olho { color: var(--accent-2); font-size: 13px; font-weight: 600; margin: 0 0 2px; }

.cartao {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
}
.cartao h3 { font-size: 17px; }

.sub { color: var(--fg-dim); font-size: 14px; }
.sub--solta { margin: -6px 0 12px; }
.legenda { color: var(--fg-dim); font-size: 12.5px; margin: 8px 0 0; }
.vazio { color: var(--fg-dim); text-align: center; padding: 22px 0; }

.grade-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .grade-2 { grid-template-columns: 1fr 1fr; } }

.linha-botoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ============ botões ============ */

.btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-soft2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    text-align: center;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { border-color: #33405c; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn--forte { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn--forte:hover { background: #6a9dff; }
.btn--grande { width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; }
.btn--perigo { color: var(--bad); border-color: #4a2320; }
.btn--som.is-falando { border-color: var(--accent); color: var(--accent); }

.btn--falar {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(180deg, #23304a, #1a2233);
    border-color: #33405c;
}
.btn--falar.is-ouvindo {
    background: linear-gradient(180deg, #4a2320, #3a1c1a);
    border-color: var(--bad);
    animation: pulsa 1.2s ease-in-out infinite;
}
@keyframes pulsa { 50% { box-shadow: 0 0 0 6px rgba(255, 90, 82, .12); } }
.btn.is-rec { border-color: var(--bad); color: var(--bad); }

.btn--op {
    flex: 1;
    min-width: 130px;
    padding: 16px 12px;
    font-size: 15px;
    line-height: 1.35;
}

.notas { display: flex; gap: 8px; margin-top: 12px; }
.btn--nota { flex: 1; flex-direction: column; gap: 2px; padding: 12px 8px; font-size: 13px; font-weight: 600; }
.btn--nota small { font-weight: 400; font-size: 11px; color: var(--fg-dim); }
.btn--nota.bad { border-color: #4a2320; }
.btn--nota.mid { border-color: #4a3c1c; }
.btn--nota.good { border-color: #1f4630; }

/* ============ navegação inferior ============ */

.nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    display: flex;
    background: rgba(11, 13, 18, .96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-b);
}
.nav-item {
    flex: 1;
    appearance: none;
    background: none;
    border: 0;
    color: var(--fg-dim);
    font: inherit;
    font-size: 11px;
    padding: 9px 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
}
.nav-item span { font-size: 17px; line-height: 1; }
.nav-item.is-on { color: var(--fg); }
.nav-item.is-on span { color: var(--accent-2); }

/* ============ pílulas e segmentado ============ */

.pilulas {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 12px;
    scrollbar-width: none;
}
.pilulas::-webkit-scrollbar { display: none; }
.pilula {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--fg-dim);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    white-space: nowrap;
}
.pilula.is-on { color: #fff; background: var(--accent); border-color: var(--accent); }
.nivel { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.nivel.n1 { background: var(--ok); }
.nivel.n2 { background: var(--warn); }
.nivel.n3 { background: var(--bad); }

.segmentado {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 12px;
}
.segmentado button {
    appearance: none;
    background: none;
    border: 0;
    color: var(--fg-dim);
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
}
.segmentado button.is-on { background: var(--bg-soft2); color: var(--fg); }

/* ============ campos ============ */

.campo { display: block; margin-bottom: 12px; }
.campo > span { display: block; font-size: 13px; color: var(--fg-dim); margin-bottom: 6px; }
.campo--linha { display: flex; align-items: center; gap: 9px; }
.campo--linha span { margin: 0; }
.campo--slider { margin: 10px 0 4px; }

.entrada, select, input[type="time"] {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    resize: vertical;
}
.entrada:focus, select:focus, input[type="time"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.entrada--grande { font-size: 16px; margin: 10px 0; }

input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

/* ============ anel e barras ============ */

.anel {
    --pct: 0;
    --cor: var(--accent);
    position: relative;
    width: 82px;
    height: 82px;
    flex: 0 0 82px;
    border-radius: 50%;
    background:
        conic-gradient(var(--cor) calc(var(--pct) * 1%), var(--bg-soft2) 0);
    display: grid;
    place-items: center;
}
/* O buraco do donut é um ::after, gerado DEPOIS do número na árvore —
   sem z-index explícito ele pinta por cima e engole a nota. */
.anel::after {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--bg-soft);
    z-index: 0;
}
.anel-num { position: relative; z-index: 1; font-size: 22px; font-weight: 700; }
.anel-num small { font-size: 11px; font-weight: 500; color: var(--fg-dim); }
.anel-rot { position: relative; z-index: 1; font-size: 10px; color: var(--fg-dim); margin-top: -2px; }

.barra { height: 7px; background: var(--bg-soft2); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.barra i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* ============ tela hoje ============ */

.dia-topo { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.dia-topo b { font-size: 17px; display: block; }
.dia-topo small { display: block; color: var(--fg-dim); font-size: 13px; }

.blocos { display: flex; flex-direction: column; gap: 8px; }
.bloco {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 11px 13px;
    color: var(--fg);
}
.bloco-check {
    flex: 0 0 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 12px;
    color: var(--bg);
}
.bloco.is-ok { border-color: #1f4630; background: #101c17; }
.bloco.is-ok .bloco-check { background: var(--ok); border-color: var(--ok); }
.bloco-txt { flex: 1; min-width: 0; }
.bloco-txt b { display: block; font-size: 15px; }
.bloco-txt small { color: var(--fg-dim); font-size: 12.5px; line-height: 1.35; display: block; }
.bloco-min { color: var(--fg-dim); font-size: 17px; font-weight: 600; text-align: right; }
.bloco-min small { display: block; font-size: 10px; font-weight: 400; }

.feito-tudo { color: var(--ok); font-size: 14px; margin: 12px 0 0; text-align: center; }

.alvos { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.alvos dt { color: var(--fg-dim); font-size: 12.5px; padding-top: 1px; }
.alvos dd { margin: 0; }
.missao-dd { color: var(--accent-2); }

.cartao--missao { border-color: #4a3a1c; background: linear-gradient(180deg, #1a1710, var(--bg-soft)); }
.missao { font-size: 15px; color: var(--accent-2); }

.streak-linha { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 12px; }
.streak-num {
    flex: 1;
    min-width: 78px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 21px;
    font-weight: 700;
}
.streak-num small { display: block; font-size: 11px; font-weight: 400; color: var(--fg-dim); line-height: 1.3; }

.calendario { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.calendario i { width: 13px; height: 13px; border-radius: 3px; background: var(--bg-soft2); }
.calendario .cal-n1 { background: #1c3a28; }
.calendario .cal-n2 { background: #23603c; }
.calendario .cal-n3 { background: #2c8a52; }
.calendario .cal-n4 { background: var(--ok); }

/* ============ cards de exercícios ============ */

.grade-cards { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (min-width: 620px) { .grade-cards { grid-template-columns: repeat(3, 1fr); } }
.card {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    color: var(--fg);
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.card:hover { border-color: #33405c; }
.card-i { font-size: 22px; }
.card b { font-size: 15px; }
.card small { color: var(--fg-dim); font-size: 12.5px; line-height: 1.35; }

/* ============ prática falada ============ */

.pratica { margin-top: 14px; }
.pratica-status { min-height: 20px; color: var(--fg-dim); font-size: 13px; margin-top: 8px; font-style: italic; }
.pratica-res:not(:empty) { margin-top: 10px; }

.res-topo { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.res-txt b { display: block; font-size: 15px; margin-bottom: 3px; }
.res-txt small { color: var(--fg-dim); font-size: 13px; }

.diff { font-size: 17px; line-height: 2.1; }
.w { padding: 2px 5px; border-radius: 5px; }
.w--ok { background: rgba(53, 196, 106, .14); color: #a8e9c1; }
.w--troca { background: rgba(242, 179, 60, .16); color: #f3d79a; }
.w--troca em { font-style: normal; font-size: 12px; opacity: .75; display: inline-block; margin-left: 4px; }
.w--faltou { background: rgba(255, 90, 82, .16); color: #ffb3af; text-decoration: line-through; }
.w--sobrou { background: rgba(120, 130, 160, .16); color: var(--fg-dim); font-size: 14px; }

.diag { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.diag-item {
    background: var(--bg);
    border-left: 3px solid var(--warn);
    border-radius: 0 8px 8px 0;
    padding: 9px 12px;
    font-size: 14px;
}
.link { font-size: 13px; white-space: nowrap; }

.fallback .entrada { margin: 8px 0; }

.gravador { margin-top: 8px; }
.audio-linha { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.audio-linha b { font-size: 12px; color: var(--fg-dim); min-width: 42px; }
.audio-linha audio { flex: 1; min-width: 180px; height: 34px; }
.btn--apagar {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-size: 15px;
    line-height: 1;
    color: var(--fg-dim);
}
.btn--apagar:hover { color: var(--bad); border-color: #4a2320; }

/* ============ pronúncia ============ */

.ipa { color: var(--fg-dim); font-size: 14px; font-weight: 400; }
.porque, .dica, .teste { font-size: 14.5px; }
.porque b, .dica b, .teste b { color: var(--fg); }
.dica { color: #cfd6e6; }

.pares { display: flex; flex-direction: column; gap: 8px; }
.par { display: flex; align-items: center; gap: 8px; }
.par-lado {
    flex: 1;
    appearance: none;
    font: inherit;
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--fg);
    cursor: pointer;
}
.par-lado b { display: block; font-size: 16px; }
.par-lado small { color: var(--fg-dim); font-size: 12px; }
.par-x { color: var(--fg-dim); font-size: 12px; }

/* O lado que mostra o erro não é clicável: não há áudio para ele. */
.par-lado--erro {
    display: block;
    cursor: default;
    border-style: dashed;
    opacity: .75;
}

.frase-alvo {
    font-size: 21px;
    line-height: 1.45;
    margin: 12px 0 6px;
    font-weight: 500;
}

.teste { margin-top: 12px; }
.teste-info { color: var(--fg-dim); font-size: 13px; margin: 0 0 8px; }
.teste-op { display: flex; gap: 8px; margin-bottom: 10px; }
.teste-fb { min-height: 24px; margin-top: 8px; }
.fb { font-size: 14px; }
.fb--ok { color: var(--ok); }
.fb--erro { color: var(--bad); }
.teste-fim { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.teste-fim .anel { margin-bottom: 4px; }

/* ============ shadowing ============ */

.sh-controles { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
@media (min-width: 620px) { .sh-controles { flex-direction: row; align-items: center; gap: 18px; } .sh-controles .campo--slider { flex: 1; } }

.linhas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.linha {
    background: var(--bg);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
}
.linha.is-on { border-left-color: var(--accent); background: #131b2b; }
.linha b { color: var(--accent-2); font-weight: 700; }
.linha .soa { color: #b9c8e6; font-style: normal; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }
.linha .pt { color: var(--fg-dim); font-style: italic; }
.linha-nota { display: block; font-size: 12.5px; color: var(--warn); margin-top: 5px; }

/* ============ escuta ============ */

.dt-topo { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); margin-bottom: 10px; }
.soa-caixa {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    margin-top: 12px;
    font-size: 15px;
}
.soa-caixa i { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9c8e6; font-style: normal; }
.nota-explica { font-size: 13.5px; color: var(--warn); margin-top: 8px; }

/* ============ chunks ============ */

.srs-resumo { display: flex; gap: 8px; margin-bottom: 14px; }
.srs-resumo div { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 6px; text-align: center; }
.srs-resumo b { font-size: 19px; }
.srs-resumo small { display: block; font-size: 10.5px; color: var(--fg-dim); }

.carta { text-align: center; padding: 6px 0; }
.carta-topo { font-size: 12px; color: var(--fg-dim); margin-bottom: 14px; }
.carta-pt { font-size: 20px; font-weight: 500; margin: 8px 0; }
.carta-instrucao { font-size: 13px; color: var(--fg-dim); }
.carta-en { font-size: 24px; font-weight: 600; color: var(--accent-2); margin: 14px 0 6px; line-height: 1.35; }
.carta-nota { font-size: 13px; color: var(--warn); }
.carta-pergunta { font-size: 13.5px; color: var(--fg-dim); margin-top: 16px; }
.carta .linha-botoes { justify-content: center; }
.tag { background: var(--bg-soft2); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
.tag--agora { background: var(--accent); color: #fff; margin-left: auto; }

.lista-chunks { list-style: none; margin: 0 0 8px; padding: 0; }
.lista-chunks li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lista-chunks span { flex: 1; }
.lista-chunks b { font-size: 15px; display: block; }
.lista-chunks small { color: var(--fg-dim); font-size: 13px; }
.lista-chunks em { display: block; font-size: 12.5px; color: var(--warn); font-style: normal; margin-top: 2px; }
.chunk-som { appearance: none; background: none; border: 0; color: var(--accent); font-size: 15px; cursor: pointer; padding: 0 2px; }
.selo { font-style: normal; font-size: 11px; color: var(--fg-dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; height: fit-content; }

.grupo { margin-bottom: 20px; }
.grupo h4 { font-size: 15px; color: var(--accent-2); }

/* ============ drills ============ */

.modelo { font-size: 13.5px; color: var(--fg-dim); }
.passos { margin: 10px 0 12px; padding-left: 20px; font-size: 14px; color: #cfd6e6; }
.passos li { margin-bottom: 4px; }
.dr-resposta .legenda { margin-top: 6px; }
.modelo i { color: #cfd6e6; font-style: normal; }
.dr-topo { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); margin: 10px 0; }
.dr-estimulo {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    padding: 22px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    line-height: 1.4;
}
.dr-relogio { height: 5px; background: var(--bg-soft2); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.dr-relogio i { display: block; height: 100%; width: 0; background: var(--accent-2); }
.dr-resposta { font-size: 17px; margin: 12px 0; padding: 12px; background: var(--bg); border-radius: 10px; border-left: 3px solid var(--ok); }
.dr-resposta b { color: var(--fg-dim); font-size: 12px; display: block; text-transform: uppercase; letter-spacing: .5px; }

/* ---- correção do que o aluno falou ---- */
.correcao { background: var(--bg); border-radius: 10px; padding: 13px; margin: 12px 0; }
.correcao h4 { font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 4px; }
.correcao h4:first-child { margin-top: 0; }
.corr-falado { font-size: 16px; color: #ffb3af; margin: 0 0 4px; }
.corr-certo { font-size: 17px; color: #a8e9c1; margin: 0 0 8px; }
.corr-lista { list-style: none; margin: 0; padding: 0; }
.corr-lista li { font-size: 14px; padding: 7px 0; border-top: 1px solid var(--line); }
.corr-lista b { color: #ffb3af; font-weight: 500; }
.corr-lista i { color: #a8e9c1; font-style: normal; }
.corr-lista small { display: block; color: var(--fg-dim); font-size: 12.5px; margin-top: 3px; }
.corr-limpo { font-size: 13.5px; color: var(--fg-dim); margin: 0; }
.corr-obs { font-size: 13.5px; color: var(--warn); margin: 10px 0 0; }
.corr-traducao { font-size: 14px; color: var(--fg-dim); font-style: italic; margin: 6px 0 0; }

/* ---- as duas respostas possíveis ---- */
.possiveis { margin: 12px 0; }
.possivel { background: var(--bg); border-left: 3px solid var(--ok); border-radius: 0 10px 10px 0; padding: 11px 13px; margin-bottom: 8px; }
.possivel b { display: block; font-size: 11.5px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
.possivel-en { font-size: 17px; margin: 0 0 4px; line-height: 1.4; }
.possivel-pt { font-size: 14px; color: var(--fg-dim); margin: 0; }
.possivel:nth-child(2) { border-left-color: var(--accent); }

/* ============ conversa ============ */

.cartao--cena { border-color: #2a3350; }
.cena { font-size: 15px; color: #cfd6e6; }
.cv-topo { font-size: 12px; color: var(--fg-dim); margin-bottom: 10px; }
.fala { border-radius: 12px; padding: 13px; margin-bottom: 12px; }
.fala > b { font-size: 12px; color: var(--fg-dim); display: block; margin-bottom: 5px; }
.fala--bot { background: var(--bg); border: 1px solid var(--line); }
.fala--bot p { font-size: 18px; line-height: 1.45; }
.fala--voce { background: #131b2b; border: 1px solid #2a3350; }
.fala-pt { color: var(--fg-dim); font-style: italic; font-size: 14px; }
.dica-turno { font-size: 13.5px; color: var(--warn); }
.modelo-caixa { background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 10px; }
.modelo-caixa b { font-size: 12px; color: var(--fg-dim); }
.modelo-caixa p { font-size: 16px; margin: 6px 0 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    font-size: 12.5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    color: var(--fg-dim);
}
.chip.is-ok { border-color: var(--ok); color: #a8e9c1; background: rgba(53, 196, 106, .1); }
.chip--alerta { border-color: #4a3c1c; color: var(--warn); }

.transcricao { margin: 12px 0; font-size: 14px; }
.transcricao summary { cursor: pointer; color: var(--fg-dim); }
.transcricao ul { padding-left: 18px; }
.transcricao li { margin-bottom: 5px; }

/* ============ arena ============ */

.cartao--arena { text-align: center; border-color: #4a2f1c; }
.arena-prompt { min-height: 70px; }
.arena-en { font-size: 21px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.arena-pt { font-size: 14px; color: var(--fg-dim); }
.arena-relogio {
    font-size: 46px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    margin: 10px 0;
    color: var(--accent-2);
}
.cartao--arena .linha-botoes { justify-content: center; }
.arena-vivo:not(:empty) {
    margin-top: 14px;
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    text-align: left;
}
.vivo-txt { font-size: 14px; color: #b9c8e6; margin: 0; min-height: 40px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* ============ coragem ============ */

.degrau {
    display: flex;
    gap: 12px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 9px;
}
.degrau-n {
    flex: 0 0 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--bg-soft2);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 14px;
}
.degrau.is-ok { border-color: #1f4630; }
.degrau.is-ok .degrau-n { background: var(--ok); color: #08160e; }
.degrau.is-travado { opacity: .5; }
.degrau-corpo { flex: 1; min-width: 0; }
.degrau-corpo b { font-size: 15.5px; }
.degrau-missao { font-size: 14px; margin: 4px 0 6px; }
.degrau-acoes { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; flex-wrap: wrap; }
.degrau-contador { font-size: 12px; color: var(--fg-dim); }
.degrau-debrief { font-size: 12.5px; color: var(--fg-dim); margin: 0; }
.degrau-debrief i { color: var(--warn); font-style: italic; }

/* ============ erros ============ */

.op-duplo { display: flex; flex-direction: column; gap: 8px; }
@media (min-width: 560px) { .op-duplo { flex-direction: row; } }
.erro-caixa { background: var(--bg); border-radius: 10px; padding: 12px; margin: 10px 0; }
.erro-caixa p { margin: 0 0 5px; }
.errado { color: #ffb3af; text-decoration: line-through; font-size: 15px; }
.certo { color: #a8e9c1; font-size: 16px; }
.erro-caixa .porque { color: var(--fg-dim); font-size: 13.5px; margin-top: 6px; }

/* ============ plano ============ */

.fase { margin-bottom: 22px; }
.fase-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.fase-head h3 { font-size: 17px; color: var(--accent-2); }
.fase-sem { font-size: 12px; color: var(--fg-dim); }
.entrega { font-size: 14px; color: #cfd6e6; }
.semanas { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.semana { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.semana summary { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; font-size: 15px; }
.semana summary::-webkit-details-marker { display: none; }
.semana-n { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--bg-soft2); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
.semana-t { flex: 1; }
.semana.is-passada { opacity: .6; }
.semana.is-atual { border-color: var(--accent); }
.semana.is-atual .semana-n { background: var(--accent); color: #fff; }
.semana-corpo { padding: 0 13px 14px; }

/* ============ diário ============ */

.humor { display: flex; gap: 6px; }
.humor button {
    flex: 1;
    appearance: none;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--fg-dim);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 8px 3px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.humor button small { font-size: 9.5px; font-weight: 400; line-height: 1.2; margin-top: 3px; }
.humor button.is-on { border-color: var(--accent); color: var(--fg); background: #131b2b; }

.diario-lista { display: flex; flex-direction: column; gap: 10px; }
.di-item { background: var(--bg); border-radius: 10px; padding: 11px 13px; font-size: 14px; }
.di-item p { margin: 0 0 4px; }
.di-item b { color: var(--fg-dim); font-size: 12.5px; }
.di-data { display: block; font-size: 11.5px; color: var(--fg-dim); margin-bottom: 6px; }
.di-alvo { color: var(--accent-2); }
.di-item--coragem { border-left: 3px solid var(--accent-2); }

/* ============ progresso ============ */

.cartao--serie { text-align: left; }
.serie-num { font-size: 30px; font-weight: 700; margin: 2px 0 6px; line-height: 1; }
.serie-num small { font-size: 14px; color: var(--fg-dim); font-weight: 400; }
.delta { font-size: 13px; margin-left: 8px; vertical-align: middle; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--bad); }
.grafico { width: 100%; height: 54px; color: var(--accent); display: block; }
.grafico--vazio { display: grid; place-items: center; font-size: 12px; color: var(--fg-dim); border: 1px dashed var(--line); border-radius: 8px; }

.minutos-barras { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin-top: 10px; }
.mb { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.mb i { width: 100%; background: linear-gradient(180deg, var(--accent), #2b4f8f); border-radius: 3px; display: block; }
.mb small { font-size: 9px; color: var(--fg-dim); }

/* ============ abertura ============ */

.abertura { padding-top: 10px; }
.abertura-titulo { font-size: 40px; margin: 0 0 6px; letter-spacing: -1.5px; }
.abertura-titulo span { color: var(--accent-2); }
.abertura-sub { font-size: 16px; color: var(--fg-dim); line-height: 1.5; margin-bottom: 18px; }
.lista-check { list-style: none; margin: 0; padding: 0; }
.lista-check li { padding: 7px 0 7px 24px; position: relative; font-size: 14.5px; }
.lista-check li::before { content: '✓'; position: absolute; left: 0; color: var(--ok); }
.cartao--pacto { border-color: #4a3a1c; }
.pacto-linha { display: flex; align-items: flex-start; gap: 10px; font-size: 14.5px; margin-bottom: 10px; cursor: pointer; }
.rodape-nota { font-size: 12px; color: var(--fg-dim); text-align: center; }

.lista-status { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.lista-status li { padding: 4px 0; }
.lista-status .ok { color: var(--ok); }
.lista-status .nao { color: var(--bad); }

.texto-longo h3 { margin-top: 18px; font-size: 16px; color: var(--accent-2); }
.texto-longo h3:first-child { margin-top: 0; }
.texto-longo p { font-size: 15px; line-height: 1.6; color: #cfd6e6; }

.aviso { background: #1a1710; border: 1px solid #4a3a1c; border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }

/* Título de cartão com o botão de ajuda ao lado. */
.cartao-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}
.cartao-titulo h3, .cartao-titulo b { margin: 0; }
.cartao-titulo .sub { margin: 0; }
.sub--compacta { margin: -4px 0 12px; font-size: 13px; }
.linha-ajuda { margin: -6px 0 14px; }

.etiqueta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--fg-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
}

.arena-ajuda { text-align: right; margin: -4px 0 4px; }

/* ============ ajuda em pop-up ============ */

.btn-ajuda {
    appearance: none;
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg-soft2);
    color: var(--fg-dim);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    vertical-align: middle;
    margin-left: 6px;
    flex: 0 0 auto;
}
.btn-ajuda:hover { color: var(--fg); border-color: #33405c; }

.modal {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(4, 6, 10, .72);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
}
@media (min-width: 620px) { .modal { align-items: center; padding: 20px; } }

.modal-caixa {
    width: 100%;
    max-width: 560px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(18px + var(--safe-b));
    animation: sobe .18s ease;
}
@media (min-width: 620px) { .modal-caixa { border-radius: 16px; } }
@keyframes sobe { from { transform: translateY(14px); opacity: .6; } }

.modal-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.modal-topo h3 { font-size: 18px; margin: 0; }
.modal-x { appearance: none; background: none; border: 0; color: var(--fg-dim); font-size: 18px; cursor: pointer; padding: 0 4px; }

.modal-corpo { font-size: 15px; line-height: 1.55; color: #cfd6e6; }
.modal-corpo p { margin: 0 0 10px; }
.modal-corpo b { color: var(--fg); }
.modal-corpo ol, .modal-corpo ul { padding-left: 20px; margin: 0 0 10px; }
.modal-corpo li { margin-bottom: 5px; }
.modal-corpo .destaque { color: var(--accent-2); }

.sem-rolagem { overflow: hidden; }

/* ============ toast ============ */

.toast {
    position: fixed;
    left: 50%;
    bottom: calc(78px + var(--safe-b));
    transform: translate(-50%, 16px);
    background: #232b3d;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 14px;
    padding: 11px 16px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    max-width: 90vw;
    text-align: center;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast--erro { border-color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

/* Quanto falta para o bloco do dia fechar — dentro do exercício,
   onde o aluno está, e não só na tela Hoje. */
.bloco-progresso {
    margin: 2px 0 10px;
    font-size: 13px;
    color: var(--fg-dim);
}

.bloco-progresso.is-ok {
    color: var(--ok);
}

.ex-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--fg-dim);
    font-size: 13px;
    margin-bottom: 8px;
}

.ex-palavra {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
    padding: 18px 12px 14px;

    border: 1px solid var(--line);
    border-radius: 14px;
}

.ex-palavra small {
    display: block;
    margin-top: 4px;
    font-size: 14px;
    font-weight: 500;
    color: var(--fg-dim);
    letter-spacing: 0;
}

.ex-rotulo {
    margin: 14px 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-dim);
}

.ex-rotulo small {
    text-transform: none;
    letter-spacing: 0;
}

.ex-fichas {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.ficha {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-soft2);
    font-size: 14px;
    color: var(--fg-dim);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.ficha--nao {
    border-style: dashed;
    text-decoration: line-through;
}

/* acesa = usou uma palavra que ajuda; queimada = disse a proibida */
.ficha.is-acesa {
    background: rgba(53, 196, 106, 0.18);
    border-color: var(--ok);
    color: var(--ok);
    text-decoration: none;
}

.ficha.is-queimada {
    background: rgba(255, 90, 82, 0.2);
    border-color: var(--bad);
    border-style: solid;
    color: var(--bad);
}

.ex-transcricao {
    min-height: 20px;
    margin: 10px 0 0;
    font-size: 15px;
    color: var(--fg-dim);
    font-style: italic;
}

.ex-minha {
    margin: 10px 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
}

.ex-minha b {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-dim);
    margin-bottom: 4px;
}

.ex-minha p {
    margin: 0;
}

.btn.is-gravando {
    background: var(--bad);
    border-color: var(--bad);
    color: #fff;
}

/* ---------- Pega o erro ---------- */
.pe-caixa {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 84px;
    padding: 16px;
    text-align: center;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 12px;
}

.pe-oculto {
    color: var(--fg-dim);
    font-size: 14px;
    font-style: italic;
}

.pe-frase {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.35;
}

.pe-frase--torta {
    text-decoration: line-through;
    text-decoration-color: var(--bad);
    text-decoration-thickness: 2px;
}

/* ---------- lembrete de estudo ---------- */
.dias {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
}

.dia-btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-soft2);

    font-family: inherit;
    cursor: pointer;
}

.dia-btn.is-on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}

/* O seletor de hora nasce branco no Android: sem isto ele aparece
   como um retângulo claro no meio da tela escura. */
input[type="time"] {
    font-family: inherit;
    color-scheme: dark;
    width: 100%;
}

/* ---------- tradução reversa ---------- */
.rv-pt {
    padding: 20px 16px;
    margin-bottom: 12px;
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.35;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
}

.rv-armadilha {
    margin: 12px 0;
    padding: 12px 14px;

.rv-armadilha b {
    display: block;
    font-size: 12px;
    text-transform: uppercase;

}

    text-align: center;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: 0.5px;
}

.carta-furada .furo {
    color: var(--accent);
    font-style: normal;

}

.ch-uso {

}

.ch-uso > b {
    display: block;
    font-size: 12px;

/* =========================================================
   Correção por regras.

   O app não entende inglês: não há modelo de linguagem aqui
   dentro, e tudo funciona sem internet. O que ele sabe fazer é
   reconhecer os erros que o falante de português comete de
   forma previsível — e esses são muitos, repetidos e fáceis de
   detectar por padrão de texto.

   Cada regra é de alta confiança: só dispara quando o trecho é
   inequivocamente errado. Preferimos deixar passar erro a
   acusar uma frase correta, porque corretor que erra faz o
   aluno desconfiar de tudo o que ele diz.

   O texto chega em minúsculas e sem pontuação, como sai do
   reconhecimento de fala.
   ========================================================= */
window.F = window.F || {};
F.data = F.data || {};

F.data.correcoes = [

    /* ---------- ser e estar ---------- */
    { re: /\bi (?:have|has) (\d+|thirty|forty|twenty|fifty) years?\b/, troca: "I'm $1 years old", porque: 'Idade é com TO BE: "I\'m 34", nunca "I have 34 years".' },
    { re: /\bi am with (hungry|cold|hot|thirsty|sleepy|scared|afraid)\b/, troca: "I'm $1", porque: 'Estado é adjetivo direto: "I\'m hungry", não "I\'m with hungry".' },
    /* A forma que o brasileiro realmente produz é com o SUBSTANTIVO —
       "estou com fome" vira "I am with hunger" antes de virar "with hungry". */
    { re: /\bi am with hunger\b/, troca: "I'm hungry", porque: 'Em inglês o estado é adjetivo com TO BE: "I\'m hungry" — nunca "I am with hunger".' },
    { re: /\bi am with cold\b/, troca: "I'm cold", porque: 'Em inglês o estado é adjetivo com TO BE: "I\'m cold" — nunca "I am with cold".' },
    { re: /\bi am with heat\b/, troca: "I'm hot", porque: 'Em inglês o estado é adjetivo com TO BE: "I\'m hot" — nunca "I am with heat".' },
    { re: /\bi am with thirst\b/, troca: "I'm thirsty", porque: 'Em inglês o estado é adjetivo com TO BE: "I\'m thirsty" — nunca "I am with thirst".' },
    { re: /\bi am with sleep\b/, troca: "I'm sleepy", porque: 'Em inglês o estado é adjetivo com TO BE: "I\'m sleepy" — nunca "I am with sleep".' },

/* =========================================================
   Ponte com o app Android.

   O WebView não implementa a Web Speech API: dentro dele
   window.speechSynthesis e SpeechRecognition não existem, e sem
   os dois este app vira só a versão escrita.

   Quando o app nativo está presente (window.AndroidVoz), este
   arquivo repõe as duas APIs com a mesma forma que o navegador
   expõe, para que js/voz.js — e todo o resto — não precise saber
   onde está rodando. No navegador comum, ele não faz nada.

   Precisa vir ANTES de js/voz.js: aquele arquivo lê as duas APIs
   uma única vez, na hora em que carrega.
   ========================================================= */
(function () {
    'use strict';

    var ponte = window.AndroidVoz;
    /* Os lembretes vivem numa interface separada da voz: são assuntos
       distintos, e a página precisa saber qual das duas falta quando
       algo não funciona. */
    var lem = window.AndroidLembrete;
    if (!ponte) return;

    function definir(nome, valor) {
        // speechSynthesis é acessor somente-leitura em alguns WebViews:
        // atribuir direto falha em silêncio, defineProperty não.
        try {
            Object.defineProperty(window, nome, { value: valor, configurable: true, writable: true });
        } catch (e) {
            try { window[nome] = valor; } catch (e2) { }
        }
    }

    /* ---------------- falar ---------------- */

    var VOZES = [
        { name: 'Voz do Android — americano', lang: 'en-US', localService: true, default: true },
        { name: 'Voz do Android — britânico', lang: 'en-GB', localService: true, default: false },
        { name: 'Voz do Android — australiano', lang: 'en-AU', localService: true, default: false },
        { name: 'Voz do Android — indiano', lang: 'en-IN', localService: true, default: false }
    ];

    var falando = null;

    /* Encerra a fala atual uma única vez, venha o aviso do Android
       (terminou) ou daqui (foi cancelada). */
    function terminarFala(ok) {
        var u = falando;
        falando = null;
        if (!u) return;
        if (ok === false && u.onerror) u.onerror({ error: 'interrupted' });
        else if (u.onend) u.onend({});
    }

    window.__ponteFalaFim = function (ok) { terminarFala(ok !== false); };

    function Enunciado(texto) {
        this.text = texto === undefined ? '' : String(texto);
        this.lang = 'en-US';
        this.rate = 1;
        this.pitch = 1;
        this.volume = 1;
        this.voice = null;
        this.onend = null;
        this.onerror = null;
        this.onstart = null;
    }

    definir('SpeechSynthesisUtterance', Enunciado);

    definir('speechSynthesis', {
        speaking: false,
        pending: false,
        paused: false,
        speak: function (u) {
            terminarFala(true);          // o Android descarta a fala anterior
            falando = u;
            if (u.onstart) u.onstart({});
            ponte.falar(String(u.text || ''), u.rate || 1, u.lang || 'en-US');

        cancel: function () {

        },
        pause: function () { },
        resume: function () { },
        getVoices: function () { return VOZES; },
        addEventListener: function () { },
        removeEventListener: function () { }
    });

    var atual = null;

       com isFinal no resultado. É o que js/voz.js sabe ler. */
    function eventoDeFala(alternativas, isFinal) {
        var res = alternativas.map(function (t) {
            return { transcript: t, confidence: 0.9 };

        res.isFinal = isFinal;
        var lista = [res];
        return { resultIndex: 0, results: lista };
    }

    window.__ponteEscuta = {
        parcial: function (texto) {
            if (atual && atual.onresult && atual.interimResults) {
                atual.onresult(eventoDeFala([texto], false));
            }
        },
        resultado: function (alternativas) {
            if (!atual || !atual.onresult) return;
            if (!alternativas || !alternativas.length) return;
            atual.onresult(eventoDeFala(alternativas, true));
        },
        erro: function (nome) {
            var r = atual;
            if (!r) return;
            atual = null;
            if (r.onerror) r.onerror({ error: nome });
            // no navegador, onend vem sempre depois de onerror
            if (r.onend) r.onend({});
        },
        fim: function () {
            var r = atual;
            if (!r) return;
            atual = null;
            if (r.onend) r.onend({});
        }
    };

    function Reconhecimento() {
        this.lang = 'en-US';
        this.continuous = false;
        this.interimResults = true;
        this.maxAlternatives = 3;
        this.onresult = null;
        this.onerror = null;
        this.onend = null;
    }

    Reconhecimento.prototype.start = function () {
        atual = this;
        ponte.ouvir(this.lang || 'en-US');
    };

    Reconhecimento.prototype.stop = function () {
        ponte.pararEscuta();
    };

    Reconhecimento.prototype.abort = function () {

    };

       permissão do app; a gravação, não — por isso os dois caminhos são
       separados aqui. */

        versao: (ponte.versao && ponte.versao()) || '?',

        microfone: ponte.temMicrofone ? {
            tem: function () { try { return !!ponte.temMicrofone(); } catch (e) { return false; } },
            pedir: function () { ponte.pedirMicrofone(); },

           perde sem explicar; o MediaRecorder do Android grava direto. */
        gravador: ponte.gravarComecar ? {
            comecar: function () { try { return String(ponte.gravarComecar()); } catch (e) { return 'erro:' + e; } },
            parar: function () { try { return String(ponte.gravarParar() || ''); } catch (e) { return ''; } },
            gravando: function () { try { return !!ponte.gravandoAgora(); } catch (e) { return false; } },
            apagar: function (url) { try { return !!ponte.gravarApagar(String(url || '')); } catch (e) { return false; } }
        } : null,

        lembretes: (lem && lem.agendarLembretes) ? {

            estado: function () { try { return String(lem.estadoLembretes() || '{}'); } catch (e) { return '{}'; } },

        } : null,

        diagnostico: function () {
            try { return ponte.diagnostico ? String(ponte.diagnostico()) : ''; } catch (e) { return ''; }
        }

            pronuncia: [], ditado: [], drill: [], fala: [], explicar: [], pegaoerro: [], reversa: [], erros: [], chunks: []
        },
        marcados: [],          // chunks favoritados
        gravacoes: [],         // { url, data, ts, chave, rotulo }
        config: {
            sotaque: 'en-US',
            voz: '',
            rate: 1,
            metaDiaria: 60,
            mostrarPt: true,
            /* Lembrete começa desligado: avisar sem ter sido pedido é
               notificação de app chato. Os valores são só o ponto de
               partida da tela de ajustes. 0 = domingo. */
            lembrete: {
                ligado: false,
                dias: [1, 2, 3, 4, 5, 6],
                hora: '19:00',
                antes: 10
            }
        }
    };

    var estado = carregar();

    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    function carregar() {
        try {
            var bruto = localStorage.getItem(CHAVE);
            if (!bruto) return novo();
            var s = JSON.parse(bruto);
            // completa chaves que não existiam em versões anteriores
            var p = clone(PADRAO);
            for (var k in p) if (!(k in s)) s[k] = p[k];
            for (var c in p.config) if (!(c in s.config)) s.config[c] = p.config[c];
            for (var l in p.config.lembrete) if (!(l in s.config.lembrete)) s.config.lembrete[l] = p.config.lembrete[l];
            for (var h in p.historico) if (!(h in s.historico)) s.historico[h] = p.historico[h];
            return s;
        } catch (e) {
            return novo();
        }
    }

    function novo() {
        var s = clone(PADRAO);
        s.criado = hoje();
        return s;
    }

    function salvar() {
        try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* cota cheia */ }
    }

    function hoje() {
        var d = new Date();
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function diasEntre(a, b) {
        return Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);
    }

    /* ---------------- streak e tempo ---------------- */

    function registrarMinutos(min) {
        var d = hoje();
        estado.minutos[d] = (estado.minutos[d] || 0) + min;
        tocarStreak();
        salvar();
    }

    function tocarStreak() {
        var d = hoje();
        var s = estado.streak;
        if (s.ultimo === d) return;
        if (!s.ultimo) s.atual = 1;
        else {
            var dif = diasEntre(s.ultimo, d);
            s.atual = dif === 1 ? s.atual + 1 : (dif === 0 ? s.atual : 1);
        }
        s.ultimo = d;
        if (s.atual > s.recorde) s.recorde = s.atual;
    }

    function minutosHoje() { return estado.minutos[hoje()] || 0; }

    function minutosTotais() {
        var t = 0;
        for (var k in estado.minutos) t += estado.minutos[k];
        return t;
    }

    function diasEstudados() { return Object.keys(estado.minutos).length; }

    /* ---------------- blocos do ciclo diário ---------------- */

    function blocosHoje() { return estado.blocos[hoje()] || []; }

    function concluirBloco(id) {
        var d = hoje();
        if (!estado.blocos[d]) estado.blocos[d] = [];
        if (estado.blocos[d].indexOf(id) < 0) estado.blocos[d].push(id);
        tocarStreak();
        salvar();
    }

    function blocoFeito(id) { return blocosHoje().indexOf(id) >= 0; }

    /* ---------------- desempenho ---------------- */

    function registrar(serie, pct, extra) {
        var h = estado.historico[serie];
        if (!h) h = estado.historico[serie] = [];
        h.push({ d: hoje(), p: Math.round(pct), x: extra || null });
        if (h.length > 600) h.shift();
        salvar();
    }

    /* Quantas respostas dessa série o aluno já deu hoje. É por aqui que o
       ciclo sabe se um bloco foi realmente feito: conta o trabalho do dia,
       não o fato de ter chegado até a última tela do exercício. */
    function feitosHoje(serie) {
        var d = hoje(), n = 0;
        var h = estado.historico[serie] || [];
        for (var i = h.length - 1; i >= 0; i--) {
            if (h[i].d !== d) break;
            n++;
        }
        return n;
    }

    function media(serie, ultimos) {
        var h = estado.historico[serie] || [];
        var arr = ultimos ? h.slice(-ultimos) : h;
        if (!arr.length) return null;
        var t = 0;
        for (var i = 0; i < arr.length; i++) t += arr[i].p;
        return Math.round(t / arr.length);
    }

    /* Nota geral de fluência: 0 a 100, a partir do que existe de dado. */
    function notaFluencia() {
        var partes = [];
        var pr = media('pronuncia', 30); if (pr !== null) partes.push(pr);
        var di = media('ditado', 30); if (di !== null) partes.push(di);
        var dr = media('drill', 30); if (dr !== null) partes.push(dr);
        var fa = media('fala', 30); if (fa !== null) partes.push(fa);
        var ex = media('explicar', 30); if (ex !== null) partes.push(ex);
        var pe = media('pegaoerro', 30); if (pe !== null) partes.push(pe);
        var rv = media('reversa', 30); if (rv !== null) partes.push(rv);
        // constância vale um quarto da nota: fluência é frequência
        var const_ = Math.min(100, (estado.streak.atual / 30) * 100);
        var vol = Math.min(100, (minutosTotais() / (45 * 100)) * 100);
        if (!partes.length) return Math.round((const_ + vol) / 4);
        var m = partes.reduce(function (a, b) { return a + b; }, 0) / partes.length;
        return Math.round(m * 0.6 + const_ * 0.25 + vol * 0.15);
    }

    /* ---------------- gravações ---------------- */

    /*
     * O exercício é comparar a gravação de hoje com a de duas semanas atrás,
     * então a lista precisa sobreviver a fechar o app. No app Android o áudio
     * é um arquivo e o endereço continua valendo; no navegador é um blob, que
     * morre com a aba — por isso os blobs não são guardados entre sessões.
     */
    function gravacoes(chave) {
        var todas = estado.gravacoes || [];
        return chave ? todas.filter(function (g) { return g.chave === chave; }) : todas;
    }

    /* Devolve as que saíram da lista: o arquivo delas precisa ser apagado
       junto, senão sobra áudio invisível ocupando espaço no aparelho. */
    function guardarGravacao(g) {
        if (!estado.gravacoes) estado.gravacoes = [];
        g.data = hoje();
        g.ts = Date.now();
        estado.gravacoes.unshift(g);

        // por chave, guardamos as duas últimas: a de agora e a de antes
        var vistas = {}, saíram = [];
        estado.gravacoes = estado.gravacoes.filter(function (x) {
            vistas[x.chave] = (vistas[x.chave] || 0) + 1;
            if (vistas[x.chave] <= 2) return true;
            saíram.push(x);
            return false;
        });
        salvar();
        return saíram;
    }

    function esquecerGravacao(url) {
        estado.gravacoes = (estado.gravacoes || []).filter(function (g) { return g.url !== url; });
        salvar();
    }

    /* Blob de sessão anterior não toca mais: sai da lista na abertura. */
    function limparGravacoesMortas() {
        var antes = (estado.gravacoes || []).length;
        estado.gravacoes = (estado.gravacoes || []).filter(function (g) {
            return g.url && g.url.indexOf('blob:') !== 0;
        });
        if (estado.gravacoes.length !== antes) salvar();
    }

    /* ---------------- diário ---------------- */

    function anotar(entrada) {
        entrada.data = hoje();
        entrada.ts = Date.now();
        estado.diario.unshift(entrada);
        if (estado.diario.length > 400) estado.diario.pop();
        salvar();
    }

    /* ---------------- exportar / importar ---------------- */

    function exportar() {
        return JSON.stringify(estado, null, 2);
    }

    function importar(texto) {
        var s = JSON.parse(texto);
        if (!s || typeof s !== 'object' || !('streak' in s)) throw new Error('arquivo não é um backup do app');
        estado = s;
        salvar();
        return true;
    }

    function zerar() {
        estado = novo();
        salvar();
    }

    return {
        get: function () { return estado; },
        salvar: salvar,
        hoje: hoje,
        diasEntre: diasEntre,
        registrarMinutos: registrarMinutos,
        minutosHoje: minutosHoje,
        minutosTotais: minutosTotais,
        diasEstudados: diasEstudados,
        tocarStreak: tocarStreak,
        blocosHoje: blocosHoje,
        blocoFeito: blocoFeito,
        concluirBloco: concluirBloco,
        feitosHoje: feitosHoje,
        registrar: registrar,
        media: media,
        notaFluencia: notaFluencia,
        anotar: anotar,
        gravacoes: gravacoes,
        guardarGravacao: guardarGravacao,
        esquecerGravacao: esquecerGravacao,
        limparGravacoesMortas: limparGravacoesMortas,
        exportar: exportar,
        importar: importar,
        zerar: zerar
    };
})();

</script>
    <script>
/* =========================================================
   Comparação de texto — é o que permite corrigir o aluno.

   Serve para três coisas: nota do ditado, nota da pronúncia
   (comparando com o que o reconhecimento de voz entendeu) e
   diagnóstico do erro típico de brasileiro por trás da palavra
   que saiu errada.
   ========================================================= */
window.F = window.F || {};

F.texto = (function () {
    'use strict';

    var CONTRACOES = {
        "i'm": 'i am', "im": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are',
        "he's": 'he is', "she's": 'she is', "it's": 'it is', "that's": 'that is', "there's": 'there is',
        "what's": 'what is', "who's": 'who is', "let's": 'let us', "here's": 'here is',
        "don't": 'do not', "doesn't": 'does not', "didn't": 'did not', "isn't": 'is not',
        "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not', "can't": 'can not',
        "cannot": 'can not', "couldn't": 'could not', "won't": 'will not', "wouldn't": 'would not',
        "shouldn't": 'should not', "haven't": 'have not', "hasn't": 'has not', "hadn't": 'had not',
        "i've": 'i have', "you've": 'you have', "we've": 'we have', "they've": 'they have',
        "i'd": 'i would', "you'd": 'you would', "he'd": 'he would', "she'd": 'she would',
        "we'd": 'we would', "they'd": 'they would',
        "i'll": 'i will', "you'll": 'you will', "he'll": 'he will', "she'll": 'she will',
        "we'll": 'we will', "they'll": 'they will', "it'll": 'it will',
        "gonna": 'going to', "wanna": 'want to', "gotta": 'got to', "kinda": 'kind of',
        "hafta": 'have to', "lemme": 'let me', "gimme": 'give me', "cause": 'because',
        "ok": 'okay', "alright": 'all right'
    };

    function normalizar(s) {
        if (!s) return '';
        s = String(s).toLowerCase();
        s = s.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
        s = s.replace(/[^a-z0-9'\s-]/g, ' ');
        s = s.replace(/\s+/g, ' ').trim();
        var saida = [];
        var partes = s.split(' ');
        for (var i = 0; i < partes.length; i++) {
            var p = partes[i].replace(/^-+|-+$/g, '');
            if (!p) continue;
            if (CONTRACOES[p]) saida = saida.concat(CONTRACOES[p].split(' '));
            else saida.push(p.replace(/'/g, ''));
        }
        return saida.join(' ');
    }

    function palavras(s) {
        var n = normalizar(s);
        return n ? n.split(' ') : [];
    }

    /* Alinhamento de Levenshtein no nível da palavra, com rastro.
       Devolve a lista de operações para mostrar o diff. */
    function alinhar(ref, hip) {
        var a = palavras(ref), b = palavras(hip);
        var m = a.length, n = b.length;
        var d = [], i, j;
        for (i = 0; i <= m; i++) { d[i] = [i]; }
        for (j = 0; j <= n; j++) { d[0][j] = j; }
        for (i = 1; i <= m; i++) {
            for (j = 1; j <= n; j++) {
                var custo = a[i - 1] === b[j - 1] ? 0 : 1;
                d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + custo);
            }
        }
        var ops = [];
        i = m; j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
                ops.unshift(a[i - 1] === b[j - 1]
                    ? { op: 'ok', ref: a[i - 1], hip: b[j - 1] }
                    : { op: 'troca', ref: a[i - 1], hip: b[j - 1] });
                i--; j--;
            } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) {
                ops.unshift({ op: 'faltou', ref: a[i - 1], hip: '' });
                i--;
            } else {
                ops.unshift({ op: 'sobrou', ref: '', hip: b[j - 1] });
                j--;
            }
        }
        return { ops: ops, ref: a, hip: b, distancia: d[m][n] };
    }

    /* Nota de 0 a 100 comparando o que era para falar com o que foi ouvido. */
    function pontuar(ref, hip) {
        var r = alinhar(ref, hip);
        var acertos = 0;
        for (var i = 0; i < r.ops.length; i++) if (r.ops[i].op === 'ok') acertos++;
        var total = r.ref.length || 1;
        var pct = Math.max(0, Math.round((acertos / total) * 100));
        // penaliza palavra inventada, mas de leve: quem fala demais não deve zerar
        var sobras = r.ops.filter(function (o) { return o.op === 'sobrou'; }).length;
        pct = Math.max(0, pct - Math.min(15, sobras * 3));

        r.total = total;
        r.pct = pct;
        return r;

    /* ---------------------------------------------------------
       Diagnóstico: por que essa palavra saiu errada?
       Heurística baseada nos erros clássicos do falante de
       português. Não é fonética de laboratório — é o palpite
       que um professor daria olhando o par (esperado, ouvido).
       --------------------------------------------------------- */
    var REGRAS = [
        {
            id: 'th-surdo',
            teste: function (r, h) { return /th/.test(r) && /^[stf]/.test(h) && r[0] === 't'; },
            dica: 'O TH virou S/T/F. Ponha a ponta da língua entre os dentes e sopre.'
        },
        {
            id: 'th-sonoro',
            teste: function (r, h) { return /^th/.test(r) && /^[dz]/.test(h); },
            dica: 'O TH sonoro virou D ou Z. Língua entre os dentes, com a voz ligada.'
        },
        {
            id: 'epentese',
            teste: function (r, h) { return h.length > r.length && h.indexOf(r) === 0 && /[ie]$/.test(h); },
            dica: 'Você colou uma vogal no fim da palavra. Termine na consoante e pare.'
        },
        {
            id: 'cluster-s',
            teste: function (r, h) { return /^s[ptkclmnw]/.test(r) && /^e?s/.test(h) && h.length > r.length; },
            dica: 'Entrou um "e" antes do S. Comece pelo próprio S, segurando o som.'
        },
        {
            id: 'i-longo-curto',
            teste: function (r, h) {
                return r !== h && r.replace(/ee|ea|i/g, 'I') === h.replace(/ee|ea|i/g, 'I');
            },
            dica: 'Confusão entre /ɪ/ curto e /iː/ longo (ship × sheep). São vogais diferentes, não a mesma mais rápida.'
        },
        {
            id: 'h-r',
            teste: function (r, h) { return (/^h/.test(r) && /^r/.test(h)) || (/^r/.test(r) && /^h/.test(h)); },
            dica: 'H e R trocados. O H é só ar soprado; o R americano não vibra nunca.'
        },
        {
            id: 'v-w',
            teste: function (r, h) { return (/^v/.test(r) && /^w/.test(h)) || (/^w/.test(r) && /^v/.test(h)); },
            dica: 'V e W trocados. V morde o lábio; W faz bico, sem tocar nos dentes.'
        },
        {
            id: 'ed',
            teste: function (r, h) { return /ed$/.test(r) && (h === r.replace(/ed$/, '') || h === r.replace(/ed$/, 'id')); },
            dica: 'O -ed saiu errado. Só depois de T ou D ele vira sílaba nova.'
        },
        {
            id: 's-final',
            teste: function (r, h) { return /s$/.test(r) && h === r.replace(/s$/, ''); },
            dica: 'Você comeu o -s final. Ele carrega plural, terceira pessoa ou posse.'
        },
        {
            id: 'l-final',
            teste: function (r, h) { return /l$/.test(r) && /[uw]$/.test(h); },
            dica: 'O L final virou U. A ponta da língua tem que encostar atrás dos dentes de cima.'
        }

    function diagnosticar(ref, hip) {
        if (!ref || !hip || ref === hip) return null;
        for (var i = 0; i < REGRAS.length; i++) {
            try { if (REGRAS[i].teste(ref, hip)) return REGRAS[i]; } catch (e) { }
        }
        return null;
    }

    /* Junta os diagnósticos de uma frase inteira, do mais frequente
       para o menos frequente. */
    function diagnosticoDaFrase(resultado) {
        var contagem = {}, dicas = {};
        for (var i = 0; i < resultado.ops.length; i++) {
            var o = resultado.ops[i];
            if (o.op !== 'troca') continue;
            var d = diagnosticar(o.ref, o.hip);
            if (!d) continue;
            contagem[d.id] = (contagem[d.id] || 0) + 1;
            dicas[d.id] = d.dica;
        }
        return Object.keys(contagem)
            .sort(function (a, b) { return contagem[b] - contagem[a]; })
            .map(function (id) { return { id: id, n: contagem[id], dica: dicas[id] }; });
    }

    /* ---------------------------------------------------------
       O que vai para a voz não é o que vai para os olhos.

       O conteúdo traz anotações que ajudam a ler e atrapalham a
       ouvir: a seta que separa a frase da versão "como soa", o
       IPA entre barras, a contagem entre parênteses, as aspas da
       grafia aproximada. Lidos em voz alta viram ruído — "I have
       to get out of here seta I hafta gedoudda here".

       Este é o único ponto por onde todo texto falado passa.
       --------------------------------------------------------- */
    function paraFalar(texto) {
        if (!texto) return '';
        var t = String(texto);
        t = t.split('→')[0];                    // só o lado real da frase
        t = t.split('//')[0];                   // marca de pausa do shadowing
        t = t.replace(/\/[^/]*\//g, ' ');       // IPA entre barras
        t = t.replace(/\([^)]*\)/g, ' ');       // notas entre parênteses
        t = t.replace(/[«»"“”]/g, ' ');         // aspas da grafia aproximada
        t = t.replace(/\s+/g, ' ').trim();
        return t;
    }

    /* Grafia do erro, escrita para o olho brasileiro ("es-tó-pi").
       Uma voz inglesa lendo isso não produz o erro nem o acerto:
       produz uma terceira coisa, que não ensina nada. */
    function ehGrafiaDeErro(texto, ipa) {
        return /errado|não existe/i.test(String(ipa || '')) ||
            /errado|não existe/i.test(String(texto || ''));
    }

    /* Conta sílabas aproximadamente — usado para mostrar ao aluno
       quantas sílabas a frase deveria ter (contra a vogal fantasma). */
    function silabas(frase) {
        var ps = palavras(frase), total = 0;
        for (var i = 0; i < ps.length; i++) {
            var p = ps[i].replace(/e$/, '');
            var g = p.match(/[aeiouy]+/g);
            total += g ? g.length : 1;
        }
        return total;
    }

    return {
        normalizar: normalizar,
        palavras: palavras,
        alinhar: alinhar,
        pontuar: pontuar,
        diagnosticar: diagnosticar,
        diagnosticoDaFrase: diagnosticoDaFrase,
        paraFalar: paraFalar,
        ehGrafiaDeErro: ehGrafiaDeErro,
        silabas: silabas
    };
})();

    <script>
/* =========================================================
   Corretor de regras.

   Recebe o que o reconhecimento ouviu e devolve: os erros que
   ele reconhece, a frase reescrita com as trocas aplicadas, e
   as observações do exercício (devolveu a pergunta? a reação
   ficou curta?).

   O que ele NÃO faz, e diz isso ao aluno: entender inglês.
   Não achar erro aqui não significa que a frase está certa —
   significa que ela não caiu em nenhuma das armadilhas
   conhecidas. Corretor que finge onipotência ensina o aluno a
   confiar no lugar errado.
   ========================================================= */
window.F = window.F || {};

F.correcao = (function () {
    'use strict';

    /* O reconhecimento devolve texto sem pontuação e em caixa baixa;
       é nesse formato que as regras trabalham. */
    function normalizar(t) {
        return String(t || '').toLowerCase().replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function analisar(texto, opcoes) {
        opcoes = opcoes || {};
        var t = normalizar(texto);
        var achados = [];
        var corrigido = texto ? String(texto).trim() : '';

        if (!t) return { achados: [], corrigido: '', observacoes: [], vazio: true };

        (F.data.correcoes || []).forEach(function (regra) {
            var m = t.match(regra.re);
            if (!m) return;
            var sugestao = regra.troca.replace(/\$(\d)/g, function (_, n) { return m[Number(n)] || ''; });
            achados.push({ trecho: m[0], sugestao: sugestao, porque: regra.porque });

            // reescreve a frase do aluno com a troca aplicada, para ele ver
            // a versão certa inteira, e não só o pedaço
            if (sugestao.indexOf('(') !== 0) {
                var re = new RegExp(m[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
                corrigido = corrigido.replace(re, sugestao);
            }
        });

        var observacoes = [];
        (opcoes.checar || []).forEach(function (id) {
            var o = (F.data.observacoes || {})[id];
            if (o && o.testa(t)) observacoes.push(o.aviso);
        });

        return {
            achados: achados,
            corrigido: achados.length ? corrigido : '',
            observacoes: observacoes,
            vazio: false
        };
    }

    /* Bloco pronto para as telas: o que o aluno falou, o que ficaria certo,
       e a razão de cada troca. */
    function html(texto, opcoes) {
        var esc = F.ui.esc;
        var r = analisar(texto, opcoes);
        if (r.vazio) return '';

        var partes = ['<div class="correcao">'];
        partes.push('<h4>O que você disse</h4><p class="corr-falado">“' + esc(texto) + '”</p>');

        if (r.achados.length) {
            partes.push('<h4>Corrigido</h4><p class="corr-certo">“' + esc(r.corrigido) + '”</p>');
            partes.push('<ul class="corr-lista">' + r.achados.map(function (a) {
                return '<li><b>' + esc(a.trecho) + '</b> → <i>' + esc(a.sugestao) + '</i>' +
                    '<small>' + esc(a.porque) + '</small></li>';

            partes.push('<p class="corr-limpo">Nenhum dos erros que o app sabe detectar apareceu aqui. ' +

            partes.push('<p class="corr-obs">' + esc(o) + '</p>');
        });

        return partes.join('');
    }

    return { analisar: analisar, html: html, normalizar: normalizar };
})();

    <script>
/* =========================================================
   Repetição espaçada (SM-2 enxuto).

   O chunk volta a aparecer pouco antes de você esquecer.
   Errou, volta amanhã; acertou fácil, some por semanas.
   ========================================================= */
window.F = window.F || {};

F.srs = (function () {
    'use strict';

    function hojeNum() { return Math.floor(Date.now() / 86400000); }

    function cartao(id) {
        var e = F.store.get().srs;
        return e[id] || { ef: 2.5, int: 0, rep: 0, due: 0, erros: 0, acertos: 0 };
    }

    /* nota: 0 = errei, 1 = difícil, 2 = fácil */
    function responder(id, nota) {
        var s = F.store.get();
        var c = cartao(id);
        var q = nota === 0 ? 2 : (nota === 1 ? 4 : 5);

        if (q < 3) {
            c.rep = 0;
            c.int = 1;
            c.erros++;
        } else {
            c.rep++;
            c.acertos++;
            if (c.rep === 1) c.int = 1;
            else if (c.rep === 2) c.int = 6;
            else c.int = Math.round(c.int * c.ef);
            c.ef = c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
            if (c.ef < 1.3) c.ef = 1.3;
        }
        c.due = hojeNum() + c.int;
        s.srs[id] = c;
        F.store.salvar();
        return c;
    }

    /* Fila do dia: atrasados primeiro, depois novos. */
    function fila(todos, limite) {
        limite = limite || 20;
        var s = F.store.get().srs;
        var h = hojeNum();
        var vencidos = [], novos = [];
        for (var i = 0; i < todos.length; i++) {
            var id = todos[i].id;
            var c = s[id];
            if (!c) novos.push(todos[i]);
            else if (c.due <= h) vencidos.push(todos[i]);
        }
        vencidos.sort(function (a, b) { return (s[a.id].due || 0) - (s[b.id].due || 0); });
        return vencidos.concat(novos).slice(0, limite);
    }

    function resumo(todos) {
        var s = F.store.get().srs, h = hojeNum();
        var novos = 0, revisar = 0, aprendidos = 0;
        for (var i = 0; i < todos.length; i++) {
            var c = s[todos[i].id];
            if (!c) novos++;
            else if (c.due <= h) revisar++;
            else if (c.int >= 21) aprendidos++;
        }
        return { novos: novos, revisar: revisar, aprendidos: aprendidos, total: todos.length };
    }

    return { cartao: cartao, responder: responder, fila: fila, resumo: resumo, hojeNum: hojeNum };
})();

/* =========================================================
   Voz — falar, ouvir e gravar.

   Três recursos do próprio navegador:
     speechSynthesis      o app fala (modelo nativo)
     SpeechRecognition    o app ouve você (Chrome)
     MediaRecorder        grava sua voz para você se ouvir

   Tudo com degradação suave: se o aparelho não tiver um deles,
   o exercício continua funcionando de outro jeito.
   ========================================================= */
window.F = window.F || {};

/* Registro curto do que aconteceu com voz e microfone, para o painel de
   diagnóstico dos Ajustes. Sem isto, uma falha no aparelho do aluno chega
   como "não funcionou" e morre aí. */
F.diag = (function () {
    var linhas = [];
    return {
        anotar: function (texto) {
            var d = new Date();
            var h = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) +
                ':' + ('0' + d.getSeconds()).slice(-2);
            linhas.push(h + '  ' + texto);
            if (linhas.length > 30) linhas.shift();
        },
        linhas: function () { return linhas; }
    };
})();

F.voz = (function () {
    'use strict';

    var RecAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    var sintese = window.speechSynthesis || null;
    var vozes = [];
    var rec = null;
    var recAtivo = false;
    var gravador = null;
    var pedacos = [];
    var ultimoStream = null;   // uma captura esquecida aberta trava a próxima

    /* ---------------- suporte ---------------- */

    function temFala() { return !!sintese; }
    function temEscuta() { return !!RecAPI; }
    function gravadorNativo() {
        return (window.__android && window.__android.gravador) || null;
    }

    function temGravacao() {
        if (gravadorNativo()) return true;
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    }

    /* ---------------- vozes ---------------- */

    function carregarVozes() {
        if (!sintese) return [];
        vozes = (sintese.getVoices() || []).filter(function (v) { return /^en/i.test(v.lang); });
        return vozes;
    }

    if (sintese) {
        carregarVozes();
        sintese.addEventListener && sintese.addEventListener('voiceschanged', carregarVozes);
    }

    function listaVozes() {
        if (!vozes.length) carregarVozes();
        return vozes;
    }

    function melhorVoz(sotaque) {
        var lista = listaVozes();
        if (!lista.length) return null;
        var cfg = F.store.get().config;
        if (cfg.voz) {
            for (var i = 0; i < lista.length; i++) if (lista[i].name === cfg.voz) return lista[i];
        }
        var alvo = sotaque || cfg.sotaque || 'en-US';
        // preferência: voz do idioma exato, natural/online, depois qualquer inglês
        var pontos = lista.map(function (v) {
            var p = 0;
            if (v.lang.replace('_', '-') === alvo) p += 10;
            else if (v.lang.slice(0, 2) === alvo.slice(0, 2)) p += 3;
            if (/natural|neural|google|premium|enhanced|siri/i.test(v.name)) p += 4;
            if (v.localService) p += 1;
            return { v: v, p: p };
        });
        pontos.sort(function (a, b) { return b.p - a.p; });
        return pontos[0].v;
    }

    /* ---------------- falar ---------------- */

    function falar(texto, opcoes) {
        opcoes = opcoes || {};
        return new Promise(function (resolve) {
            if (!sintese) { resolve(false); return; }
            try { sintese.cancel(); } catch (e) { }
            var u = new SpeechSynthesisUtterance(String(texto));
            var v = melhorVoz(opcoes.sotaque);
            // atribuir a voz falha em implementações incomuns de WebView; a
            // fala sem voz escolhida é bem melhor do que exceção e silêncio
            try { if (v) u.voice = v; } catch (e) { v = null; }
            u.lang = (v && v.lang) || opcoes.sotaque || F.store.get().config.sotaque || 'en-US';
            u.rate = opcoes.rate || F.store.get().config.rate || 1;
            u.pitch = opcoes.pitch || 1;
            u.onend = function () { resolve(true); };
            u.onerror = function () { resolve(false); };
            // Chrome trava a fala se a aba ficou muito tempo parada: um resume preventivo
            try { sintese.resume(); } catch (e) { }
            sintese.speak(u);
        });
    }

    function pararFala() {
        if (sintese) { try { sintese.cancel(); } catch (e) { } }
    }

    /* Fala uma lista de frases em sequência, com pausa entre elas. */
    function falarSequencia(frases, opcoes, aoTrocar) {
        opcoes = opcoes || {};
        var i = 0, cancelado = false;
        function proxima() {
            if (cancelado || i >= frases.length) return Promise.resolve(!cancelado);
            var t = frases[i];
            if (aoTrocar) aoTrocar(i, t);
            return falar(t, opcoes).then(function () {
                i++;

            });

        p.cancelar = function () { cancelado = true; pararFala(); };
        return p;

    /* ---------------- ouvir ---------------- */

    function ouvir(opcoes) {

            if (!RecAPI) { reject(new Error('sem-reconhecimento')); return; }
            pararEscuta();
            rec = new RecAPI();
            rec.lang = opcoes.sotaque || F.store.get().config.sotaque || 'en-US';
            rec.continuous = !!opcoes.continuo;
            rec.interimResults = true;
            rec.maxAlternatives = 3;

            var finalTexto = '';
            var alternativas = [];

            rec.onresult = function (ev) {
                var parcial = '';

                    var r = ev.results[i];
                    if (r.isFinal) {
                        finalTexto += ' ' + r[0].transcript;
                        for (var j = 0; j < r.length; j++) alternativas.push(r[j].transcript);
                    } else {
                        parcial += r[0].transcript;
                    }

                recAtivo = false;
                F.diag.anotar('escuta: erro "' + (ev && ev.error) + '"');

                recAtivo = false;
                resolve({ texto: finalTexto.trim(), alternativas: alternativas, vazio: !finalTexto.trim() });
            };

                rec.start();
                recAtivo = true;
                if (opcoes.limite) setTimeout(function () { if (recAtivo) pararEscuta(); }, opcoes.limite);

            }
        });

            try { rec.abort && rec.abort(); } catch (e) { }

       garantir que o app tem a permissão — senão o navegador devolve um erro
       seco que não diz qual dos dois faltou. */
    function esperar(ms) {
        return new Promise(function (r) { setTimeout(r, ms || 0); });
    }

    /* Fecha qualquer captura que tenha ficado aberta nesta página. Sair de uma
       tela no meio de uma gravação deixava a faixa de áudio viva, e a próxima
       tentativa esbarrava no microfone ocupado pelo próprio app. */
    function soltarStream() {
        if (!ultimoStream) return;
        try { ultimoStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { }
        ultimoStream = null;
    }

    function prepararMicrofone() {
        soltarStream();

        var ponte = window.__android && window.__android.microfone;
        if (!ponte) return Promise.resolve();

        try { ponte.liberar(); } catch (e) { }

        if (ponte.tem()) return Promise.resolve();

        return new Promise(function (resolve, reject) {
            var respondeu = false;
            window.__ponteMicrofone = function (liberado) {
                if (respondeu) return;

                else reject(new Error('permissao-negada'));

            }, 30000);
        });
