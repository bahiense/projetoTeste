<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <meta name="description"
        content="Treino diário de inglês falado para brasileiros: pronúncia, shadowing, escuta, conversa e coragem. Seis meses do intermediário ao quase nativo.">
    <title>Fluência 180 — inglês falado para brasileiros</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
/* =========================================================
   Fluência 180 — estilo.
   Escuro por padrão: o app é usado cedo, tarde e no ônibus.
   ========================================================= */

:root {
    --bg: #0b0d12;
    --bg-soft: #141824;
    --bg-soft2: #1b2130;
    --line: #242a3a;
    --fg: #eef1f7;
    --fg-dim: #97a0b6;
    --accent: #4f8cff;
    --accent-2: #ff8a3d;
    --ok: #35c46a;
    --warn: #f2b33c;
    --bad: #ff5a52;
    --radius: 14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
}

a { color: var(--accent); text-decoration: none; }
h2, h3, h4 { margin: 0 0 6px; letter-spacing: -0.3px; line-height: 1.25; }
p { margin: 0 0 10px; }

/* ============ cabeçalho ============ */

.cabecalho {
    position: sticky;
    top: 0;
    z-index: 30;
    padding: calc(10px + var(--safe-t)) 14px 0;
    background: rgba(11, 13, 18, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
}

.marca {
    color: var(--fg);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.4px;
}
.marca b { color: var(--accent-2); }

.cabecalho { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cab-info { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.cab-chip {
    font-size: 12px;
    color: var(--fg-dim);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
}
.cab-chip b { color: var(--accent-2); }
.cab-chip--sem { color: var(--fg); }

.cab-eng {
    font-size: 18px;
    color: var(--fg-dim);
    padding: 2px 6px;
}

.cab-progresso {
    flex: 0 0 100%;
    height: 3px;
    background: var(--bg-soft);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
}
.cab-progresso i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .4s ease;
}

/* ============ estrutura ============ */

.tela {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 14px calc(96px + var(--safe-b));
}

.tela-head { margin-bottom: 14px; }
.tela-head h2 { font-size: 24px; }
.tela-head p { color: var(--fg-dim); font-size: 14px; margin: 0; }
.olho { color: var(--accent-2); font-size: 13px; font-weight: 600; margin: 0 0 2px; }

.cartao {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
}
.cartao h3 { font-size: 17px; }

.sub { color: var(--fg-dim); font-size: 14px; }
.sub--solta { margin: -6px 0 12px; }
.legenda { color: var(--fg-dim); font-size: 12.5px; margin: 8px 0 0; }
.vazio { color: var(--fg-dim); text-align: center; padding: 22px 0; }

.grade-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .grade-2 { grid-template-columns: 1fr 1fr; } }

.linha-botoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* ============ botões ============ */

.btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--bg-soft2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    text-align: center;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover { border-color: #33405c; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn--forte { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn--forte:hover { background: #6a9dff; }
.btn--grande { width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; }
.btn--perigo { color: var(--bad); border-color: #4a2320; }
.btn--som.is-falando { border-color: var(--accent); color: var(--accent); }

.btn--falar {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(180deg, #23304a, #1a2233);
    border-color: #33405c;
}
.btn--falar.is-ouvindo {
    background: linear-gradient(180deg, #4a2320, #3a1c1a);
    border-color: var(--bad);
    animation: pulsa 1.2s ease-in-out infinite;
}
@keyframes pulsa { 50% { box-shadow: 0 0 0 6px rgba(255, 90, 82, .12); } }
.btn.is-rec { border-color: var(--bad); color: var(--bad); }

.btn--op {
    flex: 1;
    min-width: 130px;
    padding: 16px 12px;
    font-size: 15px;
    line-height: 1.35;
}

.notas { display: flex; gap: 8px; margin-top: 12px; }
.btn--nota { flex: 1; flex-direction: column; gap: 2px; padding: 12px 8px; font-size: 13px; font-weight: 600; }
.btn--nota small { font-weight: 400; font-size: 11px; color: var(--fg-dim); }
.btn--nota.bad { border-color: #4a2320; }
.btn--nota.mid { border-color: #4a3c1c; }
.btn--nota.good { border-color: #1f4630; }

/* ============ navegação inferior ============ */

.nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    display: flex;
    background: rgba(11, 13, 18, .96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-b);
}
.nav-item {
    flex: 1;
    appearance: none;
    background: none;
    border: 0;
    color: var(--fg-dim);
    font: inherit;
    font-size: 11px;
    padding: 9px 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
}
.nav-item span { font-size: 17px; line-height: 1; }
.nav-item.is-on { color: var(--fg); }
.nav-item.is-on span { color: var(--accent-2); }

/* ============ pílulas e segmentado ============ */

.pilulas {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 12px;
    scrollbar-width: none;
}
.pilulas::-webkit-scrollbar { display: none; }
.pilula {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--fg-dim);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    white-space: nowrap;
}
.pilula.is-on { color: #fff; background: var(--accent); border-color: var(--accent); }
.nivel { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.nivel.n1 { background: var(--ok); }
.nivel.n2 { background: var(--warn); }
.nivel.n3 { background: var(--bad); }

.segmentado {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 12px;
}
.segmentado button {
    appearance: none;
    background: none;
    border: 0;
    color: var(--fg-dim);
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
}
.segmentado button.is-on { background: var(--bg-soft2); color: var(--fg); }

/* ============ campos ============ */

.campo { display: block; margin-bottom: 12px; }
.campo > span { display: block; font-size: 13px; color: var(--fg-dim); margin-bottom: 6px; }
.campo--linha { display: flex; align-items: center; gap: 9px; }
.campo--linha span { margin: 0; }
.campo--slider { margin: 10px 0 4px; }

.entrada, select {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    resize: vertical;
}
.entrada:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.entrada--grande { font-size: 16px; margin: 10px 0; }

input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

/* ============ anel e barras ============ */

.anel {
    --pct: 0;
    --cor: var(--accent);
    position: relative;
    width: 82px;
    height: 82px;
    flex: 0 0 82px;
    border-radius: 50%;
    background:
        conic-gradient(var(--cor) calc(var(--pct) * 1%), var(--bg-soft2) 0);
    display: grid;
    place-items: center;
}
.anel::after {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--bg-soft);
}
.anel-num { position: relative; font-size: 22px; font-weight: 700; }
.anel-num small { font-size: 11px; font-weight: 500; color: var(--fg-dim); }
.anel-rot { position: relative; font-size: 10px; color: var(--fg-dim); margin-top: -2px; }

.barra { height: 7px; background: var(--bg-soft2); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.barra i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* ============ tela hoje ============ */

.dia-topo { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.dia-topo b { font-size: 17px; display: block; }
.dia-topo small { display: block; color: var(--fg-dim); font-size: 13px; }

.blocos { display: flex; flex-direction: column; gap: 8px; }
.bloco {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 11px 13px;
    color: var(--fg);
}
.bloco-check {
    flex: 0 0 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 12px;
    color: var(--bg);
}
.bloco.is-ok { border-color: #1f4630; background: #101c17; }
.bloco.is-ok .bloco-check { background: var(--ok); border-color: var(--ok); }
.bloco-txt { flex: 1; min-width: 0; }
.bloco-txt b { display: block; font-size: 15px; }
.bloco-txt small { color: var(--fg-dim); font-size: 12.5px; line-height: 1.35; display: block; }
.bloco-min { color: var(--fg-dim); font-size: 17px; font-weight: 600; text-align: right; }
.bloco-min small { display: block; font-size: 10px; font-weight: 400; }

.feito-tudo { color: var(--ok); font-size: 14px; margin: 12px 0 0; text-align: center; }

.alvos { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.alvos dt { color: var(--fg-dim); font-size: 12.5px; padding-top: 1px; }
.alvos dd { margin: 0; }
.missao-dd { color: var(--accent-2); }

.cartao--missao { border-color: #4a3a1c; background: linear-gradient(180deg, #1a1710, var(--bg-soft)); }
.missao { font-size: 15px; color: var(--accent-2); }

.streak-linha { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 12px; }
.streak-num {
    flex: 1;
    min-width: 78px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 21px;
    font-weight: 700;
}
.streak-num small { display: block; font-size: 11px; font-weight: 400; color: var(--fg-dim); line-height: 1.3; }

.calendario { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.calendario i { width: 13px; height: 13px; border-radius: 3px; background: var(--bg-soft2); }
.calendario .cal-n1 { background: #1c3a28; }
.calendario .cal-n2 { background: #23603c; }
.calendario .cal-n3 { background: #2c8a52; }
.calendario .cal-n4 { background: var(--ok); }

/* ============ cards de exercícios ============ */

.grade-cards { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (min-width: 620px) { .grade-cards { grid-template-columns: repeat(3, 1fr); } }
.card {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    color: var(--fg);
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.card:hover { border-color: #33405c; }
.card-i { font-size: 22px; }
.card b { font-size: 15px; }
.card small { color: var(--fg-dim); font-size: 12.5px; line-height: 1.35; }

/* ============ prática falada ============ */

.pratica { margin-top: 14px; }
.pratica-status { min-height: 20px; color: var(--fg-dim); font-size: 13px; margin-top: 8px; font-style: italic; }
.pratica-res:not(:empty) { margin-top: 10px; }

.res-topo { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.res-txt b { display: block; font-size: 15px; margin-bottom: 3px; }
.res-txt small { color: var(--fg-dim); font-size: 13px; }

.diff { font-size: 17px; line-height: 2.1; }
.w { padding: 2px 5px; border-radius: 5px; }
.w--ok { background: rgba(53, 196, 106, .14); color: #a8e9c1; }
.w--troca { background: rgba(242, 179, 60, .16); color: #f3d79a; }
.w--troca em { font-style: normal; font-size: 12px; opacity: .75; display: inline-block; margin-left: 4px; }
.w--faltou { background: rgba(255, 90, 82, .16); color: #ffb3af; text-decoration: line-through; }
.w--sobrou { background: rgba(120, 130, 160, .16); color: var(--fg-dim); font-size: 14px; }

.diag { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.diag-item {
    background: var(--bg);
    border-left: 3px solid var(--warn);
    border-radius: 0 8px 8px 0;
    padding: 9px 12px;
    font-size: 14px;
}
.link { font-size: 13px; white-space: nowrap; }

.fallback .entrada { margin: 8px 0; }

.gravador { margin-top: 8px; }
.audio-linha { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.audio-linha b { font-size: 12px; color: var(--fg-dim); min-width: 42px; }
.audio-linha audio { flex: 1; min-width: 200px; height: 34px; }

/* ============ pronúncia ============ */

.ipa { color: var(--fg-dim); font-size: 14px; font-weight: 400; }
.porque, .dica, .teste { font-size: 14.5px; }
.porque b, .dica b, .teste b { color: var(--fg); }
.dica { color: #cfd6e6; }

.pares { display: flex; flex-direction: column; gap: 8px; }
.par { display: flex; align-items: center; gap: 8px; }
.par-lado {
    flex: 1;
    appearance: none;
    font: inherit;
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--fg);
    cursor: pointer;
}
.par-lado b { display: block; font-size: 16px; }
.par-lado small { color: var(--fg-dim); font-size: 12px; }
.par-x { color: var(--fg-dim); font-size: 12px; }

.frase-alvo {
    font-size: 21px;
    line-height: 1.45;
    margin: 12px 0 6px;
    font-weight: 500;
}

.teste { margin-top: 12px; }
.teste-info { color: var(--fg-dim); font-size: 13px; margin: 0 0 8px; }
.teste-op { display: flex; gap: 8px; margin-bottom: 10px; }
.teste-fb { min-height: 24px; margin-top: 8px; }
.fb { font-size: 14px; }
.fb--ok { color: var(--ok); }
.fb--erro { color: var(--bad); }
.teste-fim { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.teste-fim .anel { margin-bottom: 4px; }

/* ============ shadowing ============ */

.sh-controles { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
@media (min-width: 620px) { .sh-controles { flex-direction: row; align-items: center; gap: 18px; } .sh-controles .campo--slider { flex: 1; } }

.linhas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.linha {
    background: var(--bg);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
}
.linha.is-on { border-left-color: var(--accent); background: #131b2b; }
.linha b { color: var(--accent-2); font-weight: 700; }
.linha .soa { color: #b9c8e6; font-style: normal; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }
.linha .pt { color: var(--fg-dim); font-style: italic; }
.linha-nota { display: block; font-size: 12.5px; color: var(--warn); margin-top: 5px; }

/* ============ escuta ============ */

.dt-topo { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); margin-bottom: 10px; }
.soa-caixa {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    margin-top: 12px;
    font-size: 15px;
}
.soa-caixa i { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9c8e6; font-style: normal; }
.nota-explica { font-size: 13.5px; color: var(--warn); margin-top: 8px; }

/* ============ chunks ============ */

.srs-resumo { display: flex; gap: 8px; margin-bottom: 14px; }
.srs-resumo div { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 6px; text-align: center; }
.srs-resumo b { font-size: 19px; }
.srs-resumo small { display: block; font-size: 10.5px; color: var(--fg-dim); }

.carta { text-align: center; padding: 6px 0; }
.carta-topo { font-size: 12px; color: var(--fg-dim); margin-bottom: 14px; }
.carta-pt { font-size: 20px; font-weight: 500; margin: 8px 0; }
.carta-instrucao { font-size: 13px; color: var(--fg-dim); }
.carta-en { font-size: 24px; font-weight: 600; color: var(--accent-2); margin: 14px 0 6px; line-height: 1.35; }
.carta-nota { font-size: 13px; color: var(--warn); }
.carta-pergunta { font-size: 13.5px; color: var(--fg-dim); margin-top: 16px; }
.carta .linha-botoes { justify-content: center; }
.tag { background: var(--bg-soft2); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
.tag--agora { background: var(--accent); color: #fff; margin-left: auto; }

.lista-chunks { list-style: none; margin: 0 0 8px; padding: 0; }
.lista-chunks li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lista-chunks span { flex: 1; }
.lista-chunks b { font-size: 15px; display: block; }
.lista-chunks small { color: var(--fg-dim); font-size: 13px; }
.lista-chunks em { display: block; font-size: 12.5px; color: var(--warn); font-style: normal; margin-top: 2px; }
.chunk-som { appearance: none; background: none; border: 0; color: var(--accent); font-size: 15px; cursor: pointer; padding: 0 2px; }
.selo { font-style: normal; font-size: 11px; color: var(--fg-dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; height: fit-content; }

.grupo { margin-bottom: 20px; }
.grupo h4 { font-size: 15px; color: var(--accent-2); }

/* ============ drills ============ */

.modelo { font-size: 13.5px; color: var(--fg-dim); }
.modelo i { color: #cfd6e6; font-style: normal; }
.dr-topo { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); margin: 10px 0; }
.dr-estimulo {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    padding: 22px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    line-height: 1.4;
}
.dr-relogio { height: 5px; background: var(--bg-soft2); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.dr-relogio i { display: block; height: 100%; width: 0; background: var(--accent-2); }

.fala-pt { color: var(--fg-dim); font-style: italic; font-size: 14px; }
.dica-turno { font-size: 13.5px; color: var(--warn); }
.modelo-caixa { background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 10px; }
.modelo-caixa b { font-size: 12px; color: var(--fg-dim); }
.modelo-caixa p { font-size: 16px; margin: 6px 0 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    font-size: 12.5px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px;
    color: var(--fg-dim);
}
.chip.is-ok { border-color: var(--ok); color: #a8e9c1; background: rgba(53, 196, 106, .1); }
.chip--alerta { border-color: #4a3c1c; color: var(--warn); }

.transcricao { margin: 12px 0; font-size: 14px; }
.transcricao summary { cursor: pointer; color: var(--fg-dim); }
.transcricao ul { padding-left: 18px; }
.transcricao li { margin-bottom: 5px; }

/* ============ arena ============ */

.cartao--arena { text-align: center; border-color: #4a2f1c; }
.arena-prompt { min-height: 70px; }
.arena-en { font-size: 21px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.arena-pt { font-size: 14px; color: var(--fg-dim); }
.arena-relogio {
    font-size: 46px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;

    margin: 10px 0;

}
.cartao--arena .linha-botoes { justify-content: center; }
.arena-vivo:not(:empty) {

    border-radius: 10px;
    padding: 12px;
    text-align: left;
}
.vivo-txt { font-size: 14px; color: #b9c8e6; margin: 0; min-height: 40px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

.degrau {
    display: flex;
    gap: 12px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px;

}
.degrau-n {
    flex: 0 0 30px;

    border-radius: 50%;
    background: var(--bg-soft2);

.degrau.is-ok { border-color: #1f4630; }
.degrau.is-ok .degrau-n { background: var(--ok); color: #08160e; }

.degrau-corpo { flex: 1; min-width: 0; }

.degrau-missao { font-size: 14px; margin: 4px 0 6px; }
.degrau-acoes { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; flex-wrap: wrap; }
.degrau-contador { font-size: 12px; color: var(--fg-dim); }
.degrau-debrief { font-size: 12.5px; color: var(--fg-dim); margin: 0; }

.op-duplo { display: flex; flex-direction: column; gap: 8px; }

.erro-caixa { background: var(--bg); border-radius: 10px; padding: 12px; margin: 10px 0; }
.erro-caixa p { margin: 0 0 5px; }
.errado { color: #ffb3af; text-decoration: line-through; font-size: 15px; }
.certo { color: #a8e9c1; font-size: 16px; }
.erro-caixa .porque { color: var(--fg-dim); font-size: 13.5px; margin-top: 6px; }

.fase { margin-bottom: 22px; }

.fase-head h3 { font-size: 17px; color: var(--accent-2); }
.fase-sem { font-size: 12px; color: var(--fg-dim); }

.di-item--coragem { border-left: 3px solid var(--accent-2); }

/* ============ abertura ============ */

.abertura { padding-top: 10px; }

.abertura-titulo span { color: var(--accent-2); }
.abertura-sub { font-size: 16px; color: var(--fg-dim); line-height: 1.5; margin-bottom: 18px; }
.lista-check { list-style: none; margin: 0; padding: 0; }
.lista-check li { padding: 7px 0 7px 24px; position: relative; font-size: 14.5px; }
.lista-check li::before { content: '✓'; position: absolute; left: 0; color: var(--ok); }
.cartao--pacto { border-color: #4a3a1c; }
.pacto-linha { display: flex; align-items: flex-start; gap: 10px; font-size: 14.5px; margin-bottom: 10px; cursor: pointer; }
.rodape-nota { font-size: 12px; color: var(--fg-dim); text-align: center; }

.lista-status { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.lista-status li { padding: 4px 0; }
.lista-status .ok { color: var(--ok); }
.lista-status .nao { color: var(--bad); }

.texto-longo h3 { margin-top: 18px; font-size: 16px; color: var(--accent-2); }
.texto-longo h3:first-child { margin-top: 0; }
.texto-longo p { font-size: 15px; line-height: 1.6; color: #cfd6e6; }

.aviso { background: #1a1710; border: 1px solid #4a3a1c; border-radius: 10px; padding: 11px 13px; font-size: 14px; margin-bottom: 12px; }

/* ============ toast ============ */

.toast {
    position: fixed;
    left: 50%;
    bottom: calc(78px + var(--safe-b));
    transform: translate(-50%, 16px);
    background: #232b3d;
    border: 1px solid var(--line);
    color: var(--fg);
    font-size: 14px;
    padding: 11px 16px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 60;
    max-width: 90vw;
    text-align: center;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.toast--erro { border-color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}

    <script>
/* =========================================================
   Ponte com o app Android.

   O WebView não implementa a Web Speech API: dentro dele
   window.speechSynthesis e SpeechRecognition não existem, e sem
   os dois este app vira só a versão escrita.

   Quando o app nativo está presente (window.AndroidVoz), este
   arquivo repõe as duas APIs com a mesma forma que o navegador
   expõe, para que js/voz.js — e todo o resto — não precise saber
   onde está rodando. No navegador comum, ele não faz nada.

   Precisa vir ANTES de js/voz.js: aquele arquivo lê as duas APIs
   uma única vez, na hora em que carrega.
   ========================================================= */
(function () {
    'use strict';

    var ponte = window.AndroidVoz;
    if (!ponte) return;

    function definir(nome, valor) {
        // speechSynthesis é acessor somente-leitura em alguns WebViews:
        // atribuir direto falha em silêncio, defineProperty não.
        try {
            Object.defineProperty(window, nome, { value: valor, configurable: true, writable: true });
        } catch (e) {
            try { window[nome] = valor; } catch (e2) { }
        }
    }

    /* ---------------- falar ---------------- */

    var VOZES = [
        { name: 'Voz do Android — americano', lang: 'en-US', localService: true, default: true },
        { name: 'Voz do Android — britânico', lang: 'en-GB', localService: true, default: false },
        { name: 'Voz do Android — australiano', lang: 'en-AU', localService: true, default: false },
        { name: 'Voz do Android — indiano', lang: 'en-IN', localService: true, default: false }
    ];

    var falando = null;

    /* Encerra a fala atual uma única vez, venha o aviso do Android
       (terminou) ou daqui (foi cancelada). */
    function terminarFala(ok) {
        var u = falando;
        falando = null;
        if (!u) return;
        if (ok === false && u.onerror) u.onerror({ error: 'interrupted' });
        else if (u.onend) u.onend({});
    }

    window.__ponteFalaFim = function (ok) { terminarFala(ok !== false); };

    function Enunciado(texto) {
        this.text = texto === undefined ? '' : String(texto);
        this.lang = 'en-US';
        this.rate = 1;
        this.pitch = 1;
        this.volume = 1;
        this.voice = null;
        this.onend = null;
        this.onerror = null;
        this.onstart = null;
    }

    definir('SpeechSynthesisUtterance', Enunciado);

    definir('speechSynthesis', {
        speaking: false,
        pending: false,
        paused: false,
        speak: function (u) {
            terminarFala(true);          // o Android descarta a fala anterior
            falando = u;
            if (u.onstart) u.onstart({});
            ponte.falar(String(u.text || ''), u.rate || 1, u.lang || 'en-US');
        },
        cancel: function () {
            ponte.pararFala();
            terminarFala(true);          // TextToSpeech.stop() não avisa quem foi interrompido
        },
        pause: function () { },
        resume: function () { },
        getVoices: function () { return VOZES; },
        addEventListener: function () { },
        removeEventListener: function () { }
    });

    /* ---------------- ouvir ---------------- */

    var atual = null;

    /* Monta o evento no formato do navegador: results[i][j].transcript,
       com isFinal no resultado. É o que js/voz.js sabe ler. */
    function eventoDeFala(alternativas, isFinal) {
        var res = alternativas.map(function (t) {
            return { transcript: t, confidence: 0.9 };
        });
        res.isFinal = isFinal;
        var lista = [res];
        return { resultIndex: 0, results: lista };
    }

    window.__ponteEscuta = {
        parcial: function (texto) {
            if (atual && atual.onresult && atual.interimResults) {
                atual.onresult(eventoDeFala([texto], false));
            }
        },
        resultado: function (alternativas) {
            if (!atual || !atual.onresult) return;
            if (!alternativas || !alternativas.length) return;
            atual.onresult(eventoDeFala(alternativas, true));
        },
        erro: function (nome) {
            var r = atual;
            if (!r) return;
            atual = null;
            if (r.onerror) r.onerror({ error: nome });
            // no navegador, onend vem sempre depois de onerror
            if (r.onend) r.onend({});
        },
        fim: function () {
            var r = atual;
            if (!r) return;
            atual = null;
            if (r.onend) r.onend({});
        }
    };

    function Reconhecimento() {
        this.lang = 'en-US';
        this.continuous = false;
        this.interimResults = true;
        this.maxAlternatives = 3;
        this.onresult = null;
        this.onerror = null;
        this.onend = null;
    }

    Reconhecimento.prototype.start = function () {
        atual = this;
        ponte.ouvir(this.lang || 'en-US');
    };

    Reconhecimento.prototype.stop = function () {
        ponte.pararEscuta();
    };

    Reconhecimento.prototype.abort = function () {
        ponte.pararEscuta();
    };

    if (ponte.temEscuta && ponte.temEscuta()) {
        definir('SpeechRecognition', Reconhecimento);
        definir('webkitSpeechRecognition', Reconhecimento);
    }

    /* Marca o ambiente, para a tela de ajustes explicar o que é o quê. */
    window.__android = {
        versao: (ponte.versao && ponte.versao()) || '?',
        escuta: !!(ponte.temEscuta && ponte.temEscuta())
    };
})();

</script>

    function clone(o) { return JSON.parse(JSON.stringify(o)); }

            var p = clone(PADRAO);

            for (var c in p.config) if (!(c in s.config)) s.config[c] = p.config[c];
            for (var h in p.historico) if (!(h in s.historico)) s.historico[h] = p.historico[h];

        s.criado = hoje();

        try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* cota cheia */ }
    }

        var d = new Date();

    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function diasEntre(a, b) {

    }

    function registrarMinutos(min) {

        salvar();
    }

    function tocarStreak() {
        var d = hoje();
        var s = estado.streak;
        if (s.ultimo === d) return;

        else {
            var dif = diasEntre(s.ultimo, d);
            s.atual = dif === 1 ? s.atual + 1 : (dif === 0 ? s.atual : 1);

    function minutosTotais() {
        var t = 0;
        for (var k in estado.minutos) t += estado.minutos[k];

    function diasEstudados() { return Object.keys(estado.minutos).length; }

    /* ---------------- blocos do ciclo diário ---------------- */

    function blocosHoje() { return estado.blocos[hoje()] || []; }

    function concluirBloco(id) {
        var d = hoje();
        if (!estado.blocos[d]) estado.blocos[d] = [];
        if (estado.blocos[d].indexOf(id) < 0) estado.blocos[d].push(id);

    function blocoFeito(id) { return blocosHoje().indexOf(id) >= 0; }

    /* ---------------- desempenho ---------------- */

    function registrar(serie, pct, extra) {
        var h = estado.historico[serie];
        if (!h) h = estado.historico[serie] = [];

        if (h.length > 600) h.shift();

    }

    function media(serie, ultimos) {
        var h = estado.historico[serie] || [];
        var arr = ultimos ? h.slice(-ultimos) : h;
        if (!arr.length) return null;
        var t = 0;
        for (var i = 0; i < arr.length; i++) t += arr[i].p;

    }

    /* Nota geral de fluência: 0 a 100, a partir do que existe de dado. */
    function notaFluencia() {
        var partes = [];
        var pr = media('pronuncia', 30); if (pr !== null) partes.push(pr);
        var di = media('ditado', 30); if (di !== null) partes.push(di);
        var dr = media('drill', 30); if (dr !== null) partes.push(dr);
        var fa = media('fala', 30); if (fa !== null) partes.push(fa);
        // constância vale um quarto da nota: fluência é frequência
        var const_ = Math.min(100, (estado.streak.atual / 30) * 100);
        var vol = Math.min(100, (minutosTotais() / (45 * 100)) * 100);
        if (!partes.length) return Math.round((const_ + vol) / 4);
        var m = partes.reduce(function (a, b) { return a + b; }, 0) / partes.length;

    }

    /* ---------------- diário ---------------- */

    function anotar(entrada) {
        entrada.data = hoje();
        entrada.ts = Date.now();
        estado.diario.unshift(entrada);
        if (estado.diario.length > 400) estado.diario.pop();
        salvar();
    }

    /* ---------------- exportar / importar ---------------- */

    function exportar() {
        return JSON.stringify(estado, null, 2);
    }

    function importar(texto) {
        var s = JSON.parse(texto);
        if (!s || typeof s !== 'object' || !('streak' in s)) throw new Error('arquivo não é um backup do app');
        estado = s;
        salvar();
        return true;
    }

    function zerar() {
        estado = novo();
        salvar();
    }

    return {
        get: function () { return estado; },
        salvar: salvar,
        hoje: hoje,
        diasEntre: diasEntre,
        registrarMinutos: registrarMinutos,
        minutosHoje: minutosHoje,
        minutosTotais: minutosTotais,
        diasEstudados: diasEstudados,
        tocarStreak: tocarStreak,
        blocosHoje: blocosHoje,
        blocoFeito: blocoFeito,
        concluirBloco: concluirBloco,
        registrar: registrar,
        media: media,
        notaFluencia: notaFluencia,
        anotar: anotar,
        exportar: exportar,
        importar: importar,
        zerar: zerar
    };
})();

   Serve para três coisas: nota do ditado, nota da pronúncia
   (comparando com o que o reconhecimento de voz entendeu) e
   diagnóstico do erro típico de brasileiro por trás da palavra

   ========================================================= */
window.F = window.F || {};

F.texto = (function () {
    'use strict';

    var CONTRACOES = {
        "i'm": 'i am', "im": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are',
        "he's": 'he is', "she's": 'she is', "it's": 'it is', "that's": 'that is', "there's": 'there is',
        "what's": 'what is', "who's": 'who is', "let's": 'let us', "here's": 'here is',
        "don't": 'do not', "doesn't": 'does not', "didn't": 'did not', "isn't": 'is not',
        "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not', "can't": 'can not',
        "cannot": 'can not', "couldn't": 'could not', "won't": 'will not', "wouldn't": 'would not',
        "shouldn't": 'should not', "haven't": 'have not', "hasn't": 'has not', "hadn't": 'had not',
        "i've": 'i have', "you've": 'you have', "we've": 'we have', "they've": 'they have',
        "i'd": 'i would', "you'd": 'you would', "he'd": 'he would', "she'd": 'she would',
        "we'd": 'we would', "they'd": 'they would',
        "i'll": 'i will', "you'll": 'you will', "he'll": 'he will', "she'll": 'she will',
        "we'll": 'we will', "they'll": 'they will', "it'll": 'it will',
        "gonna": 'going to', "wanna": 'want to', "gotta": 'got to', "kinda": 'kind of',
        "hafta": 'have to', "lemme": 'let me', "gimme": 'give me', "cause": 'because',
        "ok": 'okay', "alright": 'all right'
    };

    function normalizar(s) {
        if (!s) return '';
        s = String(s).toLowerCase();
        s = s.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
        s = s.replace(/[^a-z0-9'\s-]/g, ' ');
        s = s.replace(/\s+/g, ' ').trim();
        var saida = [];
        var partes = s.split(' ');
        for (var i = 0; i < partes.length; i++) {
            var p = partes[i].replace(/^-+|-+$/g, '');
            if (!p) continue;
            if (CONTRACOES[p]) saida = saida.concat(CONTRACOES[p].split(' '));
            else saida.push(p.replace(/'/g, ''));

    function palavras(s) {
        var n = normalizar(s);

        var m = a.length, n = b.length;
        var d = [], i, j;
        for (i = 0; i <= m; i++) { d[i] = [i]; }
        for (j = 0; j <= n; j++) { d[0][j] = j; }
        for (i = 1; i <= m; i++) {
            for (j = 1; j <= n; j++) {
                var custo = a[i - 1] === b[j - 1] ? 0 : 1;
                d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + custo);
            }

        var ops = [];
        i = m; j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
                ops.unshift(a[i - 1] === b[j - 1]
                    ? { op: 'ok', ref: a[i - 1], hip: b[j - 1] }
                    : { op: 'troca', ref: a[i - 1], hip: b[j - 1] });
                i--; j--;
            } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) {
                ops.unshift({ op: 'faltou', ref: a[i - 1], hip: '' });
                i--;

                ops.unshift({ op: 'sobrou', ref: '', hip: b[j - 1] });

        var sobras = r.ops.filter(function (o) { return o.op === 'sobrou'; }).length;

       Diagnóstico: por que essa palavra saiu errada?
       Heurística baseada nos erros clássicos do falante de
       português. Não é fonética de laboratório — é o palpite
       que um professor daria olhando o par (esperado, ouvido).
       --------------------------------------------------------- */
    var REGRAS = [
        {
            id: 'th-surdo',
            teste: function (r, h) { return /th/.test(r) && /^[stf]/.test(h) && r[0] === 't'; },
            dica: 'O TH virou S/T/F. Ponha a ponta da língua entre os dentes e sopre.'
        },
        {
            id: 'th-sonoro',
            teste: function (r, h) { return /^th/.test(r) && /^[dz]/.test(h); },
            dica: 'O TH sonoro virou D ou Z. Língua entre os dentes, com a voz ligada.'
        },
        {
            id: 'epentese',
            teste: function (r, h) { return h.length > r.length && h.indexOf(r) === 0 && /[ie]$/.test(h); },
            dica: 'Você colou uma vogal no fim da palavra. Termine na consoante e pare.'
        },
        {
            id: 'cluster-s',
            teste: function (r, h) { return /^s[ptkclmnw]/.test(r) && /^e?s/.test(h) && h.length > r.length; },
            dica: 'Entrou um "e" antes do S. Comece pelo próprio S, segurando o som.'
        },
        {
            id: 'i-longo-curto',
            teste: function (r, h) {
                return r !== h && r.replace(/ee|ea|i/g, 'I') === h.replace(/ee|ea|i/g, 'I');
            },
            dica: 'Confusão entre /ɪ/ curto e /iː/ longo (ship × sheep). São vogais diferentes, não a mesma mais rápida.'
        },
        {
            id: 'h-r',
            teste: function (r, h) { return (/^h/.test(r) && /^r/.test(h)) || (/^r/.test(r) && /^h/.test(h)); },
            dica: 'H e R trocados. O H é só ar soprado; o R americano não vibra nunca.'
        },
        {
            id: 'v-w',
            teste: function (r, h) { return (/^v/.test(r) && /^w/.test(h)) || (/^w/.test(r) && /^v/.test(h)); },
            dica: 'V e W trocados. V morde o lábio; W faz bico, sem tocar nos dentes.'
        },
        {
            id: 'ed',
            teste: function (r, h) { return /ed$/.test(r) && (h === r.replace(/ed$/, '') || h === r.replace(/ed$/, 'id')); },
            dica: 'O -ed saiu errado. Só depois de T ou D ele vira sílaba nova.'
        },
        {
            id: 's-final',
            teste: function (r, h) { return /s$/.test(r) && h === r.replace(/s$/, ''); },
            dica: 'Você comeu o -s final. Ele carrega plural, terceira pessoa ou posse.'
        },
        {
            id: 'l-final',
            teste: function (r, h) { return /l$/.test(r) && /[uw]$/.test(h); },
            dica: 'O L final virou U. A ponta da língua tem que encostar atrás dos dentes de cima.'
        }

    function diagnosticar(ref, hip) {
        if (!ref || !hip || ref === hip) return null;
        for (var i = 0; i < REGRAS.length; i++) {
            try { if (REGRAS[i].teste(ref, hip)) return REGRAS[i]; } catch (e) { }
        }
        return null;
    }

    /* Junta os diagnósticos de uma frase inteira, do mais frequente
       para o menos frequente. */
    function diagnosticoDaFrase(resultado) {
        var contagem = {}, dicas = {};
        for (var i = 0; i < resultado.ops.length; i++) {
            var o = resultado.ops[i];
            if (o.op !== 'troca') continue;
            var d = diagnosticar(o.ref, o.hip);
            if (!d) continue;
            contagem[d.id] = (contagem[d.id] || 0) + 1;
            dicas[d.id] = d.dica;
        }
        return Object.keys(contagem)
            .sort(function (a, b) { return contagem[b] - contagem[a]; })
            .map(function (id) { return { id: id, n: contagem[id], dica: dicas[id] }; });
    }

    /* Conta sílabas aproximadamente — usado para mostrar ao aluno
       quantas sílabas a frase deveria ter (contra a vogal fantasma). */
    function silabas(frase) {
        var ps = palavras(frase), total = 0;
        for (var i = 0; i < ps.length; i++) {
            var p = ps[i].replace(/e$/, '');
            var g = p.match(/[aeiouy]+/g);
            total += g ? g.length : 1;
        }
        return total;
    }

    return {
        normalizar: normalizar,
        palavras: palavras,
        alinhar: alinhar,
        pontuar: pontuar,
        diagnosticar: diagnosticar,
        diagnosticoDaFrase: diagnosticoDaFrase,
        silabas: silabas
    };
})();

    <script>
/* =========================================================
   Repetição espaçada (SM-2 enxuto).

   O chunk volta a aparecer pouco antes de você esquecer.
   Errou, volta amanhã; acertou fácil, some por semanas.
   ========================================================= */
window.F = window.F || {};

F.srs = (function () {
    'use strict';

    function hojeNum() { return Math.floor(Date.now() / 86400000); }

    function cartao(id) {
        var e = F.store.get().srs;
        return e[id] || { ef: 2.5, int: 0, rep: 0, due: 0, erros: 0, acertos: 0 };
    }

    /* nota: 0 = errei, 1 = difícil, 2 = fácil */
    function responder(id, nota) {
        var s = F.store.get();
        var c = cartao(id);
        var q = nota === 0 ? 2 : (nota === 1 ? 4 : 5);

        if (q < 3) {
            c.rep = 0;
            c.int = 1;
            c.erros++;
        } else {
            c.rep++;
            c.acertos++;
            if (c.rep === 1) c.int = 1;
            else if (c.rep === 2) c.int = 6;
            else c.int = Math.round(c.int * c.ef);
            c.ef = c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
            if (c.ef < 1.3) c.ef = 1.3;
        }
        c.due = hojeNum() + c.int;
        s.srs[id] = c;
        F.store.salvar();
        return c;
    }

    /* Fila do dia: atrasados primeiro, depois novos. */
    function fila(todos, limite) {
        limite = limite || 20;
        var s = F.store.get().srs;
        var h = hojeNum();
        var vencidos = [], novos = [];
        for (var i = 0; i < todos.length; i++) {
            var id = todos[i].id;
            var c = s[id];
            if (!c) novos.push(todos[i]);
            else if (c.due <= h) vencidos.push(todos[i]);
        }
        vencidos.sort(function (a, b) { return (s[a.id].due || 0) - (s[b.id].due || 0); });
        return vencidos.concat(novos).slice(0, limite);
    }

    function resumo(todos) {
        var s = F.store.get().srs, h = hojeNum();
        var novos = 0, revisar = 0, aprendidos = 0;
        for (var i = 0; i < todos.length; i++) {
            var c = s[todos[i].id];
            if (!c) novos++;
            else if (c.due <= h) revisar++;
            else if (c.int >= 21) aprendidos++;
        }
        return { novos: novos, revisar: revisar, aprendidos: aprendidos, total: todos.length };
    }

    return { cartao: cartao, responder: responder, fila: fila, resumo: resumo, hojeNum: hojeNum };
})();

   Voz — falar, ouvir e gravar.

   Três recursos do próprio navegador:
     speechSynthesis      o app fala (modelo nativo)
     SpeechRecognition    o app ouve você (Chrome)

   Tudo com degradação suave: se o aparelho não tiver um deles,

   ========================================================= */

    var RecAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    var sintese = window.speechSynthesis || null;
    var vozes = [];
    var rec = null;
    var recAtivo = false;
    var gravador = null;
    var pedacos = [];

    /* ---------------- suporte ---------------- */

    function temFala() { return !!sintese; }
    function temEscuta() { return !!RecAPI; }
    function temGravacao() {
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    }

    /* ---------------- vozes ---------------- */

    function carregarVozes() {
        if (!sintese) return [];
        vozes = (sintese.getVoices() || []).filter(function (v) { return /^en/i.test(v.lang); });

        carregarVozes();
        sintese.addEventListener && sintese.addEventListener('voiceschanged', carregarVozes);
    }

    function listaVozes() {
        if (!vozes.length) carregarVozes();
        return vozes;
    }

        if (!lista.length) return null;
        var cfg = F.store.get().config;

            for (var i = 0; i < lista.length; i++) if (lista[i].name === cfg.voz) return lista[i];

            else if (v.lang.slice(0, 2) === alvo.slice(0, 2)) p += 3;
            if (/natural|neural|google|premium|enhanced|siri/i.test(v.name)) p += 4;

        opcoes = opcoes || {};

            try { sintese.cancel(); } catch (e) { }

            if (v) { u.voice = v; u.lang = v.lang; }
            else u.lang = opcoes.sotaque || F.store.get().config.sotaque || 'en-US';
            u.rate = opcoes.rate || F.store.get().config.rate || 1;
            u.pitch = opcoes.pitch || 1;
            u.onend = function () { resolve(true); };
            u.onerror = function () { resolve(false); };

            try { sintese.resume(); } catch (e) { }

    function pararFala() {
        if (sintese) { try { sintese.cancel(); } catch (e) { } }
    }

    /* Fala uma lista de frases em sequência, com pausa entre elas. */
    function falarSequencia(frases, opcoes, aoTrocar) {
        opcoes = opcoes || {};
        var i = 0, cancelado = false;
        function proxima() {
            if (cancelado || i >= frases.length) return Promise.resolve(!cancelado);
            var t = frases[i];

            return falar(t, opcoes).then(function () {
                i++;

        p.cancelar = function () { cancelado = true; pararFala(); };

            rec.lang = opcoes.sotaque || F.store.get().config.sotaque || 'en-US';

                        for (var j = 0; j < r.length; j++) alternativas.push(r[j].transcript);
                    } else {
                        parcial += r[0].transcript;
                    }
                }
                if (opcoes.onParcial) opcoes.onParcial((finalTexto + ' ' + parcial).trim());
            };
            rec.onerror = function (ev) {
                recAtivo = false;
                if (ev.error === 'no-speech') { resolve({ texto: finalTexto.trim(), alternativas: alternativas, vazio: true }); return; }
                reject(new Error(ev.error || 'erro-reconhecimento'));
            };
            rec.onend = function () {
                recAtivo = false;
                resolve({ texto: finalTexto.trim(), alternativas: alternativas, vazio: !finalTexto.trim() });
            };
            try {
                rec.start();
                recAtivo = true;
                if (opcoes.limite) setTimeout(function () { if (recAtivo) pararEscuta(); }, opcoes.limite);
            } catch (e) {
                reject(e);
            }
        });
    }

    function pararEscuta() {
        if (rec) {
            try { rec.stop(); } catch (e) { }
            try { rec.abort && rec.abort(); } catch (e) { }
        }
        recAtivo = false;
    }

    function escutando() { return recAtivo; }

    /* ---------------- gravar ---------------- */

    function comecarGravacao() {
        if (!temGravacao()) return Promise.reject(new Error('sem-gravacao'));
        return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            pedacos = [];
            var tipos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', ''];
            var mime = '';
            for (var i = 0; i < tipos.length; i++) {
                if (!tipos[i] || (window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(tipos[i]))) { mime = tipos[i]; break; }
            }
            gravador = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
            gravador.ondataavailable = function (e) { if (e.data && e.data.size) pedacos.push(e.data); };
            gravador.start();
            return true;
        });
    }

    function pararGravacao() {
        return new Promise(function (resolve) {
            if (!gravador || gravador.state === 'inactive') { resolve(null); return; }
            gravador.onstop = function () {
                var blob = new Blob(pedacos, { type: gravador.mimeType || 'audio/webm' });
                try {
                    gravador.stream.getTracks().forEach(function (t) { t.stop(); });
                } catch (e) { }
                gravador = null;
                resolve(URL.createObjectURL(blob));
            };
            try { gravador.stop(); } catch (e) { resolve(null); }
        });
    }

    function gravando() { return !!gravador && gravador.state === 'recording'; }

    return {
        temFala: temFala,
        temEscuta: temEscuta,
        temGravacao: temGravacao,
        listaVozes: listaVozes,
        falar: falar,
        pararFala: pararFala,
        falarSequencia: falarSequencia,
        ouvir: ouvir,
        pararEscuta: pararEscuta,
        escutando: escutando,
        comecarGravacao: comecarGravacao,
        pararGravacao: pararGravacao,
        gravando: gravando
    };
})();

/* =========================================================
   Peças de interface reaproveitadas por todas as telas.
   ========================================================= */
window.F = window.F || {};

F.ui = (function () {
    'use strict';

    function $(id) { return document.getElementById(id); }
    function q(sel, raiz) { return (raiz || document).querySelector(sel); }
    function qq(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    var toastTimer = null;
    function toast(msg, tipo) {
        var el = $('toast');
        if (!el) return;
        el.textContent = msg;
        el.className = 'toast is-on' + (tipo ? ' toast--' + tipo : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.className = 'toast'; }, 2600);
    }

    /* Anel de nota, 0 a 100. */
    /* cor: sem argumento, semáforo de desempenho; 'neutro' para barra de
       progresso, onde estar no começo não é um problema a sinalizar. */
    function anel(pct, rotulo, cor) {
        pct = Math.max(0, Math.min(100, Math.round(pct || 0)));
        if (cor === 'neutro') cor = 'var(--accent)';
        else if (!cor) cor = pct >= 85 ? 'var(--ok)' : pct >= 60 ? 'var(--warn)' : 'var(--bad)';
        return '<div class="anel" style="--pct:' + pct + ';--cor:' + cor + '">' +
            '<div class="anel-num">' + pct + '<small>%</small></div>' +
            (rotulo ? '<div class="anel-rot">' + esc(rotulo) + '</div>' : '') +
            '</div>';
    }

    function barra(pct, cor) {
        pct = Math.max(0, Math.min(100, Math.round(pct || 0)));
        return '<div class="barra"><i style="width:' + pct + '%' + (cor ? ';background:' + cor : '') + '"></i></div>';
    }

    /* Mostra o diff entre o esperado e o que foi ouvido. */
    function diff(resultado) {
        var out = resultado.ops.map(function (o) {
            if (o.op === 'ok') return '<span class="w w--ok">' + esc(o.ref) + '</span>';
            if (o.op === 'troca') return '<span class="w w--troca" title="ouvi: ' + esc(o.hip) + '">' + esc(o.ref) +
                '<em>' + esc(o.hip) + '</em></span>';
            if (o.op === 'faltou') return '<span class="w w--faltou">' + esc(o.ref) + '</span>';
            return '<span class="w w--sobrou">' + esc(o.hip) + '</span>';
        }).join(' ');
        return '<div class="diff">' + out + '</div>';
    }

    function legendaDiff() {
        return '<p class="legenda">' +
            '<span class="w w--ok">certo</span> ' +
            '<span class="w w--troca">saiu diferente</span> ' +
            '<span class="w w--faltou">não saiu</span> ' +
            '<span class="w w--sobrou">sobrou</span></p>';
    }

    function dicasDiagnostico(lista) {
        if (!lista || !lista.length) return '';
        return '<div class="diag">' + lista.map(function (d) {
            return '<div class="diag-item"><b>' + d.n + '×</b> ' + esc(d.dica) +
                ' <a href="#/pronuncia/' + d.id + '" class="link">treinar isso</a></div>';
        }).join('') + '</div>';
    }

    /* Cronômetro regressivo simples; devolve um objeto com parar(). */
    function contagem(segundos, elemento, aoFim) {
        var restante = segundos;
        function pinta() {
            var m = Math.floor(restante / 60), s = restante % 60;
            if (elemento) elemento.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }
        pinta();
        var t = setInterval(function () {
            restante--;
            pinta();
            if (restante <= 0) {
                clearInterval(t);
                if (aoFim) aoFim();
            }
        }, 1000);
        return {
            parar: function () { clearInterval(t); return segundos - restante; },
            decorrido: function () { return segundos - restante; }
        };
    }

    /* Cronômetro progressivo. */
    function relogio(elemento, aoTique) {
        var seg = 0;
        var t = setInterval(function () {
            seg++;
            if (elemento) {
                var m = Math.floor(seg / 60), s = seg % 60;
                elemento.textContent = m + ':' + (s < 10 ? '0' : '') + s;
            }
            if (aoTique) aoTique(seg);
        }, 1000);
        return { parar: function () { clearInterval(t); return seg; }, seg: function () { return seg; } };
    }

    function embaralhar(a) {
        var arr = a.slice();
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
    }

    function sorteio(a) { return a[Math.floor(Math.random() * a.length)]; }

    /* Botão de áudio padrão, usado em todas as telas. */
    function botaoOuvir(texto, rotulo, extra) {
        return '<button class="btn btn--som" data-falar="' + esc(texto) + '"' +
            (extra || '') + '>🔊 ' + esc(rotulo || 'Ouvir') + '</button>';
    }

    function cabecalho(titulo, sub, extra) {
        return '<header class="tela-head">' +
            '<h2>' + esc(titulo) + '</h2>' +
            (sub ? '<p>' + esc(sub) + '</p>' : '') +
            (extra || '') + '</header>';
    }

    function aviso(texto) {
        return '<div class="aviso">' + texto + '</div>';
    }

    /* Feedback textual honesto — nada de "parabéns" para nota 40. */
    function veredito(pct) {
        if (pct >= 95) return 'Impecável. Isso já é nível nativo.';
        if (pct >= 85) return 'Muito bom. Passaria numa conversa real sem ruído.';
        if (pct >= 70) return 'Dá para entender, mas ainda com esforço do outro lado. Repita.';
        if (pct >= 50) return 'Metade se perdeu. Vá mais devagar e exagere os sons marcados.';
        return 'Não saiu. Ouça o modelo três vezes antes de tentar de novo — sem pressa.';
    }

    return {
        $: $, q: q, qq: qq, esc: esc, toast: toast, anel: anel, barra: barra,
        diff: diff, legendaDiff: legendaDiff, dicasDiagnostico: dicasDiagnostico,
        contagem: contagem, relogio: relogio, embaralhar: embaralhar, sorteio: sorteio,
        botaoOuvir: botaoOuvir, cabecalho: cabecalho, aviso: aviso, veredito: veredito
    };
})();

window.F = window.F || {};

F.curso = (function () {

        return F.data.fases[0];
    }

    function som(id) { return porId(F.data.sons, id); }
    function shadowing(id) { return porId(F.data.shadowing, id); }
    function ditado(id) { return porId(F.data.ditado, id); }
    function drill(id) { return porId(F.data.drills, id); }
    function dialogo(id) { return porId(F.data.dialogos, id); }
    function funcao(id) { return porId(F.data.funcoes, id); }
    function degrau(n) { return F.data.escada[Math.min(Math.max(n, 1), F.data.escada.length) - 1]; }

    /* Chunks liberados até a semana atual (nível cresce com o programa). */
    function chunksDaSemana() {
        var s = semanaAtual();
        var nivelMax = s.fase >= 4 ? 3 : (s.fase >= 2 ? 2 : 1);
        var daFuncao = [], resto = [];
        F.data.chunks.forEach(function (c, i) {

            if (c.n > nivelMax) return;
            (c.f === s.funcao ? daFuncao : resto).push(c);
        });
        return { foco: daFuncao, todos: daFuncao.concat(resto) };
    }

    /* Garante id em todo chunk, mesmo fora da semana. */
    (function idsFixos() {
        F.data.chunks.forEach(function (c, i) { if (!c.id) c.id = 'ch' + i; });
    })();

    function avancarSemana() {

        if (s.semana < F.data.curriculo.length) { s.semana++; F.store.salvar(); return true; }

        { id: 'fala', nome: 'Fala livre sob pressão', min: 5, rota: '#/arena', desc: 'Falar sem parar sobre um tema sorteado, cronometrado.' },
        { id: 'diario', nome: 'Diário e missão', min: 3, rota: '#/diario', desc: 'Anotar o que travou hoje e definir o alvo de amanhã.' }

/* =========================================================
   Prática falada — o pedaço reaproveitado por todas as telas.

   Fluxo: o app fala o modelo, você repete, o reconhecimento de
   voz transcreve, o texto é comparado com o alvo e o erro é
   diagnosticado. Sem reconhecimento de voz no aparelho, o
   mesmo exercício funciona por escrito.

window.F = window.F || {};

F.pratica = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    /* Caixa de prática: botão de falar + área de resultado. */
    function caixa(id, rotulo) {
        return '<div class="pratica" id="' + id + '">' +
            '<button class="btn btn--falar" data-papel="falar">🎙️ ' + esc(rotulo || 'Sua vez — falar') + '</button>' +
            '<div class="pratica-status" data-papel="status"></div>' +
            '<div class="pratica-res" data-papel="res"></div>' +
            '</div>';
    }

    /* Liga a caixa. opcoes: { alvo: string|função, serie: 'pronuncia', aoResultado: fn(pct, res) } */
    function ligar(id, opcoes) {
        var raiz = ui.$(id);
        if (!raiz) return;
        var bt = raiz.querySelector('[data-papel="falar"]');
        var status = raiz.querySelector('[data-papel="status"]');
        var res = raiz.querySelector('[data-papel="res"]');
        var ocupado = false;

        function alvoAtual() {
            return typeof opcoes.alvo === 'function' ? opcoes.alvo() : opcoes.alvo;
        }

        function mostrar(texto) {
            if (!document.body.contains(res)) return;
            var alvo = alvoAtual();
            var r = F.texto.pontuar(alvo, texto);
            var diag = F.texto.diagnosticoDaFrase(r);
            res.innerHTML =
                '<div class="res-topo">' + ui.anel(r.pct) +
                '<div class="res-txt"><b>' + esc(ui.veredito(r.pct)) + '</b>' +
                '<small>Ouvi: “' + esc(texto || '(nada)') + '”</small></div></div>' +
                ui.diff(r) + ui.legendaDiff() + ui.dicasDiagnostico(diag);
            if (opcoes.serie) F.store.registrar(opcoes.serie, r.pct);
            if (opcoes.aoResultado) opcoes.aoResultado(r.pct, r);
        }

        function porEscrito() {
            res.innerHTML = '<div class="fallback">' +
                '<p class="sub">Este aparelho não reconhece fala (use o Chrome para isso). ' +
                'Fale em voz alta assim mesmo e digite o que você disse:</p>' +
                '<textarea class="entrada" rows="2" placeholder="write what you just said out loud"></textarea>' +
                '<button class="btn" data-papel="conferir">Conferir</button></div>';
            var ta = res.querySelector('textarea');
            ta.focus();
            res.querySelector('[data-papel="conferir"]').addEventListener('click', function () {
                mostrar(ta.value);
            });
        }

        bt.addEventListener('click', function () {
            if (ocupado) { F.voz.pararEscuta(); return; }
            if (!F.voz.temEscuta()) { porEscrito(); return; }

            ocupado = true;
            bt.classList.add('is-ouvindo');
            bt.textContent = '⏹ Parar';
            status.textContent = 'Ouvindo… fale a frase inteira.';
            res.innerHTML = '';

            F.voz.ouvir({
                limite: opcoes.limite || 15000,
                onParcial: function (t) { status.textContent = '“' + t + '”'; }
            }).then(function (r) {
                ocupado = false;
                if (!document.body.contains(raiz)) return;
                bt.classList.remove('is-ouvindo');
                bt.textContent = '🎙️ De novo';
                status.textContent = '';
                if (r.vazio) {
                    res.innerHTML = '<p class="sub">Não ouvi nada. Fale mais perto do microfone — ' +
                        'e mais alto do que parece necessário.</p>';
                    return;
                }
                mostrar(r.texto);
            }).catch(function (e) {
                ocupado = false;
                if (!document.body.contains(raiz)) return;
                bt.classList.remove('is-ouvindo');
                bt.textContent = '🎙️ Sua vez — falar';
                status.textContent = '';
                if (String(e.message) === 'not-allowed') {
                    res.innerHTML = '<p class="sub">O navegador bloqueou o microfone. Libere o acesso e tente de novo.</p>';
                } else {
                    porEscrito();
                }
            });
        });
    }

    /* Gravador para se ouvir: grava, toca e guarda o áudio anterior
       para comparação lado a lado. */
    function gravador(id) {
        return '<div class="gravador" id="' + id + '">' +
            '<button class="btn" data-papel="rec">⏺ Gravar minha voz</button>' +
            '<div class="gravador-saida" data-papel="saida"></div>' +
            '</div>';
    }

    function ligarGravador(id) {
        var raiz = ui.$(id);
        if (!raiz) return;
        var bt = raiz.querySelector('[data-papel="rec"]');
        var saida = raiz.querySelector('[data-papel="saida"]');
        var anterior = null;

        if (!F.voz.temGravacao()) {
            bt.disabled = true;
            bt.textContent = 'Gravação indisponível neste aparelho';

        }

        bt.addEventListener('click', function () {
            if (F.voz.gravando()) {
                F.voz.pararGravacao().then(function (url) {
                    if (!document.body.contains(raiz)) return;
                    bt.textContent = '⏺ Gravar de novo';
                    bt.classList.remove('is-rec');
                    if (!url) return;
                    saida.innerHTML =
                        '<div class="audio-linha"><b>Agora</b><audio controls src="' + url + '"></audio></div>' +
                        (anterior ? '<div class="audio-linha"><b>Antes</b><audio controls src="' + anterior + '"></audio></div>' : '') +
                        '<p class="legenda">Ouça as duas. A diferença entre elas é o seu progresso — e é a única prova que vale.</p>';
                    anterior = url;
                });
            } else {
                F.voz.comecarGravacao().then(function () {
                    bt.textContent = '⏹ Parar gravação';
                    bt.classList.add('is-rec');
                }).catch(function () {
                    F.ui.toast('Não consegui acessar o microfone.', 'erro');
                });
            }
        });
    }

    return { caixa: caixa, ligar: ligar, gravador: gravador, ligarGravador: ligarGravador };
})();

            '<div class="streak-num">' + s.streak.recorde + '<small>recorde</small></div>' +
            '<div class="streak-num">' + F.store.minutosTotais() + '<small>minutos no total</small></div>' +
            '<div class="streak-num">' + F.store.notaFluencia() + '<small>nota de fluência</small></div>' +
            '</div>' +
            calendario() +
            '</div>' +

            '<div class="linha-botoes">' +
            '<a class="btn" href="#/plano">Ver o plano de 48 semanas</a>' +
            '<a class="btn" href="#/metodo">Por que funciona</a>' +
            '<button class="btn" id="proxima-semana">Concluir semana ' + sem.s + '</button>' +
            '</div>';
    }

    function saudacao(nome) {
        var h = new Date().getHours();
        var p = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
        return nome ? p + ', ' + nome + '.' : p + '.';
    }

    /* Últimos 35 dias, estilo grade de contribuições. */
    function calendario() {
        var s = F.store.get();
        var hoje = new Date();
        var celulas = [];
        for (var i = 34; i >= 0; i--) {
            var d = new Date(hoje.getTime() - i * 86400000);
            var chave = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
            var min = s.minutos[chave] || 0;
            var n = min === 0 ? 0 : min < 15 ? 1 : min < 30 ? 2 : min < 45 ? 3 : 4;
            celulas.push('<i class="cal-n' + n + '" title="' + chave + ': ' + min + ' min"></i>');
        }
        return '<div class="calendario">' + celulas.join('') + '</div>' +
            '<p class="legenda">Últimos 35 dias. Quanto mais escuro, mais tempo de boca aberta.</p>';
    }

    function p2(n) { return n < 10 ? '0' + n : '' + n; }

    function montar() {
        var b = ui.$('proxima-semana');
        if (!b) return;
        b.addEventListener('click', function () {
            var s = F.store.get();
            if (s.semana >= F.data.curriculo.length) {
                ui.toast('Você chegou ao fim do programa. Recomece o ciclo num nível mais alto.');
                return;
            }
            if (!confirm('Fechar a semana ' + s.semana + ' e abrir a ' + (s.semana + 1) + '?\n\n' +
                'Só avance se a missão da semana foi cumprida de verdade.')) return;
            F.curso.avancarSemana();
            ui.toast('Semana ' + F.store.get().semana + ' liberada.');
            F.app.desenhar();
        });
    }

    return { render: render, montar: montar };
})();

            ui.q('#pr-pratica [data-papel="res"]').innerHTML = '';
            F.voz.falar(t);
        });

        ui.$('bt-tudo').addEventListener('click', function () {
            var seq = [];

            F.voz.falarSequencia(seq, { rate: 0.7, pausa: 500 });
        });

        ui.$('bt-teste').addEventListener('click', iniciarTeste);
    }

    /* Teste de percepção: o app fala um dos dois, você diz qual foi. */
    function iniciarTeste() {
        var area = ui.$('teste-area');
        teste = { rodada: 0, acertos: 0, total: 10, atual: null };
        proximaRodada(area);

    function proximaRodada(area) {
        // o teste roda com setTimeout: se o aluno saiu da tela, não há onde escrever
        if (!area || !document.body.contains(area)) return;
        if (teste.rodada >= teste.total) {
            var pct = Math.round((teste.acertos / teste.total) * 100);
            F.store.registrar('pronuncia', pct, 'ouvido');
            area.innerHTML = '<div class="teste-fim">' + ui.anel(pct, 'de ouvido') +

                '<button class="btn" id="bt-teste2">Repetir teste</button></div>';
            ui.$('bt-teste2').addEventListener('click', iniciarTeste);
            return;

        var par = ui.sorteio(som.pares);
        var ladoA = Math.random() < 0.5;
        teste.atual = { par: par, correto: ladoA ? 'a' : 'b' };
        var palavra = ladoA ? par.a : par.b;

        area.innerHTML = '<div class="teste">' +
            '<p class="teste-info">Rodada ' + (teste.rodada + 1) + ' de ' + teste.total +
            ' · acertos: ' + teste.acertos + '</p>' +
            '<p class="sub">Qual palavra você ouviu?</p>' +
            '<div class="teste-op">' +
            '<button class="btn btn--op" data-op="a">' + esc(par.a) + '</button>' +
            '<button class="btn btn--op" data-op="b">' + esc(par.b) + '</button>' +
            '</div>' +
            '<button class="btn btn--som" id="bt-repetir">🔊 Ouvir de novo</button>' +
            '<div class="teste-fb" id="teste-fb"></div>' +
            '</div>';

        var limpa = palavra.split(' ')[0].replace(/\(.*\)/, '');
        F.voz.falar(limpa);
        ui.$('bt-repetir').addEventListener('click', function () { F.voz.falar(limpa); });

        ui.qq('#teste-area [data-op]').forEach(function (b) {
            b.addEventListener('click', function () {
                var certo = b.getAttribute('data-op') === teste.atual.correto;
                if (certo) teste.acertos++;
                ui.$('teste-fb').innerHTML = certo
                    ? '<span class="fb fb--ok">✓ Isso. Era “' + esc(palavra) + '”.</span>'
                    : '<span class="fb fb--erro">✕ Era “' + esc(palavra) + '”. Ouça os dois de novo, lado a lado.</span>';
                teste.rodada++;
                setTimeout(function () { proximaRodada(ui.$('teste-area')); }, certo ? 700 : 1600);
            });
        });
    }

    return { render: render, montar: montar };
})();

/* =========================================================
   TELA SHADOWING — falar por cima do modelo.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.shadowing = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;
    var passagem = null, linha = 0, modo = 'en', vel = 1, tocando = null, loop = null;

    function render(args) {
        var id = args[0] || F.curso.semanaAtual().shadowing;
        passagem = F.curso.shadowing(id) || F.data.shadowing[0];
        linha = 0;
        vel = F.store.get().config.rate || 1;

        var pills = F.data.shadowing.map(function (p) {
            return '<a class="pilula' + (p.id === passagem.id ? ' is-on' : '') + '" href="#/shadowing/' + p.id + '">' +
                '<i class="nivel n' + p.nivel + '"></i>' + esc(p.titulo) + '</a>';
        }).join('');

        return ui.cabecalho('Shadowing', 'Comece a falar meio segundo depois do modelo — e não espere a frase terminar.') +
            '<div class="pilulas">' + pills + '</div>' +

            '<div class="cartao">' +
            '<div class="sh-topo">' +
            '<div><h3>' + esc(passagem.titulo) + '</h3>' +
            '<p class="sub">Nível ' + passagem.nivel + ' · ' + esc(passagem.tema) + ' · ' + passagem.wpm + ' palavras/min · ' + esc(passagem.foco) + '</p></div>' +
            '</div>' +

            '<div class="sh-controles">' +
            '<div class="segmentado" id="sh-modo">' +
            ['en:Texto', 'forte:Ritmo', 'soa:Como soa', 'pt:Português'].map(function (o) {
                var p = o.split(':');
                return '<button data-modo="' + p[0] + '"' + (p[0] === 'en' ? ' class="is-on"' : '') + '>' + p[1] + '</button>';
            }).join('') + '</div>' +
            '<label class="campo campo--slider"><span>Velocidade <b id="sh-vel">' + vel.toFixed(2) + '×</b></span>' +
            '<input type="range" id="sh-rate" min="0.5" max="1.2" step="0.05" value="' + vel + '"></label>' +
            '</div>' +

            '<ol class="linhas" id="sh-linhas">' +
            passagem.linhas.map(function (l, i) {
                return '<li class="linha' + (i === 0 ? ' is-on' : '') + '" data-i="' + i + '">' +
                    '<span class="linha-txt">' + textoLinha(l, 'en') + '</span>' +
                    (l.nota ? '<span class="linha-nota">' + esc(l.nota) + '</span>' : '') +
                    '</li>';
            }).join('') +
            '</ol>' +

            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="sh-tocar">▶ Tocar tudo</button>' +
            '<button class="btn" id="sh-linha">🔁 Repetir esta linha 3×</button>' +
            '<button class="btn" id="sh-prox">Próxima linha →</button>' +
            '</div>' +
            '</div>' +

            '<div class="cartao">' +
            '<h3>Sua vez, linha por linha</h3>' +
            '<p class="sub">Ouça, fale por cima e veja o que o ouvido de fora entendeu.</p>' +
            '<p class="frase-alvo" id="sh-alvo">' + esc(passagem.linhas[0].en) + '</p>' +
            F.pratica.caixa('sh-pratica') +
            '</div>' +

            '<div class="cartao">' +
            '<h3>Gravar e comparar</h3>' +
            '<p class="sub">Grave a passagem inteira. Repita na semana que vem, com a gravação antiga do lado.</p>' +
            F.pratica.gravador('sh-grav') +
            '</div>';
    }

    function textoLinha(l, m) {
        if (m === 'forte') return marcarFortes(l.forte || l.en);
        if (m === 'soa') return '<i class="soa">' + esc(l.soa || l.en) + '</i>';
        if (m === 'pt') return '<i class="pt">' + esc(l.pt) + '</i>';
        return esc(l.en);
    }

    /* Deixa em destaque as sílabas escritas em maiúscula na versão "forte". */
    function marcarFortes(t) {
        return esc(t).replace(/([A-Z]{2,})/g, '<b>$1</b>');
    }

    function pintar() {
        ui.qq('#sh-linhas .linha').forEach(function (li, i) {
            li.classList.toggle('is-on', i === linha);
            li.querySelector('.linha-txt').innerHTML = textoLinha(passagem.linhas[i], modo);
        });
        var alvo = ui.$('sh-alvo');
        if (alvo) alvo.textContent = passagem.linhas[linha].en;
        var res = ui.q('#sh-pratica [data-papel="res"]');
        if (res) res.innerHTML = '';
    }

    function montar() {
        F.pratica.ligar('sh-pratica', {
            alvo: function () { return passagem.linhas[linha].en; },
            serie: 'pronuncia',
            aoResultado: function () { F.store.concluirBloco('shadowing'); }
        });
        F.pratica.ligarGravador('sh-grav');

        ui.qq('#sh-modo button').forEach(function (b) {
            b.addEventListener('click', function () {
                modo = b.getAttribute('data-modo');
                ui.qq('#sh-modo button').forEach(function (x) { x.classList.toggle('is-on', x === b); });
                pintar();
            });
        });

        ui.$('sh-rate').addEventListener('input', function () {
            vel = parseFloat(this.value);
            ui.$('sh-vel').textContent = vel.toFixed(2) + '×';
        });

        ui.qq('#sh-linhas .linha').forEach(function (li) {
            li.addEventListener('click', function () {
                linha = parseInt(li.getAttribute('data-i'), 10);
                pintar();
                F.voz.falar(passagem.linhas[linha].en, { rate: vel });
            });
        });

        ui.$('sh-tocar').addEventListener('click', function () {
            var bt = this;
            if (tocando) {
                tocando.cancelar();
                tocando = null;
                bt.textContent = '▶ Tocar tudo';
                return;
            }
            bt.textContent = '⏹ Parar';
            var frases = passagem.linhas.map(function (l) { return l.en; });
            tocando = F.voz.falarSequencia(frases, { rate: vel, pausa: 500 }, function (i) {
                linha = i; pintar();
            });
            tocando.then(function () {
                tocando = null;
                bt.textContent = '▶ Tocar tudo';
                F.store.concluirBloco('shadowing');
            });
        });

        ui.$('sh-linha').addEventListener('click', function () {
            if (loop) { loop.cancelar(); loop = null; this.textContent = '🔁 Repetir esta linha 3×'; return; }
            var t = passagem.linhas[linha].en;
            var bt = this;
            bt.textContent = '⏹ Parar repetição';
            loop = F.voz.falarSequencia([t, t, t], { rate: vel, pausa: 900 });
            loop.then(function () { loop = null; bt.textContent = '🔁 Repetir esta linha 3×'; });
        });

        ui.$('sh-prox').addEventListener('click', function () {
            linha = (linha + 1) % passagem.linhas.length;
            pintar();
            F.voz.falar(passagem.linhas[linha].en, { rate: vel });
        });
    }

    function desmontar() {
        if (tocando) { tocando.cancelar(); tocando = null; }
        if (loop) { loop.cancelar(); loop = null; }
    }

    return { render: render, montar: montar, desmontar: desmontar };
})();

</script>
