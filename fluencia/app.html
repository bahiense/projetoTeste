    <script>
/* =========================================================
   TELA CONVERSA — role-play com o app fazendo o outro.

   Você não "pratica inglês": você resolve uma situação em
   inglês. Ter um objetivo muda a fala inteira.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.conversa = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;
    var dl = null, turno = 0, minhas = [], usados = {}, notas = [];

    function render(args) {
        var id = args[0] || F.curso.semanaAtual().dialogo;
        dl = F.curso.dialogo(id) || F.data.dialogos[0];
        turno = 0; minhas = []; usados = {}; notas = [];

        var pills = F.data.dialogos.map(function (d) {
            return '<a class="pilula' + (d.id === dl.id ? ' is-on' : '') + '" href="#/conversa/' + d.id + '">' +
                '<i class="nivel n' + d.nivel + '"></i>' + esc(d.titulo) + '</a>';
        }).join('');

        var aCena = '<p>O app faz o outro personagem. Você responde <b>falando</b> — nunca escrevendo.</p>' +
            '<p><b>A cena:</b> ' + esc(dl.contexto) + '</p>' +
            '<p><b>Você é:</b> ' + esc(dl.seuPapel) + '<br><b>O app é:</b> ' + esc(dl.papelBot) + '</p>' +
            '<p><b>Objetivo:</b> ' + esc(dl.objetivo) + '</p>' +
            '<p>Os três blocos marcados acendem quando você os usa. Não precisa ser na ordem, ' +
            'nem na frase exata — precisa ser em algum momento da cena.</p>';

        return ui.cabecalho('Role-play') +
            '<div class="pilulas">' + pills + '</div>' +

            '<div class="cartao cartao--cena">' +
            '<div class="cartao-titulo">' +
            '<h3>' + esc(dl.titulo) + '</h3>' +
            ui.ajuda('A cena e o objetivo', aCena) +
            '</div>' +
            '<p class="cena">' + esc(dl.contexto) + '</p>' +
            '<div class="chips" id="cv-chips">' + dl.obrigatorios.map(function (o, i) {
                return '<span class="chip" data-ob="' + i + '">' + esc(o) + '</span>';
            }).join('') + '</div>' +
            '</div>' +

            '<div class="cartao">' +
            '<div id="cv-area"></div>' +
            '</div>';
    }

    function pintar() {
        var area = ui.$('cv-area');
        if (!area) return;
        if (turno >= dl.turnos.length) return fim(area);
        var t = dl.turnos[turno];

        area.innerHTML =
            '<div class="cv-topo">Turno ' + (turno + 1) + ' de ' + dl.turnos.length + '</div>' +
            '<div class="fala fala--bot">' +
            '<b>' + esc(dl.papelBot) + '</b>' +
            '<p>' + esc(t.bot) + '</p>' +
            '<div class="linha-botoes">' +
            ui.botaoOuvir(t.bot, 'Ouvir') +
            '<button class="btn btn--som" data-falar="' + esc(t.bot) + '" data-rate="0.7">🐢 Devagar</button>' +
            '<button class="btn" id="cv-pt">Ver em português</button>' +
            '</div>' +
            '<p class="fala-pt" id="cv-pt-txt" hidden>' + esc(t.pt) + '</p>' +
            '</div>' +

            '<div class="fala fala--voce">' +
            '<b>Você</b>' +
            '<p class="dica-turno">💡 ' + esc(t.dica) + '</p>' +
            F.pratica.caixa('cv-pratica', 'Responder falando') +
            '<div class="linha-botoes">' +
            '<button class="btn" id="cv-modelo">Ver uma resposta possível</button>' +
            '<button class="btn btn--forte" id="cv-prox">Continuar →</button>' +
            '</div>' +
            '<div id="cv-modelo-txt"></div>' +
            '</div>';

        F.voz.falar(t.bot);

        ui.$('cv-pt').addEventListener('click', function () {
            var e = ui.$('cv-pt-txt');
            e.hidden = !e.hidden;
            this.textContent = e.hidden ? 'Ver em português' : 'Esconder português';
        });

        ui.$('cv-modelo').addEventListener('click', function () {
            ui.$('cv-modelo-txt').innerHTML =
                '<div class="modelo-caixa"><b>Uma resposta possível</b>' +
                '<p>' + esc(t.modelo) + '</p>' + ui.botaoOuvir(t.modelo, 'ouvir') +
                '<p class="legenda">Não é a resposta certa — é uma referência de nível. A sua pode ser melhor.</p></div>';
        });

        ui.$('cv-prox').addEventListener('click', function () { turno++; pintar(); });

        /* A caixa de prática aqui compara com o modelo só para dar
           referência; o que vale mesmo é ter falado e usado os blocos. */
        F.pratica.ligar('cv-pratica', {
            alvo: function () { return dl.turnos[turno].modelo; },
            limite: 25000,
            livre: true,
            corrigir: true,
            aoResultado: function (pct, r) {
                var meu = r.hip.join(' ');
                minhas.push(meu);
                notas.push(pct);
                marcarObrigatorios(meu);
            }
        });
    }

    function marcarObrigatorios(texto) {
        var n = F.texto.normalizar(texto);
        dl.obrigatorios.forEach(function (o, i) {
            if (usados[i]) return;
            var alvo = F.texto.normalizar(o);
            // aceita a expressão inteira ou quase toda (o reconhecimento erra palavras pequenas)
            var partes = alvo.split(' ');
            var achou = n.indexOf(alvo) >= 0;
            if (!achou && partes.length > 2) {
                var presentes = partes.filter(function (p) { return n.indexOf(p) >= 0; }).length;
                achou = presentes / partes.length >= 0.8;
            }
            if (achou) {
                usados[i] = true;
                var chip = ui.q('#cv-chips [data-ob="' + i + '"]');
                if (chip) chip.classList.add('is-ok');
                ui.toast('Bloco usado: ' + o);
            }
        });
    }

    function fim(area) {
        if (!area) return;
        var usadosN = Object.keys(usados).length;
        var media = notas.length ? Math.round(notas.reduce(function (a, b) { return a + b; }, 0) / notas.length) : 0;
        var palavras = minhas.join(' ').split(/\s+/).filter(Boolean).length;
        F.store.registrar('fala', Math.min(100, media * 0.5 + (usadosN / dl.obrigatorios.length) * 50));
        F.store.concluirBloco('conversa');

        area.innerHTML = '<div class="teste-fim">' +
            '<h3>Cena encerrada</h3>' +
            '<div class="streak-linha">' +
            '<div class="streak-num">' + palavras + '<small>palavras suas</small></div>' +
            '<div class="streak-num">' + usadosN + '/' + dl.obrigatorios.length + '<small>blocos obrigatórios</small></div>' +
            '<div class="streak-num">' + media + '%<small>proximidade do modelo</small></div>' +
            '</div>' +
            '<p class="sub">Proximidade do modelo é referência, não nota: uma resposta diferente pode ser melhor. ' +
            'O que conta é ter falado sem travar e ter usado os blocos.</p>' +
            '<div class="cartao cartao--missao"><h3>Desafio</h3><p class="missao">' + esc(dl.desafio) + '</p></div>' +
            (minhas.length ? '<details class="transcricao"><summary>Ver o que você falou</summary><ul>' +
                minhas.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></details>' : '') +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="cv-refazer">Refazer a cena</button>' +
            '<a class="btn" href="#/explicar">Explicar sem a palavra</a>' +
            '</div></div>';

        ui.$('cv-refazer').addEventListener('click', function () {
            turno = 0; minhas = []; notas = []; usados = {};
            ui.qq('#cv-chips .chip').forEach(function (c) { c.classList.remove('is-ok'); });
            pintar();
        });
    }

    function montar() { pintar(); }

    return { render: render, montar: montar };
})();

</script>
    <script>
/* =========================================================
   TELA TRADUÇÃO REVERSA — o português sai, o inglês entra.

   O método é dos tradutores e a escola missionária usava sem dar
   nome: recebe a frase em português, produz a versão em inglês,
   e só então compara. O que ensina não é a nota — é a distância
   entre o que você disse e o que está na referência. É ali que a
   estrutura do português aparece escrita, e uma vez vista ela
   custa a voltar.

   Por isso a ordem importa: primeiro você tenta, depois vê. Ver
   antes transforma o exercício em cópia, que não treina nada.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.reversa = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    var META_DIA = 8;
    var RODADA = 8;

    var fila = [], pos = 0, notas = [], tentou = false;

    function render() {
        fila = montarFila();
        pos = 0; notas = [];

        var comoFazer =
            '<ol>' +
            '<li>Leia a frase em <b>português</b>.</li>' +
            '<li>Diga em inglês <b>em voz alta</b>, do seu jeito, antes de ver qualquer coisa.</li>' +
            '<li>Só então o app mostra a referência e marca, palavra por palavra, onde a sua ' +
            'versão se afastou.</li>' +
            '<li>Leia a <b>armadilha</b> e diga de novo, agora corrigido. É a segunda vez que grava.</li>' +
            '</ol>' +
            '<p>Não tente adivinhar a frase exata da referência: várias traduções estão certas. ' +
            'O que interessa é <b>onde</b> você se afastou — se foi por escolha de palavra, tudo bem; ' +
            'se foi porque o português vazou na estrutura, é isso que a armadilha explica.</p>' +
            '<p class="destaque">Este é o exercício que mais mostra progresso ao longo dos meses. ' +
            'A mesma frase que hoje sai torta vai sair inteira daqui a oito semanas — e você vai ' +
            'lembrar de ter errado.</p>';

        return ui.cabecalho('Tradução reversa') +
            '<div class="cartao">' +
            '<div class="cartao-titulo">' +
            '<h3>Do português para o inglês</h3>' +
            '<span class="etiqueta">em voz alta</span>' +
            ui.ajuda('Como funciona', comoFazer) +
            '</div>' +
            '<div id="rv-area"></div>' +
            '</div>';
    }

    /* Sobe um nível de cada vez até ter material que dure algumas semanas:
       gate apertado demais faz a fase 1 repetir as mesmas frases por um mês. */
    function montarFila() {
        var fase = F.curso.semanaAtual().fase;
        var teto = Math.max(1, Math.min(4, Math.ceil(fase / 2)));
        var pool = [];
        for (var n = 1; n <= 4 && (n <= teto || pool.length < 60); n++) {
            pool = pool.concat(F.data.reversa.filter(function (it) { return it.nivel === n; }));
        }
        if (pool.length < RODADA) pool = F.data.reversa.slice();
        return ui.embaralhar(pool).slice(0, RODADA);
    }

    function item() { return fila[pos]; }

    function pintar() {
        var area = ui.$('rv-area');
        if (!area) return;
        if (pos >= fila.length) return fim(area);
        tentou = false;

        var it = item();
        area.innerHTML =
            barraDoBloco() +
            '<div class="ex-topo"><span>' + (pos + 1) + ' de ' + fila.length + '</span>' +
            '<span class="dt-placar">boas: ' + notas.filter(Boolean).length + '</span></div>' +
            '<div class="rv-pt">' + esc(it.pt) + '</div>' +
            F.pratica.caixa('rv-pratica', '🎙 Dizer em inglês') +
            '<div class="linha-botoes">' +
            '<button class="btn" id="rv-ver">Não sei — mostrar</button>' +
            '</div>' +
            '<div id="rv-res"></div>';

        F.pratica.ligar('rv-pratica', {
            alvo: function () { return item().en; },
            serie: 'reversa',
            corrigir: true,
            limite: 14000,
            /* O veredito padrão manda ouvir o modelo três vezes — aqui não
               houve modelo nenhum antes da tentativa, e a distância que
               interessa é a da estrutura, não a do som. */
            veredito: function (pct) {
                if (pct >= 90) return 'Praticamente a referência.';
                if (pct >= 70) return 'Perto. Veja onde escorregou e diga de novo.';
                if (pct >= 40) return 'A ideia chegou, a estrutura não. É o que a armadilha explica.';
                return 'Bem longe da referência — leia a armadilha antes de repetir.';
            },
            aoResultado: function (pct) {
                if (!tentou) { notas.push(pct >= 70); tentou = true; }
                contarParaOBloco();
                revelar();
            }
        });
        ui.$('rv-ver').addEventListener('click', function () {
            if (!tentou) { notas.push(false); tentou = true; }
            revelar();
        });
    }

    function barraDoBloco() {
        var n = F.store.feitosHoje('reversa');
        if (F.store.blocoFeito('reversa')) {
            return '<p class="bloco-progresso is-ok">✓ Bloco do dia concluído — ' + n +
                ' frases. O que vier agora é treino extra.</p>';
        }
        return '<p class="bloco-progresso">Bloco do dia: <b>' + n + ' de ' + META_DIA +
            '</b> frases traduzidas.</p>';
    }

    function contarParaOBloco() {
        if (F.store.blocoFeito('reversa')) return;
        if (F.store.feitosHoje('reversa') < META_DIA) return;
        F.store.concluirBloco('reversa');
        ui.toast('Bloco do dia concluído ✓');
    }

    /* A referência, a segunda forma e — o que faz o exercício valer — a
       armadilha: o que o brasileiro costuma produzir aqui, e por quê. */
    function revelar() {
        var caixa = ui.$('rv-res');
        if (!caixa) return;
        var it = item();
        /* Depois de revelado, "não sei" só confunde: a resposta já está ali. */
        var ver = ui.$('rv-ver');
        if (ver) ver.hidden = true;

        caixa.innerHTML =
            '<div class="possiveis">' +
            '<div class="possivel"><b>Referência</b>' +
            '<p class="possivel-en">' + esc(it.en) + ' ' + ui.botaoOuvir(it.en, 'ouvir') + '</p></div>' +
            (it.alt ? '<div class="possivel"><b>Também serve</b>' +
                '<p class="possivel-en">' + esc(it.alt) + ' ' + ui.botaoOuvir(it.alt, 'ouvir') + '</p></div>' : '') +
            '</div>' +
            '<div class="rv-armadilha"><b>A armadilha</b><p>' + esc(it.armadilha) + '</p></div>' +
            '<p class="legenda">Sua versão não precisa ser igual à referência. Repita agora a forma ' +
            'certa em voz alta, no botão acima — é a repetição depois de ver o erro que fixa.</p>' +
            '<button class="btn btn--forte" id="rv-prox">Próxima →</button>';

        ui.$('rv-prox').addEventListener('click', function () { pos++; pintar(); });
    }

    function fim(area) {
        if (!area) return;
        var pct = notas.length ? Math.round((notas.filter(Boolean).length / notas.length) * 100) : 0;
        area.innerHTML = barraDoBloco() +
            '<div class="teste-fim">' + ui.anel(pct, 'perto do modelo') +
            '<p>' + esc(pct >= 80
                ? 'Quase tudo saiu perto da referência. Suba um nível: pegue as frases longas.'
                : pct >= 40
                    ? 'Metade saiu. As que se afastaram são as que o português ainda comanda.'
                    : 'Muitas se afastaram — e é exatamente para isso que este exercício existe. ' +
                    'Releia as armadilhas de hoje antes de dormir; elas voltam amanhã.') + '</p>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="rv-mais">Mais oito frases</button>' +
            '<a class="btn" href="#/exercicios">Outro exercício</a></div></div>';
        ui.$('rv-mais').addEventListener('click', function () {
            fila = montarFila(); pos = 0; notas = []; pintar();
        });
    }

    function montar() { pintar(); }
    function desmontar() { F.voz.pararFala(); F.voz.pararEscuta(); }

    return { render: render, montar: montar, desmontar: desmontar };
})();

</script>
    <script>
/* =========================================================
   TELA EXPLICAR — chegar na ideia sem a palavra.

   O que trava um intermediário não é falta de vocabulário: é
   parar quando a palavra some. Nativo contorna sem pensar
   ("aquela coisa que a gente usa pra..."). Aqui o app tira as
   saídas fáceis e obriga o contorno, escutando enquanto você
   fala e acendendo o que você acertou e o que você queimou.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.explicar = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    var META_DIA = 4;          // rodadas que fecham o bloco do dia
    var MIN_PALAVRAS = 12;     // abaixo disso não foi explicação, foi tentativa
    var TEMPO = 40;

    var fila = [], pos = 0, notas = [], rodando = false, timer = null;
    var queimadas = [], acesas = [], ouvidoAgora = '';

    function render() {
        fila = montarFila();
        pos = 0; notas = [];

        var comoFazer =
            '<ol>' +
            '<li>O app mostra uma palavra e <b>proíbe</b> as saídas óbvias.</li>' +
            '<li>Toque em <b>Explicar</b> e fale até o outro lado entender — sem dizer ' +
            'a palavra nem nenhuma das proibidas.</li>' +
            '<li>Enquanto você fala, o app acende em verde as palavras que ajudam e em ' +
            'vermelho a proibida no instante em que ela escapa.</li>' +
            '</ol>' +
            '<p><b>Ganha a rodada</b> quem falar pelo menos ' + MIN_PALAVRAS + ' palavras, ' +
            'dentro do tempo, sem queimar nenhuma proibida. Não existe resposta certa: ' +
            'existem mil explicações boas.</p>' +
            '<p>As palavras que ajudam <b>não são obrigatórias</b> — são só um empurrão para ' +
            'quem travou. E o modelo que aparece no fim é <i>uma</i> forma de explicar, para ' +
            'você comparar, não para copiar.</p>' +
            '<p class="destaque">Isto é a habilidade mais útil de todo o curso. Numa conversa ' +
            'real você vai esquecer palavras a vida inteira; o que muda é você continuar ' +
            'falando em vez de parar e pedir desculpa.</p>';

        return ui.cabecalho('Explique sem a palavra') +
            '<div class="cartao">' +
            '<div class="cartao-titulo">' +
            '<h3 id="ex-nome">Contornar o buraco</h3>' +
            '<span class="etiqueta">resposta livre</span>' +
            ui.ajuda('Como funciona', comoFazer) +
            '</div>' +
            '<div id="ex-area"></div>' +
            '</div>';
    }

    /* Rodada do dia: cinco palavras sorteadas na faixa da fase atual,
       com as fases anteriores no bolo — o que já foi treinado volta. */
    function montarFila() {
        var fase = F.curso.semanaAtual().fase;
        var teto = Math.max(1, Math.min(4, Math.ceil(fase / 2)));
        var pool = [];
        /* Sobe um nível de cada vez até ter material que dure algumas
           semanas: gate apertado demais faz a fase 1 repetir as mesmas
           vinte palavras por um mês e meio. */
        for (var n = 1; n <= 4 && (n <= teto || pool.length < 50); n++) {
            pool = pool.concat(F.data.explicar.filter(function (it) { return it.nivel === n; }));
        }
        if (pool.length < 5) pool = F.data.explicar.slice();
        return ui.embaralhar(pool).slice(0, 5);
    }

    function item() { return fila[pos]; }

    function pintar() {
        var area = ui.$('ex-area');
        if (!area) return;
        if (pos >= fila.length) return fim(area);

        var it = item();
        queimadas = []; acesas = []; ouvidoAgora = '';

        area.innerHTML =
            barraDoBloco() +
            '<div class="ex-topo"><span>' + (pos + 1) + ' de ' + fila.length + '</span>' +
            '<span class="dt-placar">explicadas: ' + notas.filter(Boolean).length + '</span></div>' +
            '<div class="ex-palavra">' + esc(it.palavra) +
            '<small>' + esc(it.pt) + '</small></div>' +
            '<p class="ex-rotulo">Não pode dizer</p>' +
            '<div class="ex-fichas" id="ex-proibidas">' +
            it.proibidas.map(function (p, i) {
                return '<span class="ficha ficha--nao" data-p="' + i + '">' + esc(p) + '</span>';
            }).join('') + '</div>' +
            '<p class="ex-rotulo">Ajudam <small>(opcionais)</small></p>' +
            '<div class="ex-fichas" id="ex-ajudam">' +
            it.ajudam.map(function (p, i) {
                return '<span class="ficha" data-a="' + i + '">' + esc(p) + '</span>';
            }).join('') + '</div>' +
            '<div class="dr-relogio"><i id="ex-barra"></i></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="ex-ir">🎙 Explicar (' + TEMPO + 's)</button>' +
            '<button class="btn" id="ex-pular">Pular</button>' +
            '</div>' +
            '<p class="ex-transcricao" id="ex-txt"></p>' +
            '<div id="ex-res"></div>';

        ui.$('ex-ir').addEventListener('click', comecar);
        ui.$('ex-pular').addEventListener('click', function () { pos++; pintar(); });
    }

    function barraDoBloco() {
        var n = F.store.feitosHoje('explicar');
        if (F.store.blocoFeito('explicar')) {
            return '<p class="bloco-progresso is-ok">✓ Bloco do dia concluído — ' + n +
                ' explicações. O que vier agora é treino extra.</p>';
        }
        return '<p class="bloco-progresso">Bloco do dia: <b>' + n + ' de ' + META_DIA +
            '</b> explicações.</p>';
    }

    function contarParaOBloco() {
        if (F.store.blocoFeito('explicar')) return;
        if (F.store.feitosHoje('explicar') < META_DIA) return;
        F.store.concluirBloco('explicar');
        ui.toast('Bloco do dia concluído ✓');
    }

    /* ------------- a escuta ao vivo ------------- */

    function comecar() {
        if (rodando) return;
        if (!F.voz.temEscuta()) {
            ui.$('ex-res').innerHTML = ui.aviso('Sem reconhecimento de fala neste aparelho. ' +
                'Explique em voz alta assim mesmo e compare com o modelo depois.', 'atencao') +
                '<button class="btn btn--forte" id="ex-ver">Ver uma explicação</button>';
            ui.$('ex-ver').addEventListener('click', function () { revelar(null); });
            return;
        }
        rodando = true;
        var barra = ui.$('ex-barra');
        ui.$('ex-res').innerHTML = '';
        ui.$('ex-ir').textContent = '● ouvindo…';
        ui.$('ex-ir').classList.add('is-gravando');

        barra.style.transition = 'none';
        barra.style.width = '100%';
        setTimeout(function () {
            if (!document.body.contains(barra)) return;
            barra.style.transition = 'width ' + TEMPO + 's linear';
            barra.style.width = '0%';
        }, 20);

        F.voz.ouvir({
            continuo: true,
            limite: TEMPO * 1000,
            onParcial: function (t) { ouvidoAgora = t; acender(t); }
        }).then(function (r) {
            revelar(r.vazio ? '' : r.texto);
        }).catch(function () {
            revelar(ouvidoAgora || '');
        });
    }

    /* Acende as fichas enquanto a pessoa fala. É o que torna o
       exercício um jogo: o erro aparece no instante em que sai da
       boca, não num relatório no fim. */
    function acender(texto) {
        var caixa = ui.$('ex-txt');
        if (!caixa) return;
        var it = item();
        caixa.textContent = texto;

        it.proibidas.forEach(function (p, i) {
            if (contem(texto, p) && queimadas.indexOf(i) < 0) {
                queimadas.push(i);
                var f = ui.q('#ex-proibidas [data-p="' + i + '"]');
                if (f) f.classList.add('is-queimada');
                ui.toast('Queimou: “' + p + '”', 'erro');
            }
        });
        it.ajudam.forEach(function (p, i) {
            if (contem(texto, p) && acesas.indexOf(i) < 0) {
                acesas.push(i);
                var f = ui.q('#ex-ajudam [data-a="' + i + '"]');
                if (f) f.classList.add('is-acesa');
            }
        });
    }

    /* Casa palavra inteira e deixa passar plural e -ing/-ed, senão
       "card" não pegaria "cards" e o jogo viraria sorte. Expressão

        var formas = [a, a + 's', a + 'es', a + 'ed', a + 'ing', a + 'd'];
        if (/e$/.test(a)) formas.push(a.slice(0, -1) + 'ing');

                }).join(', ') : ' · nenhuma proibida') +
                (acesas.length ? ' · acendeu ' + acesas.length + ' que ajudam' : '') +
                '</small></div></div>';

            if (ouvido) {
                html += '<div class="ex-minha"><b>O que você disse</b><p>' + esc(ouvido) + '</p></div>' +
                    F.correcao.html(ouvido);

        }

        html += '<div class="possiveis"><div class="possivel"><b>Uma forma de explicar</b>' +
            '<p class="possivel-en">' + esc(it.modelo) + ' ' + ui.botaoOuvir(it.modelo, 'ouvir') + '</p>' +
            '<p class="possivel-pt">' + esc(it.modeloPt) + '</p></div>' +

            'coragem de continuar falando.</p></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn" id="ex-rep">↻ Tentar de novo</button>' +
            '<button class="btn btn--forte" id="ex-prox">Próxima →</button></div>';

        caixa.innerHTML = html;
        ui.$('ex-rep').addEventListener('click', function () {
            if (notas.length) notas.pop();
            pintar();
        });
        ui.$('ex-prox').addEventListener('click', function () { pos++; pintar(); });
    }

    function fim(area) {
        if (!area) return;
        var pct = notas.length ? Math.round((notas.filter(Boolean).length / notas.length) * 100) : 0;
        area.innerHTML = barraDoBloco() +
            '<div class="teste-fim">' + ui.anel(pct, 'sem a palavra') +
            '<p>' + esc(pct >= 80
                ? 'Você contornou quase tudo. Numa conversa real, isso é o que impede a travada.'
                : pct >= 40
                    ? 'Metade saiu. As que queimaram são as palavras em que sua cabeça só tem um caminho.'
                    : 'Difícil no começo — é normal. Use as palavras que ajudam como muleta até não precisar mais.') +

            '<button class="btn btn--forte" id="ex-mais">Mais cinco palavras</button>' +
            '<a class="btn" href="#/exercicios">Outro exercício</a></div></div>';
        ui.$('ex-mais').addEventListener('click', function () {
            fila = montarFila(); pos = 0; notas = []; pintar();
        });
    }

    function montar() { pintar(); }

    function desmontar() {
        clearTimeout(timer);
        rodando = false;
        F.voz.pararEscuta();
    }

    return { render: render, montar: montar, desmontar: desmontar };

    function base() {

    function barraDoBloco() {

            return '<p class="bloco-progresso is-ok">✓ Bloco do dia concluído — ' + n +

                pintar();

/* =========================================================
   TELA PEGA O ERRO — o ouvido aprende a soar o alarme.

F.telas.pegaoerro = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    var META_DIA = 6;
    var RODADA = 8;

    var fila = [], pos = 0, notas = [], sequencia = 0, melhor = 0;
    var mostrouTexto = false, julgado = false;

    function render() {
        fila = montarFila();
        pos = 0; notas = []; sequencia = 0; melhor = 0;

        var comoFazer =
            '<ol>' +
            '<li>Toque em <b>Ouvir a frase</b>. Só o áudio — o texto fica escondido de ' +
            'propósito, para o ouvido trabalhar sozinho.</li>' +
            '<li>Decida em poucos segundos: <b>soa certo</b> ou <b>tem erro</b>?</li>' +
            '<li>Se tiver erro, você ainda precisa <b>dizer a forma certa em voz alta</b>. ' +
            'Reconhecer não basta — a boca é que tem de mudar.</li>' +
            '</ol>' +
            '<p>São as mesmas armadilhas da tela <b>Erros de brasileiro</b>, mas ali você ' +
            '<i>lê</i> as duas versões e escolhe. Aqui você não vê nada: é o ouvido que ' +
            'precisa desconfiar, que é como acontece numa conversa de verdade.</p>' +
            '<p class="destaque">Se você errar o julgamento, é justamente essa a frase que ' +
            'você diz sem perceber. Não é vergonha — é o mapa do que treinar.</p>';

        return ui.cabecalho('Pega o erro') +
            '<div class="cartao">' +
            '<div class="cartao-titulo">' +
            '<h3>Ouvido de brasileiro, alarme ligado</h3>' +
            '<span class="etiqueta">só áudio</span>' +
            ui.ajuda('Como funciona', comoFazer) +
            '</div>' +
            '<div id="pe-area"></div>' +
            '</div>';
    }

    /* Só entram frases que dá para falar inteiras: as entradas do banco

    function utilizaveis() {
        return F.data.erros.filter(function (e) {
            return !/[\/()—]/.test(e.certo) && !/[\/()]/.test(e.errado) &&
                e.certo.length < 90 && e.errado.length < 90;

        mostrouTexto = false; julgado = false;

        area.innerHTML =
            barraDoBloco() +
            '<div class="ex-topo"><span>' + (pos + 1) + ' de ' + fila.length + '</span>' +
            '<span class="dt-placar">acertos: ' + notas.filter(Boolean).length +
            (sequencia > 1 ? ' · ' + sequencia + ' seguidas 🔥' : '') + '</span></div>' +
            '<div class="pe-caixa" id="pe-caixa"><span class="pe-oculto">frase escondida — ouça</span></div>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="pe-ouvir">🔊 Ouvir a frase</button>' +
            '<button class="btn" id="pe-ver">Mostrar o texto</button>' +
            '</div>' +
            '<div class="notas" id="pe-julgar">' +
            '<button class="btn btn--nota good" data-j="ok">Soa certo</button>' +
            '<button class="btn btn--nota bad" data-j="erro">Tem erro</button>' +
            '</div>' +
            '<div id="pe-res"></div>';

        ui.$('pe-ouvir').addEventListener('click', function () {
            F.voz.falar(item().frase, { rate: 0.95 });
        });
        ui.$('pe-ver').addEventListener('click', function () {

            ui.$('pe-caixa').innerHTML = '<span class="pe-frase">' + esc(item().frase) + '</span>';
        });
        ui.qq('#pe-julgar [data-j]').forEach(function (b) {

    function barraDoBloco() {

            return '<p class="bloco-progresso is-ok">✓ Bloco do dia concluído — ' + n +

        }
        return '<p class="bloco-progresso">Bloco do dia: <b>' + n + ' de ' + META_DIA +

    function contarParaOBloco() {

    function julgar(disseQueTemErro) {

        if (sequencia > melhor) melhor = sequencia;

        ui.$('pe-caixa').innerHTML = '<span class="pe-frase' + (it.torta ? ' pe-frase--torta' : '') + '">' +

        var html = '<div class="res-topo"><div class="res-txt"><b>' +
            esc(acertou
                ? (it.torta ? 'Isso. A frase estava torta.' : 'Isso. Um nativo diria assim mesmo.')
                : (it.torta ? 'Passou batido — e é assim que ela sai na sua boca.'
                    : 'Falso alarme: essa estava certa.')) +
            '</b></div></div>';

        if (it.torta) {
            html += '<div class="dr-resposta"><b>A forma certa:</b> ' + esc(it.erro.certo) + ' ' +
                ui.botaoOuvir(it.erro.certo, 'ouvir') + '</div>' +
                '<p class="corr-traducao">' + esc(it.erro.porque) + '</p>' +
                '<div id="pe-dizer"></div>';
        } else {
            html += '<p class="corr-traducao">' + esc(it.erro.porque) + '</p>' +
                '<p class="legenda">A versão torta desta é: <i>' + esc(it.erro.errado) + '</i></p>';
        }

        html += '<div class="linha-botoes">' +
            '<button class="btn" id="pe-rep">↻ Repetir esta</button>' +
            '<button class="btn btn--forte" id="pe-prox">Próxima →</button></div>';
        caixa.innerHTML = html;

        if (it.torta) montarDizer(it);
        ui.$('pe-rep').addEventListener('click', function () {
            if (notas.length) { if (notas[notas.length - 1]) sequencia = Math.max(0, sequencia - 1); notas.pop(); }
            pintar();
        });
        ui.$('pe-prox').addEventListener('click', function () { pos++; pintar(); });
    }

    /* Julgar é meio caminho. A frase certa tem de passar pela boca —
       é ali que a forma velha é substituída. */
    function montarDizer(it) {
        var caixa = ui.$('pe-dizer');
        if (!caixa) return;
        if (!F.voz.temEscuta()) {
            caixa.innerHTML = '<p class="legenda">Diga a forma certa em voz alta duas vezes ' +
                'antes de seguir — mesmo sem o app conferir.</p>';
            return;
        }
        caixa.innerHTML = '<button class="btn btn--forte" id="pe-falar">🎙 Dizer a forma certa</button>' +
            '<div id="pe-fala"></div>';
        ui.$('pe-falar').addEventListener('click', function () {
            var bt = ui.$('pe-falar');
            bt.textContent = '● ouvindo…';
            bt.classList.add('is-gravando');
            F.voz.ouvir({ limite: 7000 }).then(function (r) {
                var res = ui.$('pe-fala');
                if (!res) return;
                var b = ui.$('pe-falar');
                if (b) { b.textContent = '🎙 Dizer de novo'; b.classList.remove('is-gravando'); }
                if (r.vazio) {
                    res.innerHTML = ui.aviso('Não ouvi nada. Fale mais perto do aparelho.', 'atencao');
                    return;
                }
                var n = F.texto.pontuar(it.erro.certo, r.texto);
                F.store.registrar('pegaoerro', n.pct);
                res.innerHTML = '<div class="res-topo">' + ui.anel(n.pct) +
                    '<div class="res-txt"><b>' + esc(n.pct >= 75 ? 'Saiu certo.' : 'Quase — olhe onde escorregou.') +
                    '</b><small>Ouvi: “' + esc(r.texto) + '”</small></div></div>' + ui.diff(n);
            }).catch(function () {
                var res = ui.$('pe-fala');
                var b = ui.$('pe-falar');
                if (b) { b.textContent = '🎙 Dizer de novo'; b.classList.remove('is-gravando'); }
                if (res) res.innerHTML = ui.aviso('A escuta falhou agora. Tente de novo.', 'atencao');
            });
        });
    }

    function fim(area) {
        if (!area) return;
        var pct = notas.length ? Math.round((notas.filter(Boolean).length / notas.length) * 100) : 0;
        area.innerHTML = barraDoBloco() +
            '<div class="teste-fim">' + ui.anel(pct, 'ouvido') +
            '<p>' + esc(pct >= 90 ? 'Seu ouvido já desconfia sozinho. É esse o alarme que faltava.'
                : pct >= 60 ? 'Bom. As que passaram batido são as que ainda soam normais para você.'
                    : 'Muitas passaram. Não é falta de estudo: é que elas soam certas em português.') +
            (melhor > 2 ? ' Melhor sequência: ' + melhor + '.' : '') + '</p>' +
            '<div class="linha-botoes">' +
            '<button class="btn btn--forte" id="pe-mais">Mais oito frases</button>' +
            '<a class="btn" href="#/erros">Ver a lista de armadilhas</a></div></div>';
        ui.$('pe-mais').addEventListener('click', function () {
            fila = montarFila(); pos = 0; notas = []; sequencia = 0; pintar();
        });
    }

    function montar() { pintar(); }
    function desmontar() { F.voz.pararFala(); F.voz.pararEscuta(); }

    return { render: render, montar: montar, desmontar: desmontar };
})();

    <script>
/* =========================================================
   TELA PROGRESSO — os números que importam.

   Nota de fluência = desempenho (60%) + constância (25%) +
   volume de prática (15%). Constância pesa porque é o que
   melhor prevê o resultado no fim dos seis meses.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

F.telas.progresso = (function () {
    'use strict';
    var ui = F.ui, esc = F.ui.esc;

    var SERIES = [
        { id: 'pronuncia', nome: 'Pronúncia', desc: 'quanto da sua fala foi reconhecida corretamente' },
        { id: 'ditado', nome: 'Escuta', desc: 'quanto você acerta do ditado em velocidade real' },
        { id: 'drill', nome: 'Automatismo', desc: 'estruturas que saem sem raciocínio' },
        { id: 'reversa', nome: 'Tradução reversa', desc: 'quanto a sua versão chega perto da referência' },
        { id: 'fala', nome: 'Fala livre', desc: 'fluxo e proximidade do modelo no role-play' },
        { id: 'explicar', nome: 'Contornar', desc: 'chegar na ideia sem a palavra, sem queimar as proibidas' },
        { id: 'pegaoerro', nome: 'Ouvido crítico', desc: 'pegar a frase torta só pelo áudio e dizer a certa' }
    ];

    function render() {
        var s = F.store.get();
        var nota = F.store.notaFluencia();
        var sem = F.curso.semanaAtual();
        var chunks = F.srs.resumo(F.data.chunks);

        return ui.cabecalho('Progresso') +

            '<div class="cartao">' +
            '<div class="dia-topo">' +
            '<div><b>Nota de fluência</b><small>desempenho + constância + volume ' +
            ui.ajuda('Como a nota é calculada',
                '<p>Ela junta três coisas: <b>desempenho</b> (60%) — suas médias de pronúncia, escuta, ' +
                'automatismo e fala livre; <b>constância</b> (25%) — sua sequência de dias; e ' +
                '<b>volume</b> (15%) — o total de tempo praticado.</p>' +
                '<p>A constância pesa tanto porque é o que melhor prevê o resultado no fim do programa. ' +
                'Quarenta e cinco minutos por dia durante um ano são mais de duzentas horas; três horas ' +
                'num sábado, uma vez por mês, não são nada.</p>' +
                '<p>Nenhum destes números substitui o teste real: gravar 90 segundos hoje e refazer na ' +
                'semana 24 e na 48.</p>') +
            '</small></div>' +
            ui.anel(nota) +
            '</div>' +
            '<p class="sub">' + esc(faixa(nota)) + '</p>' +
            '</div>' +

            '<div class="grade-2">' +
            SERIES.map(function (x) {
                var m = F.store.media(x.id, 20);
                var h = (s.historico[x.id] || []);
                var antes = h.length > 25 ? mediaDe(h.slice(0, 10)) : null;
                var delta = (m !== null && antes !== null) ? m - antes : null;
                return '<div class="cartao cartao--serie">' +
                    '<h3>' + esc(x.nome) + '</h3>' +
                    '<div class="serie-num">' + (m === null ? '—' : m + '%') +
                    (delta !== null ? '<span class="delta ' + (delta >= 0 ? 'up' : 'down') + '">' +
                        (delta >= 0 ? '▲' : '▼') + Math.abs(delta) + '</span>' : '') + '</div>' +
                    grafico(h) +
                    '<p class="sub">' + esc(x.desc) + ' · ' + h.length + ' medições</p>' +
                    '</div>';
            }).join('') +
            '</div>' +

            '<div class="cartao">' +
            '<h3>Constância</h3>' +
            '<div class="streak-linha">' +
            '<div class="streak-num">' + s.streak.atual + '<small>dias seguidos</small></div>' +
            '<div class="streak-num">' + s.streak.recorde + '<small>recorde</small></div>' +
            '<div class="streak-num">' + F.store.diasEstudados() + '<small>dias com prática</small></div>' +
            '<div class="streak-num">' + Math.round(F.store.minutosTotais() / 60) + 'h<small>de treino</small></div>' +
            '</div>' +
            barrasMinutos() +
            '</div>' +

            '<div class="grade-2">' +
            '<div class="cartao">' +
            '<h3>Programa</h3>' +
            '<p class="serie-num">' + sem.s + '<small>/' + F.data.curriculo.length + '</small></p>' +
            ui.barra((sem.s / F.data.curriculo.length) * 100) +
            '<p class="sub">Fase ' + sem.fase + ': ' + esc(F.curso.fase(sem.fase).nome) + '</p>' +
            '</div>' +
            '<div class="cartao">' +
            '<h3>Blocos na memória</h3>' +
            '<p class="serie-num">' + chunks.aprendidos + '<small>/' + chunks.total + '</small></p>' +
            ui.barra((chunks.aprendidos / chunks.total) * 100) +
            '<p class="sub">' + chunks.revisar + ' para revisar hoje · ' + chunks.novos + ' ainda não vistos</p>' +
            '</div>' +
            '</div>' +

            '<div class="cartao">' +
            '<h3>O teste dos seis meses</h3>' +
            '<p class="sub">Grave hoje 90 segundos falando sobre o seu trabalho. Guarde. Refaça na semana 12, na 24 e na 48, ' +
            'com o mesmo tema. É a única avaliação que não mente — e ela não cabe em nenhum número desta tela.</p>' +
            '<p class="legenda">Tema fixo: <i>“Tell me about what you do for a living, and what a normal ' +
            'day looks like.”</i> Fale 90 segundos sem parar. O app guarda as duas últimas.</p>' +
            F.pratica.gravador('pg-teste') +
            '</div>';
    }

    function montar() {
        F.pratica.ligarGravador('pg-teste', { chave: 'teste-6-meses' });
    }

    function faixa(n) {
        if (n >= 85) return 'Faixa quase-nativa: você conduz conversa, discorda e improvisa sem preparar antes.';
        if (n >= 70) return 'Avançado real: se vira em qualquer situação, ainda com esforço em velocidade alta.';
        if (n >= 50) return 'Intermediário alto: comunica bem o que planejou, trava no improviso.';
        if (n >= 30) return 'Começando o programa. O número sobe rápido nas primeiras semanas — não pare agora.';
        return 'Poucos dados ainda. Faça o ciclo completo por uma semana e volte aqui.';
    }

    function mediaDe(arr) {
        if (!arr.length) return null;
        return Math.round(arr.reduce(function (a, b) { return a + b.p; }, 0) / arr.length);
    }

    /* Minigráfico em SVG, sem biblioteca nenhuma. */
    function grafico(h) {
        if (!h.length) return '<div class="grafico grafico--vazio">sem dados ainda</div>';
        var pontos = h.slice(-40);
        var larg = 260, alt = 54;
        var passo = pontos.length > 1 ? larg / (pontos.length - 1) : larg;
        var d = pontos.map(function (p, i) {
            return (i ? 'L' : 'M') + (i * passo).toFixed(1) + ' ' + (alt - (p.p / 100) * alt).toFixed(1);
        }).join(' ');
        return '<svg class="grafico" viewBox="0 0 ' + larg + ' ' + alt + '" preserveAspectRatio="none">' +
            '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2" ' +
            'stroke-linejoin="round" stroke-linecap="round"/></svg>';
    }

    function barrasMinutos() {
        var s = F.store.get();
        var meta = s.config.metaDiaria || 60;
        var hoje = new Date();
        var barras = [];
        for (var i = 13; i >= 0; i--) {
            var d = new Date(hoje.getTime() - i * 86400000);
            var k = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
            var min = s.minutos[k] || 0;
            var h = Math.min(100, Math.round((min / meta) * 100));
            barras.push('<div class="mb" title="' + k + ': ' + min + ' min">' +
                '<i style="height:' + Math.max(3, h) + '%"></i>' +
                '<small>' + ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][d.getDay()] + '</small></div>');
        }
        return '<div class="minutos-barras">' + barras.join('') + '</div>' +
            '<p class="legenda">Últimos 14 dias contra a meta de ' + meta + ' minutos.</p>';
    }

    function p2(n) { return n < 10 ? '0' + n : '' + n; }

    return { render: render, montar: montar };
})();

</script>
    <script>
/* =========================================================
   Fluência 180 — montagem, navegação e telas gerais.
   ========================================================= */
window.F = window.F || {};
F.telas = F.telas || {};

(function () {
    'use strict';

    var ui = F.ui, esc = F.ui.esc;
    var telaAtual = null;

    /* ---------------- navegação ---------------- */

    var ROTAS = [
        'inicio', 'hoje', 'exercicios', 'pronuncia', 'shadowing', 'escuta', 'chunks',
        'drills', 'conversa', 'reversa', 'explicar', 'pegaoerro', 'erros', 'plano',
        'progresso', 'config', 'metodo'
    ];

    function rota() {
        var h = (location.hash || '').replace(/^#\/?/, '');
        var partes = h.split('/').filter(Boolean);
        var nome = partes[0] || (F.store.get().pacto ? 'hoje' : 'inicio');
        if (ROTAS.indexOf(nome) < 0) nome = 'hoje';
        return { nome: nome, args: partes.slice(1) };
    }

    function ir(hash) { location.hash = hash; }

    function desenhar() {
        var r = rota();
        var tela = F.telas[r.nome];
        var alvo = ui.$('tela');
        if (!tela) { alvo.innerHTML = '<p class="vazio">Tela não encontrada.</p>'; return; }

        // deixa a tela anterior desligar timers e áudio
        if (telaAtual && telaAtual.desmontar) { try { telaAtual.desmontar(); } catch (e) { } }
        F.voz.pararFala();
        F.voz.pararEscuta();
        // sair no meio de uma gravação deixaria o microfone preso pelo próprio app
        if (F.voz.gravando()) F.voz.pararGravacao();
        else F.voz.soltarStream();

        telaAtual = tela;
        ui.fecharModal();
        ui.limparAjudas();
        alvo.innerHTML = tela.render(r.args) || '';
        alvo.scrollTop = 0;
        window.scrollTo(0, 0);
        if (tela.montar) tela.montar(r.args);
        pintarCabecalho();
        marcarNav(r.nome);
    }

    function marcarNav(nome) {
        var mapa = { hoje: 'hoje', exercicios: 'exercicios', plano: 'plano', progresso: 'progresso' };
        var grupo = mapa[nome] || (['pronuncia', 'shadowing', 'escuta', 'chunks', 'drills', 'conversa', 'reversa', 'explicar', 'pegaoerro', 'erros'].indexOf(nome) >= 0 ? 'exercicios' : '');
        ui.qq('.nav-item').forEach(function (b) {
            b.classList.toggle('is-on', b.getAttribute('data-nav') === grupo);
        });
    }

    /* ---------------- cabeçalho ---------------- */

    function pintarCabecalho() {
        var s = F.store.get();
        var min = F.store.minutosHoje();
        var meta = s.config.metaDiaria || 60;
        var pct = Math.min(100, Math.round((min / meta) * 100));
        ui.$('cab-streak').textContent = s.streak.atual;
        ui.$('cab-min').textContent = min + '/' + meta + ' min';
        ui.$('cab-semana').textContent = 'Semana ' + s.semana;
        ui.$('cab-barra').style.width = pct + '%';
    }

    /* ---------------- tempo de estudo ---------------- */

    var segundos = 0;
    setInterval(function () {
        if (document.hidden) return;
        segundos++;
        if (segundos % 60 === 0) {
            F.store.registrarMinutos(1);
            pintarCabecalho();
        }
    }, 1000);

    /* ---------------- ações globais ---------------- */

    document.addEventListener('click', function (ev) {
        var fechar = ev.target.closest ? ev.target.closest('[data-fechar-modal]') : null;
        if (fechar || ev.target.id === 'modal') { ui.fecharModal(); return; }

        var ajuda = ev.target.closest ? ev.target.closest('[data-ajuda]') : null;
        if (ajuda) { ui.abrirAjuda(parseInt(ajuda.getAttribute('data-ajuda'), 10)); return; }

        var alvo = ev.target.closest ? ev.target.closest('[data-falar],[data-nav],[data-ir]') : null;
        if (!alvo) return;

        if (alvo.hasAttribute('data-falar')) {
            // tudo que é falado passa pelo limpador: sem seta, sem IPA, sem nota
            var t = F.texto.paraFalar(alvo.getAttribute('data-falar'));

            var rate = parseFloat(alvo.getAttribute('data-rate') || '0') || undefined;

            setTimeout(function () { alvo.classList.remove('is-falando'); }, 600);

        if (alvo.hasAttribute('data-ir')) { ir(alvo.getAttribute('data-ir')); return; }
        if (alvo.hasAttribute('data-nav')) { ir('#/' + alvo.getAttribute('data-nav')); }
    });

            '</div>' +
            '<p class="sub" id="lem-status">…</p>' +
            '<div class="linha-botoes" id="lem-acoes"></div>' +
            '</div></div>';
    }

    function montarLembrete() {
        var s = F.store.get();
        var l = s.config.lembrete;

        function salvar() {
            F.store.salvar();
            F.lembrete.aplicar();
            pintarStatus();
        }

        /* O estado do aparelho manda mais que a configuração: adianta pouco
           dizer "próximo aviso amanhã" se a permissão de notificar está
           negada. Cada falta tem o seu próprio botão de conserto. */
        function pintarStatus() {
            var texto = ui.$('lem-status'), acoes = ui.$('lem-acoes');
            if (!texto || !acoes) return;
            var e = F.lembrete.estado();
            acoes.innerHTML = '';

            if (l.ligado && !e.pode) {
                texto.innerHTML = '<b class="fb--erro">O aparelho ainda não deixa o app avisar.</b> ' +
                    'Sem essa permissão nada é enviado.';
                acoes.innerHTML = '<button class="btn btn--forte" id="lem-permitir">Permitir avisos</button>';
                ui.$('lem-permitir').addEventListener('click', function () {
                    F.lembrete.pedirPermissao().then(function (ok) {
                        if (ok) { F.lembrete.aplicar(); ui.toast('Avisos liberados.'); }
                        else ui.toast('O aparelho recusou. Ajustes → Aplicativos → Fluência 180 → Notificações.', 'erro');
                        pintarStatus();
                    });
                });
                return;
            }

            texto.textContent = F.lembrete.descrever() +
                (e.onde === 'navegador' ? ' Só enquanto esta página estiver aberta — no app instalado o aviso chega com ele fechado.' : '');

            if (l.ligado && e.onde === 'android' && !e.exato) {
                acoes.innerHTML = '<button class="btn" id="lem-exato">Liberar alarme no horário certo</button>';
                ui.$('lem-exato').addEventListener('click', function () { F.lembrete.abrirAjustesDeAlarme(); });
                texto.innerHTML += ' <b class="fb--erro">O Android está segurando o alarme exato</b> — ' +
                    'o aviso pode atrasar alguns minutos até você liberar.';
            }
        }

        var lig = ui.$('lem-ligado');
        if (!lig) return;
        lig.addEventListener('change', function () {
            l.ligado = this.checked;
            ui.$('lem-corpo').hidden = !l.ligado;
            F.store.salvar();
            F.lembrete.aplicar();
            /* Pinta antes de pedir a permissão: o diálogo do sistema pode
               demorar ou nem aparecer, e até lá a tela estaria mostrando o
               estado anterior. */
            pintarStatus();
            if (l.ligado && !F.lembrete.estado().pode) {
                F.lembrete.pedirPermissao().then(function () { F.lembrete.aplicar(); pintarStatus(); });
            }
        });

        ui.qq('#lem-dias [data-dia]').forEach(function (b) {
            b.addEventListener('click', function () {
                var d = parseInt(b.getAttribute('data-dia'), 10);
                var i = l.dias.indexOf(d);
                if (i >= 0) l.dias.splice(i, 1); else l.dias.push(d);
                l.dias.sort();
                b.classList.toggle('is-on', i < 0);
                b.setAttribute('aria-pressed', i < 0);
                salvar();
            });
        });

        var hora = ui.$('lem-hora');
        hora.addEventListener('change', function () { l.hora = this.value || '19:00'; salvar(); });
        ui.$('lem-antes').addEventListener('change', function () { l.antes = parseInt(this.value, 10); salvar(); });
        pintarStatus();
    }

    F.telas.config = {
        render: function () {
            var c = F.store.get().config;
            var vozes = F.voz.listaVozes();
            var opts = ['<option value="">Escolher automaticamente</option>'].concat(vozes.map(function (v) {
                return '<option value="' + esc(v.name) + '"' + (c.voz === v.name ? ' selected' : '') + '>' +
                    esc(v.name) + ' — ' + esc(v.lang) + '</option>';
            })).join('');

            return ui.cabecalho('Ajustes', 'Voz, meta diária e seus dados.') +
                '<div class="cartao">' +
                '<label class="campo"><span>Sotaque de referência</span>' +
                '<select id="cfg-sotaque">' +
                ['en-US:Americano', 'en-GB:Britânico', 'en-AU:Australiano', 'en-IN:Indiano'].map(function (o) {
                    var p = o.split(':');
                    return '<option value="' + p[0] + '"' + (c.sotaque === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
                }).join('') +
                '</select></label>' +

                '<label class="campo"><span>Voz do aparelho ' +
                (vozes.length ? '(' + vozes.length + ' em inglês)' : '(nenhuma voz em inglês encontrada)') +
                '</span><select id="cfg-voz">' + opts + '</select></label>' +
                '<button class="btn btn--som" data-falar="This is how I sound. Repeat after me, and listen to the rhythm.">🔊 Testar a voz</button>' +

                '<label class="campo"><span>Velocidade da fala: <b id="cfg-rate-v">' + c.rate + '×</b></span>' +
                '<input type="range" id="cfg-rate" min="0.5" max="1.3" step="0.05" value="' + c.rate + '"></label>' +

                '<label class="campo"><span>Meta diária: <b id="cfg-meta-v">' + c.metaDiaria + ' min</b></span>' +
                '<input type="range" id="cfg-meta" min="15" max="120" step="5" value="' + c.metaDiaria + '"></label>' +

                '<label class="campo campo--linha"><input type="checkbox" id="cfg-pt"' + (c.mostrarPt ? ' checked' : '') + '>' +
                '<span>Mostrar a tradução em português por padrão</span></label>' +
                '</div>' +

                cartaoLembrete(c.lembrete) +

                '<div class="cartao">' +
                '<h3>Seus dados</h3>' +
                '<p class="sub">Tudo fica neste aparelho. Baixe uma cópia antes de trocar de celular ou limpar o navegador.</p>' +
                '<div class="linha-botoes">' +
                '<button class="btn" id="exportar">Baixar backup</button>' +
                '<button class="btn" id="importar">Restaurar backup</button>' +
                '<button class="btn btn--perigo" id="zerar">Apagar tudo</button>' +
                '</div>' +
                '<input type="file" id="arquivo" accept="application/json" hidden>' +
                '</div>' +

                '<div class="cartao">' +
                '<h3>Recursos do aparelho</h3>' +
                '<ul class="lista-status">' +
                linhaStatus('Falar (voz do sistema)', F.voz.temFala()) +
                linhaStatus('Ouvir você (reconhecimento de fala)', F.voz.temEscuta()) +
                linhaStatus('Gravar sua voz', F.voz.temGravacao()) +
                '</ul>' +
                (F.voz.temEscuta() ? '' : '<p class="sub">Sem reconhecimento de fala, todos os exercícios continuam ' +
                    'funcionando: no lugar de falar, você digita o que diria. O ideal é usar o Chrome.</p>') +
                '</div>' +

                '<div class="cartao">' +
                '<h3>Diagnóstico</h3>' +
                '<p class="sub">O que o aparelho respondeu nas últimas tentativas de falar, ouvir e gravar. ' +
                'Serve para descobrir a causa quando algo falha — copie e mande junto com o relato.</p>' +
                '<pre class="diag-body" id="diag-corpo">carregando…</pre>' +
                '<div class="linha-botoes">' +
                '<button class="btn" id="diag-atualizar">Atualizar</button>' +
                '<button class="btn" id="diag-copiar">Copiar</button>' +
                '</div>' +
                '</div>';
        },
        montar: function () {
            var s = F.store.get();
            function liga(id, fn) { var e = ui.$(id); if (e) e.addEventListener('change', fn); }
            liga('cfg-sotaque', function () { s.config.sotaque = this.value; s.config.voz = ''; F.store.salvar(); desenhar(); });
            liga('cfg-voz', function () { s.config.voz = this.value; F.store.salvar(); });
            liga('cfg-pt', function () { s.config.mostrarPt = this.checked; F.store.salvar(); });

            var r = ui.$('cfg-rate');
            r.addEventListener('input', function () {
                s.config.rate = parseFloat(this.value);
                ui.$('cfg-rate-v').textContent = s.config.rate.toFixed(2) + '×';
                F.store.salvar();
            });
            var m = ui.$('cfg-meta');
            m.addEventListener('input', function () {
                s.config.metaDiaria = parseInt(this.value, 10);
                ui.$('cfg-meta-v').textContent = s.config.metaDiaria + ' min';
                F.store.salvar();
                pintarCabecalho();
            });

            montarLembrete();

            ui.$('exportar').addEventListener('click', function () {
                var blob = new Blob([F.store.exportar()], { type: 'application/json' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'fluencia180-' + F.store.hoje() + '.json';
                document.body.appendChild(a); a.click(); a.remove();
                ui.toast('Backup baixado.');
            });
            ui.$('importar').addEventListener('click', function () { ui.$('arquivo').click(); });
            ui.$('arquivo').addEventListener('change', function () {
                var f = this.files[0];
                if (!f) return;
                var leitor = new FileReader();
                leitor.onload = function () {
                    try {
                        F.store.importar(leitor.result);
                        F.lembrete.aplicar();
                        ui.toast('Backup restaurado.');
                        desenhar();
                    } catch (e) { ui.toast('Arquivo inválido.', 'erro'); }
                };
                leitor.readAsText(f);
            });
            /* Diagnóstico: o que o app registrou no aparelho. */
            function pintarDiag() {
                var el = ui.$('diag-corpo');
                if (!el) return;
                var linhas = [];
                linhas.push('navegador: ' + navigator.userAgent);
                linhas.push('fala: ' + (F.voz.temFala() ? 'sim' : 'não') +
                    ' · escuta: ' + (F.voz.temEscuta() ? 'sim' : 'não') +
                    ' · gravação: ' + (F.voz.temGravacao() ? 'sim' : 'não'));
                var nativo = window.__android;
                linhas.push('app Android: ' + (nativo ? 'versão ' + nativo.versao : 'não (rodando no navegador)'));
                if (nativo && nativo.diagnostico) {
                    var d = nativo.diagnostico();
                    if (d) linhas.push('', d);
                }
                if (F.diag && F.diag.linhas().length) {
                    linhas.push('', '— eventos da página —', F.diag.linhas().join('\n'));
                }
                el.textContent = linhas.join('\n');
            }
            pintarDiag();
            ui.$('diag-atualizar').addEventListener('click', pintarDiag);
            ui.$('diag-copiar').addEventListener('click', function () {
                var t = ui.$('diag-corpo').textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(t).then(function () { ui.toast('Diagnóstico copiado.'); },
                        function () { ui.toast('Não consegui copiar — selecione o texto à mão.', 'erro'); });
                } else {
                    ui.toast('Selecione o texto e copie à mão.');
                }
            });

            ui.$('zerar').addEventListener('click', function () {
                if (!confirm('Apagar todo o seu progresso? Isso não tem volta.')) return;
                F.store.zerar();
                ir('#/inicio');
                desenhar();
            });
        }
    };

    function linhaStatus(nome, ok) {
        return '<li class="' + (ok ? 'ok' : 'nao') + '">' + (ok ? '✓' : '✕') + ' ' + esc(nome) + '</li>';
    }

    /* =========================================================
       TELA: o método (por que cada exercício existe)
       ========================================================= */
    F.telas.metodo = {
        render: function () {
            return ui.cabecalho('Por que este método funciona',
                'Escola missionária de idiomas: o que ela faz de diferente, e por que dá certo com brasileiro.') +
                '<div class="cartao texto-longo">' +
                '<h3>1. A língua se aprende usando, não estudando</h3>' +
                '<p>No treinamento missionário, o aluno recebe uma tarefa real — ensinar uma lição, visitar uma família — ' +
                'e a língua é o instrumento para cumprir a tarefa. Ninguém "estuda inglês": as pessoas resolvem coisas ' +
                'em inglês. É por isso que aqui todo exercício tem um objetivo comunicativo, e não uma lista de vocabulário.</p>' +

                '<h3>2. Bloco, não palavra</h3>' +
                '<p>Quem monta a frase peça por peça sempre vai falar devagar, por mais que saiba gramática. ' +
                'O falante fluente puxa blocos prontos da memória — <i>to be honest with you</i>, <i>that makes sense</i>, ' +
                '<i>I see where you are coming from</i>. São mais de seiscentos blocos aqui, por função, e a repetição ' +
                'espaçada garante que eles fiquem.</p>' +

                '<h3>3. Falar antes de estar pronto</h3>' +
                '<p>A regra SYL existe para tirar a saída fácil. Quem pode voltar ao português quando falta uma palavra ' +
                'nunca desenvolve a habilidade mais importante da fluência: <b>contornar</b> — explicar a palavra que ' +
                'você não sabe usando as que você sabe. Nativo faz isso o tempo todo.</p>' +

                '<h3>4. Repetição até virar reflexo</h3>' +
                '<p>Os drills de estímulo e resposta parecem antiquados, e são: vêm do método audiolingual, que a escola ' +
                'missionária nunca abandonou porque funciona para uma coisa específica — automatizar estrutura. ' +
                'Enquanto você precisar pensar para formar um present perfect, ele não existe na sua fala espontânea.</p>' +

                '<h3>5. Constância mata talento</h3>' +
                '<p>Quarenta e cinco minutos por dia durante seis meses são cento e trinta e cinco horas de prática ' +
                'concentrada. Três horas num sábado, uma vez por mês, não são nada. O app mede sua sequência de dias ' +
                'porque é a única métrica que prevê o resultado final.</p>' +

                '<h3>6. Erro corrigido na hora, sem drama</h3>' +
                '<p>O app te ouve, mostra o que saiu diferente e nomeia o erro típico de brasileiro por trás. ' +
                'Sem nota vermelha, sem humilhação, sem elogio falso: informação exata e a próxima tentativa.</p>' +

                '<h3>O que este método NÃO é</h3>' +
                '<p>Não é curso de gramática, não substitui conversar com gente de verdade e não faz milagre em quem ' +
                'não abre a boca. As missões semanais existem justamente para te empurrar para fora do app — ' +
                'é lá fora que a fluência acontece. Aqui é o treino.</p>' +
                '</div>';
        }
    };

    /* ---------------- boot ---------------- */

    F.app = { ir: ir, desenhar: desenhar, pintarCabecalho: pintarCabecalho };

    document.addEventListener('DOMContentLoaded', function () {
        F.store.limparGravacoesMortas();
        /* Reaplica o lembrete na abertura: se o aparelho perdeu os alarmes
           (backup restaurado, app reinstalado), o plano guardado aqui é a
           única cópia que sobrou. */
        F.lembrete.aplicar();
        if (!location.hash) location.hash = F.store.get().pacto ? '#/hoje' : '#/inicio';
        desenhar();
        if ('serviceWorker' in navigator) {
            location.protocol !== 'file:' && navigator.serviceWorker.register('sw.js').catch(function () { });
        }
    });
})();

</script>
</body>

</html>
