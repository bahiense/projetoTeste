<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b2a3a">
    <meta name="description"
        content="Plano de leitura bíblica em oito frentes paralelas, com explicação completa de cada capítulo escrita por IA: contexto, personagens, hebraico e grego, teólogos e como o texto aponta para Cristo.">
    <title>Leitura Bíblica — plano e estudo</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Leitura Bíblica">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecalho">
        <a class="marca" href="#/hoje">Leitura&nbsp;<b>Bíblica</b></a>
        <div class="cab-info">
            <span class="cab-chip" title="dias seguidos de leitura">🔥 <b id="cab-streak">0</b></span>
            <span class="cab-chip" title="quanto da Bíblia você já leu"><b id="cab-pct">0%</b></span>
            <a class="cab-eng" id="cab-config" href="#/config" aria-label="Ajustes">⚙</a>
        </div>
        <div class="cab-progresso"><i id="cab-barra"></i></div>
    </header>

    <main id="tela" class="tela"></main>

    <nav class="nav">
        <button class="nav-item is-on" data-nav="hoje"><span>◎</span>Hoje</button>
        <button class="nav-item" data-nav="estudo"><span>✦</span>Estudo</button>
        <button class="nav-item" data-nav="biblia"><span>▤</span>Bíblia</button>
        <button class="nav-item" data-nav="progresso"><span>📈</span>Progresso</button>
    </nav>

    <div class="modal" id="modal" hidden>
        <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal-topo">
                <h3 id="modal-titulo"></h3>
                <button class="modal-x" id="modal-x" aria-label="Fechar">✕</button>
            </div>
            <div class="modal-corpo" id="modal-corpo"></div>
            <div class="modal-pe" id="modal-pe"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="data/biblia.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/texto.js"></script>
    <script src="js/store.js"></script>
    <script src="js/plano.js"></script>
    <script src="js/estudos.js"></script>
    <script src="js/prompts.js"></script>
    <script src="js/ia.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ponte-android.js"></script>
    <script src="js/views/hoje.js"></script>
    <script src="js/views/ler.js"></script>
    <script src="js/views/estudo.js"></script>
    <script src="js/views/biblia.js"></script>
    <script src="js/views/progresso.js"></script>
    <script src="js/views/config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
