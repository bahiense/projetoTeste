<style>
/* Layout: uma coluna de leitura (~680px), topo fixo com abas; cada lição é um caderno. */
:root {
    --fundo: #f6f5f1;
    --papel: #ffffff;
    --papel2: #efede6;
    --linha: #dcd8cc;
    --tinta: #1b1f2a;
    --fraco: #5f6573;
    --acento: #1f6b4f;
    --acento-txt: #ffffff;
    --latao: #8a6a1f;
    --erro: #b3362f;
    --certo-fundo: #e3f2ea;
    --errado-fundo: #f8e4e2;
    --aluno: #e4efe9;
    --display: "Literata", Georgia, "Times New Roman", serif;
    --texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --fundo: #12151d; --papel: #1a1e29; --papel2: #232837; --linha: #2e3446;
        --tinta: #e9ecf3; --fraco: #9ba3b6; --acento: #4cc38a; --acento-txt: #0b1a12;
        --latao: #e0bf6c; --erro: #ff7b72; --certo-fundo: #183526; --errado-fundo: #3a1d1d; --aluno: #1f3a2d;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --fundo: #12151d; --papel: #1a1e29; --papel2: #232837; --linha: #2e3446;
    --tinta: #e9ecf3; --fraco: #9ba3b6; --acento: #4cc38a; --acento-txt: #0b1a12;
    --latao: #e0bf6c; --erro: #ff7b72; --certo-fundo: #183526; --errado-fundo: #3a1d1d; --aluno: #1f3a2d;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body {
    background: var(--fundo); color: var(--tinta);
    font: 16px/1.62 var(--texto);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fundo); }
button, input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

#topo {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--fundo); border-bottom: 1px solid var(--linha);
}
.barra-topo {
    display: flex; align-items: center; gap: 4px; max-width: 760px; margin: 0 auto;
    padding-block: 8px;
    padding-left: max(10px, env(safe-area-inset-left, 0px));
    padding-right: max(10px, env(safe-area-inset-right, 0px));
}
#titulo { flex: 1; min-width: 0; margin: 0; font: 600 18px/1.25 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 24px; line-height: 1; cursor: pointer; }
.icone:hover { background: var(--papel2); }
#abas {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 760px; margin: 0 auto;
    padding-block: 0 10px;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
}
#abas::-webkit-scrollbar { display: none; }
#abas button {
    flex: 0 0 auto; border: 1px solid var(--linha); border-radius: 999px; background: var(--papel);
    padding: 5px 13px; font-size: 14px; cursor: pointer;
}
#abas button.ativa { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); font-weight: 600; }

#tela {
    max-width: 760px; margin: 0 auto;
    padding-block: 18px 130px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h2 { font: 600 25px/1.25 var(--display); margin: 4px 0 10px; text-wrap: balance; }
h3 { font: 600 19px/1.3 var(--display); margin: 22px 0 8px; text-wrap: balance; }
h4 { font-size: 16px; margin: 16px 0 6px; }
p { margin: 0 0 12px; }
a { color: var(--acento); }
.fraco { color: var(--fraco); }
.peq { font-size: 14px; }
.centro { text-align: center; }
.pilha { display: flex; flex-direction: column; gap: 12px; }

.cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 15px; min-width: 0; }
.cartao.toque { cursor: pointer; }
.cartao.toque:hover { border-color: var(--acento); }
.cartao > :last-child { margin-bottom: 0; }
.rotulo { display: block; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--acento); font-weight: 700; margin-bottom: 4px; }
.rotulo.latao { color: var(--latao); }
.rotulo.erro { color: var(--erro); }

.texto blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--latao); color: var(--tinta); }
.texto ul, .texto ol { padding-left: 22px; margin: 0 0 12px; }
.texto li { margin-bottom: 5px; }
.texto code { background: var(--papel2); padding: 1px 5px; border-radius: 5px; }
.texto > :last-child { margin-bottom: 0; }
.frase { font: italic 18px/1.45 var(--display); color: var(--latao); border-left: 3px solid var(--latao); padding-left: 12px; margin: 8px 0 16px; }

.marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.marca { font-size: 12.5px; color: var(--fraco); border: 1px solid var(--linha); border-radius: 999px; padding: 1px 9px; }
.marca.ok { color: var(--acento); border-color: var(--acento); }

.botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 10px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--linha); background: var(--papel); font-weight: 600;
}
.botao:hover { border-color: var(--acento); }
.botao.principal { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); }
.botao.perigo { color: var(--erro); }
.botao.largo { width: 100%; }
.botao:disabled { opacity: .55; cursor: default; }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.botoes .botao { flex: 1 1 auto; }

.titulo-licao { display: flex; gap: 8px; align-items: flex-start; }
.titulo-licao > div { flex: 1; min-width: 0; }
.girando { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; border: 2px solid var(--linha); border-top-color: var(--acento); border-radius: 50%; animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .girando { animation-duration: 3s; } }
.progresso { height: 6px; background: var(--papel2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.progresso > i { display: block; height: 100%; background: var(--acento); }

.modulo-item { display: flex; gap: 12px; align-items: flex-start; }
.modulo-item .num { flex: 0 0 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--papel2); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.modulo-item.lido .num { background: var(--acento); color: var(--acento-txt); }
.modulo-item > div:last-child { min-width: 0; }

.alternativa { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--linha); background: var(--papel); cursor: pointer; }
.alternativa.certa { border-color: var(--acento); background: var(--certo-fundo); }
.alternativa.errada { border-color: var(--erro); background: var(--errado-fundo); }
.placar { font-size: 14px; color: var(--fraco); font-variant-numeric: tabular-nums; }
.flash { min-height: 220px; display: grid; place-items: center; text-align: center; font: 20px/1.4 var(--display); padding: 24px; cursor: pointer; }
.flash .lado { font: 600 11.5px/1 var(--texto); letter-spacing: .1em; text-transform: uppercase; color: var(--fraco); margin-bottom: 10px; }

textarea, input[type=text], input[type=search] { width: 100%; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
textarea { min-height: 150px; resize: vertical; }

.conversa { display: flex; flex-direction: column; gap: 10px; }
.fala { padding: 11px 14px; border-radius: 14px; max-width: 94%; min-width: 0; }
.fala.aluno { align-self: flex-end; background: var(--aluno); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.fala.prof { align-self: flex-start; background: var(--papel); border: 1px solid var(--linha); border-bottom-left-radius: 4px; }
.fala.prof .quem { font-size: 12px; color: var(--latao); font-weight: 700; margin-bottom: 4px; }
.fala.falhou { border-color: var(--erro); }
.escrever {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--fundo); border-top: 1px solid var(--linha);
    padding-top: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.escrever > div { display: flex; gap: 8px; align-items: flex-end; max-width: 760px; margin: 0 auto; }
.escrever textarea { min-height: 46px; max-height: 160px; flex: 1; }
.escrever .botao { min-width: 60px; }

#aviso {
    position: fixed; z-index: 9; background: var(--tinta); color: var(--fundo); border-radius: 10px; padding: 12px 14px;
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto;
}
.vazio { text-align: center; color: var(--fraco); padding: 36px 8px; }
.vazio .grande { font: 600 44px/1 var(--display); color: var(--latao); margin-bottom: 10px; }
details summary { cursor: pointer; font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--linha); margin: 18px 0; }
.etapas { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.etapas li { padding: 2px 0; color: var(--fraco); }
.etapas li.feita { color: var(--acento); }
.etapas li.agora { color: var(--tinta); font-weight: 600; }
</style>

<header id="topo">
    <div class="barra-topo">
        <button id="voltar" class="icone" aria-label="Voltar" hidden>‹</button>
        <h1 id="titulo">Professor de Política</h1>
    </div>
    <nav id="abas" hidden></nav>

<main id="tela"></main>
<div id="aviso" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   Markdown simples para HTML. Tudo é escapado antes: texto
   vindo do Claude nunca entra na página como marcação.
   ========================================================= */
function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function linha(t) {
    var s = esc(t);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
}
function md(texto) {
    var linhas = String(texto || '').replace(/\r/g, '').split('\n');
    var html = [], lista = null, par = [], cit = false;
    function fp() { if (par.length) { html.push('<p>' + linha(par.join(' ')) + '</p>'); par = []; } }
    function fl() { if (lista) { html.push('</' + lista + '>'); lista = null; } }
    function fc() { if (cit) { html.push('</blockquote>'); cit = false; } }
    linhas.forEach(function (l) {
        var t = l.trim();
        if (!t) { fp(); fl(); fc(); return; }
        var h = t.match(/^(#{1,6})\s+(.*)$/);
        if (h) { fp(); fl(); fc(); var n = Math.min(6, h[1].length + 2); html.push('<h' + n + '>' + linha(h[2]) + '</h' + n + '>'); return; }
        if (/^(-{3,}|\*{3,})$/.test(t)) { fp(); fl(); fc(); html.push('<hr>'); return; }
        var ul = t.match(/^[-*•]\s+(.*)$/), ol = t.match(/^(\d+)[.)]\s+(.*)$/);
        if (ul || ol) {
            fp(); fc();
            var tipo = ul ? 'ul' : 'ol';
            if (lista && lista !== tipo) fl();
            if (!lista) { lista = tipo; html.push('<' + tipo + '>'); }
            html.push('<li>' + linha(ul ? ul[1] : ol[2]) + '</li>');
            return;
        }
        fl();
        var c = t.match(/^>\s?(.*)$/);
        if (c) { fp(); if (!cit) { html.push('<blockquote>'); cit = true; } html.push('<p>' + linha(c[1]) + '</p>'); return; }
        fc();
        par.push(t);
    });
    fp(); fl(); fc();
    return html.join('\n');
}
function lista(a) { return Array.isArray(a) ? a : []; }

/* =========================================================
   Onde as lições ficam: no banco do artifact, numa pasta
   particular de cada pessoa (ninguém mais lê). Sem o banco,
   cai para o navegador.
   ========================================================= */
var Banco = {
    col: null, local: true, metas: [],
    iniciar: async function () {
        try {
            var db = await usar('db'), user = await usar('user');
            var uid = user ? await user.id() : null;
            if (db && uid) { this.col = db.collection('data/users/' + uid); this.local = false; }
        } catch (e) { this.col = null; }
        await this.carregarMetas();
    },
    carregarMetas: async function () {
        if (this.col) {
            try {
                var snap = await comPrazo(this.col.where('tipo', '==', 'meta').get(), 12000);
                this.metas = snap.docs.map(function (d) { return JSON.parse(JSON.stringify(d.data())); });
            } catch (e) { aviso('Não consegui ler suas lições agora. Recarregue a página.'); this.metas = []; }
        } else {
            this.metas = Object.keys(localStorageSeguro()).filter(function (k) { return k.indexOf('pol:m-') === 0; })
                .map(function (k) { return lerLocal(k); }).filter(Boolean);
        }
        this.metas.sort(function (a, b) { return (b.criada || 0) - (a.criada || 0); });
    },
    ler: async function (chave) {
        if (this.col) {
            var d = await comPrazo(this.col.doc(chave).get(), 15000);
            // o banco entrega o documento congelado; a página precisa de uma cópia que possa mudar
            return d.exists ? JSON.parse(JSON.stringify(d.data())) : null;
        }
        return lerLocal('pol:' + chave);
    },
    gravar: async function (chave, valor) {
        if (this.col) return this.col.doc(chave).set(JSON.parse(JSON.stringify(valor)));
        gravarLocal('pol:' + chave, valor);
    },
    apagar: async function (chave) {
        if (this.col) { try { await this.col.doc(chave).delete(); } catch (e) {} return; }
        try { localStorage.removeItem('pol:' + chave); } catch (e) {}
    },
    meta: function (id) { return this.metas.filter(function (m) { return m.id === id; })[0]; },
    salvarMeta: async function (m) {
        m.tipo = 'meta';
        if (!this.meta(m.id)) this.metas.unshift(m);
        await this.gravar('m-' + m.id, m);
    }
};
/* Fora do Claude não existe window.claude: tudo que depende dele some. */
function usar(nome) {
    return window.claude && typeof window.claude.use === 'function' ? window.claude.use(nome) : Promise.resolve(null);
}
function comPrazo(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('prazo')); }, ms); })]);
}
function localStorageSeguro() { try { return localStorage; } catch (e) { return {}; } }
function lerLocal(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function gravarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { aviso('O navegador ficou sem espaço.'); } }

/* =========================================================
   O professor: quem ele é e como se pede cada parte.
   ========================================================= */
var PROFESSOR =
'Você é o Professor: professor universitário de ciência política, doutor, com décadas de pesquisa e vários livros publicados sobre teoria política, instituições brasileiras, partidos, eleições, Estado, poder e opinião pública. Você conhece os clássicos (de Aristóteles e Maquiavel a Weber, Schumpeter, Dahl, Sartori, Lijphart) e a ciência política brasileira (Abranches, Limongi e Figueiredo, Nicolau, Santos e outros).\n\n' +
'Seu aluno é um adulto brasileiro, inteligente e curioso, sem formação acadêmica na área. Ele faz um curso semanal: toda semana chega um PDF (em geral slides) com uma lição que junta um conceito de ciência política e um fato real da política brasileira. Ele quer sair de cada lição dominando o assunto, capaz de explicar para outra pessoa e de debater com qualquer um.\n\n' +
'Como você ensina:\n' +
'- Ensina tudo o que está no material, sem pular nada: cada slide, conceito, autor, dado, gráfico, tabela, exemplo, nota e verbete. O que o material só menciona de passagem, você explica por completo.\n' +
'- Fala simples. Frases claras, um termo técnico de cada vez, sempre definido na hora em que aparece.\n' +
'- Vai do simples ao complexo: a ideia numa frase, o desenvolvimento, um exemplo concreto (de preferência da política brasileira), depois nuances, críticas e limites.\n' +
'- Vai além do material com o seu conhecimento: origem das ideias, contexto histórico, autores que dialogam com o tema, críticas e contra-argumentos.\n' +
'- Autores: quem foi, quando e onde viveu, contexto e contra o que reagia, obras, ideias centrais e exatamente como se liga à lição.\n' +
'- Honestidade intelectual: separa fato de interpretação e de opinião; apresenta as correntes com justiça, no seu melhor argumento; não toma partido em disputas partidárias. Sobre fatos recentes, apoia-se no que o material diz, porque eles podem ser posteriores ao que você sabe; diga quando algo for incerto.\n' +
'- Nunca inventa dados, citações, datas, números ou títulos de obras. Na dúvida, diz que não tem certeza. Citação literal só quando for conhecida e fiel; senão, paráfrase sem aspas.\n' +
'- Escreve em português do Brasil. Nos textos longos, usa Markdown simples: parágrafos curtos separados por linha em branco, **negrito** nos termos importantes, listas com "- " e citações com "> ".';

function comMaterial(t, aula) {
    return PROFESSOR + '\n\n<material_da_licao>\n' + t + '\n</material_da_licao>\n\n' +
        (aula ? '<plano_da_aula>\n' + aula + '\n</plano_da_aula>\n\n' : '');
}

/* =========================================================
   Preparar a aula. Cada parte é um pedido separado, guardado
   assim que fica pronto: se algo falhar, continua de onde parou.
   ========================================================= */
var sampleFn = null, limites = null;
var gerando = {};   // id -> {texto, etapa}
var pdfs = {};      // id -> o PDF escolhido nesta visita (para continuar sem escolher de novo)

async function obterSample() {
    if (!sampleFn) sampleFn = await usar('sample');
    if (sampleFn && !limites) { try { limites = await sampleFn.limits(); } catch (e) { limites = {}; } }
    return sampleFn;
}

/* Cada página vira duas imagens (metade de cima e de baixo, com uma faixa em
   comum): o Claude recebe cada imagem com cerca de 1,2 megapixel, e assim a
   letra pequena dos slides chega com o dobro de resolução. O texto da página,
   quando o PDF tem, vai junto. */
async function pdfParaPaginas(arquivo, aoAvancar) {
    var dados = new Uint8Array(await arquivo.arrayBuffer());
    var pdf = await pdfjsLib.getDocument({ data: dados }).promise;
    var paginas = [];
    for (var n = 1; n <= pdf.numPages; n++) {
        aoAvancar('Abrindo o PDF: página ' + n + ' de ' + pdf.numPages);
        var pag = await pdf.getPage(n);
        var v = pag.getViewport({ scale: 1 });
        var escala = Math.sqrt(2200000 / (v.width * v.height));
        var vp = pag.getViewport({ scale: escala });
        var c = document.createElement('canvas');
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await pag.render({ canvasContext: ctx, viewport: vp }).promise;
        var metade = Math.round(c.height * 0.56), imgs = [];
        for (var k = 0; k < 2; k++) {
            var p = document.createElement('canvas');
            p.width = c.width; p.height = metade;
            p.getContext('2d').drawImage(c, 0, k === 0 ? 0 : c.height - metade, c.width, metade, 0, 0, c.width, metade);
            imgs.push(await new Promise(function (ok) { p.toBlob(ok, 'image/jpeg', 0.88); }));
        }
        var texto = '';
        try {
            var tc = await pag.getTextContent();
            texto = tc.items.map(function (it) { return it.str; }).join(' ').replace(/\s+/g, ' ').trim();
        } catch (e) {}
        paginas.push({ imgs: imgs, texto: texto });
    }
    return paginas;
}

var ETAPAS = ['Ler os slides', 'Planejar a aula', 'Escrever os módulos', 'Autores', 'Conceitos e cronologia', 'Debates', 'Exercícios', 'Revisão final'];

async function preparar(id, arquivo) {
    if (gerando[id]) return;
    if (arquivo) pdfs[id] = arquivo; else arquivo = pdfs[id] || null;
    var m = Banco.meta(id);
    gerando[id] = { texto: 'Começando…', etapa: 0 };
    m.estado = 'gerando'; delete m.erro;
    await Banco.salvarMeta(m);
    redesenharSeInicio();
    var trava = null;
    try { trava = await navigator.wakeLock.request('screen'); } catch (e) {}
    function andar(etapa, texto) { gerando[id] = { etapa: etapa, texto: texto }; redesenharSeInicio(); }
    try {
        var s = await obterSample();
        if (!s) throw { message: 'Este app precisa ser aberto dentro do Claude (no app ou em claude.ai).' };

        /* 1. ler os slides, em lotes de imagens */
        var transc = await Banco.ler('t-' + id);
        if (!transc || !transc.completo) {
            if (!arquivo) throw { message: 'A leitura dos slides não terminou. Escolha o PDF de novo para continuar.', precisaPdf: true };
            if (!limites || !limites.images) throw { message: 'Esta tela não consegue mandar imagens ao Claude. Abra pelo app do Claude ou por claude.ai e permita imagens.' };
            var pags = await pdfParaPaginas(arquivo, function (t) { andar(0, t); });
            // páginas por pedido: duas imagens cada, até 3 páginas
            var lote = Math.max(1, Math.min(3, Math.floor((limites.images.maxCount || 2) / 2)));
            if (transc && transc.lote && transc.lote !== lote) transc = null;
            transc = transc && transc.partes ? transc : { partes: [], paginas: pags.length, lote: lote };
            for (var ini = transc.partes.length * lote; ini < pags.length; ini += lote) {
                var fim = Math.min(pags.length, ini + lote);
                andar(0, 'Lendo os slides ' + (ini + 1) + ' a ' + fim + ' de ' + pags.length + '…');
                var grupo = pags.slice(ini, fim);
                var textos = grupo.map(function (g, j) { return g.texto ? 'Página ' + (ini + j + 1) + ': ' + g.texto : ''; }).filter(Boolean).join('\n\n');
                var r = await s(
                    'As imagens são as páginas ' + (ini + 1) + ' a ' + fim + ' (de ' + pags.length + ') de uma aula de ciência política, em slides. ' +
                    'Cada página vem em duas imagens, na ordem: a metade de cima e a metade de baixo (elas se sobrepõem um pouco; não repita o que aparece nas duas).\n\n' +
                    (textos ? 'O texto que o PDF tem dessas páginas (use para conferir a grafia):\n' + textos + '\n\n' : '') +
                    'Transcreva cada página com fidelidade total, em Markdown, começando cada uma com "### Slide N — título". Inclua TODO o texto, inclusive o pequeno: títulos, parágrafos, rótulos, legendas, números, tabelas (como lista), gráficos (descreva o que mostram e os valores), notas de rodapé, fontes e citações. Não resuma e não comente: só transcreva. Se algo estiver ilegível, escreva [ilegível].',
                    { images: [].concat.apply([], grupo.map(function (g) { return g.imgs; })), modelTier: 'complex' });
                transc.partes.push(r.text);
                await Banco.gravar('t-' + id, transc);
            }
            transc.completo = true;
            await Banco.gravar('t-' + id, transc);
        }
        var material = transc.partes.join('\n\n');

        /* 2. o plano */
        var plano = await Banco.ler('a-' + id);
        if (!plano) {
            andar(1, 'Planejando a aula…');
            plano = await s.json(comMaterial(material) +
                'Planeje a AULA INTERATIVA completa desta lição. Os módulos seguem a ordem do material e juntos cobrem TODOS os slides (em geral de 6 a 12 módulos). Liste todos os autores citados e de 2 a 5 autores complementares essenciais para entender o tema.\n\n' +
                'Responda só com JSON neste formato:\n' +
                '{"titulo": "título da lição", "subtitulo": "uma frase com o que o aluno vai aprender", ' +
                '"visao_geral": "Markdown: o que é a lição, de onde vem o tema, por que importa e o que o aluno saberá fazer no fim", ' +
                '"roteiro": ["passo"], "modulos": [{"titulo": "...", "slides": "slides 3 a 5", "cobre": "lista do que este módulo deve ensinar"}], ' +
                '"autores": [{"nome": "...", "citado_no_pdf": true}]}',
                { modelTier: 'complex' });
            plano.n_modulos = lista(plano.modulos).length;
            await Banco.gravar('a-' + id, plano);
        }
        m.titulo = plano.titulo || m.titulo;
        await Banco.salvarMeta(m);
        var resumoPlano = JSON.stringify({ titulo: plano.titulo, modulos: plano.modulos, autores: plano.autores });

        /* 3. cada módulo */
        var mods = lista(plano.modulos);
        for (var i = 0; i < mods.length; i++) {
            if (await Banco.ler('mod-' + id + '-' + i)) continue;
            andar(2, 'Escrevendo o módulo ' + (i + 1) + ' de ' + mods.length + ': ' + mods[i].titulo);
            var mod = await s.json(comMaterial(material, resumoPlano) +
                'Escreva agora o MÓDULO ' + (i + 1) + ', "' + mods[i].titulo + '" (' + mods[i].slides + '), cobrindo: ' + mods[i].cobre + '.\n\n' +
                'A "explicacao" é uma aula de verdade: completa, de 500 a 1000 palavras, com tudo o que estes slides dizem (explique cada dado e gráfico e o que significa) e o que o aluno precisa saber além deles.\n\n' +
                'Responda só com JSON:\n{"titulo": "...", "slides": "...", "em_uma_frase": "a ideia central em uma frase simples", "explicacao": "Markdown longo", ' +
                '"exemplo": "Markdown: um exemplo concreto, de preferência da política brasileira", "por_que_importa": "Markdown curto: para que serve numa análise ou num debate", ' +
                '"cuidado": "Markdown curto: o erro de interpretação mais comum", "checagem": {"pergunta": "pergunta para o aluno verificar se entendeu", "resposta": "Markdown: resposta comentada"}}',
                { modelTier: 'complex' });
            await Banco.gravar('mod-' + id + '-' + i, mod);
        }

        /* 4. autores, de três em três */
        var aut = (await Banco.ler('aut-' + id)) || { lista: [], feitos: 0 };
        var nomes = lista(plano.autores);
        while (aut.feitos < nomes.length) {
            var grupo = nomes.slice(aut.feitos, aut.feitos + 3);
            andar(3, 'Autores: ' + grupo.map(function (a) { return a.nome; }).join(', '));
            var res = await s.json(comMaterial(material, resumoPlano) +
                'Escreva o verbete completo de cada um destes autores: ' + JSON.stringify(grupo) + '.\n\n' +
                'Responda só com JSON: {"autores": [{"nome": "...", "datas": "1469–1527", "origem": "país e área", "citado_no_pdf": true, ' +
                '"quem_foi": "Markdown: vida, contexto histórico em que escreveu e o problema que queria resolver", "ideias_centrais": ["ideia explicada em uma ou duas frases"], ' +
                '"obras": [{"titulo": "título como é conhecido no Brasil", "ano": "...", "sobre": "uma frase"}], ' +
                '"relacao_com_a_licao": "Markdown: exatamente como as ideias dele se ligam ao tema e aos fatos da lição", ' +
                '"dialogos": "Markdown: com quem concorda, a quem responde, quem o critica e por quê", "frase": "frase célebre ou ideia-síntese (paráfrase sem aspas se não for citação literal conhecida)"}]}. Só obras reais.',
                { modelTier: 'complex' });
            aut.lista = aut.lista.concat(lista(res.autores));
            aut.feitos += grupo.length;
            await Banco.gravar('aut-' + id, aut);
        }

        /* 5 a 8. o resto da aula */
        var partes = [
            { etapa: 4, chave: 'conc', texto: 'Conceitos e cronologia…', pedido:
                'Monte o GLOSSÁRIO (todos os verbetes do material e todos os outros termos técnicos da aula, em geral de 15 a 30) e a CRONOLOGIA (fatos e ideias em ordem, quando fizer sentido; pode ser vazia).\n\n' +
                'Responda só com JSON: {"conceitos": [{"termo": "...", "definicao": "linguagem simples", "exemplo": "...", "nao_confundir": "com o que costuma ser confundido e a diferença, ou vazio"}], ' +
                '"linha_do_tempo": [{"data": "...", "evento": "...", "importancia": "por que importa para a lição"}]}' },
            { etapa: 5, chave: 'deb', texto: 'Preparando os debates…', pedido:
                'Monte de 3 a 5 DEBATES: as grandes controvérsias reais do tema, com duas a quatro posições apresentadas com justiça.\n\n' +
                'Responda só com JSON: {"debates": [{"questao": "pergunta polêmica", "contexto": "Markdown: por que é disputado", ' +
                '"posicoes": [{"nome": "nome curto", "quem_defende": "autores, correntes ou atores", "argumentos": ["os melhores argumentos"], "ponto_fraco": "onde é mais vulnerável"}], ' +
                '"como_debater": "Markdown: dados a usar, armadilhas, perguntas que desmontam o adversário"}]}' },
            { etapa: 6, chave: 'quiz', texto: 'Escrevendo as questões…', pedido:
                'Escreva de 20 a 25 questões de MÚLTIPLA ESCOLHA cobrindo todos os módulos e autores, das fáceis às difíceis (alterne a posição da correta), e de 12 a 15 afirmações de VERDADEIRO OU FALSO com as confusões comuns.\n\n' +
                'Responda só com JSON: {"quiz": [{"pergunta": "...", "alternativas": ["A", "B", "C", "D"], "correta": 0, "explicacao": "por que a correta está certa e as outras erradas"}], ' +
                '"verdadeiro_falso": [{"afirmacao": "...", "verdadeira": true, "explicacao": "..."}]}' },
            { etapa: 7, chave: 'rev', texto: 'Flashcards, dissertativas e síntese…', pedido:
                'Escreva: de 25 a 35 FLASHCARDS (conceitos, autores, obras, datas, números); de 5 a 8 questões DISSERTATIVAS, do básico ao avançado, incluindo o exercício que o material propõe, se houver; de 8 a 12 ARGUMENTOS PRONTOS (frases-chave para um debate); de 4 a 8 leituras reais para ir além; e a SÍNTESE final da lição.\n\n' +
                'Responda só com JSON: {"flashcards": [{"frente": "...", "verso": "..."}], "dissertativas": [{"enunciado": "...", "nivel": "básico|intermediário|avançado", "pontos_esperados": ["..."]}], ' +
                '"argumentos_prontos": ["..."], "aprofundamento": [{"titulo": "...", "autor": "...", "por_que": "o que o aluno ganha lendo"}], "sintese": "Markdown: o que levar para casa"}' }
        ];
        for (var k = 0; k < partes.length; k++) {
            var p = partes[k];
            if (await Banco.ler(p.chave + '-' + id)) continue;
            andar(p.etapa, p.texto);
            var obj = await s.json(comMaterial(material, resumoPlano) + p.pedido, { modelTier: 'complex' });
            await Banco.gravar(p.chave + '-' + id, obj);
        }

        m.estado = 'pronta';
        m.atualizada = Date.now();
        delete gerando[id];
        await Banco.salvarMeta(m);
        aviso('A aula ficou pronta!', 6000);
    } catch (e) {
        delete gerando[id];
        m.estado = 'erro';
        m.erro = traduzirErro(e);
        // ainda lendo slides e sem o PDF guardado nesta visita: o próximo passo precisa dele
        try { var tt = await Banco.ler('t-' + id); if (!(tt && tt.completo) && !pdfs[id]) m.precisaPdf = true; } catch (x) {}
        m.precisaPdf = !!(e && e.precisaPdf) || (m.precisaPdf && !pdfs[id]);
        await Banco.salvarMeta(m).catch(function () {});
        aviso(m.erro, 9000);
    } finally {
        if (trava) trava.release().catch(function () {});
        redesenharSeInicio();
    }
}

function traduzirErro(e) {
    var c = e && e.code;
    if (c === 'not_granted') return 'Você não permitiu que a página use o Claude. Toque em continuar e permita.';
    if (c === 'rate_limited') return 'Você chegou ao limite de uso do seu plano por agora. Espere o limite renovar e toque em "Continuar": o que já ficou pronto está guardado.';
    if (c === 'prompt_too_large') return 'A lição é grande demais para um pedido só. Divida o PDF em duas partes.';
    if (c === 'invalid_json' || c === 'empty_completion') return 'Uma das partes veio incompleta. Toque em "Continuar" para tentar de novo.';
    if (c === 'refused') return 'O Claude recusou uma das partes. Toque em "Continuar" para tentar de novo.';
    if (c === 'images_unavailable' || c === 'image_rejected') return 'Esta tela não conseguiu mandar as imagens dos slides. Abra pelo app do Claude ou por claude.ai.';
    if (c === 'sampling_disabled' || c === 'capability_disabled') return 'O uso do Claude por páginas está desligado na sua conta.';
    return (e && e.message) || 'Algo deu errado. Toque em "Continuar" para tentar de novo.';
}

/* Junta as partes guardadas numa aula só. */
async function lerAula(id) {
    var plano = await Banco.ler('a-' + id);
    if (!plano) return null;
    var d = Object.assign({}, plano);
    d.modulos = [];
    for (var i = 0; i < (plano.n_modulos || lista(plano.modulos).length); i++) {
        d.modulos.push((await Banco.ler('mod-' + id + '-' + i)) || { titulo: plano.modulos[i].titulo, explicacao: '(este módulo não foi escrito)' });
    }
    var aut = await Banco.ler('aut-' + id);
    d.autores = aut ? aut.lista : [];
    var extras = await Promise.all(['conc', 'deb', 'quiz', 'rev'].map(function (c) { return Banco.ler(c + '-' + id); }));
    extras.forEach(function (x) { if (x) Object.assign(d, x); });
    var t = await Banco.ler('t-' + id);
    d.material = t ? t.partes.join('\n\n') : '';
    return d;
}

/* =========================================================
   Cópias: levar para o app do celular e guardar para sempre.
   O arquivo vai para a pasta Downloads; o app Ciência Política
   (APK) acha "politica-*.json" lá sozinho. O mesmo arquivo
   restaura as aulas aqui, se um dia for preciso.
   ========================================================= */
async function pacoteDe(ids) {
    var aulas = [];
    for (var i = 0; i < ids.length; i++) {
        var m = Banco.meta(ids[i]), d = await lerAula(ids[i]);
        if (!m || !d) continue;
        aulas.push({ id: m.id, titulo: m.titulo, nome: m.nome, criada: m.criada, atualizada: m.atualizada || m.criada, aula: d });
    }
    return { formato: 'professor-de-politica', versao: 1, gerado: Date.now(), aulas: aulas };
}

function nomeArquivo(t) {
    return String(t || 'aula').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'aula';
}

async function baixarCopia(ids, nome) {
    var dl = await usar('downloads');
    if (!dl) { aviso('Esta tela não consegue baixar arquivos. Abra pelo app do Claude ou por claude.ai.', 7000); return false; }
    aviso('Preparando o arquivo…', 2000);
    var pacote = await pacoteDe(ids);
    if (!pacote.aulas.length) { aviso('Não há aula pronta para levar.'); return false; }
    try {
        await dl.save({ filename: nome, data: JSON.stringify(pacote) });
    } catch (e) {
        if (e && e.code === 'declined') return false;
        aviso('Não consegui baixar o arquivo (' + ((e && e.message) || 'erro') + ').', 7000);
        return false;
    }
    for (var i = 0; i < pacote.aulas.length; i++) {
        var m = Banco.meta(pacote.aulas[i].id);
        m.levada = m.atualizada || m.criada;
        await Banco.salvarMeta(m);
    }
    aviso('Arquivo salvo em Downloads. Abra o app Ciência Política: a aula entra sozinha.', 7000);
    redesenharSeInicio();
    return true;
}

async function restaurar(arquivo) {
    var pacote;
    try { pacote = JSON.parse(await arquivo.text()); } catch (e) { pacote = null; }
    if (!pacote || pacote.formato !== 'professor-de-politica') { aviso('Esse arquivo não é uma cópia do Professor de Política.'); return; }
    var n = 0;
    for (var i = 0; i < lista(pacote.aulas).length; i++) {
        var a = pacote.aulas[i], d = a.aula, id = String(a.id || '');
        if (!/^[a-z0-9]{1,20}$/.test(id) || !d || !Array.isArray(d.modulos)) continue;
        var ja = Banco.meta(id);
        if (ja && ja.estado === 'pronta' && (ja.atualizada || ja.criada) >= (a.atualizada || a.criada)) continue;
        await Banco.gravar('a-' + id, { titulo: d.titulo, subtitulo: d.subtitulo, visao_geral: d.visao_geral, roteiro: lista(d.roteiro),
            modulos: d.modulos.map(function (x) { return { titulo: x.titulo, slides: x.slides }; }),
            autores: lista(d.autores).map(function (x) { return { nome: x.nome, citado_no_pdf: x.citado_no_pdf }; }), n_modulos: d.modulos.length });
        for (var k = 0; k < d.modulos.length; k++) await Banco.gravar('mod-' + id + '-' + k, d.modulos[k]);
        await Banco.gravar('aut-' + id, { lista: lista(d.autores), feitos: lista(d.autores).length });
        await Banco.gravar('conc-' + id, { conceitos: lista(d.conceitos), linha_do_tempo: lista(d.linha_do_tempo) });
        await Banco.gravar('deb-' + id, { debates: lista(d.debates) });
        await Banco.gravar('quiz-' + id, { quiz: lista(d.quiz), verdadeiro_falso: lista(d.verdadeiro_falso) });
        await Banco.gravar('rev-' + id, { flashcards: lista(d.flashcards), dissertativas: lista(d.dissertativas),
            argumentos_prontos: lista(d.argumentos_prontos), aprofundamento: lista(d.aprofundamento), sintese: d.sintese || '' });
        await Banco.gravar('t-' + id, { partes: [d.material || ''], completo: true });
        await Banco.salvarMeta({ id: id, titulo: a.titulo || d.titulo, nome: a.nome || '', criada: a.criada || Date.now(),
            atualizada: a.atualizada || a.criada || Date.now(), estado: 'pronta', levada: a.atualizada || a.criada });
        n++;
    }
    Banco.metas.sort(function (x, y) { return (y.criada || 0) - (x.criada || 0); });
    aviso(n ? (n === 1 ? 'Uma aula restaurada.' : n + ' aulas restauradas.') : 'Essas aulas já estavam aqui.', 6000);
    redesenharSeInicio();
}

var $tela = document.getElementById('tela'), $titulo = document.getElementById('titulo');
var $voltar = document.getElementById('voltar'), $abas = document.getElementById('abas');
var $aviso = document.getElementById('aviso'), tempoAviso;
function aviso(t, ms) {
    $aviso.textContent = t; $aviso.hidden = false;
    clearTimeout(tempoAviso);
    tempoAviso = setTimeout(function () { $aviso.hidden = true; }, ms || 4000);
}
$aviso.onclick = function () { $aviso.hidden = true; };

var pilha = [];
function ir(t) { pilha.push(t); desenhar(true); }
function trocar(t) { pilha[pilha.length - 1] = t; desenhar(true); }
function voltar() { if (pilha.length > 1) { pilha.pop(); desenhar(false); } }
$voltar.onclick = voltar;
function redesenharSeInicio() { if (pilha.length === 1) desenhar(false); }

function desenhar(topo) {
    var t = pilha[pilha.length - 1];
    $titulo.textContent = t.titulo || 'Professor de Política';
    $voltar.hidden = pilha.length < 2;
    if (t.abas) {
        $abas.hidden = false;
        $abas.innerHTML = t.abas.map(function (a) {
            return '<button id="aba-' + a.id + '" data-aba="' + a.id + '"' + (a.id === t.aba ? ' class="ativa"' : '') + '>' + esc(a.nome) + '</button>';
        }).join('');
        $abas.querySelectorAll('button').forEach(function (b) {
            b.onclick = function () { t.aba = b.dataset.aba; desenhar(true); };
        });
    } else { $abas.hidden = true; }
    $tela.innerHTML = '';
    t.desenhar($tela);
    if (topo) window.scrollTo(0, 0);
    else if (t.rolagem) window.scrollTo(0, t.rolagem);
}
window.addEventListener('scroll', function () { var t = pilha[pilha.length - 1]; if (t) t.rolagem = window.scrollY; }, { passive: true });
function ao(raiz, sel, fn) { raiz.querySelectorAll(sel).forEach(function (n) { n.onclick = function (ev) { fn(n, ev); }; }); }

/* Confirmação dentro da página (o visualizador não mostra confirm()). */
function confirmar(botao, texto, acao) {
    if (botao.dataset.armado) { acao(); return; }
    botao.dataset.armado = '1';
    var original = botao.textContent;
    botao.textContent = texto;
    setTimeout(function () { if (botao.isConnected) { delete botao.dataset.armado; botao.textContent = original; } }, 4000);
}

    preparar(id, f);
};

function telaInicio() {

        desenhar: function (raiz) {

            if (!Banco.metas.length) {
                html += '<div class="vazio"><div class="grande">§</div>' +
                    '<p>Toda semana, toque em <b>Nova lição</b> e escolha o PDF da aula.</p>' +
                    '<p class="peq">O professor lê todos os slides, inclusive o que está em imagem, e prepara uma aula completa: ' +
                    'módulos explicados do simples ao complexo, autores, conceitos, debates, exercícios e uma conversa para tirar dúvidas.</p></div>';
            }
            Banco.metas.forEach(function (m) { html += cartaoLicao(m); });
            var prontas = Banco.metas.filter(function (m) { return m.estado === 'pronta'; });
            if (prontas.length) html += '<div class="cartao"><span class="rotulo">Guardar para sempre</span>' +
                '<p class="peq">As aulas ficam guardadas na sua conta do Claude. Para ter também no celular (app Ciência Política, funciona sem internet) ' +
                'e uma cópia de segurança, baixe o arquivo: ele vai para a pasta Downloads e o app o encontra sozinho. Guarde esse arquivo também no Google Drive.</p>' +
                '<div class="botoes"><button class="botao principal" id="levarTodas">Baixar cópia de todas (' + prontas.length + ')</button>' +
                '<button class="botao" id="restaurar">Restaurar de uma cópia</button></div></div>';
            else html += '<button class="botao" id="restaurar">Restaurar aulas de uma cópia</button>';
            html += '<p class="fraco peq">Tudo é feito pelo Claude com o seu plano, sem custo extra. Preparar uma aula usa bastante da sua cota de uso; reler e fazer os exercícios de múltipla escolha e flashcards não usa nada.' +
                (Banco.local ? ' <b>Atenção:</b> as lições estão sendo guardadas só neste navegador.' : '') + '</p></div>';
            raiz.innerHTML = html;
            raiz.querySelector('#nova').onclick = function () { paraContinuar = null; $arquivo.click(); };
            ao(raiz, '[data-abrir]', function (n) { abrirAula(n.dataset.abrir); });
            ao(raiz, '[data-continuar]', function (n, ev) {
                ev.stopPropagation();

                if (m.precisaPdf && !pdfs[m.id]) { paraContinuar = m.id; $arquivo.click(); } else preparar(m.id, pdfs[m.id] || null);
            });
            ao(raiz, '[data-menu]', function (n, ev) { ev.stopPropagation(); ir(telaMenuLicao(n.dataset.menu)); });
            ao(raiz, '[data-levar]', function (n, ev) {
                ev.stopPropagation();
                var m = Banco.meta(n.dataset.levar);
                n.disabled = true;
                baixarCopia([m.id], 'politica-aula-' + nomeArquivo(m.titulo) + '-' + m.id + '.json').then(function () { n.disabled = false; });
            });
            var lt = raiz.querySelector('#levarTodas');
            if (lt) lt.onclick = function () {
                lt.disabled = true;
                baixarCopia(prontas.map(function (m) { return m.id; }), 'politica-aulas-' + new Date().toISOString().slice(0, 10) + '.json')
                    .then(function () { lt.disabled = false; });
            };
            raiz.querySelector('#restaurar').onclick = function () { $copia.click(); };
            progressoNosCartoes(raiz);
        }
    };
}

function cartaoLicao(m) {
    var id = esc(m.id), corpo = '';
    var data = new Date(m.criada).toLocaleDateString('pt-BR');
    var g = gerando[m.id];
    if (m.estado === 'pronta') {
        var levada = m.levada && m.levada >= (m.atualizada || m.criada);
        corpo = '<div class="progresso"><i data-barra="' + id + '" style="width:0%"></i></div><div class="fraco peq" data-lidos="' + id + '">Aula pronta</div>' +
            (levada ? '<div class="marcas"><span class="marca ok">cópia baixada ✓</span></div>'
                    : '<button class="botao" style="margin-top:10px" data-levar="' + id + '">Levar para o app do celular</button>');
    } else if (g) {
        corpo = '<p class="peq" style="margin:8px 0 0"><span class="girando"></span>' + esc(g.texto) + '</p><ul class="etapas">' +
            ETAPAS.map(function (e, i) { return '<li class="' + (i < g.etapa ? 'feita' : i === g.etapa ? 'agora' : '') + '">' + (i < g.etapa ? '✓ ' : '· ') + esc(e) + '</li>'; }).join('') +
            '</ul><p class="fraco peq" style="margin:8px 0 0">Mantenha esta tela aberta. Leva de 10 a 25 minutos.</p>';
    } else if (m.estado === 'erro' || m.estado === 'gerando') {
        corpo = '<p class="peq" style="color:var(--erro);margin:8px 0">' +
            esc(m.estado === 'erro' ? m.erro : 'A preparação parou no meio (a tela foi fechada).') + '</p>' +
            '<button class="botao principal" data-continuar="' + id + '">Continuar de onde parou</button>';
    }
    return '<div class="cartao' + (m.estado === 'pronta' ? ' toque" data-abrir="' + id : '') + '">' +
        '<div class="titulo-licao"><div><h3 style="margin:0">' + esc(m.titulo) + '</h3>' +
        '<div class="fraco peq">' + esc(data) + ' · ' + esc(m.nome) + '</div></div>' +
        '<button class="icone" data-menu="' + id + '" aria-label="Opções da lição">⋮</button></div>' + corpo + '</div>';
}

async function progressoNosCartoes(raiz) {
    for (var i = 0; i < Banco.metas.length; i++) {
        var m = Banco.metas[i];
        if (m.estado !== 'pronta') continue;
        var p = await progresso(m.id), plano = await Banco.ler('a-' + m.id);
        var total = plano ? plano.n_modulos : 0, lidos = Object.keys(p.lidos).length;
        var b = raiz.querySelector('[data-barra="' + m.id + '"]'), t = raiz.querySelector('[data-lidos="' + m.id + '"]');
        if (b && total) b.style.width = Math.round(100 * lidos / total) + '%';
        if (t && total) t.textContent = lidos + ' de ' + total + ' módulos estudados';
    }
}

function telaMenuLicao(id) {
    var m = Banco.meta(id);
    return {
        titulo: m.titulo,
        desenhar: function (raiz) {
            raiz.innerHTML = '<div class="pilha"><div class="cartao"><label class="rotulo" for="nome">Nome da lição</label>' +
                '<input type="text" id="nome" value="' + esc(m.titulo) + '"><p></p>' +
                '<button class="botao" id="renomear">Salvar nome</button></div>' +
                (m.estado === 'pronta' ? '<button class="botao largo" id="refazer">Preparar a aula de novo</button>' +
                    '<p class="fraco peq" style="margin:0">Refaz tudo a partir do PDF. Você vai escolher o arquivo de novo.</p>' : '') +
                '<hr><button class="botao perigo largo" id="apagar">Apagar esta lição</button></div>';
            raiz.querySelector('#renomear').onclick = async function () {
                m.titulo = raiz.querySelector('#nome').value.trim() || m.titulo;

            };
            var r = raiz.querySelector('#refazer');
            if (r) r.onclick = function () {
                confirmar(r, 'Toque de novo para refazer do zero', async function () {
                    await apagarConteudo(id, false);
                    m.estado = 'erro'; m.precisaPdf = true; m.erro = 'Escolha o PDF para preparar de novo.';
                    await Banco.salvarMeta(m);
                    voltar(); paraContinuar = id; $arquivo.click();
                });
            };
            var a = raiz.querySelector('#apagar');
            a.onclick = function () {
                confirmar(a, 'Toque de novo para apagar de vez', async function () {
                    await apagarConteudo(id, true);
                    Banco.metas = Banco.metas.filter(function (x) { return x.id !== id; });
                    voltar();
                });
            };
        }
    };
}

async function apagarConteudo(id, tudo) {
    var plano = await Banco.ler('a-' + id);
    var chaves = ['t-', 'a-', 'aut-', 'conc-', 'deb-', 'quiz-', 'rev-'].map(function (c) { return c + id; });
    for (var i = 0; i < ((plano && plano.n_modulos) || 0); i++) chaves.push('mod-' + id + '-' + i);
    if (tudo) chaves.push('m-' + id, 'p-' + id);
    await Promise.all(chaves.map(function (k) { return Banco.apagar(k); }));
    if (tudo && Banco.col) {
        try {
            var c = await Banco.col.where('aula', '==', id).get();
            await Promise.all(c.docs.map(function (d) { return Banco.apagar(d.id); }));
        } catch (e) {}
    }
}

async function abrirAula(id) {
    aviso('Abrindo a aula…', 1500);
    var d;
    try { d = await lerAula(id); } catch (e) { d = null; }
    if (!d) { aviso('Não consegui abrir a aula. Tente de novo.'); return; }
    var aula = { id: id, d: d, p: await progresso(id) };
    var abas = [
        { id: 'aula', nome: 'Aula' }, { id: 'autores', nome: 'Autores' }, { id: 'conceitos', nome: 'Conceitos' },
        { id: 'debates', nome: 'Debates' }, { id: 'exercicios', nome: 'Exercícios' },
        { id: 'professor', nome: 'Professor' }, { id: 'revisao', nome: 'Revisão' }
    ];
    if (lista(d.linha_do_tempo).length) abas.splice(3, 0, { id: 'tempo', nome: 'Cronologia' });
    ir({
        titulo: d.titulo, abas: abas, aba: 'aula',
        desenhar: function (raiz) {
            ({ aula: abaAula, autores: abaAutores, conceitos: abaConceitos, tempo: abaTempo, debates: abaDebates,
               exercicios: abaExercicios, professor: abaProfessor, revisao: abaRevisao }[this.aba] || abaAula)(raiz, aula);
        }
    });
}

    var d = aula.d, p = aula.p, mods = lista(d.modulos);
    var lidos = mods.filter(function (_, i) { return p.lidos[i]; }).length;

        '<div class="progresso"><i style="width:' + (mods.length ? 100 * lidos / mods.length : 0) + '%"></i></div>' +
        '<p class="fraco peq">' + lidos + ' de ' + mods.length + ' módulos estudados</p><div class="pilha">' +
        '<div class="cartao texto"><span class="rotulo">Visão geral</span>' + md(d.visao_geral) + '</div>';
    if (lista(d.roteiro).length) html += '<div class="cartao texto"><span class="rotulo latao">Roteiro</span><ol>' +
        lista(d.roteiro).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ol></div>';
    html += '<h3>Módulos</h3>';
    mods.forEach(function (m, i) {
        html += '<div class="cartao toque modulo-item' + (p.lidos[i] ? ' lido' : '') + '" data-mod="' + i + '">' +

            if (ver) ver.onclick = function () { raiz.querySelector('#resp').hidden = false; ver.hidden = true; };
            raiz.querySelector('#lido').onclick = function () {
                if (p.lidos[i]) delete p.lidos[i]; else p.lidos[i] = true;
                salvarProgresso(aula.id);

            };

        }

    lista(d.dissertativas).forEach(function (q, i) {
        html += '<div class="cartao toque" data-dis="' + i + '"><span class="rotulo">' + esc(q.nivel) + '</span><p style="margin:0">' + esc(q.enunciado) + '</p>' +
            (p.corrigidas[i] ? '<div class="marcas"><span class="marca ok">corrigida</span></div>' : '') + '</div>';
    });
    raiz.innerHTML = html + '</div>';
    ao(raiz, '[data-ex]', function (n) {
        var t = n.dataset.ex;
        if (t === 'quiz' || t === 'vf') ir(telaQuiz(aula, t));
        else if (t === 'flash') ir(telaFlash(aula));
        else ir(telaConversa(aula, { chave: 'sabatina', modo: 'sabatina', titulo: 'Sabatina oral', recomecar: true,
            abertura: 'Pode começar a sabatina sobre a lição inteira.', dica: 'Responda como numa prova oral. Para terminar, peça o balanço final.' }));
    });
    ao(raiz, '[data-dis]', function (n) { ir(telaDissertativa(aula, +n.dataset.dis)); });
}

function telaQuiz(aula, tipo, soEstas) {
    var todas = lista(tipo === 'quiz' ? aula.d.quiz : aula.d.verdadeiro_falso);
    var ordem = soEstas || todas.map(function (_, i) { return i; });
    var pos = 0, acertos = 0, erros = [], respondida = false;
    return {
        titulo: tipo === 'quiz' ? 'Múltipla escolha' : 'Verdadeiro ou falso',
        desenhar: function (raiz) {
            if (pos >= ordem.length) return fim(raiz);
            var q = todas[ordem[pos]];
            var opcoes = tipo === 'quiz' ? lista(q.alternativas) : ['Verdadeiro', 'Falso'];
            var certa = tipo === 'quiz' ? q.correta : (q.verdadeira ? 0 : 1);
            raiz.innerHTML = '<div class="placar">Questão ' + (pos + 1) + ' de ' + ordem.length + ' · ' + acertos + ' acertos</div>' +
                '<div class="progresso"><i style="width:' + (100 * pos / ordem.length) + '%"></i></div>' +
                '<h3>' + esc(tipo === 'quiz' ? q.pergunta : q.afirmacao) + '</h3><div class="pilha">' +
                opcoes.map(function (o, k) { return '<button class="alternativa" data-op="' + k + '">' + (tipo === 'quiz' ? 'ABCDE'[k] + ') ' : '') + esc(o) + '</button>'; }).join('') +
                '<div id="depois" class="pilha"></div></div>';
            respondida = false;
            ao(raiz, '[data-op]', function (n) {
                if (respondida) return;
                respondida = true;
                var k = +n.dataset.op;
                raiz.querySelectorAll('[data-op]').forEach(function (b) { if (+b.dataset.op === certa) b.classList.add('certa'); });
                if (k === certa) acertos++; else { n.classList.add('errada'); erros.push(ordem[pos]); }
                var $d = raiz.querySelector('#depois');
                $d.innerHTML = '<div class="cartao texto"><span class="rotulo' + (k === certa ? '">Certo' : ' erro">Errado') + '</span>' + md(q.explicacao) + '</div>' +
                    '<button class="botao principal largo" id="seguir">Continuar</button>';
                $d.querySelector('#seguir').onclick = function () { pos++; desenhar(true); };
                $d.querySelector('#seguir').scrollIntoView({ block: 'end' });
            });
        }
    };
    function fim(raiz) {
        if (!soEstas) {
            var reg = aula.p[tipo];
            reg.ultimo = acertos; reg.melhor = Math.max(reg.melhor || 0, acertos);
            salvarProgresso(aula.id);
        }
        var pct = Math.round(100 * acertos / ordem.length);
        raiz.innerHTML = '<div class="vazio"><div class="grande">' + acertos + '/' + ordem.length + '</div><p>' +
            (pct >= 80 ? 'Muito bem! Você domina este conteúdo.' : pct >= 60 ? 'Bom, mas revise os pontos que errou.' : 'Volte aos módulos e tente de novo. Errar aqui é o jeito de aprender.') +
            '</p></div><div class="botoes">' + (erros.length ? '<button class="botao principal" id="erros">Refazer as ' + erros.length + ' que errei</button>' : '') +
            '<button class="botao" id="tudo">Refazer tudo</button></div>';
        var e = raiz.querySelector('#erros');
        if (e) e.onclick = function () { trocar(telaQuiz(aula, tipo, erros.slice())); };
        raiz.querySelector('#tudo').onclick = function () { trocar(telaQuiz(aula, tipo)); };
    }
}

function telaFlash(aula) {
    var cards = lista(aula.d.flashcards), p = aula.p;
    var monte = cards.map(function (_, i) { return i; }).filter(function (i) { return !p.flash[i]; });
    if (!monte.length) monte = cards.map(function (_, i) { return i; });
    monte.sort(function () { return Math.random() - 0.5; });
    var virado = false;
    return {
        titulo: 'Flashcards',
        desenhar: function (raiz) {
            if (!monte.length) {
                raiz.innerHTML = '<div class="vazio"><div class="grande">' + Object.keys(p.flash).length + '/' + cards.length + '</div><p>cartões sabidos. Monte terminado.</p></div>' +
                    '<button class="botao largo" id="zerar">Recomeçar com todos</button>';
                raiz.querySelector('#zerar').onclick = function () { p.flash = {}; salvarProgresso(aula.id); trocar(telaFlash(aula)); };
                return;
            }
            var c = cards[monte[0]];
            raiz.innerHTML = '<div class="pilha"><div class="placar">Faltam ' + monte.length + ' · ' + Object.keys(p.flash).length + ' de ' + cards.length + ' sabidos</div>' +
                '<button class="cartao flash" id="carta"><div><div class="lado">' + (virado ? 'resposta' : 'pergunta · toque para virar') + '</div>' + esc(virado ? c.verso : c.frente) + '</div></button>' +
                (virado ? '<div class="botoes"><button class="botao" id="nao">Não sabia</button><button class="botao principal" id="sim">Sabia</button></div>' : '') + '</div>';
            raiz.querySelector('#carta').onclick = function () { virado = !virado; desenhar(false); };
            if (virado) {
                raiz.querySelector('#sim').onclick = function () { p.flash[monte[0]] = true; salvarProgresso(aula.id); monte.shift(); virado = false; desenhar(false); };
                raiz.querySelector('#nao').onclick = function () { monte.push(monte.shift()); virado = false; desenhar(false); };
            }
        }
    };
}

function telaDissertativa(aula, i) {
    var q = lista(aula.d.dissertativas)[i], chave = 'dis' + i;
    function cfg(abertura) {
        return { chave: chave, modo: 'corrigir', titulo: 'Correção da questão ' + (i + 1), abertura: abertura,
            contexto: 'Questão: ' + q.enunciado + '\nNível: ' + q.nivel + '\nPontos esperados:\n- ' + lista(q.pontos_esperados).join('\n- '),
            dica: 'Você pode reescrever a resposta e mandar de novo para nova correção.' };
    }
    return {
        titulo: 'Questão ' + (i + 1),
        desenhar: function (raiz) {
            var rasc = lerLocal('pol:rasc:' + aula.id + ':' + i) || '';
            raiz.innerHTML = '<span class="rotulo">' + esc(q.nivel) + '</span><h2>' + esc(q.enunciado) + '</h2><div class="pilha">' +
                '<label class="fraco peq" for="resp">Sua resposta</label><textarea id="resp">' + esc(rasc) + '</textarea>' +
                '<button class="botao principal" id="enviar">Enviar para correção</button>' +
                (aula.p.corrigidas[i] ? '<button class="botao" id="ver">Ver a correção anterior</button>' : '') +
                '<details class="cartao"><summary>Ver os pontos esperados (só depois de tentar)</summary><ul>' +
                lista(q.pontos_esperados).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details></div>';
            var $r = raiz.querySelector('#resp');
            $r.oninput = function () { gravarLocal('pol:rasc:' + aula.id + ':' + i, $r.value); };
            raiz.querySelector('#enviar').onclick = async function () {
                var t = $r.value.trim();
                if (t.length < 20) { aviso('Escreva uma resposta um pouco mais longa.'); return; }
                await Banco.gravar('c-' + aula.id + '-' + chave, { aula: aula.id, msgs: [] });
                aula.p.corrigidas[i] = true; salvarProgresso(aula.id);
                ir(telaConversa(aula, cfg(t)));
            };
            var v = raiz.querySelector('#ver');
            if (v) v.onclick = function () { ir(telaConversa(aula, cfg(null))); };
        }
    };
}

function abaProfessor(raiz, aula) {
    var sugestoes = ['Explique a lição inteira como se eu tivesse 15 anos.', 'Quais são as três ideias mais importantes desta lição?',
        'Como eu usaria esta lição para analisar uma notícia de hoje?', 'Quais as críticas mais fortes a essa forma de analisar a política?',
        'Que pergunta difícil alguém poderia me fazer num debate sobre isso?'];
    raiz.innerHTML = '<h2>Professor</h2><p class="fraco">Converse com o professor sobre qualquer ponto da lição. Ele tem diante de si todos os slides transcritos.</p><div class="pilha">' +
        '<button class="botao principal largo" id="conversar">Abrir a conversa</button><h3>Sugestões</h3>' +
        sugestoes.map(function (s, k) { return '<div class="cartao toque" data-sug="' + k + '">' + esc(s) + '</div>'; }).join('') + '</div>';
    function cfg() { return { chave: 'tutor', modo: 'tutor', titulo: 'Professor', dica: 'Pergunte o que quiser sobre a lição.', recomecar: true }; }
    raiz.querySelector('#conversar').onclick = function () { ir(telaConversa(aula, cfg())); };
    ao(raiz, '[data-sug]', function (n) { var c = cfg(); c.abertura = sugestoes[+n.dataset.sug]; c.sempre = true; ir(telaConversa(aula, c)); });
}

function abaRevisao(raiz, aula) {
    var d = aula.d;
    raiz.innerHTML = '<h2>Revisão</h2><div class="pilha">' +
        '<div class="cartao texto"><span class="rotulo">Síntese</span>' + md(d.sintese) + '</div>' +
        '<div class="cartao texto"><span class="rotulo latao">Argumentos prontos para o debate</span><ul>' + lista(d.argumentos_prontos).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="cartao texto"><span class="rotulo">Para ir além</span><ul>' + lista(d.aprofundamento).map(function (l) {
            return '<li><b>' + esc(l.titulo) + '</b> — ' + esc(l.autor) + '<br><span class="fraco peq">' + esc(l.por_que) + '</span></li>'; }).join('') + '</ul></div>' +
        '<button class="botao largo" id="transc">Ver os slides transcritos</button></div>';
    raiz.querySelector('#transc').onclick = function () {
        ir({ titulo: 'Slides transcritos', desenhar: function (r) { r.innerHTML = '<div class="texto">' + md(d.material) + '</div>'; } });
    };
}

/* =========================================================
   Conversa com o professor
   ========================================================= */
var MODOS = {
    tutor: 'Modo TIRA-DÚVIDAS. O aluno está estudando esta lição e vai fazer perguntas. Responda de forma clara e completa, com exemplos. Se ele estiver num módulo ou autor específico, o contexto diz qual. Termine, quando fizer sentido, com uma pergunta curta que o faça pensar.',
    debate: 'Modo DEBATE. O aluno quer treinar para debater; o contexto diz a questão e o lado dele. Você defende o lado OPOSTO, com firmeza e os melhores argumentos dessa posição (sem caricatura). Uma rodada por vez: responda ao argumento dele, aponte com precisão a fraqueza (dado faltando, generalização, falácia, conceito mal usado) e lance um contra-argumento ou uma pergunta difícil. Respostas curtas e vivas, no máximo uns três parágrafos. Se ele errar um dado ou conceito, corrija numa linha entre colchetes, como professor, e volte ao debate.',
    avaliar: 'O debate acabou. Saia do personagem e avalie o desempenho do aluno como professor: nota de 0 a 10 com justificativa; os melhores argumentos dele; os erros (falácias, dados errados, conceitos mal usados, oportunidades perdidas); como responder melhor aos seus contra-argumentos mais fortes (dê as respostas); três coisas para estudar ou treinar.',
    sabatina: 'Modo SABATINA (prova oral). Teste o aluno sobre a lição inteira, uma pergunta de cada vez. A cada resposta: diga se está certa, parcialmente certa ou errada, explique em poucas linhas o que faltou e faça a próxima pergunta. Varie: conceitos, autores e obras, aplicação ao fato da semana, comparação, interpretação de dados. Aumente a dificuldade quando ele acertar; volte ao básico e reexplique quando errar. Quando ele pedir para encerrar, dê um balanço do que domina e do que precisa revisar.',
    corrigir: 'Modo CORREÇÃO. O contexto traz uma questão dissertativa e os pontos esperados; a mensagem do aluno é a resposta dele. Corrija como um professor exigente e generoso: nota de 0 a 10; o que está certo e bem argumentado; o que está errado, impreciso ou faltando; uma versão modelo completa da resposta; uma dica para escrever e argumentar melhor. Se ele mandar uma nova versão, corrija a nova.'
};

function telaConversa(aula, cfg) {
    var chave = 'c-' + aula.id + '-' + cfg.chave, msgs = null, falando = false, abriu = false;
    var tela = {
        titulo: cfg.titulo,
        desenhar: function (raiz) {
            if (!msgs) {
                raiz.innerHTML = '<p class="fraco centro"><span class="girando"></span>Abrindo a conversa…</p>';
                Banco.ler(chave).then(function (c) { msgs = (c && c.msgs) || []; if (pilha[pilha.length - 1] === tela) desenhar(false); })
                    .catch(function () { msgs = []; desenhar(false); });
                return;
            }
            var html = '<div class="conversa" id="conv">';
            if (!msgs.length && cfg.dica) html += '<p class="fraco peq centro">' + esc(cfg.dica) + '</p>';
            msgs.forEach(function (m) { html += fala(m); });
            html += '</div><div class="botoes" style="margin-top:14px">' +
                (cfg.avaliar && msgs.length > 2 ? '<button class="botao" id="avaliar">Encerrar e avaliar meu desempenho</button>' : '') +
                (cfg.recomecar && msgs.length ? '<button class="botao" id="recomecar">Recomeçar a conversa</button>' : '') +
                '</div><div class="escrever"><div><textarea id="msg" rows="1" aria-label="Sua mensagem" placeholder="Escreva…"></textarea>' +
                '<button class="botao principal" id="enviar" aria-label="Enviar">➤</button></div></div>';
            raiz.innerHTML = html;
            var $m = raiz.querySelector('#msg');
            $m.oninput = function () { $m.style.height = 'auto'; $m.style.height = Math.min(160, $m.scrollHeight) + 'px'; };
            raiz.querySelector('#enviar').onclick = function () {
                var t = $m.value.trim();
                if (!t || falando) return;
                $m.value = '';
                enviar(raiz, t, cfg.modo);
            };
            var av = raiz.querySelector('#avaliar');
            if (av) av.onclick = function () { if (!falando) enviar(raiz, 'Encerro o debate aqui. Avalie o meu desempenho.', 'avaliar'); };
            var rc = raiz.querySelector('#recomecar');
            if (rc) rc.onclick = function () {
                if (falando) return;
                confirmar(rc, 'Toque de novo para apagar a conversa', function () { msgs = []; guardar(); desenhar(false); });
            };
            window.scrollTo(0, document.body.scrollHeight);
            if (cfg.abertura && !abriu && (!msgs.length || cfg.sempre)) { abriu = true; enviar(raiz, cfg.abertura, cfg.modo); }
        }
    };
    return tela;

    function guardar() { Banco.gravar(chave, { aula: aula.id, msgs: msgs.slice(-40) }).catch(function () {}); }
    function fala(m) {
        if (m.papel === 'aluno') return '<div class="fala aluno">' + esc(m.texto) + '</div>';
        return '<div class="fala prof texto"><div class="quem">Professor</div>' + md(m.texto) + '</div>';
    }

    async function enviar(raiz, texto, modo) {
        if (msgs.length && msgs[msgs.length - 1].papel === 'aluno') msgs.pop();
        msgs.push({ papel: 'aluno', texto: texto });
        guardar();
        var $c = raiz.querySelector('#conv');
        $c.insertAdjacentHTML('beforeend', fala(msgs[msgs.length - 1]));
        var $p = document.createElement('div');
        $p.className = 'fala prof texto';
        $p.innerHTML = '<div class="quem">Professor</div><div class="corpo"><span class="girando"></span><span class="fraco peq">Pensando…</span></div>';
        $c.appendChild($p);
        var $corpo = $p.querySelector('.corpo');
        window.scrollTo(0, document.body.scrollHeight);
        falando = true;
        try {
            var s = await obterSample();
            if (!s) throw { message: 'Este app precisa ser aberto dentro do Claude.' };
            var abertura = comMaterial(aula.d.material) + MODOS[modo] +
                (cfg.contexto ? '\n\n<contexto_desta_conversa>\n' + cfg.contexto + '\n</contexto_desta_conversa>' : '') +
                '\n\nAgora a conversa começa. Mensagem do aluno:\n\n';
            var turnos = msgs.slice(-24).map(function (m, k) {
                return { role: m.papel === 'aluno' ? 'user' : 'assistant', content: m.texto };
            });
            while (turnos.length && turnos[0].role !== 'user') turnos.shift();
            turnos[0] = { role: 'user', content: abertura + turnos[0].content };
            if (modo === 'avaliar') turnos[turnos.length - 1].content = MODOS.avaliar + '\n\n' + turnos[turnos.length - 1].content;
            var r = await s(turnos, {
                modelTier: modo === 'corrigir' || modo === 'avaliar' ? 'complex' : 'default', cache: false,
                onText: function (ev) {
                    var noFim = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
                    $corpo.innerHTML = md(ev.text);
                    if (noFim) window.scrollTo(0, document.body.scrollHeight);
                }
            });
            msgs.push({ papel: 'prof', texto: r.text });
            guardar();
            falando = false;
            if (pilha[pilha.length - 1] === tela) desenhar(false);
        } catch (e) {
            falando = false;
            $p.classList.add('falhou');
            $corpo.innerHTML = '<p style="color:var(--erro)">' + esc(traduzirErro(e)) + '</p><button class="botao" id="denovo">Tentar de novo</button>';
            $corpo.querySelector('#denovo').onclick = function () {
                $p.remove();
                if ($c.lastElementChild) $c.lastElementChild.remove();
                var ultima = msgs.length && msgs[msgs.length - 1].papel === 'aluno' ? msgs[msgs.length - 1].texto : texto;
                enviar(raiz, ultima, modo);
            };
        }
    }
}

   Começo
   ========================================================= */
pilha = [{ titulo: 'Minhas lições', desenhar: function (r) {
    r.innerHTML = '<div class="vazio"><div class="grande">§</div><p><span class="girando"></span>Carregando suas lições…</p></div>';
} }];
desenhar(true);
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
Banco.iniciar().then(function () { pilha = [telaInicio()]; desenhar(true); });
})();
