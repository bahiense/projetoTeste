<style>
/* Layout: uma coluna de leitura (~680px), topo fixo com abas; cada lição é um caderno. */

@media (prefers-color-scheme: dark) {

        --fundo: #12151d; --papel: #1a1e29; --papel2: #232837; --linha: #2e3446;
        --tinta: #e9ecf3; --fraco: #9ba3b6; --acento: #4cc38a; --acento-txt: #0b1a12;
        --latao: #e0bf6c; --erro: #ff7b72; --certo-fundo: #183526; --errado-fundo: #3a1d1d; --aluno: #1f3a2d;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --fundo: #12151d; --papel: #1a1e29; --papel2: #232837; --linha: #2e3446;
    --tinta: #e9ecf3; --fraco: #9ba3b6; --acento: #4cc38a; --acento-txt: #0b1a12;

}

}

    padding-left: max(16px, env(safe-area-inset-left, 0px));

}
h2 { font: 600 25px/1.25 var(--display); margin: 4px 0 10px; text-wrap: balance; }

.pilha { display: flex; flex-direction: column; gap: 12px; }

.texto blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--latao); color: var(--tinta); }

.marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

}

@keyframes gira { to { transform: rotate(360deg); } }

.modulo-item { display: flex; gap: 12px; align-items: flex-start; }
.modulo-item .num { flex: 0 0 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--papel2); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.modulo-item.lido .num { background: var(--acento); color: var(--acento-txt); }
.modulo-item > div:last-child { min-width: 0; }
.modulo-item .num.dia { flex-basis: 40px; height: 40px; font-size: 13px; }
.lista-dia { margin: 6px 0 0; padding-left: 18px; }

.alternativa.certa { border-color: var(--acento); background: var(--certo-fundo); }
.alternativa.errada { border-color: var(--erro); background: var(--errado-fundo); }
.placar { font-size: 14px; color: var(--fraco); font-variant-numeric: tabular-nums; }
.flash { min-height: 220px; display: grid; place-items: center; text-align: center; font: 20px/1.4 var(--display); padding: 24px; cursor: pointer; }
.flash .lado { font: 600 11.5px/1 var(--texto); letter-spacing: .1em; text-transform: uppercase; color: var(--fraco); margin-bottom: 10px; }

textarea, input[type=text], input[type=search] { width: 100%; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
textarea { min-height: 150px; resize: vertical; }

.conversa { display: flex; flex-direction: column; gap: 10px; }

.escrever {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--fundo); border-top: 1px solid var(--linha);
    padding-top: 10px;

    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.escrever > div { display: flex; gap: 8px; align-items: flex-end; max-width: 760px; margin: 0 auto; }
.escrever textarea { min-height: 46px; max-height: 160px; flex: 1; }

#aviso {

    bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto;
}
.vazio { text-align: center; color: var(--fraco); padding: 36px 8px; }

<header id="topo">
    <div class="barra-topo">
        <button id="voltar" class="icone" aria-label="Voltar" hidden>‹</button>
        <h1 id="titulo">Professor de Política</h1>
    </div>
    <nav id="abas" hidden></nav>

<main id="tela"></main>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   Markdown simples para HTML. Tudo é escapado antes: texto
   vindo do Claude nunca entra na página como marcação.
   ========================================================= */
function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function linha(t) {
    var s = esc(t);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
}
function md(texto) {
    var linhas = String(texto || '').replace(/\r/g, '').split('\n');
    var html = [], lista = null, par = [], cit = false;
    function fp() { if (par.length) { html.push('<p>' + linha(par.join(' ')) + '</p>'); par = []; } }
    function fl() { if (lista) { html.push('</' + lista + '>'); lista = null; } }
    function fc() { if (cit) { html.push('</blockquote>'); cit = false; } }
    linhas.forEach(function (l) {
        var t = l.trim();
        if (!t) { fp(); fl(); fc(); return; }
        var h = t.match(/^(#{1,6})\s+(.*)$/);
        if (h) { fp(); fl(); fc(); var n = Math.min(6, h[1].length + 2); html.push('<h' + n + '>' + linha(h[2]) + '</h' + n + '>'); return; }
        if (/^(-{3,}|\*{3,})$/.test(t)) { fp(); fl(); fc(); html.push('<hr>'); return; }
        var ul = t.match(/^[-*•]\s+(.*)$/), ol = t.match(/^(\d+)[.)]\s+(.*)$/);
        if (ul || ol) {
            fp(); fc();
            var tipo = ul ? 'ul' : 'ol';
            if (lista && lista !== tipo) fl();
            if (!lista) { lista = tipo; html.push('<' + tipo + '>'); }
            html.push('<li>' + linha(ul ? ul[1] : ol[2]) + '</li>');
            return;
        }
        fl();
        var c = t.match(/^>\s?(.*)$/);
        if (c) { fp(); if (!cit) { html.push('<blockquote>'); cit = true; } html.push('<p>' + linha(c[1]) + '</p>'); return; }
        fc();
        par.push(t);
    });
    fp(); fl(); fc();
    return html.join('\n');
}
function lista(a) { return Array.isArray(a) ? a : []; }

/* =========================================================
   Onde as lições ficam: no banco do artifact, numa pasta
   particular de cada pessoa (ninguém mais lê). Sem o banco,
   cai para o navegador.
   ========================================================= */
var Banco = {
    col: null, local: true, metas: [],
    iniciar: async function () {
        try {
            var db = await usar('db'), user = await usar('user');
            var uid = user ? await user.id() : null;
            if (db && uid) { this.col = db.collection('data/users/' + uid); this.local = false; }
        } catch (e) { this.col = null; }
        await this.carregarMetas();
    },
    carregarMetas: async function () {
        if (this.col) {
            try {
                var snap = await comPrazo(this.col.where('tipo', '==', 'meta').get(), 12000);
                this.metas = snap.docs.map(function (d) { return JSON.parse(JSON.stringify(d.data())); });
            } catch (e) { aviso('Não consegui ler suas lições agora. Recarregue a página.'); this.metas = []; }
        } else {
            this.metas = Object.keys(localStorageSeguro()).filter(function (k) { return k.indexOf('pol:m-') === 0; })
                .map(function (k) { return lerLocal(k); }).filter(Boolean);
        }
        this.metas.sort(function (a, b) { return (b.criada || 0) - (a.criada || 0); });
    },
    ler: async function (chave) {
        if (this.col) {
            var d = await comPrazo(this.col.doc(chave).get(), 15000);
            // o banco entrega o documento congelado; a página precisa de uma cópia que possa mudar
            return d.exists ? JSON.parse(JSON.stringify(d.data())) : null;
        }
        return lerLocal('pol:' + chave);
    },
    gravar: async function (chave, valor) {
        if (this.col) return this.col.doc(chave).set(JSON.parse(JSON.stringify(valor)));
        gravarLocal('pol:' + chave, valor);
    },
    apagar: async function (chave) {
        if (this.col) { try { await this.col.doc(chave).delete(); } catch (e) {} return; }
        try { localStorage.removeItem('pol:' + chave); } catch (e) {}
    },
    meta: function (id) { return this.metas.filter(function (m) { return m.id === id; })[0]; },
    salvarMeta: async function (m) {
        m.tipo = 'meta';
        if (!this.meta(m.id)) this.metas.unshift(m);
        await this.gravar('m-' + m.id, m);
    }
};
/* Fora do Claude não existe window.claude: tudo que depende dele some. */
function usar(nome) {
    return window.claude && typeof window.claude.use === 'function' ? window.claude.use(nome) : Promise.resolve(null);
}
function comPrazo(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('prazo')); }, ms); })]);
}
function localStorageSeguro() { try { return localStorage; } catch (e) { return {}; } }
function lerLocal(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function gravarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { aviso('O navegador ficou sem espaço.'); } }

/* =========================================================
   O professor: quem ele é e como se pede cada parte.
   ========================================================= */
var PROFESSOR =
'Você é o Professor: professor universitário de ciência política, doutor, com décadas de pesquisa e vários livros publicados sobre teoria política, política brasileira, política comparada (de outros países), relações internacionais e geopolítica, instituições, partidos, eleições, Estado, poder e opinião pública. Você conhece os clássicos (de Aristóteles e Maquiavel a Weber, Schumpeter, Dahl, Sartori, Lijphart), as relações internacionais (Tucídides, Hobbes, Kant, Morgenthau, Waltz, Keohane, Nye, Wendt, Mearsheimer, Huntington) e a ciência política brasileira (Abranches, Limongi e Figueiredo, Nicolau, Santos e outros).\n\n' +
'Seu aluno é um adulto brasileiro, inteligente e curioso, sem formação acadêmica na área. Ele faz um curso semanal: toda semana chega um PDF (em geral slides) com uma lição que junta um conceito de ciência política e um fato real da política, do Brasil ou do mundo (eleições e governos de outros países, guerras e conflitos, diplomacia, organismos internacionais como ONU, OTAN, União Europeia, BRICS e Mercosul, comércio e geopolítica). Ele quer sair de cada lição dominando o assunto, capaz de explicar para outra pessoa e de debater com qualquer um.\n\n' +
'Como você ensina:\n' +
'- Ensina tudo o que está no material, sem pular nada: cada slide, conceito, autor, dado, gráfico, tabela, exemplo, nota e verbete. O que o material só menciona de passagem, você explica por completo.\n' +
'- Fala simples. Frases claras, um termo técnico de cada vez, sempre definido na hora em que aparece.\n' +
'- Vai do simples ao complexo: a ideia numa frase, o desenvolvimento, um exemplo concreto (da política brasileira ou internacional, conforme o tema), depois nuances, críticas e limites.\n' +
'- Vai além do material com o seu conhecimento: origem das ideias, contexto histórico, autores que dialogam com o tema, críticas e contra-argumentos.\n' +
'- Autores: quem foi, quando e onde viveu, contexto e contra o que reagia, obras, ideias centrais e exatamente como se liga à lição.\n' +
'- Honestidade intelectual: separa fato de interpretação e de opinião; apresenta as correntes com justiça, no seu melhor argumento; não toma partido em disputas partidárias. Sobre fatos recentes, apoia-se no que o material diz, porque eles podem ser posteriores ao que você sabe; diga quando algo for incerto.\n' +
'- Nunca inventa dados, citações, datas, números ou títulos de obras. Na dúvida, diz que não tem certeza. Citação literal só quando for conhecida e fiel; senão, paráfrase sem aspas.\n' +
'- Língua: o PDF pode estar em inglês ou em outra língua, mas a aula é SEMPRE inteira em português do Brasil: títulos, explicações, verbetes, autores, debates, questões, flashcards e conversas. Traduza com fidelidade, sem resumir; quando uma expressão do original importar (um termo técnico, uma frase de efeito do autor), dê a tradução e o original entre parênteses. Obras: o título da edição brasileira, quando houver, e o original entre parênteses.\n' +
'- Escreve em português do Brasil. Nos textos longos, usa Markdown simples: parágrafos curtos separados por linha em branco, **negrito** nos termos importantes, listas com "- " e citações com "> ".';

function comMaterial(t, aula) {
    return PROFESSOR + '\n\n<material_da_licao>\n' + t + '\n</material_da_licao>\n\n' +
        (aula ? '<plano_da_aula>\n' + aula + '\n</plano_da_aula>\n\n' : '');
}

/* =========================================================
   Preparar a aula. Cada parte é um pedido separado, guardado
   assim que fica pronto: se algo falhar, continua de onde parou.
   ========================================================= */
var sampleFn = null, limites = null;
var gerando = {};   // id -> {texto, etapa}
var pdfs = {};      // id -> o PDF escolhido nesta visita (para continuar sem escolher de novo)

async function obterSample() {
    if (!sampleFn) sampleFn = await usar('sample');
    if (sampleFn && !limites) { try { limites = await sampleFn.limits(); } catch (e) { limites = {}; } }
    return sampleFn;
}

/* Cada página vira duas imagens (metade de cima e de baixo, com uma faixa em
   comum): o Claude recebe cada imagem com cerca de 1,2 megapixel, e assim a
   letra pequena dos slides chega com o dobro de resolução. O texto da página,
   quando o PDF tem, vai junto. */
async function pdfParaPaginas(arquivo, aoAvancar) {
    var dados = new Uint8Array(await arquivo.arrayBuffer());
    var pdf = await pdfjsLib.getDocument({ data: dados }).promise;
    var paginas = [];
    for (var n = 1; n <= pdf.numPages; n++) {
        aoAvancar('Abrindo o PDF: página ' + n + ' de ' + pdf.numPages);
        var pag = await pdf.getPage(n);
        var v = pag.getViewport({ scale: 1 });
        var escala = Math.sqrt(2200000 / (v.width * v.height));
        var vp = pag.getViewport({ scale: escala });
        var c = document.createElement('canvas');
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await pag.render({ canvasContext: ctx, viewport: vp }).promise;
        var metade = Math.round(c.height * 0.56), imgs = [];
        for (var k = 0; k < 2; k++) {
            var p = document.createElement('canvas');
            p.width = c.width; p.height = metade;
            p.getContext('2d').drawImage(c, 0, k === 0 ? 0 : c.height - metade, c.width, metade, 0, 0, c.width, metade);
            imgs.push(await new Promise(function (ok) { p.toBlob(ok, 'image/jpeg', 0.88); }));
        }
        var texto = '';
        try {
            var tc = await pag.getTextContent();
            texto = tc.items.map(function (it) { return it.str; }).join(' ').replace(/\s+/g, ' ').trim();
        } catch (e) {}
        paginas.push({ imgs: imgs, texto: texto });
    }
    return paginas;
}

/* A semana de estudo: a aula é dividida em cinco dias, de segunda a sexta. */
var DIAS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira'];
/* Em que dia cai o módulo i de n (aulas antigas podem ter mais de cinco módulos). */
function diaDo(i, n) { return n <= 5 ? i : Math.floor(i * 5 / n); }
/* O dia da semana de hoje, de 0 (segunda) a 4 (sexta); -1 no fim de semana. */
function hojeDia() { var d = new Date().getDay(); return d >= 1 && d <= 5 ? d - 1 : -1; }
/* Os módulos repartidos pelos 5 dias: [[índices de segunda], [terça], …].
   Aulas novas trazem o dia de cada módulo ("dia": 1 a 5); nas antigas, os
   módulos são repartidos em ordem. */
function semanaDe(mods) {
    var g = [[], [], [], [], []];
    var comDia = mods.length && mods.every(function (m) { return m && m.dia >= 1 && m.dia <= 5; });
    mods.forEach(function (m, i) { g[comDia ? m.dia - 1 : diaDo(i, mods.length)].push(i); });
    return g;
}
/* Garante o dia de cada módulo do plano: em ordem, de 1 a 5, sem voltar atrás. */
function comDias(mods) {
    var ok = mods.length && mods.every(function (m, i) { return m.dia >= 1 && m.dia <= 5 && (i === 0 || m.dia >= mods[i - 1].dia); });
    return mods.map(function (m, i) { m.dia = ok ? m.dia : diaDo(i, mods.length) + 1; return m; });
}

function traduzirErro(e) {

    if (c === 'prompt_too_large') return 'A lição é grande demais para um pedido só. Divida o PDF em duas partes.';
    if (c === 'invalid_json' || c === 'empty_completion') return 'Uma das partes veio incompleta. Toque em "Continuar" para tentar de novo.';
    if (c === 'refused') return 'O Claude recusou uma das partes. Toque em "Continuar" para tentar de novo.';
    if (c === 'images_unavailable' || c === 'image_rejected') return 'Esta tela não conseguiu mandar as imagens dos slides. Abra pelo app do Claude ou por claude.ai.';
    if (c === 'sampling_disabled' || c === 'capability_disabled') return 'O uso do Claude por páginas está desligado na sua conta.';
    return (e && e.message) || 'Algo deu errado. Toque em "Continuar" para tentar de novo.';
}

/* Junta as partes guardadas numa aula só. */
async function lerAula(id) {
    var plano = await Banco.ler('a-' + id);
    if (!plano) return null;
    var d = Object.assign({}, plano);
    d.modulos = [];
    for (var i = 0; i < (plano.n_modulos || lista(plano.modulos).length); i++) {
        var mo = (await Banco.ler('mod-' + id + '-' + i)) || { titulo: plano.modulos[i].titulo, explicacao: '(este módulo não foi escrito)' };
        if (plano.modulos[i] && plano.modulos[i].dia) mo.dia = plano.modulos[i].dia;
        d.modulos.push(mo);
    }
    var aut = await Banco.ler('aut-' + id);
    d.autores = aut ? aut.lista : [];
    var extras = await Promise.all(['conc', 'deb', 'quiz', 'rev'].map(function (c) { return Banco.ler(c + '-' + id); }));
    extras.forEach(function (x) { if (x) Object.assign(d, x); });
    var t = await Banco.ler('t-' + id);
    d.material = t ? t.partes.join('\n\n') : '';
    return d;
}

/* =========================================================
   Cópias: levar para o app do celular e guardar para sempre.
   O arquivo vai para a pasta Downloads; o app Ciência Política
   (APK) acha "politica-*.json" lá sozinho. O mesmo arquivo
   restaura as aulas aqui, se um dia for preciso.
   ========================================================= */
async function pacoteDe(ids) {
    var aulas = [];
    for (var i = 0; i < ids.length; i++) {
        var m = Banco.meta(ids[i]), d = await lerAula(ids[i]);
        if (!m || !d) continue;
        aulas.push({ id: m.id, titulo: m.titulo, nome: m.nome, criada: m.criada, atualizada: m.atualizada || m.criada, aula: d });
    }
    return { formato: 'professor-de-politica', versao: 1, gerado: Date.now(), aulas: aulas };
}

function nomeArquivo(t) {
    return String(t || 'aula').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'aula';
}

async function baixarCopia(ids, nome) {
    var dl = await usar('downloads');
    if (!dl) { aviso('Esta tela não consegue baixar arquivos. Abra pelo app do Claude ou por claude.ai.', 7000); return false; }
    aviso('Preparando o arquivo…', 2000);
    var pacote = await pacoteDe(ids);
    if (!pacote.aulas.length) { aviso('Não há aula pronta para levar.'); return false; }
    try {
        await dl.save({ filename: nome, data: JSON.stringify(pacote) });
    } catch (e) {
        if (e && e.code === 'declined') return false;
        aviso('Não consegui baixar o arquivo (' + ((e && e.message) || 'erro') + ').', 7000);
        return false;
    }
    for (var i = 0; i < pacote.aulas.length; i++) {
        var m = Banco.meta(pacote.aulas[i].id);
        m.levada = m.atualizada || m.criada;
        await Banco.salvarMeta(m);
    }
    aviso('Arquivo salvo em Downloads. Abra o app Ciência Política: a aula entra sozinha.', 7000);
    redesenharSeInicio();
    return true;
}

async function restaurar(arquivo) {
    var pacote;
    try { pacote = JSON.parse(await arquivo.text()); } catch (e) { pacote = null; }
    if (!pacote || pacote.formato !== 'professor-de-politica') { aviso('Esse arquivo não é uma cópia do Professor de Política.'); return; }
    var n = 0;
    for (var i = 0; i < lista(pacote.aulas).length; i++) {
        var a = pacote.aulas[i], d = a.aula, id = String(a.id || '');
        if (!/^[a-z0-9]{1,20}$/.test(id) || !d || !Array.isArray(d.modulos)) continue;
        var ja = Banco.meta(id);
        if (ja && ja.estado === 'pronta' && (ja.atualizada || ja.criada) >= (a.atualizada || a.criada)) continue;
        await Banco.gravar('a-' + id, { tipo: d.tipo || 'completa', titulo: d.titulo, subtitulo: d.subtitulo, visao_geral: d.visao_geral, roteiro: lista(d.roteiro),
            modulos: d.modulos.map(function (x) { return { titulo: x.titulo, slides: x.slides, dia: x.dia }; }),
            autores: lista(d.autores).map(function (x) { return { nome: x.nome, citado_no_pdf: x.citado_no_pdf }; }), n_modulos: d.modulos.length });
        for (var k = 0; k < d.modulos.length; k++) await Banco.gravar('mod-' + id + '-' + k, d.modulos[k]);
        await Banco.gravar('aut-' + id, { lista: lista(d.autores), feitos: lista(d.autores).length });
        await Banco.gravar('conc-' + id, { conceitos: lista(d.conceitos), linha_do_tempo: lista(d.linha_do_tempo) });
        await Banco.gravar('deb-' + id, { debates: lista(d.debates) });
        await Banco.gravar('quiz-' + id, { quiz: lista(d.quiz), verdadeiro_falso: lista(d.verdadeiro_falso) });
        await Banco.gravar('rev-' + id, { flashcards: lista(d.flashcards), dissertativas: lista(d.dissertativas),
            argumentos_prontos: lista(d.argumentos_prontos), aprofundamento: lista(d.aprofundamento), sintese: d.sintese || '' });
        await Banco.gravar('t-' + id, { partes: [d.material || ''], completo: true });
        await Banco.salvarMeta({ id: id, titulo: a.titulo || d.titulo, nome: a.nome || '', criada: a.criada || Date.now(),
            atualizada: a.atualizada || a.criada || Date.now(), estado: 'pronta', estilo: d.tipo || 'completa', levada: a.atualizada || a.criada });
        n++;
    }
    Banco.metas.sort(function (x, y) { return (y.criada || 0) - (x.criada || 0); });
    aviso(n ? (n === 1 ? 'Uma aula restaurada.' : n + ' aulas restauradas.') : 'Essas aulas já estavam aqui.', 6000);
    redesenharSeInicio();
}

var $tela = document.getElementById('tela'), $titulo = document.getElementById('titulo');
var $voltar = document.getElementById('voltar'), $abas = document.getElementById('abas');
var $aviso = document.getElementById('aviso'), tempoAviso;
function aviso(t, ms) {
    $aviso.textContent = t; $aviso.hidden = false;
    clearTimeout(tempoAviso);
    tempoAviso = setTimeout(function () { $aviso.hidden = true; }, ms || 4000);
}
$aviso.onclick = function () { $aviso.hidden = true; };

var pilha = [];
function ir(t) { pilha.push(t); desenhar(true); }
function trocar(t) { pilha[pilha.length - 1] = t; desenhar(true); }
function voltar() { if (pilha.length > 1) { pilha.pop(); desenhar(false); } }
$voltar.onclick = voltar;
function redesenharSeInicio() { if (pilha.length === 1) desenhar(false); }

function desenhar(topo) {
    var t = pilha[pilha.length - 1];
    $titulo.textContent = t.titulo || 'Professor de Política';
    $voltar.hidden = pilha.length < 2;
    if (t.abas) {
        $abas.hidden = false;
        $abas.innerHTML = t.abas.map(function (a) {
            return '<button id="aba-' + a.id + '" data-aba="' + a.id + '"' + (a.id === t.aba ? ' class="ativa"' : '') + '>' + esc(a.nome) + '</button>';
        }).join('');
        $abas.querySelectorAll('button').forEach(function (b) {
            b.onclick = function () { t.aba = b.dataset.aba; desenhar(true); };
        });
    } else { $abas.hidden = true; }
    $tela.innerHTML = '';
    t.desenhar($tela);
    if (topo) window.scrollTo(0, 0);
    else if (t.rolagem) window.scrollTo(0, t.rolagem);
}
window.addEventListener('scroll', function () { var t = pilha[pilha.length - 1]; if (t) t.rolagem = window.scrollY; }, { passive: true });
function ao(raiz, sel, fn) { raiz.querySelectorAll(sel).forEach(function (n) { n.onclick = function (ev) { fn(n, ev); }; }); }

/* Confirmação dentro da página (o visualizador não mostra confirm()). */
function confirmar(botao, texto, acao) {
    if (botao.dataset.armado) { acao(); return; }
    botao.dataset.armado = '1';
    var original = botao.textContent;
    botao.textContent = texto;
    setTimeout(function () { if (botao.isConnected) { delete botao.dataset.armado; botao.textContent = original; } }, 4000);
}

function cartaoLicao(m) {
    var id = esc(m.id), corpo = '';
    var data = new Date(m.criada).toLocaleDateString('pt-BR');
    var g = gerando[m.id];
    if (m.estado === 'pronta') {
        var levada = m.levada && m.levada >= (m.atualizada || m.criada);
        corpo = '<div class="progresso"><i data-barra="' + id + '" style="width:0%"></i></div><div class="fraco peq" data-lidos="' + id + '">Aula pronta</div>' +
            (levada ? '<div class="marcas"><span class="marca ok">cópia baixada ✓</span></div>'
                    : '<button class="botao" style="margin-top:10px" data-levar="' + id + '">Levar para o app do celular</button>');
    } else if (g) {
        corpo = '<p class="peq" style="margin:8px 0 0"><span class="girando"></span>' + esc(g.texto) + '</p><ul class="etapas">' +
            (m.estilo === 'simples' ? ETAPAS_SIMPLES : ETAPAS).map(function (e, i) { return '<li class="' + (i < g.etapa ? 'feita' : i === g.etapa ? 'agora' : '') + '">' + (i < g.etapa ? '✓ ' : '· ') + esc(e) + '</li>'; }).join('') +
            '</ul><p class="fraco peq" style="margin:8px 0 0">Mantenha esta tela aberta. Leva ' + (m.estilo === 'simples' ? 'de 5 a 10 minutos.' : 'de 10 a 25 minutos.') + '</p>';
    } else if (m.estado === 'erro' || m.estado === 'gerando') {
        corpo = '<p class="peq" style="color:var(--erro);margin:8px 0">' +
            esc(m.estado === 'erro' ? m.erro : 'A preparação parou no meio (a tela foi fechada).') + '</p>' +
            '<button class="botao principal" data-continuar="' + id + '">Continuar de onde parou</button>';
    }
    return '<div class="cartao' + (m.estado === 'pronta' ? ' toque" data-abrir="' + id : '') + '">' +
        '<div class="titulo-licao"><div><h3 style="margin:0">' + esc(m.titulo) + '</h3>' +
        '<div class="marcas" style="margin:4px 0"><span class="marca' + (m.estilo === 'simples' ? ' ok">aula simples' : '">aula completa · semana') + '</span></div>' +
        '<div class="fraco peq">' + esc(data) + ' · ' + esc(m.nome) + '</div></div>' +
        '<button class="icone" data-menu="' + id + '" aria-label="Opções da lição">⋮</button></div>' + corpo + '</div>';
}

async function progressoNosCartoes(raiz) {
    for (var i = 0; i < Banco.metas.length; i++) {
        var m = Banco.metas[i];
        if (m.estado !== 'pronta') continue;
        var p = await progresso(m.id), plano = await Banco.ler('a-' + m.id);
        var dias = (plano ? semanaDe(lista(plano.modulos)) : []).filter(function (g) { return g.length; });
        var feitos = dias.filter(function (g) { return g.every(function (k) { return p.lidos[k]; }); }).length;
        var b = raiz.querySelector('[data-barra="' + m.id + '"]'), t = raiz.querySelector('[data-lidos="' + m.id + '"]');
        if (b && dias.length) b.style.width = Math.round(100 * feitos / dias.length) + '%';
        if (t && dias.length) t.textContent = feitos + ' de ' + dias.length + ' dias estudados';
        if (t && plano && plano.tipo === 'simples') t.textContent = p.lidos[0] ? 'Aula lida ✓' : 'Aula pronta para ler';
    }
}

async function apagarConteudo(id, tudo) {
    var plano = await Banco.ler('a-' + id);
    var chaves = ['t-', 'a-', 'aut-', 'conc-', 'deb-', 'quiz-', 'rev-'].map(function (c) { return c + id; });
    for (var i = 0; i < ((plano && plano.n_modulos) || 0); i++) chaves.push('mod-' + id + '-' + i);
    if (tudo) chaves.push('m-' + id, 'p-' + id);
    await Promise.all(chaves.map(function (k) { return Banco.apagar(k); }));
    if (tudo && Banco.col) {
        try {
            var c = await Banco.col.where('aula', '==', id).get();
            await Promise.all(c.docs.map(function (d) { return Banco.apagar(d.id); }));
        } catch (e) {}
    }
}

/* =========================================================
   A aula
   ========================================================= */
async function abrirAula(id) {
    aviso('Abrindo a aula…', 1500);
    var d;
    try { d = await lerAula(id); } catch (e) { d = null; }
    if (!d) { aviso('Não consegui abrir a aula. Tente de novo.'); return; }
    var aula = { id: id, d: d, p: await progresso(id), semana: semanaDe(lista(d.modulos)) };
    var abas = [
        { id: 'aula', nome: 'Aula' }, { id: 'autores', nome: 'Autores' }, { id: 'conceitos', nome: 'Conceitos' },
        { id: 'debates', nome: 'Debates' }, { id: 'exercicios', nome: 'Exercícios' },
        { id: 'professor', nome: 'Professor' }, { id: 'revisao', nome: 'Revisão' }
    ];
    if (lista(d.linha_do_tempo).length) abas.splice(3, 0, { id: 'tempo', nome: 'Cronologia' });
    if (d.tipo === 'simples') abas = [
        { id: 'aula', nome: 'Aula' }, { id: 'conceitos', nome: 'Palavras difíceis' }, { id: 'autores', nome: 'Quem é quem' },
        { id: 'teste', nome: 'Teste rápido' }, { id: 'professor', nome: 'Professor' }
    ];
    ir({
        titulo: d.titulo, abas: abas, aba: 'aula',
        desenhar: function (raiz) {
            ({ teste: abaTeste, aula: abaAula, autores: abaAutores, conceitos: abaConceitos, tempo: abaTempo, debates: abaDebates,
               exercicios: abaExercicios, professor: abaProfessor, revisao: abaRevisao }[this.aba] || abaAula)(raiz, aula);
        }
    });
}

function diaDoModulo(aula, i) {
    for (var k = 0; k < 5; k++) if (aula.semana[k].indexOf(i) >= 0) return k;
    return 0;
}
function diaFeito(aula, k) { var g = aula.semana[k]; return g.length > 0 && g.every(function (i) { return aula.p.lidos[i]; }); }
function diasComModulos(aula) { return [0, 1, 2, 3, 4].filter(function (k) { return aula.semana[k].length; }); }

function abaTeste(raiz, aula) {
    var n = lista(aula.d.quiz).length, q = aula.p.quiz;
    raiz.innerHTML = '<h2>Teste rápido</h2><p class="fraco">' + n + ' perguntas para conferir se você entendeu a aula.' +
        (q.melhor !== undefined ? ' Seu melhor resultado: ' + q.melhor + ' de ' + n + '.' : '') + '</p>' +
        '<button class="botao principal largo" id="comecar">Começar o teste</button>';
    raiz.querySelector('#comecar').onclick = function () { ir(telaQuiz(aula, 'quiz')); };
}

function abaAulaSimples(raiz, aula) {
    var d = aula.d, m = lista(d.modulos)[0] || {}, p = aula.p;
    var html = '<span class="rotulo">Aula simples · para quem não sabe nada</span><h2>' + esc(d.titulo) + '</h2>' +
        (m.em_uma_frase ? '<p class="frase">' + esc(m.em_uma_frase) + '</p>' : '') +
        '<div class="cartao texto"><span class="rotulo latao">Do que se trata</span>' + md(d.visao_geral) + '</div>' +
        '<div class="texto" style="margin-top:14px">' + md(m.explicacao) + '</div><div class="pilha" style="margin-top:14px">';
    if (lista(d.argumentos_prontos).length) html += '<div class="cartao texto"><span class="rotulo">Para guardar na cabeça</span><ul>' +
        lista(d.argumentos_prontos).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div>';
    if (m.checagem && m.checagem.pergunta) html += '<div class="cartao texto"><span class="rotulo">Para pensar</span><p><b>' + esc(m.checagem.pergunta) + '</b></p>' +
        '<button class="botao" id="ver">Ver um jeito de responder</button><div id="resp" hidden style="margin-top:10px">' + md(m.checagem.resposta) + '</div></div>';
    html += '<div class="botoes"><button class="botao" id="perguntar">Perguntar ao professor</button>' +
        '<button class="botao principal" id="lido">' + (p.lidos[0] ? '✓ Aula lida' : 'Terminei a aula') + '</button></div></div>';
    raiz.innerHTML = html;
    var ver = raiz.querySelector('#ver');
    if (ver) ver.onclick = function () { raiz.querySelector('#resp').hidden = false; ver.hidden = true; };
    raiz.querySelector('#lido').onclick = function () {
        if (p.lidos[0]) delete p.lidos[0]; else { p.lidos[0] = true; aviso('Muito bem! Agora faça o teste rápido.', 4000); }
        salvarProgresso(aula.id); desenhar(false);
    };
    raiz.querySelector('#perguntar').onclick = function () { ir(telaConversa(aula, cfgProfessor(aula))); };
}

/* A conversa com o professor; na aula simples ele fala como com um adolescente. */
function cfgProfessor(aula) {
    var simples = aula.d.tipo === 'simples';
    return { chave: 'tutor', modo: 'tutor', titulo: 'Professor', recomecar: true,
        dica: simples ? 'Pergunte qualquer coisa, sem vergonha: não existe pergunta boba.' : 'Pergunte o que quiser sobre a lição.',
        contexto: simples ? 'O aluno escolheu a AULA SIMPLES: responda como um professor especialista falando com um leigo, como um adolescente de 15 anos que não sabe nada do assunto. Explique sempre o contexto por trás (a história, como as coisas funcionam, quem são os atores e o que querem), com linguagem simples, frases curtas, exemplos do dia a dia (escola, futebol, amigos, família), e explique toda palavra difícil.' : '' };
}

function abaAula(raiz, aula) {
    if (aula.d.tipo === 'simples') return abaAulaSimples(raiz, aula);
    var d = aula.d, p = aula.p, mods = lista(d.modulos), sem = aula.semana, dias = diasComModulos(aula);
    var feitos = dias.filter(function (k) { return diaFeito(aula, k); }).length;
    var html = '<h2>' + esc(d.titulo) + '</h2>' + (d.subtitulo ? '<p class="fraco">' + esc(d.subtitulo) + '</p>' : '') +
        '<div class="progresso"><i style="width:' + (dias.length ? 100 * feitos / dias.length : 0) + '%"></i></div>' +
        '<p class="fraco peq">' + feitos + ' de ' + dias.length + ' dias estudados</p><div class="pilha">' +
        '<div class="cartao texto"><span class="rotulo">Visão geral</span>' + md(d.visao_geral) + '</div>';
    if (lista(d.roteiro).length) html += '<div class="cartao texto"><span class="rotulo latao">Roteiro</span><ol>' +
        lista(d.roteiro).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ol></div>';
    html += '<h3>A semana de estudo</h3>';
    var hoje = hojeDia();
    dias.forEach(function (k) {
        var g = sem[k], lidosDia = g.filter(function (i) { return p.lidos[i]; }).length, feito = lidosDia === g.length;
        html += '<div class="cartao toque modulo-item' + (feito ? ' lido' : '') + '" data-dia="' + k + '">' +
            '<div class="num dia">' + (feito ? '✓' : DIAS[k].slice(0, 3)) + '</div><div>' +
            '<span class="rotulo' + (k === hoje ? '' : ' latao') + '">' + DIAS[k] + (k === hoje ? ' · hoje' : '') + '</span>' +
            '<b>' + g.length + (g.length === 1 ? ' módulo' : ' módulos') + '</b><span class="fraco peq"> · ' + lidosDia + ' estudado' + (lidosDia === 1 ? '' : 's') + '</span>' +
            '<ul class="lista-dia peq">' + g.map(function (i) { return '<li' + (p.lidos[i] ? ' class="feito"' : '') + '>' + esc(mods[i].titulo) + '</li>'; }).join('') + '</ul>' +
            '</div></div>';
    });
    raiz.innerHTML = html + '</div>';
    ao(raiz, '[data-dia]', function (n) { ir(telaDia(aula, +n.dataset.dia)); });
}

/* Um dia da semana: os módulos daquele dia; cada um abre a sua aula. */
function telaDia(aula, k) {
    var mods = lista(aula.d.modulos);
    return {
        titulo: DIAS[k],
        desenhar: function (raiz) {
            var p = aula.p, g = aula.semana[k], dias = diasComModulos(aula);
            var pos = dias.indexOf(k), ant = dias[pos - 1], prox = dias[pos + 1];
            var lidosDia = g.filter(function (i) { return p.lidos[i]; }).length;
            var html = '<span class="rotulo latao">Dia ' + (pos + 1) + ' de ' + dias.length + '</span><h2>' + DIAS[k] + '</h2>' +
                '<div class="progresso"><i style="width:' + (g.length ? 100 * lidosDia / g.length : 0) + '%"></i></div>' +
                '<p class="fraco peq">' + lidosDia + ' de ' + g.length + ' módulos estudados hoje</p><div class="pilha">';
            g.forEach(function (i, j) {
                var m = mods[i];
                html += '<div class="cartao toque modulo-item' + (p.lidos[i] ? ' lido' : '') + '" data-mod="' + i + '">' +
                    '<div class="num">' + (p.lidos[i] ? '✓' : j + 1) + '</div><div><b>' + esc(m.titulo) + '</b>' +
                    '<div class="fraco peq">' + esc(m.em_uma_frase) + '</div>' +
                    (m.slides ? '<div class="marcas"><span class="marca">' + esc(m.slides) + '</span></div>' : '') + '</div></div>';
            });
            html += '<div class="botoes">' + (ant !== undefined ? '<button class="botao" id="ant">‹ ' + DIAS[ant].split('-')[0] + '</button>' : '') +
                (prox !== undefined ? '<button class="botao" id="prox">' + DIAS[prox].split('-')[0] + ' ›</button>' : '') + '</div></div>';
            raiz.innerHTML = html;
            ao(raiz, '[data-mod]', function (n) { ir(telaModulo(aula, +n.dataset.mod)); });
            var a = raiz.querySelector('#ant'), b = raiz.querySelector('#prox');
            if (a) a.onclick = function () { trocar(telaDia(aula, ant)); };
            if (b) b.onclick = function () { trocar(telaDia(aula, prox)); };
        }
    };
}

/* =========================================================
   No fim de cada módulo: palavras difíceis, quem é quem e um
   teste rápido, só sobre o que aquele módulo ensinou.
   ========================================================= */
var EXTRAS_FORMATO =
    '"palavras": [{"termo": "palavra ou expressão difícil deste módulo", "explicacao": "o que quer dizer, em linguagem simples", "exemplo": "um exemplo"}], ' +
    '"quem_e_quem": [{"nome": "autor, personagem, partido, país ou instituição citado neste módulo", "quem_foi": "duas ou três frases, com a época e o contexto", "o_que_tem_a_ver": "como entra neste módulo"}], ' +
    '"teste": [{"pergunta": "pergunta sobre este módulo", "alternativas": ["A", "B", "C", "D"], "correta": 0, "explicacao": "por que a correta está certa"}]';

function temExtras(m) { return !!(m && (lista(m.palavras).length || lista(m.quem_e_quem).length || lista(m.teste).length)); }

/* Para módulos de aulas feitas antes: cria os três itens só deste módulo. */
async function criarExtras(aula, i) {
    var s = await obterSample();
    if (!s) throw { message: 'Este app precisa ser aberto dentro do Claude.' };
    var m = aula.d.modulos[i];
    var r = await s.json(comMaterial(aula.d.material) +
        'O aluno acabou de estudar este MÓDULO da aula:\n<modulo>\n# ' + m.titulo + '\n\n' + (m.explicacao || '') + '\n</modulo>\n\n' +
        'Para o fim deste módulo, monte: as palavras difíceis que aparecem nele (de 4 a 10), quem é quem entre os citados nele (autores, personagens, partidos, países, instituições) e um teste rápido de 4 a 5 perguntas, tudo só sobre este módulo. Alterne a posição da alternativa correta.\n\n' +
        'Responda só com JSON: {' + EXTRAS_FORMATO + '}',
        { modelTier: 'default' });
    var novo = JSON.parse(JSON.stringify(m));
    novo.palavras = lista(r.palavras); novo.quem_e_quem = lista(r.quem_e_quem); novo.teste = lista(r.teste);
    delete novo.dia;
    await Banco.gravar('mod-' + aula.id + '-' + i, novo);
    novo.dia = m.dia;
    aula.d.modulos[i] = novo;
    return novo;
}

function htmlExtras(m) {
    var h = '';
    if (lista(m.palavras).length) h += '<details class="cartao texto"><summary>Palavras difíceis (' + m.palavras.length + ')</summary><div class="pilha" style="margin-top:10px">' +
        m.palavras.map(function (w) {
            return '<div><b>' + esc(w.termo) + '</b><br>' + esc(w.explicacao) + (w.exemplo ? '<br><span class="fraco peq">Exemplo: ' + esc(w.exemplo) + '</span>' : '') + '</div>';
        }).join('') + '</div></details>';
    if (lista(m.quem_e_quem).length) h += '<details class="cartao texto"><summary>Quem é quem (' + m.quem_e_quem.length + ')</summary><div class="pilha" style="margin-top:10px">' +
        m.quem_e_quem.map(function (q) {
            return '<div><b>' + esc(q.nome) + '</b><br>' + esc(q.quem_foi) + (q.o_que_tem_a_ver ? '<br><span class="fraco peq">Neste módulo: ' + esc(q.o_que_tem_a_ver) + '</span>' : '') + '</div>';
        }).join('') + '</div></details>';
    if (lista(m.teste).length) h += '<details class="cartao texto"><summary>Teste rápido (' + m.teste.length + ' perguntas)</summary><div class="pilha" style="margin-top:10px">' +
        m.teste.map(function (q, qi) {
            return '<div data-q="' + qi + '"><p style="margin:0 0 6px"><b>' + (qi + 1) + '. ' + esc(q.pergunta) + '</b></p><div class="pilha" style="gap:6px">' +
                lista(q.alternativas).map(function (o, k) { return '<button class="alternativa" data-op="' + k + '">' + 'ABCDE'[k] + ') ' + esc(o) + '</button>'; }).join('') +
                '</div><div class="explica" hidden style="margin-top:6px"></div></div>';
        }).join('') + '<p class="fraco peq" id="placarModulo" style="margin:0"></p></div></details>';
    return h;
}

/* Liga os botões do teste rápido do módulo. */
function ligarTeste(raiz, m) {
    var acertos = 0, feitas = 0;
    raiz.querySelectorAll('[data-q]').forEach(function (bloco) {
        var q = m.teste[+bloco.dataset.q], respondida = false;
        bloco.querySelectorAll('[data-op]').forEach(function (b) {
            b.onclick = function () {
                if (respondida) return;
                respondida = true; feitas++;
                var k = +b.dataset.op;
                bloco.querySelectorAll('[data-op]').forEach(function (x) { if (+x.dataset.op === q.correta) x.classList.add('certa'); });
                if (k === q.correta) acertos++; else b.classList.add('errada');
                var e = bloco.querySelector('.explica');
                e.innerHTML = '<span class="rotulo' + (k === q.correta ? '">Certo' : ' erro">Errado') + '</span>' + md(q.explicacao);
                e.hidden = false;
                var pl = raiz.querySelector('#placarModulo');
                if (pl) pl.textContent = acertos + ' de ' + feitas + ' certas' + (feitas === m.teste.length ? ' · teste terminado' : '');
            };
        });
    });
}

/* Acrescenta os três itens a todos os módulos que ainda não têm, sem refazer a aula. */
async function completarExtras(id, cx) {
    var aula;
    try { aula = { id: id, d: await lerAula(id) }; } catch (e) { aula = null; }
    var $e = cx.querySelector('#estadoExtras');
    if (!aula || !aula.d) { $e.textContent = 'Não consegui ler a aula.'; return; }
    var faltam = aula.d.modulos.map(function (m, i) { return temExtras(m) ? -1 : i; }).filter(function (i) { return i >= 0; });
    if (!faltam.length) { $e.textContent = 'Todos os ' + aula.d.modulos.length + ' módulos já têm os três itens. ✓'; return; }
    $e.innerHTML = faltam.length + ' de ' + aula.d.modulos.length + ' módulos ainda não têm esses itens. Dá para criar em todos de uma vez, sem refazer a aula ' +
        '(um pedido curto ao Claude por módulo; mantenha a tela aberta).';
    var b = document.createElement('button');
    b.className = 'botao principal largo'; b.style.marginTop = '10px'; b.id = 'completar';
    b.textContent = 'Criar em todos os módulos (' + faltam.length + ')';
    cx.appendChild(b);
    b.onclick = async function () {
        b.disabled = true;
        var trava = null;
        try { trava = await navigator.wakeLock.request('screen'); } catch (e) {}
        try {
            for (var n = 0; n < faltam.length; n++) {
                b.innerHTML = '<span class="girando"></span>Módulo ' + (n + 1) + ' de ' + faltam.length + '…';
                await criarExtras(aula, faltam[n]);
            }
            var m = Banco.meta(id);
            m.atualizada = Date.now();   // a cópia do celular fica desatualizada: o cartão volta a oferecer "Levar para o app"
            await Banco.salvarMeta(m);
            $e.textContent = 'Pronto: todos os módulos têm palavras difíceis, quem é quem e teste rápido. ✓';
            b.remove();
            aviso('Pronto! Para ter no celular, toque em "Levar para o app do celular" de novo.', 7000);
        } catch (e) {
            b.disabled = false; b.textContent = 'Continuar (os já feitos ficam guardados)';
            aviso(traduzirErro(e), 8000);
            faltam = aula.d.modulos.map(function (mm, i) { return temExtras(mm) ? -1 : i; }).filter(function (i) { return i >= 0; });
        } finally { if (trava) trava.release().catch(function () {}); }
    };
}

function telaModulo(aula, i) {
    var mods = lista(aula.d.modulos), k = diaDoModulo(aula, i), g = aula.semana[k], j = g.indexOf(i);
    return {
        titulo: DIAS[k] + ' · módulo ' + (j + 1) + ' de ' + g.length,
        desenhar: function (raiz) {
            var m = mods[i], p = aula.p, ultimo = j === g.length - 1;
            var html = '<span class="rotulo">' + DIAS[k] + ' · módulo ' + (j + 1) + ' de ' + g.length + (m.slides ? ' · ' + esc(m.slides) : '') + '</span>' +
                '<h2>' + esc(m.titulo) + '</h2>' + (m.em_uma_frase ? '<p class="frase">' + esc(m.em_uma_frase) + '</p>' : '') +
                '<div class="texto">' + md(m.explicacao) + '</div><div class="pilha" style="margin-top:14px">' +
                (m.exemplo ? '<div class="cartao texto"><span class="rotulo latao">Exemplo</span>' + md(m.exemplo) + '</div>' : '') +
                (m.por_que_importa ? '<div class="cartao texto"><span class="rotulo">Por que importa</span>' + md(m.por_que_importa) + '</div>' : '') +
                (m.cuidado ? '<div class="cartao texto"><span class="rotulo erro">Cuidado</span>' + md(m.cuidado) + '</div>' : '');
            if (m.checagem && m.checagem.pergunta) html += '<div class="cartao texto"><span class="rotulo">Você entendeu?</span>' +
                '<p><b>' + esc(m.checagem.pergunta) + '</b></p><p class="fraco peq">Pense na sua resposta antes de ver a do professor.</p>' +
                '<button class="botao" id="ver">Ver a resposta</button><div id="resp" hidden style="margin-top:10px">' + md(m.checagem.resposta) + '</div></div>';
            html += temExtras(m) ? htmlExtras(m)
                : '<div class="cartao"><span class="rotulo">Palavras difíceis · Quem é quem · Teste rápido</span>' +
                  '<p class="peq">Este módulo foi preparado antes desses itens existirem. Toque para criar só para ele (leva menos de um minuto).</p>' +
                  '<button class="botao largo" id="criarExtras">Criar para este módulo</button></div>';
            html += '<div class="botoes"><button class="botao" id="perguntar">Perguntar ao professor</button>' +
                '<button class="botao principal" id="lido">' + (p.lidos[i] ? '✓ Estudado' : 'Marcar como estudado') + '</button></div>' +
                '<div class="botoes">' + (j > 0 ? '<button class="botao" id="ant">‹ Módulo anterior</button>' : '') +
                (!ultimo ? '<button class="botao" id="prox">Próximo módulo ›</button>' : '<button class="botao" id="fimDia">Voltar ao dia</button>') + '</div></div>';
            raiz.innerHTML = html;
            var ver = raiz.querySelector('#ver');
            if (ver) ver.onclick = function () { raiz.querySelector('#resp').hidden = false; ver.hidden = true; };
            if (temExtras(m)) ligarTeste(raiz, m);
            var ce = raiz.querySelector('#criarExtras');
            if (ce) ce.onclick = function () {
                ce.disabled = true; ce.innerHTML = '<span class="girando"></span>Criando…';
                criarExtras(aula, i).then(function (novo) { mods[i] = novo; desenhar(false); }, function (e) {
                    ce.disabled = false; ce.textContent = 'Tentar de novo'; aviso(traduzirErro(e), 7000);
                });
            };
            raiz.querySelector('#lido').onclick = function () {
                if (p.lidos[i]) delete p.lidos[i]; else p.lidos[i] = true;
                salvarProgresso(aula.id);
                if (p.lidos[i] && diaFeito(aula, k)) {
                    var dias = diasComModulos(aula), seg = dias[dias.indexOf(k) + 1];
                    aviso(seg !== undefined ? 'Estudo de ' + DIAS[k].toLowerCase() + ' concluído. Próximo: ' + DIAS[seg].toLowerCase() + '.' : 'Semana concluída! Revise com os exercícios.', 5000);
                    voltar();
                    return;
                }
                if (p.lidos[i] && !ultimo) { trocar(telaModulo(aula, g[j + 1])); return; }
                desenhar(false);
            };
            raiz.querySelector('#perguntar').onclick = function () {
                ir(telaConversa(aula, { chave: 'mod' + i, modo: 'tutor', titulo: 'Dúvidas: ' + m.titulo,
                    contexto: 'O aluno está no estudo de ' + DIAS[k].toLowerCase() + ', no módulo "' + m.titulo + '" (' + (m.slides || '') + ').',

            };

function telaQuiz(aula, tipo, soEstas) {
    var todas = lista(tipo === 'quiz' ? aula.d.quiz : aula.d.verdadeiro_falso);
    var ordem = soEstas || todas.map(function (_, i) { return i; });
    var pos = 0, acertos = 0, erros = [], respondida = false;
    return {
        titulo: tipo === 'quiz' ? 'Múltipla escolha' : 'Verdadeiro ou falso',
        desenhar: function (raiz) {
            if (pos >= ordem.length) return fim(raiz);
            var q = todas[ordem[pos]];
            var opcoes = tipo === 'quiz' ? lista(q.alternativas) : ['Verdadeiro', 'Falso'];
            var certa = tipo === 'quiz' ? q.correta : (q.verdadeira ? 0 : 1);
            raiz.innerHTML = '<div class="placar">Questão ' + (pos + 1) + ' de ' + ordem.length + ' · ' + acertos + ' acertos</div>' +
                '<div class="progresso"><i style="width:' + (100 * pos / ordem.length) + '%"></i></div>' +
                '<h3>' + esc(tipo === 'quiz' ? q.pergunta : q.afirmacao) + '</h3><div class="pilha">' +
                opcoes.map(function (o, k) { return '<button class="alternativa" data-op="' + k + '">' + (tipo === 'quiz' ? 'ABCDE'[k] + ') ' : '') + esc(o) + '</button>'; }).join('') +
                '<div id="depois" class="pilha"></div></div>';
            respondida = false;
            ao(raiz, '[data-op]', function (n) {
                if (respondida) return;
                respondida = true;
                var k = +n.dataset.op;
                raiz.querySelectorAll('[data-op]').forEach(function (b) { if (+b.dataset.op === certa) b.classList.add('certa'); });
                if (k === certa) acertos++; else { n.classList.add('errada'); erros.push(ordem[pos]); }
                var $d = raiz.querySelector('#depois');
                $d.innerHTML = '<div class="cartao texto"><span class="rotulo' + (k === certa ? '">Certo' : ' erro">Errado') + '</span>' + md(q.explicacao) + '</div>' +
                    '<button class="botao principal largo" id="seguir">Continuar</button>';
                $d.querySelector('#seguir').onclick = function () { pos++; desenhar(true); };
                $d.querySelector('#seguir').scrollIntoView({ block: 'end' });
            });
        }
    };
    function fim(raiz) {
        if (!soEstas) {
            var reg = aula.p[tipo];
            reg.ultimo = acertos; reg.melhor = Math.max(reg.melhor || 0, acertos);
            salvarProgresso(aula.id);
        }
        var pct = Math.round(100 * acertos / ordem.length);
        raiz.innerHTML = '<div class="vazio"><div class="grande">' + acertos + '/' + ordem.length + '</div><p>' +
            (pct >= 80 ? 'Muito bem! Você domina este conteúdo.' : pct >= 60 ? 'Bom, mas revise os pontos que errou.' : 'Volte aos módulos e tente de novo. Errar aqui é o jeito de aprender.') +
            '</p></div><div class="botoes">' + (erros.length ? '<button class="botao principal" id="erros">Refazer as ' + erros.length + ' que errei</button>' : '') +
            '<button class="botao" id="tudo">Refazer tudo</button></div>';
        var e = raiz.querySelector('#erros');
        if (e) e.onclick = function () { trocar(telaQuiz(aula, tipo, erros.slice())); };
        raiz.querySelector('#tudo').onclick = function () { trocar(telaQuiz(aula, tipo)); };
    }
}

function telaFlash(aula) {
    var cards = lista(aula.d.flashcards), p = aula.p;
    var monte = cards.map(function (_, i) { return i; }).filter(function (i) { return !p.flash[i]; });
    if (!monte.length) monte = cards.map(function (_, i) { return i; });
    monte.sort(function () { return Math.random() - 0.5; });
    var virado = false;
    return {
        titulo: 'Flashcards',
        desenhar: function (raiz) {
            if (!monte.length) {
                raiz.innerHTML = '<div class="vazio"><div class="grande">' + Object.keys(p.flash).length + '/' + cards.length + '</div><p>cartões sabidos. Monte terminado.</p></div>' +
                    '<button class="botao largo" id="zerar">Recomeçar com todos</button>';
                raiz.querySelector('#zerar').onclick = function () { p.flash = {}; salvarProgresso(aula.id); trocar(telaFlash(aula)); };
                return;
            }
            var c = cards[monte[0]];
            raiz.innerHTML = '<div class="pilha"><div class="placar">Faltam ' + monte.length + ' · ' + Object.keys(p.flash).length + ' de ' + cards.length + ' sabidos</div>' +
                '<button class="cartao flash" id="carta"><div><div class="lado">' + (virado ? 'resposta' : 'pergunta · toque para virar') + '</div>' + esc(virado ? c.verso : c.frente) + '</div></button>' +
                (virado ? '<div class="botoes"><button class="botao" id="nao">Não sabia</button><button class="botao principal" id="sim">Sabia</button></div>' : '') + '</div>';
            raiz.querySelector('#carta').onclick = function () { virado = !virado; desenhar(false); };
            if (virado) {
                raiz.querySelector('#sim').onclick = function () { p.flash[monte[0]] = true; salvarProgresso(aula.id); monte.shift(); virado = false; desenhar(false); };
                raiz.querySelector('#nao').onclick = function () { monte.push(monte.shift()); virado = false; desenhar(false); };
            }
        }
    };
}

var MODOS = {

    sabatina: 'Modo SABATINA (prova oral). Teste o aluno sobre a lição inteira, uma pergunta de cada vez. A cada resposta: diga se está certa, parcialmente certa ou errada, explique em poucas linhas o que faltou e faça a próxima pergunta. Varie: conceitos, autores e obras, aplicação ao fato da semana, comparação, interpretação de dados. Aumente a dificuldade quando ele acertar; volte ao básico e reexplique quando errar. Quando ele pedir para encerrar, dê um balanço do que domina e do que precisa revisar.',

};

function telaConversa(aula, cfg) {
    var chave = 'c-' + aula.id + '-' + cfg.chave, msgs = null, falando = false, abriu = false;
    var tela = {
        titulo: cfg.titulo,
        desenhar: function (raiz) {
            if (!msgs) {
                raiz.innerHTML = '<p class="fraco centro"><span class="girando"></span>Abrindo a conversa…</p>';
                Banco.ler(chave).then(function (c) { msgs = (c && c.msgs) || []; if (pilha[pilha.length - 1] === tela) desenhar(false); })
                    .catch(function () { msgs = []; desenhar(false); });
                return;
            }
            var html = '<div class="conversa" id="conv">';
            if (!msgs.length && cfg.dica) html += '<p class="fraco peq centro">' + esc(cfg.dica) + '</p>';
            msgs.forEach(function (m) { html += fala(m); });
            html += '</div><div class="botoes" style="margin-top:14px">' +
                (cfg.avaliar && msgs.length > 2 ? '<button class="botao" id="avaliar">Encerrar e avaliar meu desempenho</button>' : '') +
                (cfg.recomecar && msgs.length ? '<button class="botao" id="recomecar">Recomeçar a conversa</button>' : '') +
                '</div><div class="escrever"><div><textarea id="msg" rows="1" aria-label="Sua mensagem" placeholder="Escreva…"></textarea>' +
                '<button class="botao principal" id="enviar" aria-label="Enviar">➤</button></div></div>';
            raiz.innerHTML = html;
            var $m = raiz.querySelector('#msg');
            $m.oninput = function () { $m.style.height = 'auto'; $m.style.height = Math.min(160, $m.scrollHeight) + 'px'; };
            raiz.querySelector('#enviar').onclick = function () {
                var t = $m.value.trim();
                if (!t || falando) return;
                $m.value = '';
                enviar(raiz, t, cfg.modo);
            };
            var av = raiz.querySelector('#avaliar');
            if (av) av.onclick = function () { if (!falando) enviar(raiz, 'Encerro o debate aqui. Avalie o meu desempenho.', 'avaliar'); };
            var rc = raiz.querySelector('#recomecar');
            if (rc) rc.onclick = function () {
                if (falando) return;
                confirmar(rc, 'Toque de novo para apagar a conversa', function () { msgs = []; guardar(); desenhar(false); });
            };
            window.scrollTo(0, document.body.scrollHeight);
            if (cfg.abertura && !abriu && (!msgs.length || cfg.sempre)) { abriu = true; enviar(raiz, cfg.abertura, cfg.modo); }
        }
    };
    return tela;

    function guardar() { Banco.gravar(chave, { aula: aula.id, msgs: msgs.slice(-40) }).catch(function () {}); }
    function fala(m) {
        if (m.papel === 'aluno') return '<div class="fala aluno">' + esc(m.texto) + '</div>';
        return '<div class="fala prof texto"><div class="quem">Professor</div>' + md(m.texto) + '</div>';
    }

    async function enviar(raiz, texto, modo) {
        if (msgs.length && msgs[msgs.length - 1].papel === 'aluno') msgs.pop();
        msgs.push({ papel: 'aluno', texto: texto });
        guardar();
        var $c = raiz.querySelector('#conv');
        $c.insertAdjacentHTML('beforeend', fala(msgs[msgs.length - 1]));
        var $p = document.createElement('div');
        $p.className = 'fala prof texto';
        $p.innerHTML = '<div class="quem">Professor</div><div class="corpo"><span class="girando"></span><span class="fraco peq">Pensando…</span></div>';
        $c.appendChild($p);
        var $corpo = $p.querySelector('.corpo');
        window.scrollTo(0, document.body.scrollHeight);
        falando = true;
        try {
            var s = await obterSample();
            if (!s) throw { message: 'Este app precisa ser aberto dentro do Claude.' };
            var abertura = comMaterial(aula.d.material) + MODOS[modo] +
                (cfg.contexto ? '\n\n<contexto_desta_conversa>\n' + cfg.contexto + '\n</contexto_desta_conversa>' : '') +
                '\n\nAgora a conversa começa. Mensagem do aluno:\n\n';
            var turnos = msgs.slice(-24).map(function (m, k) {
                return { role: m.papel === 'aluno' ? 'user' : 'assistant', content: m.texto };
            });
            while (turnos.length && turnos[0].role !== 'user') turnos.shift();
            turnos[0] = { role: 'user', content: abertura + turnos[0].content };
            if (modo === 'avaliar') turnos[turnos.length - 1].content = MODOS.avaliar + '\n\n' + turnos[turnos.length - 1].content;
            var r = await s(turnos, {
                modelTier: modo === 'corrigir' || modo === 'avaliar' ? 'complex' : 'default', cache: false,
                onText: function (ev) {
                    var noFim = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
                    $corpo.innerHTML = md(ev.text);
                    if (noFim) window.scrollTo(0, document.body.scrollHeight);
                }
            });
            msgs.push({ papel: 'prof', texto: r.text });
            guardar();
            falando = false;
            if (pilha[pilha.length - 1] === tela) desenhar(false);
        } catch (e) {
            falando = false;
            $p.classList.add('falhou');
            $corpo.innerHTML = '<p style="color:var(--erro)">' + esc(traduzirErro(e)) + '</p><button class="botao" id="denovo">Tentar de novo</button>';
            $corpo.querySelector('#denovo').onclick = function () {
                $p.remove();
                if ($c.lastElementChild) $c.lastElementChild.remove();
                var ultima = msgs.length && msgs[msgs.length - 1].papel === 'aluno' ? msgs[msgs.length - 1].texto : texto;
                enviar(raiz, ultima, modo);
            };
        }
    }
}

/* =========================================================
   Começo
   ========================================================= */
pilha = [{ titulo: 'Minhas lições', desenhar: function (r) {
    r.innerHTML = '<div class="vazio"><div class="grande">§</div><p><span class="girando"></span>Carregando suas lições…</p></div>';
} }];
desenhar(true);
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
Banco.iniciar().then(function () { pilha = [telaInicio()]; desenhar(true); });
})();
</script>
