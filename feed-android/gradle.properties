# ID do cliente OAuth (tipo Android) da sua própria conta Google. Sem ele o
# app abre, mas não consegue entrar na conta do YouTube e explica o porquê.
#
# Como criar, uma vez só, de graça (console.cloud.google.com):
#   1. novo projeto
#   2. APIs e serviços -> ativar "YouTube Data API v3"
#   3. tela de consentimento OAuth: tipo Externo; em "Usuários de teste",
#      adicione o e-mail da sua conta do YouTube
#   4. Credenciais -> criar ID do cliente OAuth -> Android
#        pacote:  com.bahiense.feed
#        SHA-1:   E4:54:28:A1:1C:36:9A:98:C0:A2:77:45:AF:DA:D3:AE:F7:37:35:25
