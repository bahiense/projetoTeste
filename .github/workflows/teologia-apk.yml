name: Gerar APK do Professor de Teologia

on:
  push:
    branches: [master, 'claude/**', 'ccr-*']
    paths:
      - 'teologia-android/**'
      - 'teologia-claude/professor.html'
      - '.github/workflows/teologia-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # A assinatura usa a chave fixa teologia-android/teologia.keystore (como o
      # app da Bíblia): toda versão sai com a mesma assinatura e instala por cima.

      - name: Compilar o APK
        working-directory: teologia-android
        run: ./gradlew assembleRelease --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp teologia-android/app/build/outputs/apk/release/app-release.apk dist/teologia.apk
                    # o app lê este arquivo para saber se há versão nova (botão "Procurar atualização")
          printf '{"codigo": %d, "nome": "1.%d", "novidades": %s}\n' \
            $((100 + GITHUB_RUN_NUMBER)) "$GITHUB_RUN_NUMBER" \
            "$(git log -1 --format=%s | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().strip()))')" \
            > dist/teologia-versao.json
          cat dist/teologia-versao.json
          ls -lh dist/

      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/teologia.apk | grep -iE "SHA-256 digest|SHA-1 digest" || true

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: teologia-apk
          path: dist/teologia.apk
          if-no-files-found: error

      # Link fixo e público para baixar direto no celular. Sai do master e, até
      # o app chegar lá, também da branch em que ele foi criado.
      - name: Publicar na aba Releases
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/professor-teologia')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teologia-apk-latest
          name: Professor de Teologia APK
          body: |
            APK do Professor de Teologia, gerado automaticamente a partir do código deste repositório.

            É o leitor das aulas preparadas pelo Professor de Teologia dentro do Claude (sem chave de API):
            aula em módulos, passagens com hebraico e grego, teólogos, conceitos, cronologia, debates,
            múltipla escolha, verdadeiro ou falso, flashcards e dissertativas, tudo sem internet.

            **Para instalar:** pelo celular, toque em `teologia.apk` aqui embaixo e abra o arquivo baixado.
            Se o Android pedir, permita "instalar apps desconhecidos" para o navegador.
            **Para trazer uma aula:** no Claude, toque em "Levar para o app do celular"; no app, toque em
            "Importar aula" e escolha o arquivo `teologia-….json` (ou abra o arquivo direto com o app).
          files: |
            dist/teologia.apk
            dist/teologia-versao.json
          fail_on_unmatched_files: true
