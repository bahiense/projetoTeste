name: Gerar APK do Fluência

on:
  push:
    # também nas branches de trabalho: é o único jeito de saber se compila
    # antes de o código chegar no master
    branches: [master, 'claude/**']
    paths:
      - 'fluencia/**'
      - 'fluencia-android/**'
      - '.github/workflows/fluencia-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: fluencia-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp fluencia-android/app/build/outputs/apk/debug/app-debug.apk dist/fluencia180.apk
          ls -lh dist/

      # a assinatura precisa ser a mesma em toda build, senão o Android recusa
      # a atualização com "app não instalado"
      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/fluencia180.apk | grep -i "SHA-256 digest" || true

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: fluencia180-apk
          path: dist/fluencia180.apk
          if-no-files-found: error

      # link fixo e público para baixar direto no celular — só do master, para
      # build de branch não trocar o APK que está publicado
      - name: Publicar na aba Releases
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fluencia-apk-latest
          name: Fluência 180 APK
          body: |
            APK do Fluência 180, gerado automaticamente a partir do código deste repositório.

            Baixe o `fluencia180.apk` pelo celular e abra o arquivo para instalar.
            O Android vai avisar que o app não veio da Play Store — é esperado, já que
            o arquivo foi compilado aqui mesmo.

            Na primeira abertura ele pede o microfone: é com ele que o app ouve
            você falar e corrige a pronúncia.
          files: dist/fluencia180.apk
          fail_on_unmatched_files: true
