name: APK do celular

# Gera o aplicativo Android. Rode pela aba Actions (botão "Run workflow") ou
# deixe que rode sozinho a cada mudança no app.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "celular/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

jobs:
  montar:
    name: Montar o APK
    runs-on: ubuntu-latest

    steps:
      - name: Buscar o código
        uses: actions/checkout@v4

      - name: Preparar o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Levar o app web para dentro do aplicativo
        run: |
          set -euo pipefail
          destino=android/app/src/main/assets
          mkdir -p "$destino"
          cp celular/index.html "$destino/"
          cp celular/manifest.webmanifest "$destino/"
          cp celular/icone-192.png celular/icone-512.png "$destino/"
          echo "Assets no aplicativo:"
          ls -la "$destino"

      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-concursos-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 90
