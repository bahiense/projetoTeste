name: Gerar APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'teleprompter/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/teleprompter.apk
          ls -lh dist/

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: dist/teleprompter.apk
          if-no-files-found: error

      # link fixo e público para baixar direto no celular
      - name: Publicar na aba Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Teleprompter APK
          body: |
            APK do teleprompter, gerado automaticamente a partir do código deste repositório.

            Baixe o `teleprompter.apk` pelo celular e abra o arquivo para instalar.
            O Android vai avisar que o app não veio da Play Store — é esperado, já que
            o arquivo foi compilado aqui mesmo.
          files: dist/teleprompter.apk
          fail_on_unmatched_files: true
