name: Gerar APK da Rede

on:
  push:
    # também nas branches de trabalho: é o único jeito de saber se compila
    # antes de o código chegar no master
    branches: [master, 'claude/**', 'ccr-*']
    paths:
      - 'rede-android/**'
      - '.github/workflows/rede-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: rede-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp rede-android/app/build/outputs/apk/debug/app-debug.apk dist/rede.apk
          ls -lh dist/

      # a assinatura precisa ser a mesma em toda build, senão o Android recusa
      # a atualização com "app não instalado"
      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/rede.apk | grep -i "SHA-256 digest" || true

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: rede-apk
          path: dist/rede.apk
          if-no-files-found: error

      # link fixo e público para baixar direto no celular — só do master, para
      # build de branch não trocar o APK que está publicado
      - name: Publicar na aba Releases
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rede-apk-latest
          name: Rede APK
          body: |
            APK do app Rede, gerado automaticamente a partir do código deste
            repositório.

            Baixe o `rede.apk` pelo celular e abra o arquivo para instalar. O
            Android vai avisar que o app não veio da Play Store — é esperado, já
            que o arquivo foi compilado aqui mesmo.

            Na primeira abertura, toque em "Ativar proteção" e confirme a VPN.
            O passo a passo completo está no README de `rede-android/`.
          files: dist/rede.apk
          fail_on_unmatched_files: true
