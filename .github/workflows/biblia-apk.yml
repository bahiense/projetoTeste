name: Gerar APK da Leitura Bíblica

on:
  push:
    # também nas branches de trabalho: é o único jeito de saber se compila
    # antes de o código chegar no master
    branches: [master, 'claude/**']
    paths:
      - 'biblia/**'
      - 'biblia-android/**'
      - '.github/workflows/biblia-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: biblia-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp biblia-android/app/build/outputs/apk/debug/app-debug.apk dist/leitura-biblica.apk
          ls -lh dist/

      # a assinatura precisa ser a mesma em toda build, senão o Android recusa
      # a atualização com "app não instalado"
      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/leitura-biblica.apk | grep -i "SHA-256 digest" || true

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: leitura-biblica-apk
          path: dist/leitura-biblica.apk
          if-no-files-found: error

      # link fixo e público para baixar direto no celular — só do master, para
      # build de branch não trocar o APK que está publicado
      - name: Publicar na aba Releases
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biblia-apk-latest
          name: Leitura Bíblica APK
          body: |
            APK do app de Leitura Bíblica, gerado automaticamente a partir do código
            deste repositório.

            **Para instalar:** toque em `leitura-biblica.apk` aqui embaixo, pelo celular,
            e abra o arquivo baixado. O Android vai avisar que o app não veio da Play
            Store e pode pedir para liberar "instalar apps desconhecidos" para o
            navegador — é esperado, o arquivo foi compilado aqui mesmo. Instalar por
            cima de uma versão anterior não apaga nada: a assinatura é a mesma em toda
            build.

            O texto bíblico vem dentro do APK: dá para ler os capítulos no próprio app,
            sem internet e sem conta. A tradução embutida é a Almeida de 1911, em domínio
            público (com uma revisão ortográfica opcional); para ler o mesmo capítulo na
            NVI, cada tela de leitura tem um botão que abre a Bible.com — a NVI é texto
            licenciado e não pode ser embutida.

            O plano de leitura, o mapa dos 1.189 capítulos e os estudos já guardados
            também funcionam sem internet.

            **De onde vêm os estudos.** Cada capítulo tem duas versões: a simples, de
            cinco minutos (contexto, quem é quem, aplicação), e a completa, com original,
            teólogos e a ligação com Cristo. Há dois caminhos para escrevê-las, os dois
            gratuitos:

            - **Pelo Claude**, na versão do app que roda dentro dele — sem chave nenhuma.
              O app instalado não alcança o Claude (ele só existe dentro do claude.ai),
              então os estudos atravessam num arquivo: lá, um botão salva um pacote na
              pasta Downloads; aqui, em Ajustes, você aponta essa pasta uma vez e os
              pacotes passam a entrar sozinhos a cada abertura, sem substituir a leitura
              marcada no aparelho.
            - **Pela chave gratuita do Google AI Studio** (aistudio.google.com/apikey —
              dois minutos, sem cartão), posta em Ajustes. Aí o próprio app escreve.

            Só há caminhos gratuitos no app: nenhum deles pede cartão.
          files: dist/leitura-biblica.apk
          fail_on_unmatched_files: true
