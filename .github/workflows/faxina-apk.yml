name: Gerar APK do Faxina

on:
  push:
    branches: [master, 'claude/**']
    paths:
      - 'faxina/**'
      - '.github/workflows/faxina-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: faxina
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp faxina/app/build/outputs/apk/debug/app-debug.apk dist/faxina.apk
          ls -lh dist/

      # a assinatura precisa ser a mesma em toda build, senão o Android recusa
      # a atualização com "app não instalado"
      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/faxina.apk | grep -i "SHA-256 digest" || true

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: faxina-apk
          path: dist/faxina.apk
          if-no-files-found: error

      # link fixo e público para baixar direto no celular
      - name: Publicar na aba Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faxina-latest
          name: Faxina APK
          body: |
            APK do Faxina, gerado automaticamente a partir do código deste repositório.

            Instale por cima da versão anterior — a assinatura é sempre a mesma.

            Depois de instalar, ligue as duas permissões que o próprio app pede
            na tela inicial: "Acesso a todos os arquivos" e "Acesso de uso".
          files: dist/faxina.apk
