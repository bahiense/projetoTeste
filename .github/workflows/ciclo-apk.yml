name: APK do Ciclo Concursos

on:
  push:
    branches: ["**"]
    paths:
      - 'ciclo-android/**'
      - 'celular/**'
      - '.github/workflows/ciclo-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: ciclo-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: |
          mkdir -p dist
          cp ciclo-android/app/build/outputs/apk/debug/app-debug.apk dist/ciclo-concursos.apk
          ls -lh dist/

      # a assinatura precisa ser a mesma em toda build, senão o Android recusa
      # a atualização com "app não instalado"
      - name: Conferir a assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/ciclo-concursos.apk | grep -i "SHA-256 digest" || true

      - name: Guardar o APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-concursos-apk
          path: dist/ciclo-concursos.apk
          if-no-files-found: error

      # link fixo e público para baixar direto no celular
      - name: Publicar na aba Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ciclo-apk-latest
          name: Ciclo Concursos APK
          body: |
            APK do Ciclo Concursos, gerado automaticamente a partir do código
            deste repositório.

            Baixe o `ciclo-concursos.apk` pelo celular e abra o arquivo para
            instalar. O Android vai avisar que o app não veio da Play Store — é
            esperado, já que o arquivo foi compilado aqui mesmo.

            Os seus dados de estudo ficam no aparelho e não são apagados quando
            você instala uma versão nova por cima.
          files: dist/ciclo-concursos.apk
          fail_on_unmatched_files: true
