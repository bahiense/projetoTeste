<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Aplicativo para lidar com gatilhos: protocolo guiado de 90 segundos, respiração conduzida, ferramentas passo a passo e registro do que muda.">
<meta name="theme-color" content="#e6e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>O Segundo Antes</title>
<link rel="icon" href="icone.svg">
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="app.css">
</head>

<body>

<main id="tela"></main>

<!-- A tela do protocolo cobre tudo: no meio de uma crise não deve haver mais
     nada clicável na frente. -->
<div id="protocolo" hidden>
  <div class="barra">
    <button class="fechar" type="button" aria-label="Sair do protocolo">&times;</button>
    <div class="passos"></div>
    <span class="relogio"></span>
  </div>
  <div class="palco"></div>
  <div class="acoes"></div>
</div>

<nav id="nav">
  <button type="button" data-ir="agora">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-7 4 14L16 12h5"/></svg>
    <span>Agora</span>
  </button>
  <button type="button" data-ir="hoje">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>
    <span>Hoje</span>
  </button>
  <button type="button" data-ir="ferramentas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Ferramentas</span>
  </button>
  <button type="button" data-ir="registro">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Registro</span>
  </button>
</nav>

<script src="dados.js"></script>
<script src="app.js"></script>

</body>

</html>
