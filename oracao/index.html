<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0e14">
    <meta name="description"
        content="Treino de oração pública pelo Método Altar: 21 dias de prática em voz alta, com análise da sua própria oração, para nunca mais travar quando pedirem 'irmão, pode fazer uma oração?'.">
    <title>Altar — treino de oração pública</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecalho">
        <a class="marca" href="#/hoje">Al<b>tar</b></a>
        <div class="cab-info">
            <span class="cab-chip" title="dias seguidos de prática">🔥 <b id="cab-streak">0</b></span>
            <span class="cab-chip cab-chip--dia" id="cab-dia">Dia 1</span>
            <a class="cab-eng" href="#/config" aria-label="Ajustes">⚙</a>
        </div>
        <div class="cab-progresso"><i id="cab-barra"></i></div>
    </header>

    <main id="tela" class="tela"></main>

    <nav class="nav">
        <button class="nav-item is-on" data-nav="hoje"><span>◎</span>Hoje</button>
        <button class="nav-item" data-nav="treinar"><span>🎙</span>Treinar</button>
        <button class="nav-item" data-nav="programa"><span>📅</span>21 dias</button>
        <button class="nav-item" data-nav="curso"><span>📖</span>Método</button>
        <button class="nav-item" data-nav="progresso"><span>📈</span>Progresso</button>
    </nav>

    <div class="modal" id="modal" hidden>
        <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal-topo">
                <h3 id="modal-titulo"></h3>
                <button class="modal-x" data-fechar-modal aria-label="Fechar">✕</button>
            </div>
            <div class="modal-corpo" id="modal-corpo"></div>
            <button class="btn btn--forte btn--grande" id="modal-fechar" data-fechar-modal>Entendi</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- conteúdo -->
    <script src="data/metodo.js"></script>
    <script src="data/modulos.js"></script>
    <script src="data/cenarios.js"></script>
    <script src="data/programa.js"></script>
    <script src="data/dicionario.js"></script>
    <script src="data/versiculos.js"></script>
    <script src="data/exemplos.js"></script>
    <script src="data/frases.js"></script>
    <script src="data/lexico.js"></script>

    <!-- ponte com o app Android; precisa vir antes de js/voz.js -->
    <script src="js/ponte-android.js"></script>

    <!-- motor -->
    <script src="js/store.js"></script>
    <script src="js/texto.js"></script>
    <script src="js/analise.js"></script>
    <script src="js/frases.js"></script>
    <script src="js/voz.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/lembrete.js"></script>
    <script src="js/treino.js"></script>

    <!-- telas -->
    <script src="js/views/hoje.js"></script>
    <script src="js/views/treinar.js"></script>
    <script src="js/views/dia.js"></script>
    <script src="js/views/programa.js"></script>
    <script src="js/views/curso.js"></script>
    <script src="js/views/biblioteca.js"></script>
    <script src="js/views/momento.js"></script>
    <script src="js/views/progresso.js"></script>
    <script src="js/views/config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
