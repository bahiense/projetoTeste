<style>
/* Layout: uma coluna de leitura (~680px), topo fixo com abas; cada material é um caderno. */
:root {
    --fundo: #f7f4ee;
    --papel: #ffffff;
    --papel2: #efe9df;
    --linha: #ddd5c6;
    --tinta: #1f1b1a;
    --fraco: #665f5a;
    --acento: #7a2c3a;
    --acento-txt: #ffffff;
    --latao: #87661c;
    --pesq: #2c5f8c;
    --pesq-fundo: #e8f0f8;
    --comp-fundo: #f8f2e3;
    --erro: #b3362f;
    --certo-fundo: #e5f2e8;
    --errado-fundo: #f8e4e2;
    --aluno: #f1e3e5;
    --display: "Literata", Georgia, "Times New Roman", serif;
    --texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --fundo: #16131a; --papel: #1f1b24; --papel2: #2a2530; --linha: #3a3340;
        --tinta: #efe9ec; --fraco: #aaa0a8; --acento: #e8909f; --acento-txt: #2a0d14;
        --latao: #e2c172; --pesq: #8fc1ee; --pesq-fundo: #18273a; --comp-fundo: #2d2617;
        --erro: #ff7b72; --certo-fundo: #183526; --errado-fundo: #3a1d1d; --aluno: #3a2129;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --fundo: #16131a; --papel: #1f1b24; --papel2: #2a2530; --linha: #3a3340;
    --tinta: #efe9ec; --fraco: #aaa0a8; --acento: #e8909f; --acento-txt: #2a0d14;
    --latao: #e2c172; --pesq: #8fc1ee; --pesq-fundo: #18273a; --comp-fundo: #2d2617;
    --erro: #ff7b72; --certo-fundo: #183526; --errado-fundo: #3a1d1d; --aluno: #3a2129;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--fundo); color: var(--tinta);
    font: 16px/1.62 var(--texto);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fundo); }

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

#topo {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--fundo); border-bottom: 1px solid var(--linha);
}
.barra-topo {
    display: flex; align-items: center; gap: 4px; max-width: 760px; margin: 0 auto;
    padding-block: 8px;
    padding-left: max(10px, env(safe-area-inset-left, 0px));

}
#titulo { flex: 1; min-width: 0; margin: 0; font: 600 18px/1.25 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icone { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 24px; line-height: 1; cursor: pointer; flex: 0 0 auto; }
.icone:hover { background: var(--papel2); }

    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 760px; margin: 0 auto;

}
#abas::-webkit-scrollbar { display: none; }

}

#tela {
    max-width: 760px; margin: 0 auto;
    padding-block: 18px 130px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));

}
h2 { font: 600 25px/1.25 var(--display); margin: 4px 0 10px; text-wrap: balance; }

.peq { font-size: 14px; }
.centro { text-align: center; }
.pilha { display: flex; flex-direction: column; gap: 12px; }

.cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 15px; min-width: 0; overflow-wrap: anywhere; }
.cartao.toque { cursor: pointer; }
.cartao.toque:hover { border-color: var(--acento); }

.rotulo { display: block; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--acento); font-weight: 700; margin-bottom: 4px; }
.rotulo.latao { color: var(--latao); }
.rotulo.erro { color: var(--erro); }

.texto blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--latao); color: var(--tinta); }
.texto ul, .texto ol { padding-left: 22px; margin: 0 0 12px; }
.texto li { margin-bottom: 5px; }
.texto code { background: var(--papel2); padding: 1px 5px; border-radius: 5px; }
.texto > :last-child { margin-bottom: 0; }
.frase { font: italic 18px/1.45 var(--display); color: var(--latao); border-left: 3px solid var(--latao); padding-left: 12px; margin: 8px 0 16px; }
.original { font: 20px/1.4 "SBL Hebrew", "Ezra SIL", "Times New Roman", serif; }

.marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.marca { font-size: 12.5px; color: var(--fraco); border: 1px solid var(--linha); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.marca.ok { color: var(--acento); border-color: var(--acento); }
.marca.pesq { color: var(--pesq); border-color: var(--pesq); }

.botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 10px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--linha); background: var(--papel); font-weight: 600; text-align: center;
}
.botao:hover { border-color: var(--acento); }
.botao.principal { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); }
.botao.perigo { color: var(--erro); }
.botao.largo { width: 100%; }
.botao:disabled { opacity: .55; cursor: default; }
a.botao { text-decoration: none; color: inherit; }
.botoes { display: flex; gap: 8px; flex-wrap: wrap; }
.botoes .botao { flex: 1 1 auto; }

.escolhas { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
.escolhas label { position: relative; }
.escolhas input { position: absolute; opacity: 0; pointer-events: none; }
.escolhas span { display: inline-block; border: 1px solid var(--linha); border-radius: 999px; padding: 6px 13px; font-size: 14px; cursor: pointer; background: var(--papel); }
.escolhas input:checked + span { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); font-weight: 600; }
.escolhas input:focus-visible + span { outline: 2px solid var(--acento); outline-offset: 2px; }
.marcar { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.marcar input { width: 20px; height: 20px; margin-top: 2px; flex: 0 0 auto; accent-color: var(--acento); }

.titulo-licao { display: flex; gap: 8px; align-items: flex-start; }
.titulo-licao > div { flex: 1; min-width: 0; }
.girando { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; border: 2px solid var(--linha); border-top-color: var(--acento); border-radius: 50%; animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .girando { animation-duration: 3s; } }
.progresso { height: 6px; background: var(--papel2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.progresso > i { display: block; height: 100%; background: var(--acento); }

.modulo-item { display: flex; gap: 12px; align-items: flex-start; }
.modulo-item .num { flex: 0 0 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--papel2); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.modulo-item.lido .num { background: var(--acento); color: var(--acento-txt); }
.modulo-item > div:last-child { min-width: 0; }

.alternativa { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--linha); background: var(--papel); cursor: pointer; }
.alternativa.certa { border-color: var(--acento); background: var(--certo-fundo); }
.alternativa.errada { border-color: var(--erro); background: var(--errado-fundo); }
.placar { font-size: 14px; color: var(--fraco); font-variant-numeric: tabular-nums; }
.flash { min-height: 220px; width: 100%; display: grid; place-items: center; text-align: center; font: 20px/1.4 var(--display); padding: 24px; cursor: pointer; }
.flash .lado { font: 600 11.5px/1 var(--texto); letter-spacing: .1em; text-transform: uppercase; color: var(--fraco); margin-bottom: 10px; }

textarea, input[type=text], input[type=search] { width: 100%; background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
textarea { min-height: 150px; resize: vertical; }

.conversa { display: flex; flex-direction: column; gap: 10px; }
.fala { padding: 11px 14px; border-radius: 14px; max-width: 94%; min-width: 0; overflow-wrap: anywhere; }
.fala.aluno { align-self: flex-end; background: var(--aluno); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.fala.prof { align-self: flex-start; background: var(--papel); border: 1px solid var(--linha); border-bottom-left-radius: 4px; }
.fala.prof .quem { font-size: 12px; color: var(--latao); font-weight: 700; margin-bottom: 4px; }
.fala.falhou { border-color: var(--erro); }
.escrever {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--fundo); border-top: 1px solid var(--linha);
    padding-top: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.escrever > div { display: flex; gap: 8px; align-items: flex-end; max-width: 760px; margin: 0 auto; }
.escrever textarea { min-height: 46px; max-height: 160px; flex: 1; }
.escrever .botao { min-width: 60px; }

#aviso {
    position: fixed; z-index: 9; background: var(--tinta); color: var(--fundo); border-radius: 10px; padding: 12px 14px;
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto;
}
.vazio { text-align: center; color: var(--fraco); padding: 36px 8px; }
.vazio .grande { font: 600 44px/1 var(--display); color: var(--latao); margin-bottom: 10px; }
details summary { cursor: pointer; font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--linha); margin: 18px 0; }
.etapas { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.etapas li { padding: 2px 0; color: var(--fraco); }
.etapas li.feita { color: var(--acento); }
.etapas li.agora { color: var(--tinta); font-weight: 600; }
.legenda { display: grid; gap: 6px; font-size: 14px; }
.legenda div { display: flex; gap: 8px; align-items: baseline; }
.legenda .marca { flex: 0 0 auto; }
</style>

<header id="topo">
    <div class="barra-topo">
        <button id="voltar" class="icone" aria-label="Voltar" hidden>‹</button>
        <h1 id="titulo">Professor de Teologia</h1>
    </div>
    <nav id="abas" hidden></nav>
</header>
<main id="tela"></main>
<div id="aviso" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   Onde a página roda:
   - no Claude (artifact): escreve as aulas pelo plano, com o banco do artifact;
   - no app Android (WebView): o objeto TeologiaNativo guarda tudo em arquivos
     e a página vira um leitor (sem Claude, sem rede).
   ========================================================= */
var NATIVO = window.TeologiaNativo || null;
var PREFIXO_ARQ = 'teologia-';
var FORMATO = 'professor-de-teologia';
var SERVIDOR_BUSCA = 'Parallel Search';
// o Professor de Teologia dentro do Claude: onde as aulas são preparadas, pelo plano
var NO_CLAUDE = 'https://claude.ai/artifact/JW1aJyxRL68X8n7LyzVL3q';

/* =========================================================
   Markdown simples para HTML. Tudo é escapado antes: texto
   vindo do Claude nunca entra na página como marcação.
   ========================================================= */
function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function linha(t) {
    var s = esc(t);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
}
function md(texto) {
    var linhas = String(texto || '').replace(/\r/g, '').split('\n');
    var html = [], lista = null, par = [], cit = false;
    function fp() { if (par.length) { html.push('<p>' + linha(par.join(' ')) + '</p>'); par = []; } }
    function fl() { if (lista) { html.push('</' + lista + '>'); lista = null; } }
    function fc() { if (cit) { html.push('</blockquote>'); cit = false; } }
    linhas.forEach(function (l) {
        var t = l.trim();
        if (!t) { fp(); fl(); fc(); return; }
        var h = t.match(/^(#{1,6})\s+(.*)$/);
        if (h) { fp(); fl(); fc(); var n = Math.min(6, h[1].length + 2); html.push('<h' + n + '>' + linha(h[2]) + '</h' + n + '>'); return; }
        if (/^(-{3,}|\*{3,})$/.test(t)) { fp(); fl(); fc(); html.push('<hr>'); return; }
        var ul = t.match(/^[-*•]\s+(.*)$/), ol = t.match(/^(\d+)[.)]\s+(.*)$/);
        if (ul || ol) {
            fp(); fc();
            var tipo = ul ? 'ul' : 'ol';
            if (lista && lista !== tipo) fl();
            if (!lista) { lista = tipo; html.push('<' + tipo + '>'); }
            html.push('<li>' + linha(ul ? ul[1] : ol[2]) + '</li>');
            return;
        }
        fl();
        var c = t.match(/^>\s?(.*)$/);
        if (c) { fp(); if (!cit) { html.push('<blockquote>'); cit = true; } html.push('<p>' + linha(c[1]) + '</p>'); return; }
        fc();
        par.push(t);
    });
    fp(); fl(); fc();
    return html.join('\n');
}
function lista(a) { return Array.isArray(a) ? a : []; }
function copia(x) { return x === undefined || x === null ? x : JSON.parse(JSON.stringify(x)); }
function bytes(s) { return new TextEncoder().encode(String(s || '')).length; }

/* =========================================================
   Onde as aulas ficam.
   - Claude: banco do artifact, pasta particular de cada pessoa.
   - App Android: arquivos do app (TeologiaNativo).
   - Sem nenhum dos dois: o navegador (localStorage).
   O banco do artifact entrega documentos CONGELADOS: tudo o que
   sai daqui é uma cópia que pode ser alterada.
   ========================================================= */
var Banco = {
    col: null, local: true, metas: [],
    iniciar: async function () {
        if (NATIVO) { this.local = false; await this.carregarMetas(); return; }
        try {
            var db = await usar('db'), user = await usar('user');
            var uid = user ? await user.id() : null;
            if (db && uid) { this.col = db.collection('data/users/' + uid); this.local = false; }
        } catch (e) { this.col = null; }
        await this.carregarMetas();
    },
    carregarMetas: async function () {
        if (NATIVO) {
            try { this.metas = JSON.parse(NATIVO.metas() || '[]'); } catch (e) { this.metas = []; }
        } else if (this.col) {
            try {
                var snap = await comPrazo(this.col.where('tipo', '==', 'meta').get(), 12000);
                this.metas = snap.docs.map(function (d) { return copia(d.data()); });
            } catch (e) { aviso('Não consegui ler seus materiais agora. Recarregue a página.'); this.metas = []; }
        } else {
            this.metas = Object.keys(localStorageSeguro()).filter(function (k) { return k.indexOf('teo:m-') === 0; })
                .map(function (k) { return lerLocal(k); }).filter(Boolean);
        }
        this.metas.sort(function (a, b) { return (b.criada || 0) - (a.criada || 0); });
    },
    ler: async function (chave) {
        if (NATIVO) { var t = NATIVO.ler(chave); return t ? JSON.parse(t) : null; }
        if (this.col) {
            var d = await comPrazo(this.col.doc(chave).get(), 15000);
            return d.exists ? copia(d.data()) : null;
        }
        return lerLocal('teo:' + chave);
    },
    gravar: async function (chave, valor) {
        var v = copia(valor);
        if (NATIVO) { if (!NATIVO.gravar(chave, JSON.stringify(v))) throw new Error('Não consegui gravar no aparelho.'); return; }
        if (this.col) return comPrazo(this.col.doc(chave).set(v), 20000);
        gravarLocal('teo:' + chave, v);
    },
    apagar: async function (chave) {
        if (NATIVO) { NATIVO.apagar(chave); return; }
        if (this.col) { try { await this.col.doc(chave).delete(); } catch (e) {} return; }
        try { localStorage.removeItem('teo:' + chave); } catch (e) {}
    },
    apagarConversas: async function (id) {
        if (NATIVO) { NATIVO.apagarPrefixo('c-' + id + '-'); return; }
        if (this.col) {
            try {
                var c = await this.col.where('aula', '==', id).get();
                await Promise.all(c.docs.map(function (d) { return Banco.apagar(d.id); }));
            } catch (e) {}
            return;
        }
        Object.keys(localStorageSeguro()).filter(function (k) { return k.indexOf('teo:c-' + id + '-') === 0; })
            .forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    },
    meta: function (id) { return this.metas.filter(function (m) { return m.id === id; })[0]; },
    salvarMeta: async function (m) {
        m.tipo = 'meta';
        var i = this.metas.findIndex(function (x) { return x.id === m.id; });
        if (i < 0) this.metas.unshift(m); else this.metas[i] = m;
        await this.gravar('m-' + m.id, m);
    }
};
/* Fora do Claude não existe window.claude: tudo que depende dele some. */
function usar(nome) {
    return window.claude && typeof window.claude.use === 'function' ? window.claude.use(nome) : Promise.resolve(null);
}
function comPrazo(p, ms) {
    var t;
    return Promise.race([p, new Promise(function (_, rej) { t = setTimeout(function () { rej(new Error('O banco demorou a responder. Toque em "Continuar".')); }, ms); })])
        .finally(function () { clearTimeout(t); });
}
function localStorageSeguro() { try { return localStorage; } catch (e) { return {}; } }
function lerLocal(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function gravarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { aviso('O navegador ficou sem espaço.'); } }

/* =========================================================
   O professor
   ========================================================= */
var PROFESSOR =
'Você é o Professor: teólogo, doutor em teologia, com décadas de docência em seminário e universidade e vários livros publicados. Domina teologia sistemática, bíblica e histórica, exegese do Antigo e do Novo Testamento nas línguas originais (hebraico, aramaico bíblico e grego koiné), história da igreja (patrística, Idade Média, Reforma e Contrarreforma, avivamentos, missões, teologia moderna e contemporânea, cristianismo na América Latina e no Brasil), apologética, ética cristã, homilética e hermenêutica. Conhece por dentro as grandes tradições cristãs (católica romana, ortodoxa, luterana, reformada/presbiteriana, anglicana, anabatista e batista, metodista/wesleyana e arminiana, pentecostal e carismática, além das teologias liberal, neo-ortodoxa, da libertação e evangélica contemporânea) e o judaísmo do Segundo Templo.\n\n' +
'Seu aluno é um adulto brasileiro, inteligente e curioso. Ele sobe materiais variados (aulas em slides, livros, apostilas, artigos, sermões, estudos bíblicos; quase sempre de teologia, mas pode ser de outro assunto: nesse caso, ensine aquele assunto com o mesmo rigor). Ele quer sair de cada material dominando o conteúdo, capaz de explicar para outra pessoa e de debater com qualquer um.\n\n' +
'Como você ensina:\n' +
'- Ensina TUDO o que está no material, sem pular nada: cada página, argumento, conceito, autor, passagem bíblica, termo em hebraico ou grego, data, tabela, nota e citação. O que o material só menciona de passagem, você explica por completo.\n' +
'- Fala simples. Frases claras, um termo técnico de cada vez, sempre definido na hora em que aparece.\n' +
'- Vai do simples ao complexo: a ideia numa frase, o desenvolvimento, um exemplo ou ilustração concreta, depois nuances, debates e limites.\n' +
'- Passagens bíblicas: dá o contexto (livro, autor, época, destinatários, contexto literário e histórico), o sentido do texto e, quando ajuda, os termos originais com transliteração e significado. Mostra quando as tradições leem o texto de modos diferentes.\n' +
'- Teólogos e autores: quem foi, quando e onde viveu, a que tradição pertencia, contra o que reagia, obras e ideias centrais, e exatamente como se liga ao material.\n' +
'- Justiça com as tradições: apresenta cada posição no seu melhor argumento, nas palavras de quem a defende, sem caricatura; separa o que é consenso, o que é posição de uma tradição e o que é opinião do autor do material. Não faz proselitismo nem desqualifica outras igrejas; quando o aluno pedir sua avaliação, dá com honestidade, mostrando os critérios.\n' +
'- Separa SEMPRE a origem da informação: o que o material diz; o que você acrescenta do seu conhecimento; o que veio da pesquisa na web (quando houver pesquisa, ela vem em <pesquisa_na_web>, com fontes). Nunca atribua ao material o que ele não diz.\n' +
'- Nunca inventa dados, citações, datas, números, títulos de obras ou referências bíblicas. Na dúvida, diz que não tem certeza. Citação literal só quando for conhecida e fiel; senão, paráfrase sem aspas. Não reproduza longos trechos de traduções bíblicas protegidas: cite a referência e, no máximo, um versículo curto.\n' +
'- Escreve em português do Brasil. Nos textos longos, usa Markdown simples: parágrafos curtos separados por linha em branco, **negrito** nos termos importantes, listas com "- " e citações com "> ". Referências bíblicas no padrão brasileiro (ex.: Rm 3.21-26).';

var GENEROS = [
    { id: 'aula', nome: 'Aula ou slides', desc: 'slides de uma aula' },
    { id: 'livro', nome: 'Livro ou capítulo', desc: 'um livro (ou capítulos de um livro)' },
    { id: 'apostila', nome: 'Apostila ou artigo', desc: 'uma apostila ou artigo acadêmico' },
    { id: 'sermao', nome: 'Sermão ou pregação', desc: 'um sermão ou pregação (transcrição ou esboço)' },
    { id: 'estudo', nome: 'Estudo bíblico', desc: 'um estudo bíblico' },
    { id: 'outro', nome: 'Outro', desc: 'um material de estudo' }
];
var OBJETIVOS = [
    { id: 'dominar', nome: 'Dominar e debater', aba: 'Apologética',
      pedido: 'APOLOGÉTICA E DEFESA: as objeções mais fortes (de dentro e de fora da fé, e entre tradições) às teses centrais do material, cada uma com a melhor resposta disponível e o que ainda fica em aberto; perguntas difíceis que alguém faria e como responder com honestidade.' },
    { id: 'pregacao', nome: 'Preparar uma pregação', aba: 'Pregação',
      pedido: 'PREGAÇÃO: um esboço homilético completo baseado no material: texto base, tema, proposição, introdução, de 3 a 4 pontos (cada um com explicação do texto, ilustração e aplicação), conclusão e apelo; depois, cuidados exegéticos para não distorcer o texto e sugestões de ilustrações e de público.' },
    { id: 'ensinar', nome: 'Ensinar um estudo ou aula', aba: 'Para ensinar',
      pedido: 'PARA ENSINAR: um plano de aula ou de estudo em grupo a partir do material: objetivo, duração sugerida, roteiro passo a passo, perguntas para discussão (com o que se espera ouvir), uma dinâmica ou recurso visual, as perguntas difíceis que os alunos costumam fazer e como responder, e uma tarefa para casa.' },
    { id: 'prova', nome: 'Estudar para prova', aba: 'Para a prova',
      pedido: 'PARA A PROVA: o que mais cai e por quê; um esquema-resumo de uma página; quadros comparativos (por exemplo, entre posições ou autores); mnemônicos; pegadinhas comuns; e um roteiro de revisão em três dias.' },
    { id: 'devocional', nome: 'Edificação pessoal', aba: 'Para a vida',
      pedido: 'PARA A VIDA: uma meditação a partir das verdades centrais do material, perguntas de reflexão pessoal, aplicações práticas para a semana, textos bíblicos para ler e meditar, e uma sugestão de oração (sem forçar uma tradição específica).' }
];
function genero(id) { return GENEROS.filter(function (g) { return g.id === id; })[0] || GENEROS[5]; }
function objetivo(id) { return OBJETIVOS.filter(function (o) { return o.id === id; })[0] || OBJETIVOS[0]; }

function sobreOMaterial(m) {
    var o = objetivo(m.objetivo);
    return 'O material é ' + genero(m.genero).desc + '. Objetivo do aluno: ' + o.nome.toLowerCase() + '.' +
        (m.obs ? '\nObservações do aluno: ' + m.obs : '');
}

/* O texto-base que acompanha os pedidos: o material inteiro, quando cabe;
   o fichamento de cada parte, quando o material é grande (um livro). */
function contexto(d, opcoes) {
    opcoes = opcoes || {};
    var t = PROFESSOR + '\n\n<sobre_o_material>\n' + sobreOMaterial(d.meta || {}) + '\n</sobre_o_material>\n\n';
    var sec = opcoes.secoes || (opcoes.secao !== undefined ? [opcoes.secao] : null);
    if (sec && d.secoes && d.secoes.length > 1) {
        t += '<resumo_do_material_inteiro>\n' + caber(d.fichas.join('\n\n'), 30000) + '\n</resumo_do_material_inteiro>\n\n' +
            '<trecho_do_material>\n' + caber(sec.map(function (k) { return d.secoes[k] || ''; }).join('\n\n'), 150000) + '\n</trecho_do_material>\n\n';
    } else {
        t += '<material>\n' + caber(d.base, 150000) + '\n</material>\n\n';
    }
    if (d.plano) t += '<plano_da_aula>\n' + caber(d.plano, 12000) + '\n</plano_da_aula>\n\n';
    if (d.dossie) t += '<pesquisa_na_web>\n' + caber(d.dossie, 25000) + '\n</pesquisa_na_web>\n\n';
    return t;
}
function caber(texto, max) {
    texto = String(texto || '');
    if (bytes(texto) <= max) return texto;
    var corte = texto.slice(0, Math.floor(max / 1.15));
    while (bytes(corte) > max) corte = corte.slice(0, Math.floor(corte.length * 0.9));
    return corte + '\n\n[… o restante foi omitido aqui por tamanho]';
}
var REGRA_ORIGEM =
    'Regra de origem: em "explicacao" fica só o que o material diz (explicado e desdobrado); em "complemento" o que você acrescenta do seu conhecimento; em "da_pesquisa" só o que veio de <pesquisa_na_web>, com o link da fonte em Markdown (deixe vazio se não houver pesquisa ou se ela nada acrescentar a este ponto).';

/* =========================================================
   Preparar a aula. Cada parte é um pedido separado, guardado
   assim que fica pronto: se algo falhar, continua de onde parou.
   ========================================================= */
var sampleFn = null, limites = null;
var gerando = {};    // id -> {texto, etapa}
var fontes = {};     // id -> o arquivo escolhido nesta visita (para continuar sem escolher de novo)

async function obterSample() {
    if (!sampleFn) sampleFn = await usar('sample');
    if (sampleFn && !limites) { try { limites = await sampleFn.limits(); } catch (e) { limites = {}; } }
    return sampleFn;
}

/* Uma imagem (página de PDF ou foto) vira duas metades, com uma faixa em
   comum: o Claude recebe cada uma com cerca de 1,2 megapixel, e a letra
   pequena chega com o dobro de resolução. */
async function metades(c) {
    var metade = Math.round(c.height * 0.56), imgs = [];
    for (var k = 0; k < 2; k++) {
        var p = document.createElement('canvas');
        p.width = c.width; p.height = metade;
        var ctx = p.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, p.width, p.height);
        ctx.drawImage(c, 0, k === 0 ? 0 : c.height - metade, c.width, metade, 0, 0, c.width, metade);
        imgs.push(await new Promise(function (ok) { p.toBlob(ok, 'image/jpeg', 0.88); }));
    }
    return imgs;
}

/* Abre a fonte e devolve um leitor de páginas: {total, pagina(n) -> {texto, imagens()}}. */
async function abrirFonte(fonte) {
    if (fonte.tipo === 'pdf') {
        if (!window.pdfjsLib) throw { message: 'Não consegui carregar o leitor de PDF. Verifique a internet e recarregue a página.' };
        var pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await fonte.arquivo.arrayBuffer()) }).promise;
        return {
            total: pdf.numPages,
            pagina: async function (n) {
                var pag = await pdf.getPage(n), texto = '';
                try {
                    var tc = await pag.getTextContent();
                    texto = tc.items.map(function (it) { return it.str + (it.hasEOL ? '\n' : ' '); }).join('')
                        .replace(/[ \t]+/g, ' ').replace(/\n /g, '\n').replace(/\n{3,}/g, '\n\n').trim();
                } catch (e) {}
                return {
                    texto: texto,
                    imagens: async function () {
                        var v = pag.getViewport({ scale: 1 });
                        var vp = pag.getViewport({ scale: Math.sqrt(2200000 / (v.width * v.height)) });
                        var c = document.createElement('canvas');
                        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
                        var ctx = c.getContext('2d');
                        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
                        await pag.render({ canvasContext: ctx, viewport: vp }).promise;
                        return metades(c);
                    }
                };
            }
        };
    }
    if (fonte.tipo === 'imagens') {
        return {
            total: fonte.arquivos.length,
            pagina: async function (n) {
                return {
                    texto: '',
                    imagens: async function () {
                        var bmp = await createImageBitmap(fonte.arquivos[n - 1]);
                        var e = Math.min(1, Math.sqrt(2200000 / (bmp.width * bmp.height)));
                        var c = document.createElement('canvas');
                        c.width = Math.round(bmp.width * e); c.height = Math.round(bmp.height * e);
                        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
                        return metades(c);
                    }
                };
            }
        };
    }
    throw { message: 'Fonte desconhecida.' };
}

/* Divide um texto longo em partes de até `max` bytes, em quebras de parágrafo. */
function dividir(texto, max) {
    var partes = [], atual = '';
    String(texto || '').split(/\n(?=\n)/).forEach(function (bloco) {
        if (atual && bytes(atual) + bytes(bloco) > max) { partes.push(atual); atual = ''; }
        while (bytes(bloco) > max) { var n = Math.floor(bloco.length * max / bytes(bloco) * 0.95); partes.push(bloco.slice(0, n)); bloco = bloco.slice(n); }
        atual += bloco;
    });
    if (atual.trim()) partes.push(atual);
    return partes.length ? partes : [''];
}

var ETAPAS = ['Ler o material', 'Fichar e planejar', 'Pesquisar na web', 'Escrever os módulos', 'Teólogos e autores',
    'Passagens bíblicas', 'Conceitos e cronologia', 'Debates e tradições', 'Exercícios', 'Revisão e aplicação'];
var LIMITE_PEQUENO = 110000;   // bytes: até aqui, o material vai inteiro em cada pedido
var TAM_SECAO = 55000;         // bytes de cada parte de um material grande
var LOTE = 3;                  // páginas por pedido de leitura
var DIAS = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira'];

/* As partes de um material grande divididas em 5 dias seguidos. Com menos de 5
   partes, dias vizinhos dividem a mesma parte (o plano diz o que cabe a cada um). */
function gruposPorDia(secoes) {
    var n = secoes.length, grupos = [];
    for (var k = 0; k < 5; k++) {
        var ini = Math.min(n - 1, Math.floor(k * n / 5)), fim = Math.max(ini, Math.ceil((k + 1) * n / 5) - 1);
        var g = [];
        for (var x = ini; x <= Math.min(fim, n - 1); x++) g.push(x);
        grupos.push(g);
    }
    return grupos;
}
/* Garante 5 dias: junta os módulos a mais em ordem; se vierem menos, divide os maiores. */
function cincoDias(mods) {
    mods = mods.filter(Boolean);
    if (!mods.length) mods = [{ titulo: 'Aula', trecho: '', cobre: 'todo o material' }];
    while (mods.length > 5) {
        var k = 0, menor = Infinity;
        for (var i = 0; i < mods.length - 1; i++) {
            var tam = String(mods[i].cobre || '').length + String(mods[i + 1].cobre || '').length;
            if (tam < menor) { menor = tam; k = i; }
        }
        var a = mods[k], b = mods[k + 1];
        mods.splice(k, 2, { titulo: a.titulo + ' e ' + b.titulo, trecho: [a.trecho, b.trecho].filter(Boolean).join('; '), cobre: [a.cobre, b.cobre].filter(Boolean).join('; ') });
    }
    while (mods.length < 5) {
        var j = 0;
        mods.forEach(function (m, i) { if (String(m.cobre || '').length > String(mods[j].cobre || '').length) j = i; });
        var m = mods[j];
        mods.splice(j, 1, { titulo: m.titulo + ' (1ª parte)', trecho: m.trecho, cobre: 'a primeira metade de: ' + m.cobre },
                          { titulo: m.titulo + ' (2ª parte)', trecho: m.trecho, cobre: 'a segunda metade de: ' + m.cobre });
    }
    return mods;
}

async function lerMaterial(id) {
    var t = await Banco.ler('t-' + id);
    if (!t) return null;
    var partes = await Promise.all(Array.from({ length: t.n || 0 }, function (_, k) { return Banco.ler('tp-' + id + '-' + k); }));
    return { info: t, texto: partes.map(function (p) { return p ? p.texto : ''; }).join('\n\n') };
}

async function preparar(id, fonte) {
    if (gerando[id]) return;
    if (fonte) fontes[id] = fonte; else fonte = fontes[id] || null;
    var m = Banco.meta(id);
    gerando[id] = { texto: 'Começando…', etapa: 0 };
    m.estado = 'gerando'; delete m.erro; delete m.precisaArquivo;
    await Banco.salvarMeta(m);
    redesenharSeInicio();
    var trava = null;
    try { trava = await navigator.wakeLock.request('screen'); } catch (e) {}
    function andar(etapa, texto) { gerando[id] = { etapa: etapa, texto: texto }; redesenharSeInicio(); }
    try {
        var s = await obterSample();
        if (!s) throw { message: 'Este app precisa ser aberto dentro do Claude (no app ou em claude.ai).' };

        /* 1. ler o material, em janelas de LOTE páginas, cada uma guardada */
        var t = await Banco.ler('t-' + id);
        if (!t || !t.completo) {
            if (!fonte) throw { message: 'A leitura não terminou. Escolha o arquivo de novo para continuar de onde parou.', precisaArquivo: true };
            var leitor = await abrirFonte(fonte);
            if (!t || t.paginas !== leitor.total) t = { n: 0, paginas: leitor.total, lote: LOTE, completo: false, imagens: 0 };
            for (var ini = t.n * LOTE; ini < leitor.total; ini += LOTE) {
                var fim = Math.min(leitor.total, ini + LOTE);
                andar(0, 'Lendo as páginas ' + (ini + 1) + ' a ' + fim + ' de ' + leitor.total + '…');
                var pags = [];
                for (var n = ini + 1; n <= fim; n++) pags.push(await leitor.pagina(n));
                // páginas com bastante texto vão direto; slides, figuras e escaneados vão como imagem ao Claude
                var precisaImagem = m.imagens || pags.some(function (p) { return p.texto.replace(/\s/g, '').length < 400; });
                var texto;
                if (!precisaImagem) {
                    texto = pags.map(function (p, j) { return '### Página ' + (ini + j + 1) + '\n\n' + p.texto; }).join('\n\n');
                } else {
                    if (!limites || !limites.images) throw { message: 'Esta tela não consegue mandar imagens ao Claude. Abra pelo app do Claude ou por claude.ai e permita imagens.' };
                    var imgs = [];
                    for (var j = 0; j < pags.length; j++) imgs = imgs.concat(await pags[j].imagens());
                    var textos = pags.map(function (p, j) { return p.texto ? 'Página ' + (ini + j + 1) + ': ' + p.texto : ''; }).filter(Boolean).join('\n\n');
                    // cada página são duas imagens; se a tela aceita menos imagens por pedido, divide a janela
                    var porPedido = Math.max(2, Math.floor((limites.images.maxCount || 6) / 2) * 2), lidos = [];
                    for (var c0 = 0; c0 < imgs.length; c0 += porPedido) {
                        var pIni = ini + c0 / 2 + 1, pFim = Math.min(fim, ini + (c0 + porPedido) / 2);
                        var r = await s(
                            'As imagens são as páginas ' + pIni + ' a ' + pFim + ' (de ' + leitor.total + ') de ' + genero(m.genero).desc + ' (em geral de teologia). ' +
                            'Cada página vem em duas imagens, na ordem: a metade de cima e a metade de baixo (elas se sobrepõem um pouco; não repita o que aparece nas duas).\n\n' +
                            (textos ? 'O texto que o arquivo tem dessas páginas (use para conferir a grafia, inclusive de palavras em hebraico e grego):\n' + textos + '\n\n' : '') +
                            'Transcreva cada página com fidelidade total, em Markdown, começando cada uma com "### Página N — título (se houver)". Inclua TODO o texto, inclusive o pequeno: títulos, parágrafos, rótulos, legendas, referências bíblicas, palavras em hebraico ou grego (na escrita original e, se a página trouxer, a transliteração), números, tabelas (como lista), esquemas e gráficos (descreva o que mostram), notas de rodapé, fontes e citações. Não resuma e não comente: só transcreva. Se algo estiver ilegível, escreva [ilegível].',
                            { images: imgs.slice(c0, c0 + porPedido), modelTier: 'complex' });
                        lidos.push(r.text);
                    }
                    texto = lidos.join('\n\n');
                    t.imagens = (t.imagens || 0) + pags.length;
                }
                await Banco.gravar('tp-' + id + '-' + t.n, { aula: id, texto: texto });
                t.n++;
                await Banco.gravar('t-' + id, t);
            }
            t.completo = true;
            await Banco.gravar('t-' + id, t);
        }
        var material = (await lerMaterial(id)).texto;
        var secoes = bytes(material) <= LIMITE_PEQUENO ? [material] : dividir(material, TAM_SECAO);
        var d = { meta: m, base: material, secoes: secoes, fichas: [] };

        /* 2. fichar (material grande) e planejar */
        if (secoes.length > 1) {
            for (var f = 0; f < secoes.length; f++) {
                var ficha = await Banco.ler('f-' + id + '-' + f);
                if (!ficha) {
                    andar(1, 'Fichando a parte ' + (f + 1) + ' de ' + secoes.length + '…');
                    ficha = await s.json(PROFESSOR + '\n\n<sobre_o_material>\n' + sobreOMaterial(m) + '\n</sobre_o_material>\n\n' +
                        '<trecho_do_material parte="' + (f + 1) + ' de ' + secoes.length + '">\n' + secoes[f] + '\n</trecho_do_material>\n\n' +
                        'Faça o FICHAMENTO completo deste trecho (ele é uma das ' + secoes.length + ' partes do material).\n\n' +
                        'Responda só com JSON: {"fichamento": "Markdown de 1200 a 2500 palavras: cada argumento, tese, autor, passagem bíblica, termo original e dado do trecho, na ordem, sem pular nada", ' +
                        '"autores": ["nomes citados"], "passagens": ["referências bíblicas citadas"]}', { modelTier: 'complex' });
                    ficha.secao = f;
                    await Banco.gravar('f-' + id + '-' + f, ficha);
                }
                d.fichas.push('## Parte ' + (f + 1) + '\n\n' + ficha.fichamento);
                d.autFichas = (d.autFichas || []).concat(lista(ficha.autores));
                d.pasFichas = (d.pasFichas || []).concat(lista(ficha.passagens));
            }
            d.base = d.fichas.join('\n\n');
        }
        var plano = await Banco.ler('a-' + id);
        if (!plano) {
            andar(1, 'Planejando a semana de estudo…');
            var grande = secoes.length > 1;
            var grupos = gruposPorDia(secoes);
            plano = await s.json(contexto(d) +
                (grande ? 'O material é grande e acima está o fichamento de cada parte. Cada dia estuda estas partes do fichamento: ' +
                    grupos.map(function (g, k) { return DIAS[k] + ': parte' + (g.length > 1 ? 's ' + (g[0] + 1) + ' a ' + (g[g.length - 1] + 1) : ' ' + (g[0] + 1)); }).join('; ') +
                    ' (quando dois dias compartilham uma parte, divida o conteúdo dela entre eles, sem repetir).' +
                    '\nAutores citados nas partes: ' + JSON.stringify(d.autFichas) + '\nPassagens citadas nas partes: ' + JSON.stringify(d.pasFichas) + '\n\n'
                       : '') +

function traduzirErro(e) {
    var c = e && e.code;
    if (c === 'not_granted') return 'Você não permitiu que a página use o Claude. Toque em continuar e permita.';
    if (c === 'rate_limited') return 'Você chegou ao limite de uso do seu plano por agora. Espere o limite renovar e toque em "Continuar": o que já ficou pronto está guardado.';
    if (c === 'prompt_too_large') return 'Uma parte ficou grande demais para um pedido só. Divida o arquivo em partes menores.';
    if (c === 'invalid_json' || c === 'empty_completion') return 'Uma das partes veio incompleta. Toque em "Continuar" para tentar de novo.';
    if (c === 'refused') return 'O Claude recusou uma das partes. Toque em "Continuar" para tentar de novo.';
    if (c === 'images_unavailable' || c === 'image_rejected') return 'Esta tela não conseguiu mandar as imagens das páginas. Abra pelo app do Claude ou por claude.ai.';
    if (c === 'sampling_disabled' || c === 'capability_disabled') return 'O uso do Claude por páginas está desligado na sua conta.';
    return (e && e.message) || 'Algo deu errado. Toque em "Continuar" para tentar de novo.';
}

/* =========================================================
   Pesquisa na web: a página não tem rede própria; a única
   porta é um conector do Claude (MCP). Usa o "Parallel Search"
   (gratuito, sem login), se a pessoa o tiver adicionado.
   ========================================================= */
var esquemaBusca;   // undefined = ainda não perguntei; null = sem esquema
async function entradasBusca(mcp, q) {
    if (esquemaBusca === undefined) {
        try { esquemaBusca = (await mcp.describeTool(SERVIDOR_BUSCA, 'web_search')).inputSchema || null; } catch (e) { esquemaBusca = null; }
    }
    var tentativas = [];
    var props = esquemaBusca && esquemaBusca.properties;
    if (props) {
        var ent = {}, req = lista(esquemaBusca.required);
        Object.keys(props).forEach(function (k) {
            var pr = props[k] || {}, tipo = pr.type;
            var texto = /objective|query|search|prompt|question|q$/i.test(k);
            if (tipo === 'string' && (texto || req.indexOf(k) >= 0)) ent[k] = q;
            else if (tipo === 'array' && (texto || req.indexOf(k) >= 0)) ent[k] = [q];
            else if ((tipo === 'integer' || tipo === 'number') && /max|limit|num|count/i.test(k)) ent[k] = 5;
        });
        if (Object.keys(ent).length) tentativas.push(ent);
    }
    tentativas.push({ objective: q, search_queries: [q] }, { query: q });
    return tentativas;
}
async function buscarNaWeb(q, signal) {
    var mcp = await usar('mcp');
    if (!mcp) throw { code: 'sem_mcp' };
    var tentativas = await entradasBusca(mcp, q), ultimo;
    for (var i = 0; i < tentativas.length; i++) {
        try {
            var r = await mcp.callTool(SERVIDOR_BUSCA, 'web_search', tentativas[i], { signal: signal });
            var bruto = r.payload !== undefined ? r.payload : r.content;
            var texto = typeof bruto === 'string' ? bruto : JSON.stringify(bruto, null, 1);
            var links = (texto.match(/https?:\/\/[^\s"')\]]+/g) || []).filter(function (u, k, a) { return a.indexOf(u) === k; }).slice(0, 12);
            return { texto: caber(texto, 6000), links: links };
        } catch (e) {
            ultimo = e;
            // argumento errado: tenta o próximo formato; outros erros não melhoram tentando
            if (!(e && (e.code === 'tool_error' || e.code === 'bad_request'))) throw e;
        }
    }
    throw ultimo;
}
function motivoBusca(e) {
    var c = e && e.code;
    if (c === 'sem_mcp') return 'Esta tela não dá acesso a conectores (abra pelo claude.ai ou pelo app do Claude).';
    if (c === 'server_not_connected' || c === 'selection_required') return 'O conector "Parallel Search" não está adicionado na sua conta. Em claude.ai → Configurações → Conectores, adicione "Parallel Search" (gratuito, sem login) e prepare de novo.';
    if (c === 'not_granted' || c === 'approval_required') return 'Você não permitiu que a página use o conector de pesquisa.';
    if (c === 'needs_reauth') return 'O conector de pesquisa precisa ser reconectado em claude.ai → Configurações → Conectores.';
    if (c === 'blocked_by_policy') return 'A sua organização bloqueia esse conector.';
    if (c === 'cancelled') return 'A pesquisa foi interrompida.';
    return 'A pesquisa falhou (' + ((e && (e.code || e.message)) || 'erro') + ').';
}
async function estadoPesquisa() {
    if (NATIVO) return { ok: false, texto: '' };
    var mcp = await usar('mcp');
    if (!mcp) return { ok: false, texto: 'Pesquisa na web indisponível nesta tela.' };
    try {
        var l = await mcp.listTools(SERVIDOR_BUSCA);
        var srv = lista(l && l.servers).filter(function (x) { return x.server === SERVIDOR_BUSCA; })[0];
        if (!srv || !lista(srv.tools).length) return { ok: false, texto: 'Para pesquisar, adicione o conector "Parallel Search" (gratuito) em claude.ai → Configurações → Conectores. Sem ele, o professor completa com o próprio conhecimento.' };
        if (srv.authStatus === 'needs_reauth') return { ok: false, texto: 'Reconecte o conector "Parallel Search" em claude.ai → Configurações → Conectores.' };
        return { ok: true, texto: 'Pesquisa pelo conector "Parallel Search". Na primeira busca, o Claude pede sua permissão.' };
    } catch (e) {
        return { ok: true, texto: 'Vou tentar pesquisar pelo conector "Parallel Search"; se ele não estiver adicionado, o professor completa com o próprio conhecimento.' };
    }
}

    d.passagens = r[1] ? r[1].lista : [];
    [r[2], r[3], r[4], r[5]].forEach(function (x) { if (x) Object.assign(d, x); });
    d.aplicacao = r[6] || null;
    d.pesquisa = r[7] || { feita: false };
    d.dossie = d.pesquisa.feita ? d.pesquisa.dossie : '';
    var mat = await lerMaterial(id);
    d.material = mat ? mat.texto : '';
    d.fichas = [];
    if ((plano.n_secoes || 1) > 1) {
        var fs = await Promise.all(Array.from({ length: plano.n_secoes }, function (_, k) { return Banco.ler('f-' + id + '-' + k); }));
        d.fichas = fs.map(function (f, k) { return '## Parte ' + (k + 1) + '\n\n' + (f ? f.fichamento : ''); });
        d.secoes = dividir(d.material, TAM_SECAO);
        d.base = d.fichas.join('\n\n');
    } else { d.secoes = [d.material]; d.base = d.material; }
    d.plano = JSON.stringify({ titulo: plano.titulo, modulos: lista(plano.modulos).map(function (x) { return x.titulo; }) });
    return d;
}

/* =========================================================
   Cópias: levar para o app do celular e guardar para sempre.
   O arquivo "teologia-*.json" vai para Downloads; no celular,
   o app Professor de Teologia importa pelo botão "Importar
   aula", por "Abrir com" ou por "Compartilhar".
   ========================================================= */
async function pacoteDe(ids) {
    var aulas = [];
    for (var i = 0; i < ids.length; i++) {
        var m = Banco.meta(ids[i]);
        if (!m || m.estado !== 'pronta') continue;
        var plano = await Banco.ler('a-' + m.id);
        if (!plano) continue;
        var partes = {};
        var chaves = ['a', 'aut', 'pas', 'conc', 'deb', 'quiz', 'rev', 'apl', 'pesq', 't'];
        var r = await Promise.all(chaves.map(function (c) { return Banco.ler(c + '-' + m.id); }));
        chaves.forEach(function (c, k) { partes[c] = r[k]; });
        partes.mod = await Promise.all(Array.from({ length: plano.n_modulos || 0 }, function (_, k) { return Banco.ler('mod-' + m.id + '-' + k); }));
        partes.f = await Promise.all(Array.from({ length: (plano.n_secoes || 1) > 1 ? plano.n_secoes : 0 }, function (_, k) { return Banco.ler('f-' + m.id + '-' + k); }));
        var mat = await lerMaterial(m.id);
        partes.material = mat ? mat.texto : '';
        var meta = copia(m); delete meta.erro; delete meta.precisaArquivo;
        aulas.push({ id: m.id, titulo: m.titulo, criada: m.criada, atualizada: m.atualizada || m.criada, meta: meta, partes: partes });
    }
    return { formato: FORMATO, versao: 1, gerado: Date.now(), aulas: aulas };
}

function nomeArquivo(t) {
    return String(t || 'aula').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'aula';
}

async function baixarCopia(ids, nome) {
    var dl = await usar('downloads');
    if (!dl) { aviso('Esta tela não consegue baixar arquivos. Abra pelo app do Claude ou por claude.ai.', 7000); return false; }
    aviso('Preparando o arquivo…', 2000);
    var pacote = await pacoteDe(ids);
    if (!pacote.aulas.length) { aviso('Não há aula pronta para levar.'); return false; }
    try {
        await dl.save({ filename: nome, data: JSON.stringify(pacote) });
    } catch (e) {
        if (e && e.code === 'declined') return false;
        aviso('Não consegui baixar o arquivo (' + ((e && e.message) || 'erro') + ').', 7000);
        return false;
    }
    for (var i = 0; i < pacote.aulas.length; i++) {
        var m = Banco.meta(pacote.aulas[i].id);
        m.levada = m.atualizada || m.criada;
        await Banco.salvarMeta(m);
    }
    aviso('Arquivo salvo. No celular, abra o app Professor de Teologia e toque em "Importar aula" (ou abra o arquivo com o app).', 9000);
    redesenharSeInicio();
    return true;
}

/* Traz aulas de um arquivo de cópia. Devolve quantas entraram. */
async function restaurarTexto(texto) {
    var pacote;
    try { pacote = JSON.parse(texto); } catch (e) { pacote = null; }
    if (!pacote || pacote.formato !== FORMATO) { aviso('Esse arquivo não é uma aula do Professor de Teologia (ou veio cortado no download).', 7000); return -1; }
    var n = 0;
    for (var i = 0; i < lista(pacote.aulas).length; i++) {
        var a = pacote.aulas[i], id = String(a.id || ''), p = a.partes;
        if (!/^[a-z0-9]{1,20}$/.test(id) || !p || !p.a || !Array.isArray(p.mod)) continue;
        var ja = Banco.meta(id);
        if (ja && ja.estado === 'pronta' && (ja.atualizada || ja.criada) >= (a.atualizada || a.criada)) continue;
        await apagarConteudo(id, false);
        var plano = p.a; plano.n_modulos = p.mod.length; plano.n_secoes = p.f && p.f.length > 1 ? p.f.length : 1;
        await Banco.gravar('a-' + id, plano);
        for (var k = 0; k < p.mod.length; k++) if (p.mod[k]) await Banco.gravar('mod-' + id + '-' + k, p.mod[k]);
        if (plano.n_secoes > 1) for (k = 0; k < p.f.length; k++) if (p.f[k]) await Banco.gravar('f-' + id + '-' + k, p.f[k]);
        var outras = ['aut', 'pas', 'conc', 'deb', 'quiz', 'rev', 'apl', 'pesq'];
        for (k = 0; k < outras.length; k++) if (p[outras[k]]) await Banco.gravar(outras[k] + '-' + id, p[outras[k]]);
        var pedacos = dividir(p.material || '', 200000);
        for (k = 0; k < pedacos.length; k++) await Banco.gravar('tp-' + id + '-' + k, { aula: id, texto: pedacos[k] });
        await Banco.gravar('t-' + id, Object.assign({}, p.t || {}, { n: pedacos.length, completo: true }));
        var meta = Object.assign({}, a.meta || {}, { id: id, titulo: a.titulo || plano.titulo, criada: a.criada || Date.now(),
            atualizada: a.atualizada || a.criada || Date.now(), estado: 'pronta', levada: a.atualizada || a.criada });
        await Banco.salvarMeta(meta);
        n++;
    }
    Banco.metas.sort(function (x, y) { return (y.criada || 0) - (x.criada || 0); });
    aviso(n ? (n === 1 ? 'Uma aula importada.' : n + ' aulas importadas.') : 'Essas aulas já estavam aqui.', 6000);
    redesenharSeInicio();
    return n;
}

function entradaArquivo(id, aceita, varios) {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = aceita; i.hidden = true; i.id = id; if (varios) i.multiple = true;
    document.body.appendChild(i);
    return i;
}
var $arquivo = entradaArquivo('arquivo', 'application/pdf,.pdf,text/plain,.txt,.md,text/markdown,image/jpeg,image/png,image/webp', true);
var $copia = entradaArquivo('copia', 'application/json,.json,text/plain', false);
var paraContinuar = null, aoEscolher = null;
$copia.onchange = async function () { var f = $copia.files[0]; $copia.value = ''; if (f) restaurarTexto(await f.text()); };
$arquivo.onchange = async function () {
    var fs = Array.prototype.slice.call($arquivo.files);
    $arquivo.value = '';
    if (!fs.length) return;
    var fonte = await fonteDeArquivos(fs);
    if (!fonte) return;
    if (paraContinuar) { var idc = paraContinuar; paraContinuar = null; preparar(idc, fonte); return; }
    if (aoEscolher) aoEscolher(fonte);
};
async function fonteDeArquivos(fs) {
    var pdf = fs.filter(function (f) { return /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name); });
    var img = fs.filter(function (f) { return /^image\//.test(f.type); });
    var txt = fs.filter(function (f) { return /^text\//.test(f.type) || /\.(txt|md)$/i.test(f.name); });
    if (pdf.length === 1 && fs.length === 1) return { tipo: 'pdf', arquivo: pdf[0], nome: pdf[0].name };
    if (img.length === fs.length) {
        img.sort(function (a, b) { return a.name.localeCompare(b.name, 'pt', { numeric: true }); });
        return { tipo: 'imagens', arquivos: img, nome: img.length === 1 ? img[0].name : img.length + ' imagens' };
    }
    if (txt.length === fs.length) {
        var textos = await Promise.all(txt.map(function (f) { return f.text(); }));
        return { tipo: 'texto', texto: textos.join('\n\n'), nome: txt[0].name };
    }
    aviso('Escolha um PDF, um ou mais arquivos de texto (.txt, .md) ou várias fotos de páginas. Word e EPUB: salve como PDF antes.', 8000);
    return null;
}

                    pesquisar: $p.checked, imagens: raiz.querySelector('#imagens').checked, fonte: f.tipo };
                await Banco.salvarMeta(m);

                    await Banco.gravar('t-' + id, { n: pedacos.length, completo: true, paginas: 0 });
                }
                pilha = [telaInicio()]; desenhar(true);
                preparar(id, f.tipo === 'texto' ? null : f);

        }
    };
    return tela;
}

/* tudo: também o meta, o progresso e as conversas; manterLeitura: guarda o material lido. */
async function apagarConteudo(id, tudo, manterLeitura) {
    var plano = await Banco.ler('a-' + id), t = await Banco.ler('t-' + id);
    var chaves = ['a-', 'aut-', 'pas-', 'conc-', 'deb-', 'quiz-', 'rev-', 'apl-', 'pesq-'].map(function (c) { return c + id; });
    for (var i = 0; i < ((plano && plano.n_modulos) || 0); i++) chaves.push('mod-' + id + '-' + i);
    for (i = 0; i < ((plano && plano.n_secoes) || 0); i++) chaves.push('f-' + id + '-' + i);
    if (!manterLeitura) {
        chaves.push('t-' + id);
        for (i = 0; i < ((t && t.n) || 0); i++) chaves.push('tp-' + id + '-' + i);
    }
    if (tudo) chaves.push('m-' + id, 'p-' + id);
    await Promise.all(chaves.map(function (k) { return Banco.apagar(k); }));
    if (tudo) { await Banco.apagarConversas(id); delete cacheProg[id]; }
}

}
var pedidos = {}, numPedido = 0;
window.__resposta = function (n, r) { var f = pedidos[n]; delete pedidos[n]; if (f) f(r); };
window.__progresso = function (n, p) { var b = document.getElementById('atualizar'); if (b) b.textContent = 'Baixando… ' + p + '%'; };
function pedir(fn) { return new Promise(function (ok) { var n = ++numPedido; pedidos[n] = ok; fn(n); }); }

function botoesNativos(raiz) {
    var u = raiz.querySelector('#ultimaCopia');
    try { var q = NATIVO.ultimaCopia(); if (u && q) u.textContent = 'Última cópia em Downloads: ' + new Date(q).toLocaleString('pt-BR'); } catch (e) {}
    var c = raiz.querySelector('#copiaAgora');
    if (c) c.onclick = async function () {
        c.disabled = true;
        var pacote = await pacoteDe(Banco.metas.map(function (m) { return m.id; }));
        NATIVO.salvarCopia(JSON.stringify(pacote));
        c.disabled = false;
    };
    var e = raiz.querySelector('#enviarCopia');
    if (e) e.onclick = async function () {
        var pacote = await pacoteDe(Banco.metas.map(function (m) { return m.id; }));
        NATIVO.enviarCopia(JSON.stringify(pacote));
    };
    var ATU = window.TeologiaAtualizar, b = raiz.querySelector('#atualizar'), v = raiz.querySelector('#versao');
    if (!ATU) { if (b) b.hidden = true; return; }
    try { v.textContent += ' Versão ' + ATU.versaoInstalada() + '.'; } catch (x) {}
    b.onclick = async function () {
        if (b.dataset.nova) {
            b.disabled = true;
            var r = await pedir(function (n) { ATU.atualizar(n); });
            b.disabled = false;
            if (r.permissao) aviso('Permita que o app instale atualizações e toque de novo.', 8000);
            else if (r.erro) aviso(r.erro, 8000);
            b.textContent = 'Instalar a versão nova';
            return;
        }
        b.disabled = true; b.textContent = 'Procurando…';
        var info = await pedir(function (n) { ATU.verificar(n); });
        b.disabled = false;
        if (info.codigo && info.codigo > info.instalada) {
            b.dataset.nova = '1'; b.textContent = 'Instalar a versão ' + info.nome;
            if (info.novidades) aviso('Novidade: ' + info.novidades, 8000);
        } else b.textContent = info.codigo ? 'O app está atualizado' : 'Sem internet agora';
    };
}

async function abrirAula(id) {
    aviso('Abrindo a aula…', 1500);
    var d;
    try { d = await lerAula(id); } catch (e) { d = null; }
    if (!d) { aviso('Não consegui abrir a aula. Tente de novo.'); return; }
    var aula = { id: id, d: d, p: await progresso(id) };
    var m = d.meta, obj = objetivo(m.objetivo);
    var abas = [{ id: 'aula', nome: 'Aula' }];
    if (lista(d.passagens).length) abas.push({ id: 'passagens', nome: 'Passagens' });
    if (lista(d.autores).length) abas.push({ id: 'autores', nome: 'Teólogos' });
    abas.push({ id: 'conceitos', nome: 'Conceitos' });
    if (lista(d.linha_do_tempo).length) abas.push({ id: 'tempo', nome: 'Cronologia' });
    abas.push({ id: 'debates', nome: 'Debates' }, { id: 'exercicios', nome: 'Exercícios' });
    if (d.aplicacao) {
        var abaApl = { id: 'aplicacao', nome: d.aplicacao.titulo || obj.aba };
        // quem vai pregar ou ensinar quer essa parte logo no começo
        if (m.objetivo === 'pregacao' || m.objetivo === 'ensinar') abas.splice(1, 0, abaApl); else abas.push(abaApl);
    }
    if (m.genero === 'estudo' && abas[1] && abas[1].id !== 'passagens') {
        var ip = abas.findIndex(function (a) { return a.id === 'passagens'; });
        if (ip > 1) abas.splice(1, 0, abas.splice(ip, 1)[0]);
    }
    abas.push({ id: 'professor', nome: 'Professor' }, { id: 'revisao', nome: 'Revisão' });
    ir({
        titulo: d.titulo, abas: abas, aba: 'aula',
        desenhar: function (raiz) {
            ({ aula: abaAula, passagens: abaPassagens, autores: abaAutores, conceitos: abaConceitos, tempo: abaTempo, debates: abaDebates,
               exercicios: abaExercicios, aplicacao: abaAplicacao, professor: abaProfessor, revisao: abaRevisao }[this.aba] || abaAula)(raiz, aula);
        }
    });
}

function telaQuiz(aula, tipo, soEstas) {
    var todas = lista(tipo === 'quiz' ? aula.d.quiz : aula.d.verdadeiro_falso);
    var ordem = soEstas || todas.map(function (_, i) { return i; });
    var pos = 0, acertos = 0, erros = [], respondida = false;
    return {
        titulo: tipo === 'quiz' ? 'Múltipla escolha' : 'Verdadeiro ou falso',
        desenhar: function (raiz) {
            if (pos >= ordem.length) return fim(raiz);
            var q = todas[ordem[pos]];
            var opcoes = tipo === 'quiz' ? lista(q.alternativas) : ['Verdadeiro', 'Falso'];
            var certa = tipo === 'quiz' ? q.correta : (q.verdadeira ? 0 : 1);
            raiz.innerHTML = '<div class="placar">Questão ' + (pos + 1) + ' de ' + ordem.length + ' · ' + acertos + ' acertos</div>' +
                '<div class="progresso"><i style="width:' + (100 * pos / ordem.length) + '%"></i></div>' +
                '<h3>' + esc(tipo === 'quiz' ? q.pergunta : q.afirmacao) + '</h3><div class="pilha">' +
                opcoes.map(function (o, k) { return '<button class="alternativa" data-op="' + k + '">' + (tipo === 'quiz' ? 'ABCDE'[k] + ') ' : '') + esc(o) + '</button>'; }).join('') +
                '<div id="depois" class="pilha"></div></div>';
            respondida = false;
            ao(raiz, '[data-op]', function (n) {
                if (respondida) return;
                respondida = true;
                var k = +n.dataset.op;
                raiz.querySelectorAll('[data-op]').forEach(function (b) { if (+b.dataset.op === certa) b.classList.add('certa'); });
                if (k === certa) acertos++; else { n.classList.add('errada'); erros.push(ordem[pos]); }
                var $d = raiz.querySelector('#depois');
                $d.innerHTML = '<div class="cartao texto"><span class="rotulo' + (k === certa ? '">Certo' : ' erro">Errado') + '</span>' + md(q.explicacao) + '</div>' +
                    '<button class="botao principal largo" id="seguir">Continuar</button>';
                $d.querySelector('#seguir').onclick = function () { pos++; desenhar(true); };
                $d.querySelector('#seguir').scrollIntoView({ block: 'end' });
            });
        }
    };
    function fim(raiz) {
        if (!soEstas) {
            var reg = aula.p[tipo];
            reg.ultimo = acertos; reg.melhor = Math.max(reg.melhor || 0, acertos);
            salvarProgresso(aula.id);
        }
        var pct = Math.round(100 * acertos / Math.max(1, ordem.length));
        raiz.innerHTML = '<div class="vazio"><div class="grande">' + acertos + '/' + ordem.length + '</div><p>' +
            (pct >= 80 ? 'Muito bem! Você domina este conteúdo.' : pct >= 60 ? 'Bom, mas revise os pontos que errou.' : 'Volte aos módulos e tente de novo. Errar aqui é o jeito de aprender.') +
            '</p></div><div class="botoes">' + (erros.length ? '<button class="botao principal" id="erros">Refazer as ' + erros.length + ' que errei</button>' : '') +
            '<button class="botao" id="tudo">Refazer tudo</button></div>';
        var e = raiz.querySelector('#erros');
        if (e) e.onclick = function () { trocar(telaQuiz(aula, tipo, erros.slice())); };
        raiz.querySelector('#tudo').onclick = function () { trocar(telaQuiz(aula, tipo)); };
    }
}

function telaFlash(aula) {
    var cards = lista(aula.d.flashcards), p = aula.p;
    var monte = cards.map(function (_, i) { return i; }).filter(function (i) { return !p.flash[i]; });
    if (!monte.length) monte = cards.map(function (_, i) { return i; });
    monte.sort(function () { return Math.random() - 0.5; });
    var virado = false;
    return {
        titulo: 'Flashcards',
        desenhar: function (raiz) {
            if (!monte.length) {
                raiz.innerHTML = '<div class="vazio"><div class="grande">' + Object.keys(p.flash).length + '/' + cards.length + '</div><p>cartões sabidos. Monte terminado.</p></div>' +
                    '<button class="botao largo" id="zerar">Recomeçar com todos</button>';
                raiz.querySelector('#zerar').onclick = function () { p.flash = {}; salvarProgresso(aula.id); trocar(telaFlash(aula)); };
                return;
            }
            var c = cards[monte[0]];
            raiz.innerHTML = '<div class="pilha"><div class="placar">Faltam ' + monte.length + ' · ' + Object.keys(p.flash).length + ' de ' + cards.length + ' sabidos</div>' +
                '<button class="cartao flash" id="carta"><div><div class="lado">' + (virado ? 'resposta' : 'pergunta · toque para virar') + '</div>' + esc(virado ? c.verso : c.frente) + '</div></button>' +
                (virado ? '<div class="botoes"><button class="botao" id="nao">Não sabia</button><button class="botao principal" id="sim">Sabia</button></div>' : '') + '</div>';
            raiz.querySelector('#carta').onclick = function () { virado = !virado; desenhar(false); };
            if (virado) {
                raiz.querySelector('#sim').onclick = function () { p.flash[monte[0]] = true; salvarProgresso(aula.id); monte.shift(); virado = false; desenhar(false); };
                raiz.querySelector('#nao').onclick = function () { monte.push(monte.shift()); virado = false; desenhar(false); };
            }
        }
    };
}

var MODOS = {
    tutor: 'Modo TIRA-DÚVIDAS. O aluno está estudando este material e vai fazer perguntas. Responda de forma clara e completa, com exemplos e, quando ajudar, com as passagens e os termos originais. Deixe claro o que vem do material, o que é complemento seu e o que veio de pesquisa. Termine, quando fizer sentido, com uma pergunta curta que o faça pensar.',
    debate: 'Modo DEBATE. O aluno quer treinar para debater; o contexto diz a questão e o lado dele. Você defende o lado OPOSTO, com firmeza e os melhores argumentos dessa posição (sem caricatura), como faria um bom teólogo dessa tradição. Uma rodada por vez: responda ao argumento dele, aponte com precisão a fraqueza (texto bíblico fora de contexto, generalização, falácia, conceito mal usado, dado histórico errado) e lance um contra-argumento ou uma pergunta difícil. Respostas curtas e vivas, no máximo uns três parágrafos. Se ele errar um dado ou conceito, corrija numa linha entre colchetes, como professor, e volte ao debate.',
    avaliar: 'O debate acabou. Saia do personagem e avalie o desempenho do aluno como professor: nota de 0 a 10 com justificativa; os melhores argumentos dele; os erros (falácias, exegese fraca, dados errados, conceitos mal usados, oportunidades perdidas); como responder melhor aos seus contra-argumentos mais fortes (dê as respostas, com os textos); três coisas para estudar ou treinar.',
    sabatina: 'Modo SABATINA (prova oral). Teste o aluno sobre o material inteiro, uma pergunta de cada vez. A cada resposta: diga se está certa, parcialmente certa ou errada, explique em poucas linhas o que faltou e faça a próxima pergunta. Varie: conceitos, teólogos e obras, passagens e seu contexto, termos originais, comparação entre tradições, aplicação. Aumente a dificuldade quando ele acertar; volte ao básico e reexplique quando errar. Quando ele pedir para encerrar, dê um balanço do que domina e do que precisa revisar.',
    corrigir: 'Modo CORREÇÃO. O contexto traz uma questão dissertativa e os pontos esperados; a mensagem do aluno é a resposta dele. Corrija como um professor exigente e generoso: nota de 0 a 10; o que está certo e bem argumentado; o que está errado, impreciso ou faltando; uma versão modelo completa da resposta; uma dica para escrever e argumentar melhor. Se ele mandar uma nova versão, corrija a nova.'
};
function podeConversar() { return !NATIVO; }

function telaConversa(aula, cfg) {
    var chave = 'c-' + aula.id + '-' + cfg.chave, msgs = null, falando = false, abriu = false;
    var tela = {
        titulo: cfg.titulo,
        desenhar: function (raiz) {
            if (!msgs) {
                raiz.innerHTML = '<p class="fraco centro"><span class="girando"></span>Abrindo a conversa…</p>';
                Banco.ler(chave).then(function (c) { msgs = (c && c.msgs) || []; if (pilha[pilha.length - 1] === tela) desenhar(false); })
                    .catch(function () { msgs = []; desenhar(false); });
                return;
            }
            var html = '<div class="conversa" id="conv">';
            if (!podeConversar()) html += '<div class="cartao peq"><p>As conversas com o professor (dúvidas, debate, sabatina e correção) acontecem no <b>Professor de Teologia dentro do Claude</b>, pelo seu plano. A mesma aula está lá, com as mesmas abas.</p>' +
                '<a class="botao principal largo" href="' + NO_CLAUDE + '">Abrir no Claude ›</a></div>';
            else if (!msgs.length && cfg.dica) html += '<p class="fraco peq centro">' + esc(cfg.dica) + '</p>';
            msgs.forEach(function (m) { html += fala(m); });
            html += '</div>';
            if (podeConversar()) html += '<div class="botoes" style="margin-top:14px">' +
                (cfg.avaliar && msgs.length > 2 ? '<button class="botao" id="avaliar">Encerrar e avaliar meu desempenho</button>' : '') +
                (cfg.recomecar && msgs.length ? '<button class="botao" id="recomecar">Recomeçar a conversa</button>' : '') +
                '</div><div class="escrever"><div><textarea id="msg" rows="1" aria-label="Sua mensagem" placeholder="Escreva…"></textarea>' +
                '<button class="botao principal" id="enviar" aria-label="Enviar">➤</button></div></div>';
            raiz.innerHTML = html;
            if (!podeConversar()) return;
            var $m = raiz.querySelector('#msg');
            $m.oninput = function () { $m.style.height = 'auto'; $m.style.height = Math.min(160, $m.scrollHeight) + 'px'; };
            raiz.querySelector('#enviar').onclick = function () {
                var t = $m.value.trim();
                if (!t || falando) return;
                $m.value = '';
                enviar(raiz, t, cfg.modo);
            };
            var av = raiz.querySelector('#avaliar');
            if (av) av.onclick = function () { if (!falando) enviar(raiz, 'Encerro o debate aqui. Avalie o meu desempenho.', 'avaliar'); };
            var rc = raiz.querySelector('#recomecar');
            if (rc) rc.onclick = function () {
                if (falando) return;
                confirmar(rc, 'Toque de novo para apagar a conversa', function () { msgs = []; guardar(); desenhar(false); });
            };
            window.scrollTo(0, document.body.scrollHeight);
            if (cfg.abertura && !abriu && (!msgs.length || cfg.sempre)) { abriu = true; enviar(raiz, cfg.abertura, cfg.modo); }
        }
    };
    return tela;

    function guardar() { Banco.gravar(chave, { aula: aula.id, msgs: msgs.slice(-40) }).catch(function () {}); }
    function fala(m) {
        if (m.papel === 'aluno') return '<div class="fala aluno">' + esc(m.texto) + '</div>';
        return '<div class="fala prof texto"><div class="quem">Professor</div>' + md(m.texto) + '</div>';
    }

    async function enviar(raiz, texto, modo) {
        if (msgs.length && msgs[msgs.length - 1].papel === 'aluno') msgs.pop();
        msgs.push({ papel: 'aluno', texto: texto });
        guardar();
        var $c = raiz.querySelector('#conv');
        $c.insertAdjacentHTML('beforeend', fala(msgs[msgs.length - 1]));
        var $p = document.createElement('div');
        $p.className = 'fala prof texto';
        $p.innerHTML = '<div class="quem">Professor</div><div class="corpo"><span class="girando"></span><span class="fraco peq">Pensando…</span></div>';
        $c.appendChild($p);
        var $corpo = $p.querySelector('.corpo');
        window.scrollTo(0, document.body.scrollHeight);
        falando = true;
        try {
            var s = await obterSample();
            if (!s) throw { message: 'Este app precisa ser aberto dentro do Claude.' };
            var comWeb = modo === 'tutor' && pesquisaNaConversa() && limites && limites.tools;
            var abertura = contexto(aula.d, cfg.secoes ? { secoes: cfg.secoes } : cfg.secao !== undefined ? { secao: cfg.secao } : {}) + MODOS[modo === 'avaliar' ? 'debate' : modo] +
                (comWeb ? '\n\nVocê tem a ferramenta pesquisar_na_web. Use-a quando precisar conferir um fato, data, citação ou trazer algo atual que não está no material; diga ao aluno o que veio da pesquisa e dê o link da fonte em Markdown.' : '') +
                (cfg.contexto ? '\n\n<contexto_desta_conversa>\n' + cfg.contexto + '\n</contexto_desta_conversa>' : '') +
                '\n\nAgora a conversa começa. Mensagem do aluno:\n\n';
            var turnos = msgs.slice(-24).map(function (m) {
                return { role: m.papel === 'aluno' ? 'user' : 'assistant', content: m.texto };
            });
            while (turnos.length && turnos[0].role !== 'user') turnos.shift();
            turnos[0] = { role: 'user', content: abertura + turnos[0].content };
            if (modo === 'avaliar') turnos[turnos.length - 1].content = MODOS.avaliar + '\n\n' + turnos[turnos.length - 1].content;
            var opcoes = {
                modelTier: modo === 'corrigir' || modo === 'avaliar' ? 'complex' : 'default',
                onText: function (ev) {
                    var noFim = window.innerHeight + window.scrollY >= document.body.scrollHeight - 120;
                    $corpo.innerHTML = md(ev.text);
                    if (noFim) window.scrollTo(0, document.body.scrollHeight);
                }
            };
            if (comWeb) {
                opcoes.tools = [{
                    name: 'pesquisar_na_web',
                    description: 'Pesquisa na web e devolve trechos de páginas com seus links. Use consultas curtas e específicas.',
                    inputSchema: { type: 'object', properties: { consulta: { type: 'string', description: 'o que pesquisar' } }, required: ['consulta'] },
                    execute: async function (entrada, ctx) {
                        $corpo.innerHTML = '<span class="girando"></span><span class="fraco peq">Pesquisando: ' + esc(entrada && entrada.consulta) + '…</span>';
                        try { return (await buscarNaWeb(String((entrada && entrada.consulta) || ''), ctx && ctx.signal)).texto; }
                        catch (e) { throw new Error(motivoBusca(e)); }
                    }
                }];
            } else opcoes.cache = false;
            var r = await s(turnos, opcoes);
            msgs.push({ papel: 'prof', texto: r.text });
            guardar();
            falando = false;
            if (pilha[pilha.length - 1] === tela) desenhar(false);
        } catch (e) {
            falando = false;
            $p.classList.add('falhou');
            $corpo.innerHTML = '<p style="color:var(--erro)">' + esc(traduzirErro(e)) + '</p><button class="botao" id="denovo">Tentar de novo</button>';
            $corpo.querySelector('#denovo').onclick = function () {
                $p.remove();
                if ($c.lastElementChild) $c.lastElementChild.remove();
                var ultima = msgs.length && msgs[msgs.length - 1].papel === 'aluno' ? msgs[msgs.length - 1].texto : texto;
                enviar(raiz, ultima, modo);
            };
        }
    }
}

/* =========================================================
   Começo
   ========================================================= */
pilha = [{ titulo: 'Professor de Teologia', desenhar: function (r) {
    r.innerHTML = '<div class="vazio"><div class="grande">✠</div><p><span class="girando"></span>Carregando seus materiais…</p></div>';
} }];
desenhar(true);
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
Banco.iniciar().then(function () {
    pilha = [telaInicio()]; desenhar(true);
    if (NATIVO && NATIVO.pronto) NATIVO.pronto();   // o app entrega um arquivo que chegou por "Abrir com"
});
})();
</script>
