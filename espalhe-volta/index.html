<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Voltar ao Espalhe</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0b0d12;
            color: #eef1f7;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        a {
            display: inline-block;
            margin-top: 18px;
            background: #8b6cff;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
        }
        p { color: #97a0b6; max-width: 340px; }
    </style>
</head>

<body>
    <main>
        <h1>Quase lá</h1>
        <p id="msg">Voltando ao Espalhe com a permissão do TikTok…</p>
        <a id="voltar" href="#">Voltar ao Espalhe</a>
    </main>
    <script>
        /*
         * O TikTok só devolve o login para um endereço https. Esta página recebe
         * esse retorno (?code=…&state=…) e passa adiante para o app, pelo
         * endereço espalhe://volta. Ela não guarda nem envia nada: o código só
         * vale junto com as chaves que estão no celular.
         */
        var destino = 'intent://volta' + location.search +
            '#Intent;scheme=espalhe;package=com.bahiense.espalhe;end';
        document.getElementById('voltar').href = destino;
        if (location.search.indexOf('code=') >= 0 || location.search.indexOf('error=') >= 0) {
            location.replace(destino);
        } else {
            document.getElementById('msg').textContent =
                'Esta página só serve para devolver o login do TikTok ao app Espalhe.';
        }
    </script>
</body>

</html>
